<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>루프 퀘스트 — 인바이츠루프 V5 아케이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --page:#E6EFEA; --paper:#F3F9F5; --card:#FFFFFF; --ink:#1E2320; --sub:#5F6E66; --line:#D9E5DE;
  --clay:#B8865C; --blue:#5B8FB9; --blue-deep:#3B6A93; --blue-pale:#E2EEF8; --loop:#1FB86B;
  --sky:#D3E6F4; --sand:#F1E3D3; --butter:#F7E7B0; --lilac:#E4DDF6; --mist:#D9EEE4; --peach:#F6D3C4;
  --mute:#CDD5D1; --hole:#26302B; --skin:#F5D8C3; --hairc:#3A2F2A; --wood:#EBD8C2; --wood-line:#D6BC9F;
  --dusk1:#E4DFF5; --dusk2:#F5F3EC; --scrim:rgba(243,249,245,.76); --shadow:rgba(23,34,28,.2);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0B100D; --paper:#121815; --card:#1B2420; --ink:#E8EDE9; --sub:#98A69F; --line:#2B3933;
    --clay:#D4A277; --blue:#7FB0DA; --blue-deep:#A8CAE8; --blue-pale:#1C2C38; --loop:#3DD38A;
    --sky:#233A4C; --sand:#3B3127; --butter:#463F24; --lilac:#332E48; --mist:#1F3A2F; --peach:#4A322B;
    --mute:#3A4640; --hole:#060908; --skin:#EBCBB4; --hairc:#2B231F; --wood:#3A3026; --wood-line:#54453A;
    --dusk1:#1C1A2C; --dusk2:#131916; --scrim:rgba(18,24,21,.8); --shadow:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0B100D; --paper:#121815; --card:#1B2420; --ink:#E8EDE9; --sub:#98A69F; --line:#2B3933;
  --clay:#D4A277; --blue:#7FB0DA; --blue-deep:#A8CAE8; --blue-pale:#1C2C38; --loop:#3DD38A;
  --sky:#233A4C; --sand:#3B3127; --butter:#463F24; --lilac:#332E48; --mist:#1F3A2F; --peach:#4A322B;
  --mute:#3A4640; --hole:#060908; --skin:#EBCBB4; --hairc:#2B231F; --wood:#3A3026; --wood-line:#54453A;
  --dusk1:#1C1A2C; --dusk2:#131916; --scrim:rgba(18,24,21,.8); --shadow:rgba(0,0,0,.55);
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); height:100%; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; height:100%; overflow:hidden; color:var(--ink);
  background-color:var(--page);
  background-image:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1.4px);
  background-size:22px 22px;
  font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
#shell{ height:100%; display:flex; align-items:center; justify-content:center; }
#frame{
  position:relative; overflow:hidden; border-radius:24px; background:var(--paper);
  box-shadow:0 0 0 1px var(--line), 0 40px 90px -40px var(--shadow);
  touch-action:none; user-select:none; -webkit-user-select:none; cursor:default;
}
@media (max-width:560px){ #frame{ border-radius:0; box-shadow:none; } }
#cv{ display:block; }
#ui{ position:absolute; left:0; top:0; width:720px; height:960px; transform-origin:0 0; pointer-events:none; }

/* HUD */
#hud{ position:absolute; left:0; top:0; width:720px; height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 18px 0 22px; font-family:Jua,"Noto Sans KR",sans-serif; }
#hud[hidden]{ display:none; }
#hud .hl{ display:flex; align-items:center; gap:10px; width:262px; white-space:nowrap; }
#hud .hc{ width:206px; display:flex; justify-content:center; }
#hud .hr{ display:flex; align-items:center; justify-content:flex-end; gap:10px; width:200px; }
.seg{ display:inline-flex; align-items:center; justify-content:center; min-width:42px; height:30px; padding:0 10px; border-radius:15px; border:2px solid var(--blue); color:var(--blue-deep); font-size:17px; line-height:1; font-family:Jua,"Noto Sans KR",sans-serif; }
.seg.boss{ border-color:var(--clay); color:var(--clay); }
#hud .num{ font-size:17px; color:var(--sub); }
#hud .nm{ font-size:21px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; }
#hud .clock{ font-size:24px; color:var(--ink); font-variant-numeric:tabular-nums; min-width:74px; text-align:right; }
#hud .clock.practice{ font-size:17px; color:var(--sub); }
.ib{ pointer-events:auto; appearance:none; border:0; width:40px; height:40px; border-radius:20px; background:var(--card); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line); font-family:Jua,sans-serif; font-size:18px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
.ib svg{ width:20px; height:20px; }
.ib[aria-pressed="false"]{ color:var(--sub); }

/* 패널·카드 */
#panel{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:auto; }
#panel[hidden]{ display:none; }
#panel.scrim{ background:var(--scrim); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
#panel.clear{ background:transparent; pointer-events:none; }
#panel.clear .btn, #panel.clear button{ pointer-events:auto; }
.card{
  position:relative; width:610px; background:var(--card); color:var(--ink); border-radius:30px;
  padding:32px 38px 30px 48px; box-shadow:0 0 0 1px var(--line), 0 34px 70px -34px var(--shadow);
  animation:cardIn .36s cubic-bezier(.2,.8,.2,1) both;
}
.card::before{ content:""; position:absolute; left:22px; top:34px; bottom:34px; width:3px; border-radius:3px; background:var(--clay); }
.card .cring{ position:absolute; right:28px; top:24px; width:70px; height:70px; }
@keyframes cardIn{ from{ opacity:0; transform:translateY(16px) scale(.985); } to{ opacity:1; transform:none; } }
.meta{ display:flex; align-items:center; gap:10px; font-family:Jua,sans-serif; font-size:18px; color:var(--sub); padding-right:80px; }
.meta .time{ margin-left:auto; font-variant-numeric:tabular-nums; }
.ttl{ font-family:Jua,sans-serif; font-weight:400; font-size:46px; line-height:1.14; letter-spacing:-.5px; margin:14px 80px 6px 0; color:var(--ink); word-break:keep-all; }
.desc{ font-size:20px; line-height:1.5; color:var(--sub); margin:0 0 16px; word-break:keep-all; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 18px; }
.chip{ display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 15px 0 10px; border-radius:19px; border:1.5px solid var(--line); font-family:Jua,sans-serif; font-size:19px; color:var(--sub); background:var(--card); }
.chip svg{ width:20px; height:20px; flex:none; }
.chip.on{ border-color:var(--blue); color:var(--ink); background:var(--blue-pale); }
.howto{ display:grid; grid-template-columns:58px 1fr; gap:10px 12px; margin:0 0 24px; font-size:18px; line-height:1.55; }
.howto dt{ font-family:Jua,sans-serif; color:var(--blue-deep); font-size:19px; }
.howto dd{ margin:0; color:var(--ink); word-break:keep-all; }
.body{ font-size:19px; line-height:1.7; color:var(--ink); margin:0 0 10px; word-break:keep-all; }
.body.sub{ color:var(--sub); font-size:18px; }
.cite{ display:grid; gap:8px; margin:8px 0 12px; }
.cite div{ padding:11px 14px; border-radius:14px; font-size:17px; line-height:1.55; word-break:keep-all; }
.cite .app{ background:var(--blue-pale); }
.cite .doc{ box-shadow:inset 0 0 0 1.5px var(--line); }
.cite b{ font-family:Jua,sans-serif; font-weight:400; display:block; font-size:17px; color:var(--blue-deep); margin-bottom:2px; }
.cite .doc b{ color:var(--clay); }
.try{ display:flex; align-items:center; gap:12px; margin:14px 0 22px; flex-wrap:wrap; }
.try .tl{ font-family:Jua,sans-serif; font-size:17px; color:var(--sub); }
.try .bub{ padding:9px 16px; background:var(--paper); box-shadow:inset 0 0 0 1.5px var(--line); border-radius:18px 18px 18px 6px; font-size:18px; color:var(--ink); }
.row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.btn{ appearance:none; border:0; cursor:pointer; font-family:Jua,sans-serif; font-size:24px; line-height:1; border-radius:999px; padding:16px 30px; display:inline-flex; align-items:center; gap:12px; color:var(--ink); background:transparent; transition:transform .12s ease; }
.btn:active{ transform:scale(.97); }
.btn.primary{ background:var(--ink); color:var(--card); }
.btn.ghost{ box-shadow:inset 0 0 0 2px var(--line); }
.btn kbd{ font-family:Jua,sans-serif; font-size:15px; padding:4px 8px; border-radius:8px; background:rgba(127,127,127,.22); }
.btn:focus-visible, .ib:focus-visible, .sel:focus-visible{ outline:3px solid var(--blue); outline-offset:3px; }
.auto{ display:block; height:3px; border-radius:3px; background:var(--line); margin-top:16px; overflow:hidden; }
.auto i{ display:block; height:100%; width:100%; background:var(--blue); transform-origin:0 0; animation:auto linear forwards; }
@keyframes auto{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }

/* 타이틀 */
.title{ position:absolute; left:0; right:0; bottom:52px; text-align:center; padding:0 56px; }
.logo{ font-family:Jua,sans-serif; font-weight:400; font-size:86px; line-height:1; margin:0; letter-spacing:-1px; color:var(--ink); }
.logo small{ display:block; font-size:22px; color:var(--sub); letter-spacing:0; margin-top:12px; }
.story{ font-size:19px; line-height:1.7; color:var(--ink); margin:20px auto 24px; max-width:560px; word-break:keep-all; }
.title .row{ justify-content:center; }
.title .note{ font-size:16px; color:var(--sub); margin:18px 0 0; }

/* 결과·선택 */
.bigtime{ font-family:Jua,sans-serif; font-size:84px; line-height:1; margin:10px 0 4px; font-variant-numeric:tabular-nums; }
.splits{ list-style:none; padding:0; margin:18px 0 20px; display:grid; gap:6px; }
.splits li{ display:grid; grid-template-columns:48px 1fr auto; gap:10px; align-items:center; font-size:17px; padding:7px 0; border-bottom:1px solid var(--line); }
.splits .s{ font-family:Jua,sans-serif; color:var(--blue-deep); }
.splits .v{ font-variant-numeric:tabular-nums; font-family:Jua,sans-serif; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0 24px; }
.sel{ appearance:none; border:0; cursor:pointer; text-align:left; padding:14px 16px; border-radius:18px; background:var(--paper); box-shadow:inset 0 0 0 1.5px var(--line); color:var(--ink); font-family:Jua,sans-serif; font-size:20px; line-height:1.25; }
.sel small{ display:block; font-family:"Noto Sans KR",sans-serif; font-size:14px; color:var(--sub); margin-top:4px; }
.skip{ position:absolute; right:22px; top:20px; pointer-events:auto; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
@media (prefers-reduced-motion:reduce){ .card{ animation:none; } .auto i{ animation:none; transform:scaleX(1); } }

</style>
</head>
<body>
<main id="shell">
  <div id="frame" aria-label="루프 퀘스트 게임 화면">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div id="ui">
      <header id="hud" hidden>
        <div class="hl"><span class="seg" id="h-seg">W</span><span class="num" id="h-num">01</span><span class="nm" id="h-nm"></span></div>
        <div class="hc"><svg id="h-loop" viewBox="0 0 220 40" width="206" height="38" aria-hidden="true"></svg></div>
        <div class="hr"><span class="clock" id="h-clock">00:00</span><button class="ib" id="h-snd" type="button" aria-label="소리 끄기" aria-pressed="true"></button></div>
      </header>
      <section id="panel" hidden></section>
      <p id="sr" class="sr" aria-live="polite"></p>
    </div>
  </div>
</main>
<script>
'use strict';
/* ==========================================================
   루프 퀘스트 — 인바이츠루프 V5 아케이드 · core
   ========================================================== */
const W = 720, H = 960, TAU = Math.PI * 2;
const FD = 'Jua, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const FB = '"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
const E = {
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inCubic: (t) => t * t * t,
  inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outQuad: (t) => 1 - (1 - t) * (1 - t),
  outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(pointer: coarse)').matches;
let NOW = 0;

/* ---------- 색 ---------- */
const P = {};
const RGBA = new Map();
const PKEYS = ['page', 'paper', 'card', 'ink', 'sub', 'line', 'clay', 'blue', 'blueDeep', 'bluePale', 'loop', 'sky', 'sand', 'butter', 'lilac', 'mist', 'peach', 'mute', 'hole', 'skin', 'hairc', 'wood', 'woodLine', 'dusk1', 'dusk2'];
const cssVar = (k) => '--' + k.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase());
function readPalette() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of PKEYS) P[k] = (cs.getPropertyValue(cssVar(k)) || '').trim() || '#888888';
  const th = document.documentElement.dataset.theme;
  P.dark = th === 'dark' || (th !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  P.shade = P.dark ? '#000000' : '#1E2320';
  P.side = P.dark ? '#0C110E' : '#D2DED7';
  RGBA.clear();
}
function rgba(hex, a) {
  const k = hex + '|' + a; let v = RGBA.get(k); if (v) return v;
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map((x) => x + x).join('');
  const n = parseInt(h.slice(0, 6), 16) || 0;
  v = `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  RGBA.set(k, v); return v;
}
/* 캐릭터 색은 라이트·다크 공통 (일러스트 고정 팔레트) */
const CH = {
  body: '#FFFFFF', low: '#E6F2EB', line: '#1E2320', skin: '#F5D8C3', hair: '#3A2F2A', cheek: '#F2B9A5',
  blue: '#5B8FB9', clay: '#B8865C', loop: '#1FB86B', scrub: '#A9CBE8', hood: '#C9BFEC', hoodDark: '#AFA2DF',
  pants: '#44505F', shoe: '#2B3138', bell: '#F4D77A', mute: '#C3CBC7', lilac: '#CBBEEA', sand: '#EED9C2', sky: '#D6E8F6',
};

/* ---------- 캔버스 ---------- */
const frame = $('#frame'), cv = $('#cv'), ctx = cv.getContext('2d'), ui = $('#ui');
let SC = 1;
function fit() {
  const cs = getComputedStyle(document.documentElement);
  const vw = window.innerWidth;
  const vh = window.innerHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
  const m = vw < 560 ? 0 : 18;
  const s = Math.max(0.28, Math.min((vw - m * 2) / W, (vh - m * 2) / H));
  const cw = Math.round(W * s), chh = Math.round(H * s);
  frame.style.width = cw + 'px'; frame.style.height = chh + 'px';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(chh * dpr);
  cv.style.width = cw + 'px'; cv.style.height = chh + 'px';
  SC = cw / W; ui.style.transform = `scale(${SC})`;
}

/* ---------- 입력 ---------- */
const IN = { x: W / 2, y: H / 2, down: false, pressed: false, released: false, moved: false, kind: 'mouse', pid: null, touchSeen: false, keys: new Set(), kp: new Set(), kr: new Set(), pts: new Map() };
function localPt(e) { const r = frame.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
function onUI(e) { return !!(e.target && e.target.closest && e.target.closest('button, a, input')); }
frame.addEventListener('pointerdown', (e) => {
  AU.unlock();
  if (e.pointerType === 'touch') IN.touchSeen = true;
  if (onUI(e)) return;
  const p = localPt(e);
  IN.kind = e.pointerType || 'mouse';
  IN.pts.set(e.pointerId, p);
  if (IN.pid === null) { IN.pid = e.pointerId; IN.x = p.x; IN.y = p.y; IN.down = true; IN.pressed = true; }
  try { frame.setPointerCapture(e.pointerId); } catch (_) { /* noop */ }
  e.preventDefault();
});
frame.addEventListener('pointermove', (e) => {
  const p = localPt(e);
  if (IN.pts.has(e.pointerId)) IN.pts.set(e.pointerId, p);
  if (e.pointerId === IN.pid || (e.pointerType === 'mouse' && IN.pid === null)) { IN.x = p.x; IN.y = p.y; IN.moved = true; if (e.pointerType === 'mouse') IN.kind = 'mouse'; }
});
function ptrEnd(e) {
  IN.pts.delete(e.pointerId);
  if (e.pointerId === IN.pid) { const p = localPt(e); IN.x = p.x; IN.y = p.y; IN.down = false; IN.released = true; IN.pid = null; }
}
frame.addEventListener('pointerup', ptrEnd);
frame.addEventListener('pointercancel', ptrEnd);
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'space', Enter: 'enter', NumpadEnter: 'enter', KeyZ: 'z', KeyX: 'x', Escape: 'esc', KeyM: 'm' };
for (let i = 1; i <= 9; i++) { KEYMAP['Digit' + i] = String(i); KEYMAP['Numpad' + i] = String(i); }
window.addEventListener('keydown', (e) => {
  const k = KEYMAP[e.code]; if (!k) return;
  AU.unlock();
  const ae = document.activeElement;
  if ((k === 'space' || k === 'enter') && ae && ae.tagName === 'BUTTON') return;
  if (k === 'space' || k === 'left' || k === 'right' || k === 'up' || k === 'down') e.preventDefault();
  if (!IN.keys.has(k)) IN.kp.add(k);
  IN.keys.add(k);
});
window.addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (!k) return; IN.keys.delete(k); IN.kr.add(k); });
window.addEventListener('blur', () => { IN.keys.clear(); IN.pts.clear(); IN.down = false; IN.pid = null; });
const key = (k) => IN.keys.has(k), hit = (k) => IN.kp.has(k), rel = (k) => IN.kr.has(k);
function endInput() { IN.pressed = false; IN.released = false; IN.moved = false; IN.kp.clear(); IN.kr.clear(); }

/* ---------- 사운드 (Web Audio 합성, 외부 파일 없음) ---------- */
const AU = {
  ctx: null, out: null, sfx: null, mus: null, on: true, nb: null,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    try {
      this.ctx = new C();
      this.out = this.ctx.createGain(); this.out.gain.value = this.on ? 0.9 : 0; this.out.connect(this.ctx.destination);
      this.sfx = this.ctx.createGain(); this.sfx.gain.value = 0.55; this.sfx.connect(this.out);
      this.mus = this.ctx.createGain(); this.mus.gain.value = 0.13; this.mus.connect(this.out);
      const len = this.ctx.sampleRate; this.nb = this.ctx.createBuffer(1, len, len);
      const d = this.nb.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      if (BGM.want) BGM.play(BGM.want, true);
    } catch (err) { this.ctx = null; }
  },
  setOn(v) { this.on = v; if (this.out) this.out.gain.setTargetAtTime(v ? 0.9 : 0, this.ctx.currentTime, 0.04); },
  tone(f, d, o = {}) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime + (o.at || 0);
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);

/* ---------- 03 · M1 스케볼 (Patient Summary 전달) ---------- */

/* ---------- 05 · M3 파워 배구 (환자와 의료진의 협동 랠리) ---------- */
const VB = { floor: 880, net: 360, netTop: 700, g: 950 };

  constructor(def) {

    <p class="story">리셋몬이 당신의 건강 기억을 ‘처음부터 다시’로 지우려 해요. AI 건강비서 루피와 함께 W → M1 → M2 → M3를 한 바퀴 돌아 루프를 지켜 주세요.</p>
    <div class="row"><button class="btn primary" type="button" data-act="play" data-focus>게임 시작 <kbd>Space</kbd></button><button class="btn ghost" type="button" data-act="select">챕터 연습</button></div>
    <p class="note">${best}키보드 · 마우스 · 터치 모두 가능 · 카드 읽는 시간은 기록에서 빠져요</p>
  </div><button class="ib skip" type="button" data-act="sound" data-snd="1"></button>`, 'clear');
  syncSound(); announce('루프 퀘스트. 게임 시작 버튼을 누르세요.');
}
function showSelect() {
  FLOW.state = 'select';
  const items = STAGES.map((s, i) => `<button class="sel" type="button" data-act="practice" data-i="${i}">${esc(s.num)} · ${esc(s.seg)} ${esc(s.name)}<small>${esc(s.desc)}</small></button>`).join('') + '<button class="sel" type="button" data-act="practice" data-i="7">엔딩<small>오락실식 마지막 장면만 보기</small></button>';
  setPanel(`<div class="card"><div class="meta">챕터 연습</div><h2 class="ttl">어디부터 볼까요?</h2><p class="desc">연습 모드는 기록이 남지 않아요. 발표 때 원하는 장면으로 바로 갈 수 있어요.</p><div class="grid">${items}</div><button class="btn ghost" type="button" data-act="title" data-focus>처음 화면으로</button></div>`);
}
function drawTitleBG(c) {
  c.fillStyle = P.paper; c.fillRect(0, 0, W, H);
  const cx = 360, cy = 296, R = 168;
  openRing(c, cx, cy, R + 44, { w: 2, col: rgba(P.blue, 0.22), span: 360, dot: false });
  openRing(c, cx, cy, R, { w: 10, col: P.blue, span: 262 + Math.sin(NOW * 0.9) * 18, rot: NOW * 0.22 });
  const names = ['풍선', '사천성', '스케볼', '두더지', '배구', '인형뽑기', '보스'];
  LOOP_LABELS.forEach((l, i) => {
    const a = -Math.PI / 2 + i * TAU / LOOP_LABELS.length, x = cx + Math.cos(a) * (R + 44), y = cy + Math.sin(a) * (R + 44);
    circ(c, x, y, 24); fill(c, i === 6 ? P.sand : P.card); stroke(c, i === 6 ? P.clay : P.blue, 2.4);
    txt(c, l, x, y + 1, { size: l.length > 1 ? 17 : 20, col: i === 6 ? P.clay : P.blueDeep });
    txt(c, names[i], cx + Math.cos(a) * (R + 92), cy + Math.sin(a) * (R + 86), { size: 14, col: P.sub });
  });
  line(c, cx - 64, cy + 96, cx + 64, cy + 96, P.clay, 2);
  drawLoopy(c, cx, cy + 92, 1.4, { mood: (NOW % 5) < 1.2 ? 'happy' : 'idle', talk: (NOW % 5) > 3.6, shadow: false });
}

/* ---------- 진행 ---------- */
function startRun() {
  FLOW.practice = false; FLOW.play = 0; FLOW.total = 0; FLOW.split = []; FLOW.newBest = false; loadStage(0);
}
function startPractice(i) {
  FLOW.practice = true; FLOW.play = 0; FLOW.total = 0; FLOW.split = [];
  if (i >= STAGES.length) { toEnding(); return; }
  loadStage(i);
}
function loadStage(i) {
  FLOW.idx = i; FLOW.def = STAGES[i]; FX.clear(); readPalette();
  FLOW.stage = FLOW.def.make(FLOW.def); FLOW.stagePlay = 0; FLOW.stT = 0; FLOW.state = 'intro';
  BGM.play(FLOW.def.boss ? 'boss' : 'stage');
  setHUD(FLOW.def, i);
  const d = FLOW.def;
  setPanel(`<div class="card">${bigRingSVG(false)}
    <div class="meta"><span class="seg${d.boss ? ' boss' : ''}">${esc(d.seg)}</span><span>${d.boss ? 'FINAL STAGE' : 'STAGE ' + esc(d.num)}</span></div>
    <h2 class="ttl">${esc(d.name)}</h2><p class="desc">${esc(d.desc)}</p>
    ${chipsHTML(d.words, false)}
    <dl class="howto"><dt>미션</dt><dd>${esc(d.mission)}</dd><dt>조작</dt><dd>${esc(d.ctrl)}</dd></dl>
    <button class="btn primary" type="button" data-act="start" data-focus>시작 <kbd>Space</kbd></button>
    <span class="auto"><i style="animation-duration:9s"></i></span>
  </div>`);
  announce(`${d.num} ${d.name}. ${d.desc}. ${d.mission}`);
}
function beginPlay() {
  if (FLOW.state !== 'intro') return;
  hidePanel(); FLOW.state = 'play'; FLOW.stT = 0; FLOW.stage.onStart(); SFX.ui();
}
function toClear() {
  FLOW.state = 'clear'; FLOW.stT = 0; SFX.clear();
  FX.burst(W / 2, 470, { n: 40, sp: 520, cols: [P.blue, P.loop, P.clay, P.butter], shape: 'rect', size: 11, life: 1.3 });
  FLOW.split.push({ num: FLOW.def.num, seg: FLOW.def.seg, name: FLOW.def.name, t: FLOW.stagePlay });
  hudLoop(FLOW.idx + 1);
}
function toCard() {
  FLOW.state = 'card'; FLOW.stT = 0; const d = FLOW.def, cd = d.card;
  const last = FLOW.practice ? '처음 화면으로' : FLOW.idx === STAGES.length - 2 ? '보스전으로' : '다음 스테이지';
  const cite = cd.cite ? `<div class="cite"><div class="app"><b>${esc(cd.cite.app[0])}</b>${esc(cd.cite.app[1])}</div><div class="doc"><b>${esc(cd.cite.doc[0])}</b>${esc(cd.cite.doc[1])}</div></div>` : '';
  setPanel(`<div class="card">${bigRingSVG(true)}
    <div class="meta"><span class="seg">${esc(d.seg)}</span><span>QUEST CLEAR · ${esc(d.num)}</span><span class="time">${FLOW.practice ? '' : fmt1(FLOW.stagePlay)}</span></div>
    <h2 class="ttl">${esc(cd.title)}</h2>
    ${chipsHTML(d.words, true)}
    ${cd.body.map((p, i) => `<p class="body${i ? ' sub' : ''}">${esc(p)}</p>`).join('')}
    ${cite}
    <div class="try"><span class="tl">${esc(cd.tryLabel)}</span><span class="bub">${esc(cd.tryText)}</span></div>
    <button class="btn primary" type="button" data-act="next" data-focus>${last} <kbd>Space</kbd></button>
  </div>`);
  announce(`퀘스트 클리어. ${cd.title}. ${cd.body.join(' ')}`);
}
function nextStage() {
  if (FLOW.state !== 'card') return;
  if (FLOW.practice) { showTitle(); return; }
  loadStage(FLOW.idx + 1);
}
function toEnding() {
  if (FLOW.stage && FLOW.def && FLOW.def.boss && !FLOW.practice) FLOW.split.push({ num: FLOW.def.num, seg: FLOW.def.seg, name: FLOW.def.name, t: FLOW.stagePlay });
  FLOW.state = 'ending'; FLOW.ending = new Ending(); FLOW.stage = null; hud.hidden = true; FX.clear(); BGM.play('ending');
  setPanel('<button class="btn ghost skip" type="button" data-act="skip">엔딩 건너뛰기</button>', 'clear');
  announce('엔딩. 화면을 탭하면 다음 장면으로 넘어가요.');
}
function toResult() {
  FLOW.state = 'result'; BGM.play('title');
  let rec = '';
  if (!FLOW.practice && FLOW.split.length >= STAGES.length) {
    if (FLOW.best == null || FLOW.play < FLOW.best) { FLOW.best = FLOW.play; FLOW.newBest = true; try { localStorage.setItem('loopquest.best.v1', String(FLOW.play)); } catch (e) { /* 저장 불가 환경 */ } }
    rec = `<p class="desc">${FLOW.newBest ? '최고 기록이에요!' : `최고 기록 ${fmt1(FLOW.best)}`} · 전체 소요 ${fmt(FLOW.total)} (카드 읽는 시간 포함)</p>
      <ol class="splits">${FLOW.split.map((s) => `<li><span class="s">${esc(s.seg)}</span><span>${esc(s.num)} ${esc(s.name)}</span><span class="v">${fmt1(s.t)}</span></li>`).join('')}</ol>`;
  } else rec = '<p class="desc">연습 모드라 기록은 남기지 않았어요.</p>';
  setPanel(`<div class="card">${bigRingSVG(true)}
    <div class="meta">THE LOOP CONTINUES</div>
    <h2 class="ttl">한 바퀴 완주!</h2>
    ${FLOW.practice ? '' : `<div class="bigtime">${fmt1(FLOW.play)}</div><p class="body sub">플레이 타임</p>`}
    ${rec}
    <div class="row"><button class="btn primary" type="button" data-act="again" data-focus>다시 하기</button><button class="btn ghost" type="button" data-act="title">처음 화면으로</button></div>
  </div>`);
  announce(`한 바퀴 완주. 플레이 타임 ${fmt1(FLOW.play)}.`);
}
panel.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return; AU.unlock();
  const act = b.dataset.act;
  if (act !== 'sound') SFX.ui();
  if (act === 'play') startRun();
  else if (act === 'select') showSelect();
  else if (act === 'title') showTitle();
  else if (act === 'practice') startPractice(parseInt(b.dataset.i, 10));
  else if (act === 'start') beginPlay();
  else if (act === 'next') nextStage();
  else if (act === 'skip') { if (FLOW.ending) FLOW.ending.done = true; }
  else if (act === 'again') startRun();
  else if (act === 'sound') toggleSound();
});

/* ---------- 메인 루프 ---------- */
function drawClearBanner(c, t) {
  const k = clamp(t / 0.35, 0, 1), s = Math.max(0.01, E.outBack(k)), a = clamp((1.5 - t) / 0.3, 0, 1);
  c.save(); c.globalAlpha = a;
  c.fillStyle = rgba(P.paper, 0.6); c.fillRect(0, 380, W, 200);
  c.translate(W / 2, 480); c.scale(s, s);
  openRing(c, 0, 0, 118, { w: 8, col: P.blue, span: 220 + 140 * clamp(t / 0.9, 0, 1) });
  txt(c, 'QUEST CLEAR!', 0, -8, { size: 62, col: P.ink, stroke: P.card, sw: 10 });
  txt(c, FLOW.def.num + ' · ' + FLOW.def.name, 0, 44, { size: 24, col: P.blueDeep, stroke: P.card, sw: 6 });
  c.restore();
}
function update(dt) {
  if (hit('m')) toggleSound();
  FX.update(dt);
  const st = FLOW.state;
  if (st !== 'title' && st !== 'boot' && st !== 'select' && st !== 'result') FLOW.total += dt;
  if (st === 'title') { if ((hit('space') || hit('enter')) && !panel.contains(document.activeElement)) startRun(); }
  else if (st === 'intro') { FLOW.stage.update(dt, false); FLOW.stT += dt; if ((FLOW.stT > 0.5 && (IN.pressed || hit('space') || hit('enter'))) || FLOW.stT > 9) beginPlay(); }
  else if (st === 'play') {
    FLOW.stage.update(dt, true); FLOW.stagePlay += dt; if (!FLOW.practice) FLOW.play += dt;
    if (FLOW.stage.done) { if (FLOW.def.boss) toEnding(); else toClear(); }
  } else if (st === 'clear') { FLOW.stage.update(dt, false); FLOW.stT += dt; if (FLOW.stT > 1.5) toCard(); }
  else if (st === 'card') { FLOW.stage.update(dt, false); FLOW.stT += dt; if (FLOW.stT > 0.9 && (IN.pressed || hit('space') || hit('enter'))) nextStage(); }
  else if (st === 'ending') { FLOW.ending.update(dt); if (FLOW.ending.done) toResult(); }
  if (st === 'play' || st === 'intro' || st === 'clear' || st === 'card') { const ck = $('#h-clock'); const v = FLOW.practice ? '연습 모드' : fmt(FLOW.play); if (ck.textContent !== v) ck.textContent = v; }
}
function render() {
  const c = ctx; c.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  c.clearRect(0, 0, W, H);
  const [ox, oy] = FX.offset(); c.save(); c.translate(ox, oy);
  const st = FLOW.state;
  if (st === 'boot') { c.fillStyle = P.paper; c.fillRect(-20, -20, W + 40, H + 40); }
  else if (st === 'title' || st === 'select') drawTitleBG(c);
  else if (st === 'ending' || st === 'result') { if (FLOW.ending) FLOW.ending.draw(c); else drawTitleBG(c); }
  else if (FLOW.stage) FLOW.stage.draw(c);
  FX.draw(c);
  if (st === 'clear') drawClearBanner(c, FLOW.stT);
  c.restore();
  if (FLOW.stage && (st === 'intro' || st === 'play' || st === 'clear' || st === 'card')) { c.fillStyle = rgba(P.paper, 0.86); c.fillRect(0, 0, W, 64); line(c, 0, 64, W, 64, P.line, 1.2); }
}
let lastTs = 0;
function frameLoop(ts) {
  const dt = Math.min(0.05, lastTs ? (ts - lastTs) / 1000 : 0.016); lastTs = ts; NOW += dt;
  try { update(dt); render(); } catch (err) { console.error(err); }
  endInput();
  requestAnimationFrame(frameLoop);
}
async function loadFonts() {
  if (!document.fonts || !document.fonts.load) return;
  try {
    await Promise.race([
      Promise.all([document.fonts.load('30px Jua', FONT_SAMPLE), document.fonts.load('400 18px "Noto Sans KR"', FONT_SAMPLE), document.fonts.load('500 18px "Noto Sans KR"', FONT_SAMPLE)]),
      new Promise((r) => setTimeout(r, 2600)),
    ]);
  } catch (e) { /* 폰트 실패 시 시스템 글꼴 */ }
}
async function boot() {
  readPalette(); fit();
  window.addEventListener('resize', fit);
  const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', readPalette);
  new MutationObserver(readPalette).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  requestAnimationFrame(frameLoop);
  await loadFonts();
  try { const v = localStorage.getItem('loopquest.best.v1'); FLOW.best = v ? parseFloat(v) : null; } catch (e) { FLOW.best = null; }
  showTitle();
}
/* 발표·자동 점검용 훅 (게임 진행에는 영향 없음) */
window.__LQ = { state: () => FLOW.state, idx: () => FLOW.idx, go: (i) => startPractice(i), run: () => startRun(), begin: () => beginPlay(), finish: () => { if (FLOW.stage) FLOW.stage.finishNow(); }, next: () => nextStage(), stage: () => FLOW.stage, flow: () => FLOW };
boot();

</script>
