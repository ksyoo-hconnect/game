<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e2320">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%221%22 x2=%221%22 y2=%220%22%3E%3Cstop offset=%220%22 stop-color=%22%233cc48a%22/%3E%3Cstop offset=%221%22 stop-color=%22%234c7bff%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d=%22M10 30C7 16 19 6 32 8c13-2 25 8 22 22 3 13-8 24-22 23C17 55 6 44 10 30Z%22 fill=%22%23fff%22 stroke=%22url(%23g)%22 stroke-width=%225%22/%3E%3Ccircle cx=%2225%22 cy=%2230%22 r=%223.5%22 fill=%22%231c2421%22/%3E%3Ccircle cx=%2239%22 cy=%2230%22 r=%223.5%22 fill=%22%231c2421%22/%3E%3Cpath d=%22M27 38q5 5 10 0z%22 fill=%22%23e2445c%22/%3E%3C/svg%3E">
  <title>말풍선 러시</title>
  <style>
/* 말풍선 러시 — 스타일
 * 폰 화면 안(W)은 원본 V5 W 화면 모양: 민트 배경, 사용자 말풍선, 원본 칩, 입력창·안내 줄.
 * 폰 화면 밖(진행 줄·진행자 지니)은 어두운 틀.
 */
:root {
  --bg: #F3F9F5;          /* 원본 W 배경 */
  --ink: #1E2320;
  --sub: #5F6E66;
  --hair: #E1ECE5;
  --blue: #5B8FB9;
  --blue-pale: #E3F1E8;   /* 원본 사용자 말풍선 */
  --clay: #B8865C;        /* 원본 [급해요] 칩·답 위 짧은 선 */
  --loop: #1FB86B;
  --chrome: #1E2320;      /* 폰 화면 밖 틀 */
  --good: #2fa86c;
  --bad: #e0566b;
  --font: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --binh: 104px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #c9d6cf; }
body { font-family: var(--font); color: var(--ink); -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: break-word; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
p { margin: 0; }
[hidden] { display: none !important; }
.ic { display: inline-flex; width: 22px; height: 22px; }
.ic svg, .icon-btn svg { width: 100%; height: 100%; display: block; }
kbd { display: none; font: 600 10px/1 var(--font); padding: 2px 4px; border-radius: 4px; border: 1px solid currentColor; opacity: .55; margin-left: 6px; vertical-align: 2px; }
@media (hover: hover) and (pointer: fine) { kbd { display: inline-block; } }

/* ---------- 틀 ---------- */
.frame { position: relative; width: 100%; max-width: 430px; height: 100vh; height: 100dvh; margin: 0 auto; background: var(--chrome); }
@media (min-width: 600px) and (min-height: 620px) {
  body { display: flex; align-items: center; justify-content: center; }
  .frame { height: min(calc(100dvh - 32px), 900px); border-radius: 34px; box-shadow: 0 20px 60px rgba(20, 40, 30, .28); }
}
.screen { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; border-radius: inherit; }
.screen.on { display: flex; }

.btn { display: block; text-align: center; text-decoration: none; border: 0; border-radius: 999px; padding: 15px 18px; font-size: 16px; font-weight: 800; cursor: pointer; width: 100%; line-height: 1.25; }
.btn.dark { background: var(--chrome); color: #fff; }
.btn.ghost { background: #fff; color: var(--ink); border: 1px solid #d5e2da; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; white-space: nowrap; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; padding: 8px; color: #fff; background: rgba(255, 255, 255, .1); }
.snd { position: absolute; top: 12px; right: 12px; z-index: 40; }
.snd.on { background: var(--loop); }
.frame[data-screen="result"] .snd { color: var(--ink); background: rgba(30, 35, 32, .08); }
.frame[data-screen="result"] .snd.on { color: #fff; background: var(--loop); }
.frame[data-screen="play"] .snd { top: 6px; right: 52px; }

/* ---------- 지니 동작 ---------- */
.jini { display: block; width: 100%; height: 100%; overflow: visible; }
@keyframes hop { 0% { transform: translateY(0); } 35% { transform: translateY(-16%) rotate(-6deg); } 60% { transform: scale(1.06, .94); } 100% { transform: none; } }
@keyframes jshake { 0%, 100% { transform: none; } 25% { transform: translateX(-6%) rotate(-5deg); } 75% { transform: translateX(6%) rotate(5deg); } }
.j-hop { animation: hop .5s ease-out both; }
.j-shake { animation: jshake .3s linear 2; }

/* ---------- 표지 ---------- */
#s-cover { color: #fff; padding: 30px 22px calc(18px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
.cover-head { text-align: center; padding-top: 18px; }
.kicker { font-size: 13px; color: #9fb7ab; font-weight: 600; letter-spacing: .2px; }
.logo { margin: 6px 0 0; font-size: 46px; font-weight: 900; letter-spacing: -1.5px; line-height: 1.1; }
.logo b { color: #45d690; }
.cover-demo { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.mini { position: relative; width: 100%; max-width: 340px; flex: 1; min-height: 170px; max-height: 390px; background: var(--bg); border-radius: 24px; overflow: hidden; }
.mini-bub { position: absolute; left: 50%; top: -20%; transform: translateX(-50%); background: var(--blue-pale); color: var(--ink); padding: 10px 16px; border-radius: 18px 18px 6px 18px; font-size: 15px; font-weight: 500; white-space: nowrap; box-shadow: 0 4px 12px rgba(30, 60, 45, .12); animation: minifall 3.4s ease-in-out -1.1s infinite; }
.mini-hand { position: absolute; left: 50%; top: 34%; width: 40px; height: 45px; margin: 6px 0 0 -18px; animation: minihand 3.4s ease-in-out -1.1s infinite; opacity: 0; }
.mini-hand svg { width: 100%; height: 100%; display: block; }
.mini-bins { position: absolute; left: 8px; right: 8px; bottom: 8px; height: 76px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mini-bin { border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 800; color: var(--ink); border: 1.5px solid transparent; }
.mini-bin .ic { width: 30px; height: 30px; }
.mini-bin.b-now { background: #EAF1F8; border-color: #cfdeec; }
.mini-bin.b-doc { background: #E3F3EA; border-color: #bfe0cc; animation: minigulp 3.4s ease-in-out -1.1s infinite; }
@keyframes minifall {
  0% { top: -20%; left: 50%; transform: translateX(-50%); opacity: 1; }
  40% { top: 34%; left: 50%; transform: translateX(-50%); opacity: 1; }
  48% { top: 36%; left: 50%; transform: translateX(-50%); opacity: 1; }
  64% { top: 72%; left: 75%; transform: translateX(-50%) scale(.3); opacity: .2; }
  66%, 100% { top: 72%; left: 75%; transform: translateX(-50%) scale(.3); opacity: 0; }
}
@keyframes minihand {
  0%, 36% { opacity: 0; left: 50%; top: 40%; }
  42% { opacity: 1; left: 50%; top: 36%; transform: none; }
  48% { opacity: 1; left: 50%; top: 36%; transform: scale(.9); }
  64% { opacity: 1; left: 75%; top: 66%; transform: scale(.9); }
  76% { opacity: 0; left: 76%; top: 68%; }
  100% { opacity: 0; }
}
@keyframes minigulp { 0%, 62% { transform: none; } 68% { transform: scale(1.06); background: #c8ecd6; } 80%, 100% { transform: none; } }
.cover-host { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 330px; }
.cover-jini { width: 76px; height: 76px; flex: none; }
.say { position: relative; background: #fff; color: var(--ink); border-radius: 16px; padding: 10px 14px; font-size: 15px; font-weight: 700; line-height: 1.4; }
.say::before { content: ""; position: absolute; left: -7px; top: 50%; margin-top: -7px; border: 7px solid transparent; border-left: 0; border-right-color: #fff; }
.cover-rules { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.cover-rules li { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: #d6e5dd; background: rgba(255, 255, 255, .08); border-radius: 999px; padding: 6px 12px; }
.cover-rules .heart { width: 15px; height: 14px; fill: #ff5d73; }
.cover-best { text-align: center; font-size: 14px; color: #ffd66b; font-weight: 800; }
.cover-bottom { display: flex; flex-direction: column; gap: 10px; }
#s-cover .btn.dark { background: var(--loop); color: #0f2a1b; font-size: 18px; padding: 17px; }
.fine { font-size: 11.5px; color: #8fa69a; text-align: center; line-height: 1.5; }

/* ---------- 플레이: 폰 화면 밖 ---------- */
#s-play { background: var(--chrome); }
.hud { flex: none; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; padding-right: 96px; color: #fff; position: relative; }
.hud #btn-pause { position: absolute; right: 8px; top: 6px; }
.hearts { display: flex; gap: 3px; flex: none; }
.hearts .heart { width: 22px; height: 20px; fill: #ff5d73; transition: transform .2s; }
.hearts .heart.lost { fill: rgba(255, 255, 255, .18); }
.hearts.hit { animation: jshake .25s linear 2; }
.clock { flex: 1; min-width: 0; }
.stage-label { font-size: 11px; font-weight: 800; color: #9fe7c0; margin-bottom: 3px; }
.bar { display: flex; gap: 3px; height: 6px; }
.bar .seg { position: relative; height: 100%; border-radius: 3px; background: rgba(255, 255, 255, .14); overflow: hidden; display: block; }
.bar .s1 { flex: 30; } .bar .s2 { flex: 25; } .bar .s3 { flex: 35; }
.bar .seg b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #45d690; }
.scorebox { text-align: right; flex: none; min-width: 56px; }
.score { font-size: 19px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
.combo { font-size: 11px; font-weight: 800; color: #ffd66b; height: 13px; line-height: 13px; }
.host { flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 6px; min-height: 52px; }
.host-jini { width: 44px; height: 44px; flex: none; }
.host-line { position: relative; flex: 1; background: #fff; color: var(--ink); font-size: 13.5px; font-weight: 700; line-height: 1.35; border-radius: 14px; padding: 7px 12px; min-height: 34px; display: flex; align-items: center; }
.host-line::before { content: ""; position: absolute; left: -6px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left: 0; border-right-color: #fff; }
.host-line.new { animation: pop .25s ease-out both; }
@keyframes pop { from { transform: scale(.94); opacity: .4; } to { transform: none; opacity: 1; } }

/* 넓은 화면: 진행자 지니는 폰 왼쪽 바깥에 크게 */
@media (min-width: 900px) and (min-height: 620px) {
  .frame[data-screen="play"] #s-play { overflow: visible; }
  .host { position: absolute; right: calc(100% + 28px); top: 110px; width: 250px; flex-direction: column; align-items: center; gap: 12px; padding: 0; }
  .host-jini { width: 150px; height: 150px; }
  .host-line { width: 100%; font-size: 17px; padding: 14px 16px; border-radius: 18px; box-shadow: 0 10px 30px rgba(20, 40, 30, .15); }
  .host-line::before { left: 50%; top: -7px; margin: 0 0 0 -7px; border: 7px solid transparent; border-top: 0; border-bottom-color: #fff; }
}

/* ---------- 플레이: 폰 화면 안(원본 W) ---------- */
.w { position: relative; flex: 1; min-height: 0; margin: 0 8px 8px; background: var(--bg); border-radius: 26px; display: flex; flex-direction: column; overflow: hidden; }
.w-top { flex: none; height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 18px; }
.w-top-r { display: flex; gap: 18px; }
.field { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
.edge { display: block; height: 2px; width: 28px; border-radius: 2px; background: linear-gradient(90deg, var(--clay) 0%, var(--clay) 70%, transparent 100%); margin-bottom: 8px; }
.bubbles { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.bub { position: absolute; left: 0; top: 0; max-width: min(62%, 230px); background: var(--blue-pale); color: var(--ink); padding: 11px 17px; border-radius: 20px 20px 6px 20px; font-size: 16px; font-weight: 500; line-height: 1.45; letter-spacing: -.2px; box-shadow: 0 4px 14px rgba(30, 70, 50, .14); cursor: grab; will-change: transform; pointer-events: auto; }
.bub span { display: block; }
.bub.dragging { cursor: grabbing; box-shadow: 0 8px 22px rgba(30, 70, 50, .25), 0 0 0 2px var(--blue); }
.bub.fly { transition: transform .26s ease-in, opacity .26s ease-in; opacity: .15; }
.bub.crash { animation: crash .5s ease-out both; }
@keyframes crash { 0% { filter: none; } 30% { filter: grayscale(1); opacity: 1; margin-left: -6px; } 60% { margin-left: 6px; } 100% { filter: grayscale(1); opacity: 0; margin-left: 0; } }
.bub.said { background: #fff; border: 1.5px dashed #b9c7bf; box-shadow: none; text-align: left; }
.bub.said em { display: block; font-style: normal; font-size: 11px; font-weight: 700; color: var(--sub); margin-bottom: 2px; }
.bub.struck span { text-decoration: line-through; text-decoration-color: var(--clay); text-decoration-thickness: 2px; }
.bub.struck { transition: opacity .6s; opacity: 0; }
.bub.fade { transition: opacity .35s; opacity: 0; }
.bub.freeze { filter: grayscale(.7); opacity: .7; }

.bins { position: absolute; left: 8px; right: 8px; bottom: 8px; height: var(--binh); z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bins[data-n="3"] { grid-template-columns: 1fr 1fr 1fr; }
.bin { position: relative; border-radius: 18px; border: 1.5px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 4px; text-align: center; min-width: 0; }
.bin .ic { width: 38px; height: 38px; margin-bottom: 2px; }
.bin b { font-size: 15px; font-weight: 800; line-height: 1.2; }
.bin small { font-size: 11.5px; color: var(--sub); line-height: 1.3; }
.bin kbd { position: absolute; top: 6px; left: 8px; margin: 0; }
.bin.b-now { background: #EAF1F8; border-color: #cfdeec; }
.bin.b-doc { background: #E3F3EA; border-color: #bfe0cc; }
.bin.b-if { background: #F0EEF8; border-color: #d9d3ee; }
.bin.b-chg { background: #FBEDE7; border-color: #f0d0c3; }
.bin.b-fact { background: #E9F2EE; border-color: #c9ddd3; }
.bins[data-n="3"] .bin .ic { width: 34px; height: 34px; }
.bins[data-n="3"] .bin b { font-size: 14.5px; }
.bins[data-n="3"] .bin small { font-size: 11px; }
.bin.gulp { animation: gulp .4s ease-out; }
@keyframes binshake { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes gulp { 40% { transform: scale(1.07); } }
.bin.wrong { animation: binshake .25s linear 2; border-color: var(--bad); background: #fde8eb; }
.bin.right, .chip.right { box-shadow: 0 0 0 3px var(--good); }
.bins.swap .bin { animation: binin .5s ease-out both; }
@keyframes binin { from { transform: translateY(40%); opacity: 0; } to { transform: none; opacity: 1; } }
.post { position: absolute; top: -13px; width: 12px; height: 15px; margin-left: -6px; background: #b9c9c0; border-radius: 6px 6px 2px 2px; }

.pops { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.pop { position: absolute; transform: translate(-50%, 0); font-size: 18px; font-weight: 900; white-space: nowrap; animation: rise .9s ease-out both; }
.pop.good { color: var(--good); }
.pop.miss { color: #8b9891; }
.pop.sos { color: var(--clay); }
.pop.bonus { color: #d99a00; font-size: 22px; }
@keyframes rise { from { opacity: 0; margin-top: 6px; } 20% { opacity: 1; } to { opacity: 0; margin-top: -34px; } }

.banner { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: rgba(243, 249, 245, .86); text-align: center; padding: 0 20px; animation: pop .25s ease-out both; }
.banner-n { font-size: 34px; font-weight: 900; letter-spacing: -1px; }
.banner-t { font-size: 15px; font-weight: 700; color: var(--sub); }

.chiprow { display: none; flex: none; gap: 8px; padding: 4px 14px 0; flex-wrap: nowrap; }
.w.sos-on .chiprow { display: flex; }
.chip { font-size: 15px; padding: 8px 16px; min-height: 42px; border-radius: 22px; border: 1px solid var(--hair); background: transparent; color: var(--ink); white-space: nowrap; position: relative; }
.chip::before { content: ""; position: absolute; left: -1px; top: -1px; width: 52%; height: calc(100% + 2px); border: 1px solid var(--blue); border-right: 0; border-radius: 22px 0 0 22px; opacity: .4; pointer-events: none; }
.chip.sos { border-color: var(--clay); color: var(--clay); font-weight: 600; }
.chip.press { background: #f5ebe2; }
#chip-bonus { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

.hint { position: relative; flex: none; min-height: 54px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; line-height: 1.5; color: var(--sub); padding: 8px 18px 8px 20px; }
.reply { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; justify-content: center; padding: 2px 18px 4px 20px; background: var(--bg); opacity: 0; transition: opacity .15s; pointer-events: none; }
.reply.on { opacity: 1; }
.reply .edge { margin-bottom: 5px; flex: none; }
.reply p { font-size: 13.5px; font-weight: 600; line-height: 1.4; color: var(--ink); letter-spacing: -.2px; }
.finder { color: var(--blue); white-space: nowrap; }
.box { flex: none; margin: 0 12px 12px; background: rgba(255, 255, 255, .75); border: 1px solid var(--hair); border-radius: 24px; padding: 10px 12px 10px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .05); }
.box-line { height: 16px; }
.tools { display: flex; align-items: center; gap: 10px; }
.tool.round { width: 38px; height: 38px; border-radius: 50%; background: var(--blue-pale); display: inline-flex; align-items: center; justify-content: center; }
.tool.round .ic { width: 18px; height: 18px; }
.tool.pill { background: var(--blue-pale); border-radius: 18px; padding: 8px 14px; font-size: 13.5px; }
.tool.mic { margin-left: auto; }
.tool.send { background: var(--blue); }

.hand { position: absolute; left: 0; top: 0; width: 50px; height: 56px; margin: -4px 0 0 -22px; z-index: 30; pointer-events: none; opacity: 0; transform: translate(var(--x0), var(--y0)); filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .2)); }
.hand svg { width: 100%; height: 100%; display: block; }
.hand.on.swipe { animation: hswipe 1.6s ease-in-out both; }
.hand.on.tap { animation: htap 1.6s ease-in-out both; }
@keyframes hswipe {
  0% { opacity: 0; transform: translate(var(--x0), calc(var(--y0) + 20px)); }
  15% { opacity: 1; transform: translate(var(--x0), var(--y0)); }
  28% { opacity: 1; transform: translate(var(--x0), var(--y0)) scale(.9); }
  70% { opacity: 1; transform: translate(var(--x1), var(--y1)) scale(.9); }
  85% { opacity: 1; transform: translate(var(--x1), var(--y1)); }
  100% { opacity: 0; transform: translate(var(--x1), var(--y1)); }
}
@keyframes htap {
  0% { opacity: 0; transform: translate(var(--x0), var(--y0)); }
  30% { opacity: 1; transform: translate(var(--x1), var(--y1)); }
  42% { transform: translate(var(--x1), var(--y1)) scale(.85); }
  54% { transform: translate(var(--x1), var(--y1)); }
  66% { transform: translate(var(--x1), var(--y1)) scale(.85); }
  80% { opacity: 1; transform: translate(var(--x1), var(--y1)); }
  100% { opacity: 0; transform: translate(var(--x1), var(--y1)); }
}

/* ---------- 결과 ---------- */
#s-result { background: var(--bg); padding: 22px 18px calc(16px + env(safe-area-inset-bottom, 0px)); justify-content: space-between; gap: 10px; }
.res-head { display: flex; align-items: center; gap: 12px; padding-right: 44px; }
.res-jini { width: 80px; height: 80px; flex: none; }
.res-over { font-size: 13px; font-weight: 700; color: var(--sub); }
.res-badge { font-size: 23px; font-weight: 900; letter-spacing: -.6px; line-height: 1.25; margin-top: 2px; }
.res-say { position: relative; background: #fff; border-radius: 16px; padding: 11px 14px; font-size: 14.5px; line-height: 1.5; font-weight: 500; }
.res-say::before { content: ""; position: absolute; left: 34px; top: -7px; border: 7px solid transparent; border-top: 0; border-bottom-color: #fff; }
.res-score { background: #fff; border-radius: 20px; padding: 12px 14px 12px; text-align: center; }
.res-num { font-size: 50px; font-weight: 900; letter-spacing: -1.5px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.res-num span { font-size: 20px; margin-left: 2px; letter-spacing: 0; }

/* 지니 SVG (말풍선 러시 진행자용 사본)
 * 기존 유형 테스트 game/js/jini.js의 진행자 지니(몸·물결 고리 머리·볼·망토)만 복사해 왔다.
 * 원본 특징: 흰 둥근 몸, 초록→파랑 물결 고리 머리, 분홍 볼, 청록 망토. 원본 이미지 출처는 ../자료/마스코트/출처.md.
 * 표정(smirk 장난, dizzy 어질)과 땀·별 효과를 더했다. 동작(폴짝·흔들기)은 css의 .j-* 클래스.
 * 지니는 원본 W 화면(폰 화면) 안에 넣지 않고 진행자로만 쓴다.
 *
 * Jini.svg({ mood, sweat, stars, wave }) → viewBox 0 0 160 160 안쪽 마크업
 * Jini.el(o, cls)  → <svg> 문자열
 * Jini.doc(o, size)→ 독립 SVG 문서(이미지 저장용)
 */
(function () {
  let gid = 0;
  const INK = '#1c2421';
  const st = (w) => `stroke="${INK}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"`;

  const EYES = {
    base: `<circle cx="70" cy="76" r="5.5" fill="${INK}"/><circle cx="94" cy="76" r="5.5" fill="${INK}"/><circle cx="71.5" cy="74.5" r="1.8" fill="#fff"/><circle cx="95.5" cy="74.5" r="1.8" fill="#fff"/>`,
    happy: `<path d="M64 77 q6 -8 12 0" ${st(4)}/><path d="M88 77 q6 -8 12 0" ${st(4)}/>`,
    sad: `<circle cx="70" cy="78" r="5" fill="${INK}"/><circle cx="94" cy="78" r="5" fill="${INK}"/><path d="M62 69 l12 -5 M102 69 l-12 -5" ${st(3)}/>`,
    wait: `<path d="M64 77 h12" ${st(4)}/><circle cx="94" cy="76" r="5.5" fill="${INK}"/>`,
    wow: `<circle cx="70" cy="75" r="6.5" fill="${INK}"/><circle cx="94" cy="75" r="6.5" fill="${INK}"/><circle cx="72" cy="73" r="2.2" fill="#fff"/><circle cx="96" cy="73" r="2.2" fill="#fff"/>`,
    // 장난꾸러기: 한쪽 윙크 + 치켜 올린 눈썹
    smirk: `<path d="M64 77 q6 -7 12 0" ${st(4)}/><circle cx="94" cy="76" r="5.5" fill="${INK}"/><circle cx="95.5" cy="74.5" r="1.8" fill="#fff"/><path d="M86 63 q8 -6 16 -1" ${st(3)}/>`,
    // 어질어질: X 눈
    dizzy: `<path d="M65 71 l10 10 M75 71 l-10 10 M89 71 l10 10 M99 71 l-10 10" ${st(3.6)}/>`
  };
  const MOUTH = {
    base: '<path d="M74 86 q8 9 16 0 z" fill="#e2445c"/>',
    happy: '<path d="M72 85 q10 13 20 0 z" fill="#e2445c"/>',
    sad: `<path d="M75 92 q7 -6 14 0" ${st(3)}/>`,
    wait: `<path d="M76 90 h12" ${st(3)}/>`,
    wow: '<ellipse cx="82" cy="91" rx="5" ry="6" fill="#e2445c"/>',
    smirk: `<path d="M72 88 q10 7 20 -3" ${st(3)}/><path d="M86 89 q2 7 6 5 q3 -2 0 -7" fill="#ff7f9c" stroke="${INK}" stroke-width="1.8"/>`,
    dizzy: `<path d="M72 92 q4 -4 8 0 t8 0 t8 0" ${st(2.8)}/>`
  };
  const SWEAT = '<path d="M118 50 q6 10 0 16 q-6 -6 0 -16z" fill="#7fc8ff" stroke="#4aa3e6" stroke-width="1.2"/><path d="M128 66 q4 6 0 10 q-4 -4 0 -10z" fill="#a8dcff"/>';
  const STARS = '<g fill="#ffd400" stroke="#e8a800" stroke-width="1">' + [[40, 24], [118, 18], [138, 44]].map(([x, y]) => `<path d="M${x} ${y - 7} l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z"/>`).join('') + '</g>';

  function ring(id) {
    return `<defs><linearGradient id="${id}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3cc48a"/><stop offset=".5" stop-color="#38b6c9"/><stop offset="1" stop-color="#4c7bff"/></linearGradient></defs>`;
  }
  function head(id) {
    return [
      `<path d="M30 70 C22 40 48 14 80 18 C112 14 140 38 132 68 C140 96 116 118 82 114 C46 120 20 98 30 70Z" fill="#fff" stroke="url(#${id})" stroke-width="5"/>`,
      `<path d="M40 70 C34 46 54 26 80 29 C106 26 128 44 122 68 C128 90 108 106 82 103 C54 108 34 92 40 70Z" fill="none" stroke="url(#${id})" stroke-width="3" opacity=".7"/>`,
      `<path d="M50 72 C46 54 60 40 80 42 C100 40 114 54 110 70 C114 86 100 94 82 92 C62 96 46 86 50 72Z" fill="#fff" stroke="url(#${id})" stroke-width="2" opacity=".5"/>`
    ].join('');
  }
  const CHEEK = '<circle cx="60" cy="88" r="7" fill="rgba(255,140,160,.45)"/><circle cx="104" cy="88" r="7" fill="rgba(255,140,160,.45)"/>';

  function svg(o) {
    o = o || {};
    const id = 'jg' + (gid++);
    const mood = EYES[o.mood] ? o.mood : 'base';
    return [
      ring(id),
      '<ellipse cx="80" cy="152" rx="40" ry="6" fill="rgba(0,0,0,.12)"/>',
      '<path d="M50 108 q-10 20 0 36 h60 q10 -16 0 -36z" fill="#3fbfa8"/>',
      '<ellipse cx="80" cy="128" rx="28" ry="22" fill="#fff"/>',
      '<ellipse cx="62" cy="148" rx="10" ry="6" fill="#fff"/><ellipse cx="98" cy="148" rx="10" ry="6" fill="#fff"/>',
      o.wave ? '<ellipse cx="128" cy="104" rx="9" ry="11" fill="#fff" stroke="#e3ece8" stroke-width="2"/>' : '',
      head(id),
      EYES[mood] + MOUTH[mood],
      CHEEK,
      o.sweat || mood === 'wait' ? SWEAT : '',
      o.stars || mood === 'dizzy' ? STARS : ''
    ].join('');
  }
  function el(o, cls) {
    return `<svg class="jini ${cls || ''}" viewBox="0 0 160 160" aria-hidden="true">${svg(o)}</svg>`;
  }
  function doc(o, size) {
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="${size}" height="${size}">${svg(o)}</svg>`;
  }
  window.Jini = { svg, el, doc };
})();

</script>
  <script>
/* 공통 도구: 유틸, 저장소(막히면 메모리), Web Audio 효과음(기본 꺼짐), SVG 아이콘
 * 모든 파일은 window.BR 하나에 붙는다(ES 모듈 없이 file://로도 동작).
 */
(function () {
  const BR = (window.BR = window.BR || {});

  /* ---------- 유틸 ---------- */
  BR.$ = (s, r) => (r || document).querySelector(s);
  BR.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  BR.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  BR.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  BR.lerp = (a, b, k) => a + (b - a) * BR.clamp(k, 0, 1);
  BR.esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // 애니메이션 클래스를 다시 걸기(끝나면 반드시 지움)
  BR.flash = (el, cls, ms) => {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    clearTimeout(el['_t_' + cls]);
    el['_t_' + cls] = setTimeout(() => el.classList.remove(cls), ms || 600);
  };

  /* ---------- 저장소 ---------- */
  const mem = {};
  BR.store = {
    get(k) {
      try { const v = window.localStorage.getItem(k); if (v !== null) return v; } catch (e) { /* 막힘 */ }
      return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null;
    },
    set(k, v) {
      mem[k] = v;
      try { window.localStorage.setItem(k, v); } catch (e) { /* 막힘: 메모리만 */ }
    }
  };
  BR.KEY_BEST = 'bubblerush:best:v1';

  /* ---------- 효과음 ---------- */
  let actx = null;
  const snd = (BR.sound = { on: false });
  function ctx() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended' && actx.resume) actx.resume().catch(() => {});
    return actx;
  }
  function tone(f, dur, opt) {
    if (!snd.on) return;
    const c = ctx(); if (!c) return;
    opt = opt || {};
    try {
      const t = c.currentTime + (opt.at || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = opt.type || 'triangle';
      o.frequency.setValueAtTime(f, t);
      if (opt.to) o.frequency.exponentialRampToValueAtTime(opt.to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(opt.vol || 0.06, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* 소리는 실패해도 게임은 계속 */ }
  }
  const FX = {
    tap: () => tone(660, 0.06, { vol: 0.05 }),
    whoosh: () => tone(280, 0.14, { to: 900, vol: 0.05 }),
    ok: () => { tone(784, 0.07, { vol: 0.07 }); tone(1175, 0.12, { vol: 0.07, at: 0.07 }); },
    bad: () => tone(300, 0.24, { type: 'sawtooth', to: 110, vol: 0.05 }),

  // 원본 화면 문구(입력창 위 안내 줄)
  BR.HINT = '무엇을 도와드릴까요? 의료 판단이 필요한 내용은 선생님께 연결해 드려요.';
})();

</script>
  <script>
/* 말풍선 러시 — 플레이 엔진
 *
 * 화면: 원본 W 화면 한 장. 위에서 사용자 말풍선이 떨어지고, 바닥(칸 사이 기둥)에 닿기 전에
 * 좌·우로 쳐서 칸에 넣는다. 말풍선은 언제나 두 칸 사이 기둥 위에서 떨어지므로 ←/→ 한 번이면 된다.
 * 조작: 끌기·스와이프(말풍선 밖에서 밀어도 가장 아래 말풍선이 움직임), 칸 누르기, ←/→ 키,
 *       [급해요]·보너스 칩은 누르기 또는 ↑/스페이스.
 * 시간은 requestAnimationFrame 프레임 간격(최대 50ms)으로만 흐르고, 일시정지·전환 중에는 멈춘다.
 */
(function () {
  const BR = window.BR;
  const $ = BR.$;

  const R = (BR.rush = {});
  let el = {};
  let G = null;           // 판 상태
  let raf = 0, last = 0;
  let drag = null;        // 진행 중인 끌기
  let geo = { w: 0, h: 0, floor: 0, binTop: 0 };

  /* ---------- 초기화 ---------- */
  R.init = function (hooks) {
    el = {
      field: $('#field'), bubbles: $('#bubbles'), bins: $('#bins'), pops: $('#pops'),
      reply: $('#reply'), replyText: $('#reply-text'), banner: $('#banner'), bannerN: $('#banner-n'), bannerT: $('#banner-t'),
      chipSos: $('#chip-sos'), chipBonus: $('#chip-bonus'), chiprow: $('#chiprow'), w: $('#w'), hand: $('#hand')
    };
    R.hooks = hooks || {};
    bindPointer();
    el.chipSos.addEventListener('click', () => chipSos());
    el.chipBonus.addEventListener('click', () => chipBonus());
    el.hand.innerHTML = BR.icon('hand');
    if (window.ResizeObserver) new ResizeObserver(measure).observe(el.field);
    window.addEventListener('resize', measure);
    // 놓기 신호를 잃는 경우: 창 포커스 이탈
    window.addEventListener('blur', () => cancelDrag('blur'));
  };

  function measure() {
    const f = el.field;
    if (!f) return;
    const binsEl = el.bins;
    geo.w = f.clientWidth;
    geo.h = f.clientHeight;
    geo.binTop = binsEl.offsetTop;
    geo.floor = geo.binTop - 12; // 기둥 꼭대기
    if (G) G.bubbles.forEach(place);
  }

  /* ---------- 판 시작/정지 ---------- */
  R.start = function () {
    stopLoop();
    clearField();
    G = {
      t: 0, stage: 0, running: true, paused: false, trans: 0, over: false, finished: false,
      hearts: 3, score: 0, combo: 0, maxCombo: 0,
      bubbles: [], id: 0, sinceSpawn: 99, spawned: 0, stageSpawned: 0,
      openers: [], recent: [], log: [], kinds: [], demo: {},
      bonus: { done: false, active: false, ok: false }, speedSaid: {}
    };
    setStage(0, true);
    R.hooks.update && R.hooks.update(G);
    last = performance.now();
    raf = requestAnimationFrame(loop);
  };
  R.state = () => G;
  R.isPlaying = () => !!(G && G.running && !G.over);

  R.pause = function () {
    if (!G || !G.running || G.paused || G.over) return false;
    G.paused = true;
    cancelDrag('pause');
    el.field.classList.add('paused');
    return true;
  };
  R.resume = function () {
    if (!G || !G.paused) return;
    G.paused = false;
    el.field.classList.remove('paused');
    last = performance.now();
  };
  R.stop = function () {
    stopLoop();
    if (G) { G.running = false; G.over = true; }
    cancelDrag('stop');
    clearField();
  };
  function stopLoop() { if (raf) cancelAnimationFrame(raf); raf = 0; }

  function clearField() {
    el.bubbles.innerHTML = '';
    el.pops.innerHTML = '';
    el.reply.classList.remove('on');
    el.banner.hidden = true;
    el.hand.className = 'hand';
    el.chipBonus.hidden = true;
  }

  /* ---------- 단계 ---------- */
  function setStage(i, first) {
    G.stage = i;
    G.stageSpawned = 0;
    const st = BR.STAGES[i];
    G.openers = (BR.OPENERS[st.n] || []).slice();
    // 칸 그리기
    el.bins.innerHTML = st.bins.map((k, j) => {
      const b = BR.BINS[k];
      return `<button class="bin b-${k}" type="button" data-bin="${k}" data-i="${j}"><i class="ic">${BR.icon(b.icon)}</i><b>${b.name}</b><small>${b.sub}</small><kbd>${j + 1}</kbd></button>`;
    }).join('') + st.bins.slice(1).map((_, j) => `<i class="post" style="left:${((j + 1) / st.bins.length) * 100}%"></i>`).join('');
    el.bins.dataset.n = st.bins.length;
    el.w.classList.toggle('sos-on', !!st.sos);
    el.w.dataset.stage = st.n;
    measure();
    if (!first) {
      G.trans = 1.7;
      el.bannerN.textContent = st.n + '단계';
      el.bannerT.textContent = st.n === 2 ? '[급해요] 칩이 생겼어요' : '칸이 바뀌었어요';
      el.banner.hidden = false;
      BR.flash(el.bins, 'swap', 700);
      BR.sound.play('stage');
    }
    R.hooks.stage && R.hooks.stage(st, first);
  }

  /* ---------- 메인 루프 ---------- */
  function loop(now) {
    raf = requestAnimationFrame(loop);
    let dt = (now - last) / 1000; last = now;
    if (!G || !G.running || G.paused) return;
    dt = Math.min(dt, 0.05);
    if (G.over) return;
    if (G.trans > 0) {
      G.trans -= dt;
      if (G.trans <= 0) { el.banner.hidden = true; }
      return;
    }
    const st = BR.STAGES[G.stage];
    if (G.t < st.until) G.t = Math.min(st.until, G.t + dt);
    G.sinceSpawn += dt;

    // 빨라져요 알림
    [15, 45, 75].forEach((s) => { if (G.t >= s && !G.speedSaid[s]) { G.speedSaid[s] = 1; R.hooks.say && R.hooks.say('빨라져요! 휙휙!', 'wow'); } });

    // 단계 끝: 새 말풍선 멈추고, 화면이 비면 다음 단계
    const live = G.bubbles.filter((b) => b.state === 'fall' || b.state === 'drag');
    if (G.t >= st.until) {
      if (!G.bubbles.length) {
        if (G.stage + 1 < BR.STAGES.length) setStage(G.stage + 1, false);
        else { finish(true); return; }
      }
    } else if (wantSpawn(live)) {
      spawn();
    }
    // 이동
    G.bubbles.forEach((b) => {
      if (b.state !== 'fall' && b.state !== 'drag') return;
      b.p += dt / b.T;
      if (b.p >= 1) { b.p = 1; place(b); landed(b); } else place(b);
    });
    R.hooks.tick && R.hooks.tick(G);
  }

  function stageProg() {
    const st = BR.STAGES[G.stage];
    const from = G.stage ? BR.STAGES[G.stage - 1].until : 0;
    return (G.t - from) / (st.until - from);
  }

  function wantSpawn(live) {
    if (G.bonus.active) return false;
    const n = BR.STAGES[G.stage].n;
    let max = 2;
    if (n === 1 && G.stageSpawned < 4) max = 1;
    if (n === 3 && G.stageSpawned < 3) max = 1;
    if (live.length >= max) return false;
    if (!live.length) return G.sinceSpawn > 0.45;
    const gap = n === 1 ? BR.lerp(2.7, 1.9, stageProg()) : n === 2 ? BR.lerp(2.2, 1.6, stageProg()) : BR.lerp(2.4, 1.5, stageProg());
    // 앞 말풍선이 충분히 내려왔을 때만(겹침 방지)
    const top = Math.min.apply(null, live.map((b) => b.p));
    return G.sinceSpawn >= gap && top > 0.32;
  }

  function fallTime(n, opener) {
    const k = stageProg();
    if (n === 1) return opener ? [8.5, 7.8, 7.2, 6.6][G.stageSpawned] || 6.6 : BR.lerp(6.3, 4.8, k);
    if (n === 2) return opener ? 7.5 : BR.lerp(5.2, 4.1, k);
    return opener ? [7.2, 6.6, 6.2][G.stageSpawned] || 6 : BR.lerp(5.6, 3.6, k);
  }

  function chooseItem() {
    const st = BR.STAGES[G.stage];
    if (G.openers.length) {
      const t = G.openers.shift();
      return { item: BR.ITEMS.find((x) => x.t === t), opener: true };
    }
    const live = G.bubbles.filter((b) => b.state === 'fall' || b.state === 'drag');
    const sosLive = live.some((b) => b.item.bin === 'sos');
    let pool;
    const r = Math.random();
    if (st.sos && !sosLive && r < (st.n === 2 ? 0.27 : 0.12)) pool = BR.ITEMS.filter((x) => x.bin === 'sos');
    else pool = BR.ITEMS.filter((x) => st.bins.indexOf(x.bin) >= 0);
    // 1단계 앞부분은 함정 없이
    if (st.n === 1 && G.t < 12) pool = pool.filter((x) => x.lv < 2);
    const fresh = pool.filter((x) => G.recent.indexOf(x.t) < 0 && !live.some((b) => b.item.t === x.t));
    return { item: BR.pick(fresh.length ? fresh : pool), opener: false };
  }

  function spawn() {
    const st = BR.STAGES[G.stage];
    if (st.n === 3 && !G.bonus.done && G.t >= BR.BONUS.at) { spawnBonus(); return; }
    const c = chooseItem();
    const it = c.item;
    // 어느 기둥 위에서 떨어질지: 정답 칸이 바로 옆에 오도록
    let div = 0;
    if (st.bins.length === 3) {
      const idx = st.bins.indexOf(it.bin);
      if (idx === 0) div = 0; else if (idx === 2) div = 1; else div = Math.random() < 0.5 ? 0 : 1;
    }
    const b = makeBubble(it, div, fallTime(st.n, c.opener));
    G.recent.push(it.t); if (G.recent.length > 5) G.recent.shift();
    G.sinceSpawn = 0; G.spawned++; G.stageSpawned++;
    // 각 단계 첫 말풍선: 손가락 시범 1회
    if (c.opener && !G.demo[st.n]) { G.demo[st.n] = 1; setTimeout(() => demo(b), 450); }
  }

  function makeBubble(item, div, T, extra) {
    const node = document.createElement('div');
    node.className = 'bub' + (extra || '');
    node.innerHTML = `<span>${BR.esc(item.t)}</span>`;
    el.bubbles.appendChild(node);
    const b = { id: ++G.id, item, div, T, p: 0, state: 'fall', node, dx: 0, w: node.offsetWidth, h: node.offsetHeight, bonus: !!extra };
    node.dataset.id = b.id;
    G.bubbles.push(b);
    place(b);
    return b;
  }

  function divX(div) {
    const n = BR.STAGES[G.stage].bins.length;
    return geo.w * ((div + 1) / n);
  }
  function baseX(b) { return b.bonus ? geo.w / 2 : divX(b.div); }
  function bubY(b) {
    const y0 = -b.h - 4, y1 = geo.floor - b.h;
    return y0 + (y1 - y0) * b.p;
  }
  function place(b) {
    if (!b.node || b.state === 'fly' || b.state === 'dead') return;
    b.w = b.node.offsetWidth; b.h = b.node.offsetHeight;
    const cx = BR.clamp(baseX(b) + b.dx, b.w / 2 + 4, geo.w - b.w / 2 - 4);
    b.cx = cx;
    b.node.style.transform = `translate3d(${Math.round(cx - b.w / 2)}px, ${Math.round(bubY(b))}px, 0)`;
  }

  function lowest() {
    let best = null;
    G && G.bubbles.forEach((b) => { if ((b.state === 'fall' || b.state === 'drag') && !b.bonus && (!best || b.p > best.p)) best = b; });
    return best;
  }
  function binIndexAt(x) {
    const n = BR.STAGES[G.stage].bins.length;
    return BR.clamp(Math.floor((x / geo.w) * n), 0, n - 1);
  }
  function nearPost(x) {
    const n = BR.STAGES[G.stage].bins.length;
    for (let j = 1; j < n; j++) if (Math.abs(x - geo.w * (j / n)) < 14) return true;
    return false;
  }

  /* ---------- 판정 ---------- */
  function sendTo(b, binIdx, how) {
    if (!G || G.over || !b || (b.state !== 'fall' && b.state !== 'drag')) return;
    const st = BR.STAGES[G.stage];
    const key = st.bins[binIdx];
    const binEl = el.bins.querySelector(`[data-i="${binIdx}"]`);
    if (b.bonus) { b.dx = 0; b.state = 'fall'; place(b); R.hooks.say && R.hooks.say('이건 칸이 아니라 아래 칩으로 바로잡아요!', 'base'); return; }
    fly(b, binEl);
    BR.sound.play('whoosh');
    if (b.item.bin === key) good(b, binEl);
    else bad(b, b.item.bin === 'sos' ? 'sos' : kindOf(b.item.bin, key), binEl);
    R.hooks.action && R.hooks.action(how);
  }
  function kindOf(right, chosen) {
    if (right === 'doc' && chosen === 'now') return 'self';
    if (right === 'now' && chosen === 'doc') return 'toss';
    return right; // if / chg / fact
  }

  function good(b, target) {
    G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    const mult = [1, 1.2, 1.5][G.stage];
    const pts = Math.round(100 * mult) + Math.min(G.combo, 10) * 10;
    G.score += pts;
    G.log.push({ s: G.stage + 1, t: b.item.t, bin: b.item.bin, r: b.item.bin === 'sos' ? 's' : 'o', a: b.item.a });
    BR.sound.play(b.item.bin === 'sos' ? 'sos' : 'ok');
    if (target) BR.flash(target, 'gulp', 420);
    pop(target, '+' + pts, 'good');
    showReply(b.item.a);
    if (G.combo === 5 || G.combo === 10 || G.combo === 20) R.hooks.say && R.hooks.say(`콤보 ${G.combo}! 좋아요!`, 'happy');
    else R.hooks.mood && R.hooks.mood('happy');
    R.hooks.update && R.hooks.update(G);
  }

  function bad(b, kind, target, soft) {
    if (G.over) return;
    G.combo = 0;
    G.kinds.push(kind);
    if (!soft) {
      G.log.push({ s: G.stage + 1, t: b ? b.item.t : '', bin: b ? b.item.bin : '', r: kind === 'drop' || (b && b.dropped) ? 'm' : 'x', a: b ? b.item.a : '', kind });
      G.hearts--;
      BR.sound.play('bad');
      R.hooks.hurt && R.hooks.hurt();
    } else {
      BR.sound.play('bad');
    }
    if (target) BR.flash(target, 'wrong', 520);
    // 정답 칸 알려 주기
    if (b && b.item.bin !== 'sos') {
      const ri = BR.STAGES[G.stage].bins.indexOf(b.item.bin);
      const rEl = el.bins.querySelector(`[data-i="${ri}"]`);
      if (rEl) BR.flash(rEl, 'right', 900);
    } else if (b && b.item.bin === 'sos') BR.flash(el.chipSos, 'right', 900);
    R.hooks.say && R.hooks.say(BR.FIX[kind] || BR.FIX[b ? b.item.bin : 'drop'], 'sad');
    R.hooks.update && R.hooks.update(G);
    if (G.hearts <= 0) finish(false);
  }

  function landed(b) {
    if (G.over) return;
    if (b.bonus) { // 보너스는 놓쳐도 하트를 잃지 않음
      b.state = 'dead'; b.node.classList.add('fade');
      setTimeout(() => remove(b), 400);
      G.bonus.active = false; G.bonus.done = true; el.chipBonus.hidden = true;
      R.hooks.say && R.hooks.say('기록 바로잡기는 다음 판에!', 'base');
      return;
    }
    if (b.state === 'drag') { // 끌던 중 바닥: 지금 위치의 칸으로
      const x = b.cx;
      endDragState();
      if (!nearPost(x)) { sendTo(b, binIndexAt(x), 'drag-floor'); return; }
    }
    b.state = 'dead';
    b.dropped = true;
    b.node.classList.add('crash');
    setTimeout(() => remove(b), 520);
    pop(null, '놓쳤어요', 'miss', b.cx, geo.floor - 8);
    bad(b, b.item.bin === 'sos' ? 'sos' : 'drop', null);
  }

  function fly(b, target) {
    b.state = 'fly';
    const fr = el.field.getBoundingClientRect();
    let tx = b.cx, ty = geo.binTop + 20;
    if (target) { const r = target.getBoundingClientRect(); tx = r.left - fr.left + r.width / 2; ty = r.top - fr.top + 24; }
    b.node.classList.add('fly');
    b.node.style.transform = `translate3d(${Math.round(tx - b.w / 2)}px, ${Math.round(ty - b.h / 2)}px, 0) scale(.28)`;
    setTimeout(() => remove(b), 300);
  }
  function remove(b) {
    b.state = 'dead';
    if (b.node && b.node.parentNode) b.node.parentNode.removeChild(b.node);
    if (G) G.bubbles = G.bubbles.filter((x) => x !== b);
  }

  function pop(target, text, cls, x, y) {
    const fr = el.field.getBoundingClientRect();
    if (target) { const r = target.getBoundingClientRect(); x = r.left - fr.left + r.width / 2; y = r.top - fr.top - 6; }
    const p = document.createElement('span');
    p.className = 'pop ' + cls;
    p.textContent = text;
    p.style.left = Math.round(BR.clamp(x, 40, geo.w - 40)) + 'px';
    p.style.top = Math.round(y) + 'px';
    el.pops.appendChild(p);
    setTimeout(() => p.remove(), 900);
  }

  let replyT = 0;
  function showReply(text) {
    el.replyText.textContent = text;
    el.reply.classList.add('on');
    clearTimeout(replyT);
    replyT = setTimeout(() => el.reply.classList.remove('on'), 800);
  }

  /* ---------- 칩 ---------- */
  function chipSos() {
    if (!R.isPlaying() || G.paused || G.trans > 0) return;
    if (!BR.STAGES[G.stage].sos) return;
    const b = G.bubbles.find((x) => (x.state === 'fall' || x.state === 'drag') && x.item.bin === 'sos');
    BR.flash(el.chipSos, 'press', 300);
    if (b) {
      if (drag && drag.b === b) endDragState();
      fly(b, el.chipSos);
      good(b, null);
      pop(null, '119 안내', 'good sos', b.cx, bubY(b));
    } else {
      bad(null, 'panic', null, true); // 하트는 잃지 않음
    }
    R.hooks.action && R.hooks.action('chip');
  }
  function chipBonus() {
    if (!R.isPlaying() || G.paused || !G.bonus.active) return;
    const b = G.bubbles.find((x) => x.bonus && x.state !== 'dead');
    G.bonus.active = false; G.bonus.done = true; G.bonus.ok = true;
    el.chipBonus.hidden = true;
    G.score += 300;
    G.log.push({ s: 3, t: BR.BONUS.said, bin: 'bonus', r: 'b', a: BR.BONUS.a });
    BR.sound.play('bonus');
    if (b) { b.state = 'fly'; b.node.classList.add('struck'); setTimeout(() => remove(b), 650); pop(null, '+300', 'good bonus', b.cx, bubY(b)); }
    showReply(BR.BONUS.a);
    R.hooks.say && R.hooks.say('기록 바로잡기 성공! 보너스 +300', 'happy');
    R.hooks.update && R.hooks.update(G);
  }
  R.chip = function () { if (G && G.bonus.active) chipBonus(); else chipSos(); };

  function spawnBonus() {
    G.bonus.active = true;
    G.sinceSpawn = 0;
    const b = makeBubble({ t: BR.BONUS.said, bin: 'bonus', a: BR.BONUS.a }, 0, 6.5, ' said');
    b.node.insertAdjacentHTML('afterbegin', '<em>앞서 기록된 말</em>');
    place(b);
    el.chipBonus.hidden = false;
    R.hooks.say && R.hooks.say('그 말, 사실 어머니 얘기였죠? 칩으로 바로잡아요!', 'wow');
    setTimeout(() => demoChip(el.chipBonus), 400);
  }

  /* ---------- 시범 손가락 ---------- */
  function demo(b) {
    if (!G || b.state === 'dead') return;
    if (b.item.bin === 'sos') { demoChip(el.chipSos); return; }
    const st = BR.STAGES[G.stage];
    const ri = st.bins.indexOf(b.item.bin);
    const target = el.bins.querySelector(`[data-i="${ri}"]`);
    if (!target) return;
    const wr = el.w.getBoundingClientRect();
    const br = b.node.getBoundingClientRect();
    const tr = target.getBoundingClientRect();
    const x0 = br.left - wr.left + br.width / 2, y0 = br.top - wr.top + br.height / 2;
    const x1 = tr.left - wr.left + tr.width / 2, y1 = tr.top - wr.top + 10;
    runHand(x0, y0, x1, y1, 'swipe');
  }
  function demoChip(chip) {
    const wr = el.w.getBoundingClientRect(), cr = chip.getBoundingClientRect();
    const x = cr.left - wr.left + cr.width / 2, y = cr.top - wr.top + cr.height / 2;
    runHand(x, y - 60, x, y, 'tap');
  }
  function runHand(x0, y0, x1, y1, mode) {
    const h = el.hand;
    h.style.setProperty('--x0', x0 + 'px'); h.style.setProperty('--y0', y0 + 'px');
    h.style.setProperty('--x1', x1 + 'px'); h.style.setProperty('--y1', y1 + 'px');
    h.className = 'hand';
    void h.offsetWidth;
    h.className = 'hand on ' + mode;
    clearTimeout(h._t);
    h._t = setTimeout(() => { h.className = 'hand'; }, 2000);
  }

  /* ---------- 끝 ---------- */
  function finish(done) {
    if (G.over) return;
    G.over = true; G.finished = done;
    cancelDrag('finish');
    if (done) G.score += G.hearts * 200;
    G.bubbles.forEach((b) => b.node && b.node.classList.add('freeze'));
    BR.sound.play(done ? 'stage' : 'over');
    el.bannerN.textContent = done ? '완주!' : '게임 오버';
    el.bannerT.textContent = done ? `남은 하트 ${G.hearts}개 × 200점 보너스` : '하트를 다 썼어요';
    el.banner.hidden = false;
    el.banner.classList.toggle('end', true);
    R.hooks.update && R.hooks.update(G);
    setTimeout(() => { el.banner.classList.remove('end'); R.hooks.end && R.hooks.end(G); }, 1200);
  }

  /* ---------- 키 ---------- */
  R.key = function (k) {
    if (!R.isPlaying() || G.paused || G.trans > 0) return false;
    const b = lowest();
    const n = BR.STAGES[G.stage].bins.length;
    if (k === 'ArrowLeft' || k === 'ArrowRight') {
      if (!b) return true;
      sendTo(b, k === 'ArrowLeft' ? b.div : b.div + 1, 'key');
      return true;
    }
    if (/^[1-3]$/.test(k) && +k <= n) { if (b) sendTo(b, +k - 1, 'key'); return true; }
    if (k === 'ArrowUp' || k === ' ') { R.chip(); return true; }
    return false;
  };

  /* ---------- 끌기·스와이프·칸 누르기 ----------
   * pointer capture + window 리스너. 놓기 신호를 못 받은 경우(버튼 없는 이동, blur, pointercancel,
   * capture 상실, 탭 숨김)는 모두 cancelDrag로 정리해 말풍선을 기둥 위로 되돌린다.
   */
  function bindPointer() {
    el.field.addEventListener('pointerdown', onDown);
  }
  function onDown(e) {
    if (!R.isPlaying() || G.paused || G.trans > 0) return;
    if (e.button > 0) return;
    e.preventDefault();
    cancelDrag('new');
    const binBtn = e.target.closest && e.target.closest('.bin');
    const bubEl = e.target.closest && e.target.closest('.bub');
    let b = null;
    if (bubEl) b = G.bubbles.find((x) => x.node === bubEl && (x.state === 'fall' || x.state === 'drag'));
    if (!b) b = lowest();
    const d = { id: e.pointerId, type: e.pointerType, x0: e.clientX, y0: e.clientY, b, binBtn, moved: false, hist: [{ x: e.clientX, t: performance.now() }], dx0: b ? b.dx : 0 };
    drag = d;
    try { el.field.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
    el.field.addEventListener('lostpointercapture', onLost);
  }
  function onMove(e) {
    const d = drag;
    if (!d || e.pointerId !== d.id) return;
    if (e.pointerType === 'mouse' && e.buttons === 0) { cancelDrag('buttonless'); return; }
    const dx = e.clientX - d.x0;
    d.hist.push({ x: e.clientX, t: performance.now() });
    while (d.hist.length > 2 && performance.now() - d.hist[0].t > 100) d.hist.shift();
    if (!d.moved && Math.abs(dx) > 8) {
      d.moved = true;
      if (d.b && d.b.state === 'fall') { d.b.state = 'drag'; d.b.node.classList.add('dragging'); }
    }
    if (d.moved && d.b && d.b.state === 'drag') { d.b.dx = d.dx0 + dx; place(d.b); }
  }
  function onUp(e) {
    const d = drag;
    if (!d || e.pointerId !== d.id) return;
    detach();
    drag = null;
    const b = d.b;
    if (!d.moved) {
      // 칸 누르기 → 가장 아래 말풍선을 그 칸으로
      if (d.binBtn && b) sendTo(b, +d.binBtn.dataset.i, 'bin');
      return;
    }
    if (!b || b.state !== 'drag') return;
    b.node.classList.remove('dragging');
    const a = d.hist[0], z = d.hist[d.hist.length - 1];
    const vx = (z.x - a.x) / Math.max(16, z.t - a.t);
    const x = b.cx;
    if (!nearPost(x)) { sendTo(b, binIndexAt(x), d.type === 'touch' ? 'swipe' : 'drag'); return; }
    if (Math.abs(vx) > 0.35) { sendTo(b, vx < 0 ? b.div : b.div + 1, 'flick'); return; }
    // 기둥 위에서 놓음: 제자리로
    b.state = 'fall'; b.dx = 0; place(b);
  }
  function onCancel(e) { if (drag && (!e || e.pointerId === drag.id)) cancelDrag('cancel'); }
  function onLost() { setTimeout(() => { if (drag) cancelDrag('lost'); }, 0); }
  function detach() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    el.field.removeEventListener('lostpointercapture', onLost);
    if (drag) { try { if (el.field.hasPointerCapture(drag.id)) el.field.releasePointerCapture(drag.id); } catch (err) { /* 무시 */ } }
  }
  function endDragState() {
    if (!drag) return;
    detach();
    const b = drag.b;
    drag = null;
    if (b && b.node) b.node.classList.remove('dragging');
    if (b && b.state === 'drag') b.state = 'fall';
  }
  function cancelDrag(why) {
    if (!drag) return;
    const b = drag.b;
    endDragState();
    if (b && b.state === 'fall') { b.dx = 0; place(b); }
    R.hooks.lost && R.hooks.lost(why);
  }
  R.cancelDrag = cancelDrag;
})();

  <script>
/* 결과 공유: 텍스트 복사(클립보드 → execCommand 대체), 캔버스 PNG(브라우저 안에서 생성).
 * 서버 전송 없음. 이름·입력값은 넣지 않는다.
 */
(function () {
  const BR = window.BR;
  const MARK = { o: '🟩', s: '🚨', x: '🟥', m: '⬜', b: '⭐' };
  const MAX = 20;
  const LABEL = { o: '맞힘', s: '[급해요] 맞힘', x: '틀림', m: '놓침', b: '기록 바로잡기 보너스' };

  function rows(R) {
    const out = [];
    R.log.forEach((r) => { (out[r.s - 1] = out[r.s - 1] || []).push(r); });
    return out.map((row, i) => ({ s: i + 1, row: row || [] })).filter((x) => x.row.length);
  }

  function gridHtml(R) {
    // 한 단계에 너무 많으면 앞 MAX칸만 보이고 나머지는 +N
    return rows(R).map((x) => `<div class="gr"><span class="gs">${x.s}단계</span><span class="gc">${x.row.slice(0, MAX).map((r) => `<i class="c-${r.r}" title="${LABEL[r.r]}"></i>`).join('')}${x.row.length > MAX ? `<em>+${x.row.length - MAX}</em>` : ''}</span></div>`).join('');
  }

  function text(R) {
    const lines = [
      `💬 말풍선 러시 — ${R.finished ? '3단계 완주!' : R.stage + '단계에서 게임 오버'}`,
      `${R.score.toLocaleString()}점 · 맞힘 ${R.ok}/${R.total} · 최고 콤보 ${R.maxCombo}`,
      rows(R).map((x) => `${x.s}단계 ${x.row.slice(0, MAX).map((r) => MARK[r.r]).join('')}${x.row.length > MAX ? ` +${x.row.length - MAX}` : ''}`).join('\n'),
      `칭호: ${R.title}`
    ];
    lines.push('👉 ' + (/^https?:/.test(location.protocol) ? location.origin + location.pathname : 'https://v5-bubble-rush.vercel.app/'));
    return lines.filter(Boolean).join('\n');
  }

  async function copy(t) {
    try {
      if (navigator.clipboard && window.isSecureContext !== false) {
        await navigator.clipboard.writeText(t);
        return true;
      }
    } catch (e) { /* 아래 대체 */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = t;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, t.length);
      const ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      return !!ok;
    } catch (e) { return false; }
  }

  function loadImg(src) {
    return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  }
  function rr(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  const FONT = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif';
  const COLOR = { o: '#3cbf7f', s: '#B8865C', x: '#e0566b', m: '#c9d3ce', b: '#f2b632' };

  async function draw(R, withJini) {
    const W = 1080, H = 1350;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    c.fillStyle = '#1e2320'; c.fillRect(0, 0, W, H);
    // 민트 카드(원본 W 배경색)
    c.fillStyle = '#F3F9F5'; rr(c, 50, 50, W - 100, H - 100, 56); c.fill();
    c.textBaseline = 'alphabetic'; c.textAlign = 'left';
    c.fillStyle = '#5F6E66'; c.font = `600 38px ${FONT}`; c.fillText('인바이츠루프 V5 손가락 게임', 110, 150);
    c.fillStyle = '#1E2320'; c.font = `900 104px ${FONT}`; c.fillText('말풍선 러시', 104, 265);
    c.fillStyle = '#1E8F5A'; c.font = `800 52px ${FONT}`; c.fillText(R.finished ? '3단계 완주!' : `${R.stage}단계에서 게임 오버`, 110, 350);
    // 떨어지는 말풍선 장식
    c.fillStyle = '#E3F1E8'; rr(c, 110, 390, 360, 86, 40); c.fill();
    c.fillStyle = '#1E2320'; c.font = `500 38px ${FONT}`; c.fillText('약 끊어도 돼?', 146, 446);
    if (withJini) {
      const svg = window.Jini.doc({ mood: R.finished ? 'happy' : 'dizzy', stars: R.finished }, 300);
      const im = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
      c.drawImage(im, W - 110 - 280, 150, 280, 280);
    }
    // 점수
    c.fillStyle = '#fff'; rr(c, 110, 510, W - 220, 260, 40); c.fill();
    c.textAlign = 'center';
    c.fillStyle = '#5F6E66'; c.font = `700 36px ${FONT}`; c.fillText(`맞힘 ${R.ok}/${R.total} · 최고 콤보 ${R.maxCombo}`, W / 2, 580);
    c.fillStyle = '#1E2320'; c.font = `900 140px ${FONT}`; c.fillText(R.score.toLocaleString() + '점', W / 2, 725);
    // 칭호
    c.fillStyle = '#1E2320'; rr(c, 110, 800, W - 220, 110, 55); c.fill();
    c.fillStyle = '#fff'; c.font = `800 46px ${FONT}`; c.fillText(`칭호 · ${R.title}`, W / 2, 872);
    // 그리드(단계별, 한 줄 최대 14칸)
    let y = 960;
    const cell = 42, gap = 8;
    rows(R).forEach((x) => {
      const row = x.row.slice(0, 14);
      c.textAlign = 'left'; c.fillStyle = '#5F6E66'; c.font = `700 32px ${FONT}`; c.fillText(`${x.s}단계`, 110, y + 34);
      let cx = 250;
      row.forEach((r) => { c.fillStyle = COLOR[r.r]; rr(c, cx, y, cell, cell, 12); c.fill(); cx += cell + gap; });
      if (x.row.length > 14) { c.fillStyle = '#5F6E66'; c.fillText('…', cx + 4, y + 34); }
      y += cell + 24;
    });
    c.textAlign = 'center'; c.fillStyle = '#5F6E66'; c.font = `600 28px ${FONT}`;
    c.fillText('원본 V5 프로토타입 문장으로 만든 가상 연출 게임', W / 2, H - 82);
    return cv.toDataURL('image/png');
  }

  async function image(R) {
    try { return await draw(R, true); }
    catch (e) { return draw(R, false); } // SVG 그리기가 막히면 지니 없이
  }

  BR.share = { text, copy, image, gridHtml };
})();

  <script>
/* 화면 흐름: 표지 → 플레이(rush.js) → 결과(칭호·이모지 그리드·복사·이미지 저장·바로 다시)
 * 진행자 지니는 원본 W 화면 밖(진행 줄 아래 머리줄, 넓은 화면에서는 폰 왼쪽)에만 둔다.
 */
(function () {
  const BR = window.BR, $ = BR.$, snd = BR.sound;
  const frame = $('#frame');
  let screen = 'cover';
  let lastResult = null;

  // 아이콘 채우기
  BR.$$('[data-icon]').forEach((n) => { n.innerHTML = BR.icon(n.dataset.icon); });
  $('#hint-text').textContent = BR.HINT;
  $('#btn-pause').innerHTML = BR.icon('pause');
  $('.mini-hand').innerHTML = BR.icon('hand');
  $('#cover-jini').innerHTML = window.Jini.el({ mood: 'happy', wave: true }, 'j-hop');

  function show(id) {
    screen = id;
    frame.dataset.screen = id;
    ['cover', 'play', 'result'].forEach((s) => $('#s-' + s).classList.toggle('on', s === id));
  }

  /* ---------- 소리 ---------- */
  function renderSnd() {
    const b = $('#snd');
    b.innerHTML = BR.icon(snd.on ? 'sndOn' : 'sndOff');
    b.setAttribute('aria-pressed', String(snd.on));
    b.setAttribute('aria-label', snd.on ? '소리 끄기' : '소리 켜기');
    b.classList.toggle('on', snd.on);
  }
  $('#snd').addEventListener('click', (e) => { snd.toggle(); renderSnd(); e.currentTarget.blur(); });

  /* ---------- 진행자 지니(폰 화면 밖) ---------- */
  let moodT = 0;
  function mood(m) {
    $('#host-jini').innerHTML = window.Jini.el({ mood: m || 'base' }, m === 'sad' ? 'j-shake' : m === 'happy' ? 'j-hop' : '');
    clearTimeout(moodT);
    if (m && m !== 'base') moodT = setTimeout(() => mood('base'), 1100);
  }
  function say(text, m) {
    const p = $('#host-line');
    p.textContent = text;
    BR.flash(p, 'new', 400);
    mood(m || 'base');
  }

  /* ---------- 진행 줄 ---------- */
  function hearts(n) {
    $('#hearts').innerHTML = [0, 1, 2].map((i) => `<i class="heart ${i < n ? '' : 'lost'}">${BR.icon('heart')}</i>`).join('');
    $('#hearts').setAttribute('aria-label', `하트 ${n}개`);
  }
  function update(G) {
    hearts(G.hearts);
    $('#score').textContent = G.score.toLocaleString();
    $('#combo').textContent = G.combo >= 2 ? `콤보 ${G.combo}` : '';
  }
  function tick(G) {
    const ends = BR.STAGES.map((s) => s.until);
    BR.$$('#bar .seg b').forEach((b, i) => {
      const from = i ? ends[i - 1] : 0;
      b.style.width = BR.clamp(((G.t - from) / (ends[i] - from)) * 100, 0, 100) + '%';
    });
  }

  BR.rush.init({
    update, tick, say, mood,
    hurt: () => BR.flash($('#hearts'), 'hit', 500),
    stage: (st, first) => {
      $('#stage-label').textContent = st.n + '단계';
      say(st.line, first ? 'happy' : 'wow');
    },
    end: (G) => result(G),
    lost: (why) => { if (window.__brLog) window.__brLog.push('lost-release:' + why); },
    action: (how) => { if (window.__brLog) window.__brLog.push('action:' + how); }
  });

  /* ---------- 시작 ---------- */
  function start() {
    closeSheet();
    $('#ov-pause').hidden = true;
    show('play');
    $('#combo').textContent = '';
    BR.rush.start();
  }

  /* ---------- 일시정지 ---------- */
  function pause() {
    if (screen !== 'play' || !BR.rush.pause()) return;
    $('#ov-pause').hidden = false;
    $('#btn-resume').focus({ preventScroll: true });
  }
  function resume() {
    $('#ov-pause').hidden = true;
    BR.rush.resume();
  }
  $('#btn-pause').addEventListener('click', (e) => { pause(); e.currentTarget.blur(); });
  $('#btn-resume').addEventListener('click', resume);
  $('#btn-quit').addEventListener('click', () => { $('#ov-pause').hidden = true; BR.rush.stop(); renderCover(); show('cover'); });
  // 탭이 백그라운드로 가면 멈춤(돌아와도 자동으로 이어지지 않고 [이어서 하기]를 기다림)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { BR.rush.cancelDrag('hidden'); pause(); }
  });

  /* ---------- 결과 ---------- */
  function titleOf(G) {
    const cnt = {};
    G.kinds.forEach((k) => { cnt[k] = (cnt[k] || 0) + 1; });
    let best = null, bc = 0;
    G.kinds.forEach((k) => { if (cnt[k] >= bc) { bc = cnt[k]; best = k; } }); // 같으면 나중 실수
    if (!best) return BR.TITLES.clean;
    if (G.finished && G.kinds.length <= 1) return BR.TITLES.few;
    return BR.TITLES[best] || BR.TITLES.few;
  }

  function result(G) {
    const prevBest = +BR.store.get(BR.KEY_BEST) || 0;
    const isNew = G.score > prevBest;
    if (isNew) BR.store.set(BR.KEY_BEST, String(G.score));
    const best = Math.max(prevBest, G.score);
    const T = titleOf(G);
    const ok = G.log.filter((r) => r.r === 'o' || r.r === 's').length;
    const total = G.log.filter((r) => r.r !== 'b').length;
    lastResult = { score: G.score, best, isNew, finished: G.finished, stage: G.stage + 1, ok, total, maxCombo: G.maxCombo, log: G.log.slice(), title: T.title, line: T.line, bonus: G.bonus.ok };

    $('#res-jini').innerHTML = window.Jini.el({ mood: G.finished ? 'happy' : 'dizzy', stars: G.finished }, G.finished ? 'j-hop' : '');
    $('#res-over').textContent = G.finished ? '완주!' : `${G.stage + 1}단계에서 게임 오버`;
    $('#res-badge').textContent = T.title;
    $('#res-say').textContent = T.line;
    $('#res-score').textContent = G.score.toLocaleString();
    $('#res-new').hidden = !isNew;
    $('#res-stats').innerHTML = `<span>맞힘 <b>${ok}/${total}</b></span><span>최고 콤보 <b>${G.maxCombo}</b></span><span>최고 기록 <b>${best.toLocaleString()}</b></span>`;

  // 결과 화면 맞춤: 다시 볼 말(최대 3줄)을 화면에 들어가는 만큼만 보여 준다(스크롤·잘림 없이, 큰 빈칸 없이)
  function fitResult() {
    const s = $('#s-result');
    const rv = $('#res-review');
    const rows = BR.$$('.rv', rv);
    rv.hidden = !rows.length;
    rows.forEach((r) => { r.hidden = false; });
    const need = () => {
      const cs = getComputedStyle(s);
      const kids = Array.from(s.children).filter((c) => !c.hidden && c.offsetParent);
      const sum = kids.reduce((a, c) => a + c.getBoundingClientRect().height, 0);
      return sum + 10 * (kids.length - 1) + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    };
    for (let i = rows.length - 1; i >= 1 && need() > s.clientHeight; i--) rows[i].hidden = true;
    if (need() > s.clientHeight) rv.hidden = true;
  }
  window.addEventListener('resize', () => { if (screen === 'result') fitResult(); });

  // 다시 볼 말: 틀린 말(최대 3개) 또는 맞힌 말 중 칸이 다른 것(최대 3개) + 원본 답 첫 줄
  function reviewHtml(G) {
    const seen = {};
    let rows = G.log.filter((r) => (r.r === 'x' || r.r === 'm') && r.bin && !seen[r.t] && (seen[r.t] = 1));
    let head = '틀리거나 놓친 말, 원본은 이렇게 해요';
    if (!rows.length) {
      head = '이번 판 원본 답 다시 보기';
      const bins = {};
      rows = G.log.filter((r) => (r.r === 'o' || r.r === 's') && !bins[r.bin] && (bins[r.bin] = 1));
    }
    rows = rows.slice(0, 3);
    if (!rows.length) return '';
    return `<p class="rv-head">${head}</p>` + rows.map((r) => {
      const name = r.bin === 'sos' ? '[급해요]' : BR.BINS[r.bin].name;
      return `<div class="rv"><p class="rv-q"><span class="rv-bub">${BR.esc(r.t)}</span><span class="rv-to">→ ${name}</span></p><p class="rv-a"><i class="edge"></i>${BR.esc(r.a)}</p></div>`;
    }).join('');
  }

  /* ---------- 공유 ---------- */
  let toastT = 0;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('on'), 1800);
  }
  function openSheet(title, bodyHtml, saveHref) {
    $('#toast').classList.remove('on');
    $('#sheet-title').textContent = title;
    $('#sheet-body').innerHTML = bodyHtml;
    const a = $('#sheet-save');
    a.hidden = !saveHref;
    if (saveHref) a.href = saveHref;
    $('#sheet').hidden = false;
  }
  function closeSheet() { $('#sheet').hidden = true; $('#sheet-body').innerHTML = ''; }
  $('#sheet-close').addEventListener('click', closeSheet);
  $('#sheet').addEventListener('pointerdown', (e) => { if (e.target.id === 'sheet') closeSheet(); });

  $('#btn-start').addEventListener('click', start);
  $('#btn-again').addEventListener('click', start);
  $('#btn-copy').addEventListener('click', async () => {
    const text = BR.share.text(lastResult);
    const ok = await BR.share.copy(text);
    if (ok) toast('결과를 복사했어요!');
    else openSheet('복사가 막혀 있어요. 아래 글을 길게 눌러 복사해 주세요', `<textarea class="copybox" readonly>${BR.esc(text)}</textarea>`, '');
  });
  $('#btn-img').addEventListener('click', async () => {
    const btn = $('#btn-img');
    btn.disabled = true;
    try {
      const url = await BR.share.image(lastResult);
      openSheet('결과 이미지 · 저장하거나 길게 눌러 저장해요', `<img class="preview" alt="말풍선 러시 결과 이미지" src="${url}">`, url);
    } catch (e) {
      toast('이미지를 만들지 못했어요');
    } finally { btn.disabled = false; }
  });

  /* ---------- 키보드 ---------- */
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (!$('#sheet').hidden) { if (k === 'Escape') closeSheet(); return; }
    if (screen === 'play') {
      if (!$('#ov-pause').hidden) { if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); resume(); } return; }
      if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); pause(); return; }
      if (e.repeat) { if (k.indexOf('Arrow') === 0 || k === ' ') e.preventDefault(); return; }
      if (BR.rush.key(k)) e.preventDefault();
      return;
    }
    if (e.repeat) return;
    if (screen === 'cover' && (k === ' ' || k === 'Enter')) { e.preventDefault(); start(); return; }
    if (screen === 'result' && (k === 'r' || k === 'R')) { e.preventDefault(); start(); }
  });

  function renderCover() {
    const best = +BR.store.get(BR.KEY_BEST) || 0;
    $('#cover-best').textContent = best ? `최고 기록 ${best.toLocaleString()}점` : '';
    $('#cover-best').hidden = !best;
  }

  // 시험용 읽기 전용 훅(화면 동작에는 영향 없음)
  BR._debug = { state: () => BR.rush.state(), result: () => lastResult };

  renderSnd();
  renderCover();
  hearts(3);
  show('cover');
})();

</script>
</body>
</html>
