<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="잠든 AI 건강비서를 깨워 네 지역의 퀘스트 11개로 하루 루프에서 검진·외래·퇴원 후·사후 관리까지 Patient Journey를 여행하는 첫 사용 안내 게임 시안(가상 데이터).">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>건강비서 퀘스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 게임 안의 앱: 장면(하늘·먼 산·건물·땅)이 화면 전체, 위에 얇은 게임 HUD, 아래 RPG 대화 상자.
   v5 화면은 아바타가 꺼내는 "통신기"(폰 프레임) 안에서만 쓰고, 그 안은 실제 v5처럼 차분하게 둔다. */
:root {
  --primary: #1a71ff;      /* v5 blue.50 */
  --primary-soft: #eaf2fe; /* v5 blue.95 */
  --ink: #171719;          /* v5 text.default */
  --sub: #70737c;          /* v5 text.sub */
  --line: #dbdcdf;         /* v5 border.base */
  --panel: #ffffff;
  --surface: #f4f5f7;
  --good: #00b200;         /* v5 green.50 */
  --gold: #ffd21f;
  --gold-ink: #5a3a00;
  --parch: #f8edd3;
  --parch-2: #ecd7a6;
  --parch-line: #b8924f;
  --parch-ink: #3d2b10;
  --hud-bg: rgba(14, 20, 44, .62);
  --hud-line: rgba(255, 220, 130, .55);
  --display: "Black Han Sans", "Noto Sans KR", system-ui, sans-serif;
  --body: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
  --num: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; font-family: var(--body); color: var(--ink); background: #0b1022; background-image: radial-gradient(circle at 50% 30%, #1d2a55, #0b1022 70%); overflow: hidden; display: grid; place-items: center; }
#app { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: #8fb7ff; }
@media (min-width: 600px) { #app { height: min(100vh, 932px); width: calc(min(100vh, 932px) * .5); border-radius: 28px; box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08); } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
button { font: inherit; cursor: pointer; border: 0; }

/* ── 장면(스테이지 400×800, 앱을 덮도록 스케일) ── */
#stage { position: absolute; left: 50%; bottom: 0; width: 400px; height: 800px; transform-origin: 50% 100%; z-index: 1; --s1: #8fb7ff; --s2: #ffe0b8; --sf: none; }
#stage svg.lay { position: absolute; inset: 0; width: 400px; height: 800px; display: block; pointer-events: none; overflow: hidden; }
#stage svg.bg { will-change: transform; }
#stage svg.a1, #stage svg.bg, #stage svg.a2 { filter: var(--sf); transition: filter .8s; }
#stage .stars, #stage .moon, #stage svg.top, #stage .ffly { opacity: 0; transition: opacity .8s; }
#stage.night .stars, #stage.night .moon, #stage.night svg.top, #stage.dusk .ffly { opacity: 1; }
#stage .sun { transition: transform 1.2s ease, opacity .8s; }
#stage .sun .disc { transition: fill .8s; }
#stage.t-noon .sun { transform: translate(-60px, -50px); }
#stage.t-evening .sun { transform: translate(-150px, 200px); }
#stage.t-evening .sun .disc { fill: #ffa25a; }
#stage .rays { transition: opacity .8s; animation: rays 7s ease-in-out infinite alternate; }
#stage.night .sun { opacity: 0; }
#stage.night .rays, #stage.t-evening .rays { visibility: hidden; }
#stage .cloud { animation: drift 46s linear infinite alternate; }
#stage .cloud.c2 { animation-duration: 64s; animation-direction: alternate-reverse; }
#stage .bird { animation: fly 28s linear infinite; }
#stage .bird .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: flapw .45s ease-in-out infinite alternate; }
#stage .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4.5s ease-in-out infinite alternate; }
#stage .sway.banner { transform-origin: 50% 0; animation-duration: 3.2s; }
#stage .smoke { transform-box: fill-box; transform-origin: center; opacity: 0; animation: smoke 3.9s ease-out infinite; }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame .45s ease-in-out infinite alternate; }
.flicker { animation: flicker 2.2s ease-in-out infinite; }
#stage .flag { transform-box: fill-box; transform-origin: 0 50%; animation: flag 1.3s ease-in-out infinite alternate; }
#stage .mist { animation: mist 16s ease-in-out infinite alternate; }
#stage .wave, #stage .shimmer { animation: wave 2.6s ease-in-out infinite alternate; }
#stage .fall path { animation: fall .6s linear infinite; }
#stage .ffly circle { animation: ffly 3s ease-in-out infinite alternate; }
#stage .glint path { animation: glint 1.8s ease-in-out infinite alternate; }
#stage .boat { transform-box: fill-box; transform-origin: 50% 100%; animation: boat 3.4s ease-in-out infinite alternate; }
#stage .beam { transform-box: fill-box; transform-origin: 100% 50%; animation: beam 3.4s ease-in-out infinite; }
#stage .bfly { animation: bfly 10s ease-in-out infinite alternate; }
#stage .bfly .flap { transform-box: fill-box; transform-origin: center; animation: bflap .18s ease-in-out infinite alternate; }
@keyframes rays { from { opacity: .65; } to { opacity: 1; } }
@keyframes fly { from { transform: translateX(-40px); } to { transform: translateX(440px); } }
@keyframes flapw { from { transform: scaleY(1); } to { transform: scaleY(-.5); } }
@keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
@keyframes smoke { 0% { opacity: 0; transform: translate(0, 0) scale(.5); } 15% { opacity: .6; } 100% { opacity: 0; transform: translate(14px, -56px) scale(2.2); } }
@keyframes flame { from { transform: scale(1, 1); } to { transform: scale(.86, 1.14); } }
@keyframes flicker { 0%, 100% { opacity: .75; } 40% { opacity: 1; } 55% { opacity: .6; } 70% { opacity: .95; } }
@keyframes flag { from { transform: skewY(-5deg) scaleX(1); } to { transform: skewY(6deg) scaleX(.9); } }
@keyframes mist { from { transform: translateX(-24px); } to { transform: translateX(30px); } }
@keyframes fall { to { stroke-dashoffset: -18; } }
@keyframes ffly { from { opacity: .15; transform: translate(0, 0); } to { opacity: 1; transform: translate(6px, -10px); } }
@keyframes glint { from { opacity: .15; } to { opacity: 1; } }
@keyframes boat { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(3px) rotate(2deg); } }
@keyframes bfly { 0% { transform: translate(0, 0); } 33% { transform: translate(50px, -26px); } 66% { transform: translate(90px, 4px); } 100% { transform: translate(140px, -18px); } }
@keyframes bflap { to { transform: scaleX(.3); } }
@keyframes breath { 0%, 100% { translate: 0 0; } 50% { translate: 0 -1.6px; } }
@keyframes talkbob { from { translate: 0 0; } to { translate: 0 -3px; } }
@keyframes talk { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
@keyframes tilt { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-3deg); } 60% { transform: rotate(2deg); } }
@keyframes handmove { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(7deg); } }
/* 캐릭터 — 발끝 기준 */
.ch { position: absolute; top: 0; transform: translateX(-50%); background: none; padding: 0; color: inherit; transition: left .6s linear; }
.ch:focus-visible { outline: 3px solid #fff2a8; outline-offset: 2px; border-radius: 12px; }
.ch .mk2 { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); font-family: var(--display); font-size: 40px; line-height: 1; color: var(--gold); -webkit-text-stroke: 2px var(--gold-ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--gold-ink), 0 0 16px rgba(255,214,60,.95); animation: mbob .9s ease-in-out infinite; pointer-events: none; }
.ch .mk2:empty { display: none; }
.ch.giving { cursor: pointer; }
.ch.giving::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 70px; height: 16px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(rgba(255,214,60,.7), transparent 70%); animation: halo 1.4s ease-in-out infinite; pointer-events: none; }
#avatar { width: 72px; height: 100px; z-index: 3; }
#avatar svg { width: 72px; height: 100px; display: block; overflow: visible; }
#avatar.flip svg { transform: scaleX(-1); }
#avatar .leg, #avatar .arm { transform-box: fill-box; transform-origin: 50% 4%; }
#avatar.walking .leg.l, #avatar.walking .arm.b { animation: legA .3s ease-in-out infinite alternate; }
#avatar.walking .leg.r, #avatar.walking .arm.f { animation: legB .3s ease-in-out infinite alternate; }
#avatar.walking svg { animation: walkbob .3s ease-in-out infinite; }
#avatar .gadget { opacity: 0; transition: opacity .25s; }
#avatar.using .gadget { opacity: 1; }
#avatar .arm { transition: transform .25s; }
#avatar.using .arm.f { transform: rotate(-55deg); }
.breath { animation: breath 3.2s ease-in-out infinite; }
.ch .eyes, .npc .eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.6s infinite; }
.npc .eyes { animation-delay: -1.7s; }
.npc .head { transform-box: fill-box; transform-origin: 50% 95%; animation: tilt 6s ease-in-out infinite; }
.npc .hand { transform-box: fill-box; transform-origin: 80% 5%; animation: handmove 3.8s ease-in-out infinite; }
.mouth-o { opacity: 0; }
.talking .mouth-c { opacity: 0; }
.talking .mouth-o { opacity: 1; transform-box: fill-box; transform-origin: center; animation: talk .16s ease-in-out infinite alternate; }
.talking .breath { animation: talkbob .32s ease-in-out infinite alternate; }
#comp.talking .agent, .dpor.talking .agent { animation: talkbob .3s ease-in-out infinite alternate; }
#comp { width: 62px; height: 62px; z-index: 2; transition: left .8s ease, top .8s ease; }
#comp .agent { width: 62px; height: 62px; }
.npcbtn { width: 92px; height: 100px; z-index: 2; }
.npcbtn .npc { width: 92px; height: 100px; overflow: visible; display: block; }
#stage.night #avatar svg, #stage.night .npcbtn .npc, #stage.night #comp .agent { filter: brightness(.78) saturate(.85); }
.bubble { position: absolute; transform: translate(-50%, -100%); background: #fff; color: var(--ink); font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 14px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.2); z-index: 4; animation: pop .25s ease-out; pointer-events: none; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }
.pillar { position: absolute; top: 0; width: 70px; height: 560px; transform: translateX(-50%); transform-origin: 50% 100%; background: linear-gradient(to top, rgba(255,236,140,.95), rgba(255,236,140,.55) 40%, rgba(255,236,140,0)); border-radius: 40px 40px 0 0; filter: blur(1px); mix-blend-mode: screen; pointer-events: none; z-index: 5; animation: pillar 1.5s ease-out forwards; }

/* ── HUD ── */
.hud { position: absolute; z-index: 10; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hl { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; background: var(--hud-bg); border: 1px solid var(--hud-line); border-radius: 16px; padding: 5px 10px 5px 5px; color: #fff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: 220px; }
.por { width: 46px; height: 46px; flex: none; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #2a3f86, #0c1533); border: 2px solid var(--gold); display: grid; place-items: center; overflow: hidden; }
.por .agent { width: 46px; height: 46px; }
.hlv { min-width: 0; flex: 1; display: grid; gap: 2px; }
.hlv small { font-size: 10.5px; font-weight: 700; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hlv .lvrow { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; overflow: hidden; }
.hlv .lvrow b { font-family: var(--display); font-weight: 400; font-size: 16px; color: var(--gold); }
.hlv .lvrow span { font-size: 11.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.xpbar { height: 7px; border-radius: 4px; background: rgba(0,0,0,.4); box-shadow: inset 0 0 0 1px rgba(255,220,130,.5); overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8cc0ff, #1a71ff); border-radius: 4px; transition: width .6s ease; }
.hr { display: flex; align-items: flex-start; gap: 6px; flex: none; }
.stats { display: grid; grid-template-columns: auto auto; align-items: center; gap: 3px 6px; justify-items: end; background: var(--hud-bg); border: 1px solid var(--hud-line); border-radius: 14px; padding: 5px 8px; color: #fff; font-size: 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.stats .xpv { grid-column: 1 / -1; }
.stats b { font-family: var(--num); font-size: 12.5px; }
.stats .xpv b { color: #fff2a8; }
#mute { background: rgba(255,255,255,.18); color: #fff; border-radius: 999px; width: 26px; height: 22px; font-size: 11px; }
#mute:focus-visible, #logBtn:focus-visible { outline: 3px solid #fff2a8; }
.mini { width: 58px; height: 60px; flex: none; border-radius: 12px; border: 1.5px solid var(--parch-line); box-shadow: 0 0 0 1px rgba(255,220,130,.4); overflow: hidden; background: var(--parch); }
.mini svg { width: 100%; height: 100%; display: block; }
.mini .dot { fill: #c9b48a; stroke: #8a6a30; stroke-width: 6; }
.mini .dot.done { fill: var(--gold); }
.mini .dot.cur { fill: #ff7a3d; stroke: #fff; stroke-width: 8; animation: halo 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

/* 퀘스트 추적기 — 오른쪽, 접을 수 있다 */
.tracker { position: absolute; z-index: 10; right: 10px; top: calc(80px + env(safe-area-inset-top, 0px)); width: 184px; max-width: calc(100% - 20px); box-sizing: border-box; background: var(--hud-bg); border: 1px solid var(--hud-line); border-radius: 12px; color: #fff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow: hidden; }
.tracker:empty { display: none; }
.trk-head { width: 100%; display: flex; align-items: center; gap: 6px; padding: 5px 9px 2px; background: none; color: #ffe9a8; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-align: left; }
.trk-head i { margin-left: auto; font-style: normal; transition: transform .2s; }
.tracker.collapsed .trk-head i { transform: rotate(-90deg); }
.tracker.collapsed .trk-body { display: none; }
.trk-body { padding: 0 9px 6px; display: grid; gap: 2px; }
.trk-body > b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.obj { display: flex; align-items: center; gap: 5px; font-size: 11.5px; min-width: 0; }
.obj span.t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.obj .box { width: 12px; height: 12px; flex: none; border: 1.5px solid #ffe9a8; border-radius: 3px; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: #0c1533; }
.obj em { font-style: normal; font-family: var(--num); font-size: 11px; color: #ffe9a8; flex: none; }
.obj.ok { color: #9ff07a; }
.obj.ok .box { background: #7de549; border-color: #7de549; }
.obj.ok em { color: #9ff07a; }
.obj.flash { animation: objflash .6s; }
.trk-offer, .turnin { display: block; width: 100%; font-weight: 800; font-size: 12.5px; color: var(--gold-ink); background: linear-gradient(180deg, #ffe680, #ffc21f); border-top: 1px solid #b07d00; padding: 8px 8px; animation: pulsegold 1.2s infinite; }
.turnin { border-radius: 8px; border: 1px solid #b07d00; margin-top: 3px; }
.mk { font-family: var(--display); color: #fff; -webkit-text-stroke: 1px var(--gold-ink); paint-order: stroke fill; font-size: 15px; margin-right: 3px; }
.trk-idle { padding: 7px 9px; font-size: 11.5px; font-weight: 700; color: #ffe9a8; }
.trk-offer:focus-visible, .turnin:focus-visible, .trk-head:focus-visible { outline: 3px solid #fff2a8; outline-offset: -3px; }

/* 아래: 아이템 슬롯 바 + 퀘스트 로그 */
.itembar { position: absolute; z-index: 10; left: 10px; right: 10px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 6px; padding: 5px 6px; background: var(--hud-bg); border: 1px solid var(--hud-line); border-radius: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity .3s, transform .3s; }
.slots { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; }
.slot { aspect-ratio: 1; border-radius: 6px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,220,130,.35); display: grid; place-items: center; font-size: 14px; line-height: 1; min-width: 0; }
.slot.got { background: linear-gradient(180deg, #fffaf0, #ecd08a); border-color: var(--gold); }
.slot.new { animation: lootpop .5s cubic-bezier(.2,.9,.3,1.4); }
#logBtn { flex: none; font-size: 12px; font-weight: 800; color: var(--gold-ink); background: linear-gradient(180deg, #ffe680, #ffc21f); border-radius: 9px; padding: 7px 8px; white-space: nowrap; }
.flyloot { position: fixed; z-index: 58; font-size: 30px; line-height: 1; pointer-events: none; transform: translate(-50%, -50%); filter: drop-shadow(0 0 10px rgba(255,214,60,.95)); }

/* RPG 대화 상자 */
.dialog { position: absolute; z-index: 12; left: 10px; right: 10px; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); min-height: 92px; box-sizing: border-box; padding: 26px 16px 14px; background: linear-gradient(180deg, rgba(20,28,62,.94), rgba(10,15,36,.96)); border: 2px solid var(--hud-line); border-radius: 16px; color: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,.25), 0 14px 40px rgba(0,0,0,.4); text-align: left; transform: translateY(16px); opacity: 0; pointer-events: none; transition: transform .25s, opacity .25s; }
.dialog.show { transform: none; opacity: 1; pointer-events: auto; cursor: pointer; }
.dialog .dpor { position: absolute; left: 12px; top: -34px; width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fffaf0, #e5cd96); border: 3px solid var(--gold); overflow: hidden; display: grid; place-items: center; }
.dialog .dpor svg { width: 56px; height: 56px; }
.dialog .dname { position: absolute; left: 78px; top: -13px; font-size: 12.5px; font-weight: 800; color: var(--gold-ink); background: linear-gradient(180deg, #ffe680, #ffc21f); border: 1px solid #b07d00; border-radius: 8px; padding: 3px 10px; }
.dialog .dtext { font-size: 15.5px; line-height: 1.6; min-height: 50px; word-break: keep-all; overflow-wrap: anywhere; }
.dialog .dnext { position: absolute; right: 12px; bottom: 6px; color: var(--gold); font-size: 13px; animation: nextbob .8s ease-in-out infinite; }
.dialog[data-state="typing"] .dnext { visibility: hidden; }
.dialog:focus-visible { outline: 3px solid #fff2a8; }

/* 퀘스트 카드(제안) — 대화 상자 자리에 */
.qcard { position: absolute; z-index: 13; left: 10px; right: 10px; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; max-height: calc(100% - 200px); overflow-y: auto; background: linear-gradient(180deg, var(--parch), var(--parch-2)); color: var(--parch-ink); border: 2px solid var(--parch-line); border-radius: 16px; box-shadow: 0 0 0 4px rgba(255,236,180,.35), 0 20px 50px rgba(0,0,0,.45); padding: 14px 16px 16px; display: grid; gap: 8px; animation: unroll .3s cubic-bezier(.2,.9,.3,1.15); }
.qcard .rib { justify-self: start; font-size: 11.5px; font-weight: 800; letter-spacing: .12em; color: #fff; background: #b0571a; border-radius: 6px; padding: 2px 8px; }
.qcard h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 23px; line-height: 1.15; }
.qsec { font-size: 11.5px; font-weight: 800; color: #8a6a30; letter-spacing: .08em; border-bottom: 1px solid rgba(138,106,48,.35); padding-bottom: 2px; }
.qobj { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 14px; font-weight: 500; }
.qobj li::before { content: "◆ "; color: #b07d00; }
.qrew { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.xpchip { font-weight: 800; font-size: 13px; background: #fff6cf; border: 1px solid #d9b44a; border-radius: 999px; padding: 4px 10px; color: var(--gold-ink); }
.itemchip { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; background: #fffaf0; border: 1px solid var(--parch-line); border-radius: 10px; padding: 4px 10px 4px 4px; }
.itemchip i { font-style: normal; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; background: linear-gradient(180deg, #fff6cf, #ecd08a); font-size: 15px; }
.qnote { font-size: 11.5px; color: #6b5226; }

/* ── 통신기: 폰 프레임 속 실제 v5 화면 ── */
#phone { position: absolute; z-index: 9; left: 12px; right: 12px; top: calc(178px + env(safe-area-inset-top, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); background: #1b1f2a; border-radius: 34px; padding: 7px; box-sizing: border-box; box-shadow: 0 0 0 2px #3a4152, 0 24px 60px rgba(0,0,0,.5); transform: translateY(115%); transition: transform .42s cubic-bezier(.2,.9,.3,1.05); display: flex; }
#app.phone-on #phone { transform: none; }
#app.phone-on .itembar { opacity: 0; transform: translateY(20px); pointer-events: none; }
/* 목표를 채우면 통신기를 바로 닫지 않는다 — 다 읽고 누르면 닫힌다 */
.pdone { flex: none; margin: 0 10px 10px; padding: 12px; border-radius: 14px; font-size: 15px; font-weight: 800; color: var(--gold-ink); background: linear-gradient(180deg, #ffe680, #ffc21f); border: 1.5px solid #b07d00; box-shadow: 0 3px 0 #b07d00; animation: pop .25s ease-out, pulsegold 1.2s .25s infinite; }
.pdone small { display: block; font-size: 11.5px; font-weight: 700; opacity: .8; }
.pdone:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
#phone .screen { position: relative; flex: 1; min-width: 0; background: var(--panel); border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; }
#phone .notch { position: absolute; left: 50%; top: 6px; width: 84px; height: 20px; margin-left: -42px; background: #1b1f2a; border-radius: 12px; z-index: 3; }
#phone .status { display: flex; justify-content: space-between; align-items: center; padding: 6px 20px 2px; height: 22px; font-size: 12px; font-weight: 700; color: var(--ink); flex: none; }
#phone .status span:last-child { letter-spacing: 1px; font-size: 10px; }
.bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex: none; }
.logo { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #9fd0ff, #1a71ff 55%, #5b2bd6); flex: none; }
.bar strong { font-size: 15px; }
.pill-note { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--sub); background: var(--surface); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chat { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.5; animation: pop .25s ease-out; word-break: keep-all; overflow-wrap: anywhere; }
.msg.bot { background: var(--surface); border-top-left-radius: 4px; align-self: flex-start; }
.msg.me { background: var(--primary); color: #fff; border-top-right-radius: 4px; align-self: flex-end; }
.msg.me.photo { padding: 6px; background: var(--primary-soft); }
.msg.me.photo span { display: block; font-size: 52px; width: 92px; height: 92px; line-height: 92px; text-align: center; background: #fff; border-radius: 12px; }
.typing { align-self: flex-start; background: var(--surface); border-radius: 16px; padding: 12px 14px; display: flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--sub); animation: dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.sys { align-self: center; font-size: 12px; color: var(--sub); background: var(--surface); padding: 4px 10px; border-radius: 999px; text-align: center; }
.card { align-self: stretch; border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; animation: pop .25s ease-out; background: var(--panel); }
.card h4 { margin: 0; font-size: 15px; }
.card .src { font-size: 11px; color: var(--sub); font-weight: 400; }
.card.done { opacity: .72; }
.card.done button { pointer-events: none; }
.row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.row .grow { flex: 1; min-width: 0; }
.row.checked .grow { color: var(--sub); text-decoration: line-through; }
.check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; color: #fff; flex: none; }
.row.checked .check { background: var(--good); border-color: var(--good); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; background: var(--primary); color: #fff; }
.btn:disabled { background: var(--line); color: var(--sub); cursor: default; }
.btn.ghost { background: var(--surface); color: var(--ink); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.gold { background: linear-gradient(180deg, #c98d14, #8a5a00); color: #fff; box-shadow: 0 3px 0 #5a3a00; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn:focus-visible, .chip:focus-visible, .tile:focus-visible, #send:focus-visible, #input:focus-visible, .q:focus-visible, .pain button:focus-visible, .tone button:focus-visible { outline: 3px solid #99c2ff; outline-offset: 2px; }
.pulse { animation: pulse 1.4s infinite; }
.tone { display: grid; gap: 8px; }
.tone button { text-align: left; padding: 11px 12px; border-radius: 12px; background: var(--surface); color: var(--ink); display: grid; gap: 2px; }
.tone button b { font-size: 13px; color: var(--primary); }
.tone button span { font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border-radius: 12px; padding: 10px 4px; display: grid; gap: 2px; justify-items: center; color: var(--ink); }
.tile span { font-size: 36px; line-height: 1.2; }
.tile small { font-size: 12px; }
.kcal { font-family: var(--num); font-size: 26px; font-weight: 700; }
.kcal small { font-family: var(--body); font-size: 13px; color: var(--sub); font-weight: 500; }
.macro { display: grid; grid-template-columns: 60px 1fr 48px; align-items: center; gap: 8px; font-size: 13px; }
.macro .b { height: 8px; border-radius: 4px; background: var(--surface); overflow: hidden; }
.macro .b i { display: block; height: 100%; background: var(--primary); border-radius: 4px; }
.macro em { font-style: normal; font-family: var(--num); text-align: right; color: var(--sub); }
.lab { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 10px; background: var(--surface); border-radius: 10px; font-size: 14px; }
.lab b { font-family: var(--num); font-size: 15px; text-align: right; }
.lab small { grid-column: 1 / -1; font-size: 11px; color: var(--sub); }
.lab.out small { color: #b26800; font-weight: 700; }
.qs { display: grid; gap: 6px; }
.q { text-align: left; padding: 10px 12px; border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 14px; border: 2px solid transparent; }
.q[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
.q[aria-pressed="true"]::before { content: "✓ "; color: var(--primary); font-weight: 700; }
.appt { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin: 0; }
.appt dt { color: var(--sub); }
.appt dd { margin: 0; font-weight: 700; }
.pills { position: relative; height: 120px; border-radius: 14px; background: linear-gradient(180deg, #f5faff, #eaf2fe); overflow: hidden; }
.pills .pill { position: absolute; font-size: 30px; line-height: 1; padding: 8px; background: #fff; border-radius: 50%; box-shadow: 0 6px 16px rgba(26,113,255,.25); animation: pop .2s; }
.pills .slotrow { position: absolute; left: 10px; right: 10px; bottom: 8px; display: flex; justify-content: space-around; font-size: 12px; color: var(--sub); }
.pills .slotrow b { color: var(--good); }
.pain { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.pain button { padding: 8px 0; border-radius: 10px; background: var(--surface); color: var(--ink); font-family: var(--num); font-weight: 700; font-size: 15px; }
.trend { display: flex; align-items: flex-end; gap: 6px; height: 64px; }
.trend i { flex: 1; background: #cbdffe; border-radius: 4px 4px 0 0; }
.trend i:last-child { background: var(--primary); }
.trend-lab { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); }
.compare { display: grid; gap: 6px; font-size: 13px; }
.compare div { display: grid; grid-template-columns: 70px 1fr 40px; align-items: center; gap: 8px; }
.compare .b { height: 10px; border-radius: 5px; background: var(--surface); position: relative; }
.compare .b i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: #cbdffe; }
.compare .b i.now { background: var(--primary); }
.compare em { font-style: normal; font-family: var(--num); text-align: right; }
.field { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field label { display: grid; gap: 4px; font-size: 12px; color: var(--sub); }
.field input { font: inherit; font-family: var(--num); font-size: 20px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; width: 100%; box-sizing: border-box; color: var(--ink); background: var(--panel); }
.finder { position: relative; height: 110px; border-radius: 14px; background: #111827; overflow: hidden; }
.finder .zone { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border: 2px dashed rgba(255,255,255,.7); border-radius: 12px; box-shadow: 0 0 0 4px rgba(255,184,0,.35); }
.finder .food { position: absolute; top: 50%; left: 0; font-size: 50px; line-height: 1; margin-top: -26px; animation: slide 1.6s ease-in-out infinite alternate; }
.finder.shot .food { animation-play-state: paused; }
.finder .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.finder.shot .flash { animation: flash .35s; }
.shutter { justify-self: center; width: 60px; height: 60px; border-radius: 50%; background: #fff; border: 5px solid var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); font-size: 0; }
.shutter:active { transform: scale(.92); }
.road { position: relative; height: 54px; border-radius: 12px; background: linear-gradient(180deg, #ffe2c6, #f3b88a); overflow: hidden; }
.road::after { content: "🏁"; position: absolute; right: 8px; top: 12px; font-size: 24px; }
.walker { position: absolute; left: 4px; top: 10px; font-size: 30px; transition: left .18s ease-out; transform: scaleX(-1); }
.walker.step { animation: step .18s; }
.meter { display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); }
.meter b { font-family: var(--num); color: var(--ink); }
.mash { font-size: 18px; padding: 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 12px 8px; flex: none; }
.chips:empty { padding: 0; }
.chip { padding: 8px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--primary); color: var(--primary); font-size: 14px; font-weight: 500; }
.composer { display: flex; gap: 8px; padding: 8px 10px 12px; border-top: 1px solid var(--line); flex: none; }
#input { flex: 1; min-width: 0; font: inherit; font-size: 15px; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; color: var(--ink); background: var(--panel); }
#send { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 18px; flex: none; }
.hint { font-size: 12px; color: var(--sub); padding: 0 12px 6px; flex: none; }
.hint:empty { padding: 0; }
#notif { position: absolute; left: 8px; right: 8px; top: 30px; z-index: 4; background: rgba(255,255,255,.98); border-radius: 18px; padding: 12px 14px; display: grid; grid-template-columns: 36px 1fr; gap: 2px 10px; text-align: left; color: var(--ink); box-shadow: 0 12px 30px rgba(0,0,0,.3); border: 1px solid var(--line); transform: translateY(-180%); transition: transform .45s cubic-bezier(.2,.9,.3,1.2); }
#notif.show { transform: translateY(0); animation: wiggle .5s .45s 2; }
#notif .logo { grid-row: span 3; width: 36px; height: 36px; border-radius: 10px; }
#notif small { color: var(--sub); font-size: 12px; }
#notif b { font-size: 15px; }
#notif span { font-size: 14px; }

/* ── 오버레이: 앱 안에 머문다 ── */
.back { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(8,12,30,.6); padding: 0 12px; animation: fadein .2s; }
.back.out { animation: fadeout .25s forwards; }
.parch { width: 100%; max-width: 416px; box-sizing: border-box; max-height: calc(100% - 24px); overflow-y: auto; background: linear-gradient(180deg, var(--parch), var(--parch-2)); color: var(--parch-ink); border: 2px solid var(--parch-line); border-radius: 18px; box-shadow: 0 0 0 4px rgba(255,236,180,.35), 0 20px 50px rgba(0,0,0,.4); padding: 16px 16px 18px; display: grid; gap: 10px; animation: unroll .35s cubic-bezier(.2,.9,.3,1.15); }
.mapsheet { gap: 8px; }
.mapsheet h1 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.15; margin: 0; text-wrap: balance; }
.mapsheet h1 em { font-style: normal; color: #b0571a; }
.mapsheet p { margin: 0; font-size: 14px; line-height: 1.55; word-break: keep-all; }
.maphead { display: flex; align-items: baseline; gap: 8px; }
.maphead small { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #8a6a30; }
.maphead b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.map { width: 100%; height: auto; max-height: min(370px, 46vh); display: block; margin: 0 auto; }
.mapinfo { display: grid; gap: 1px; text-align: center; }
.mapinfo b { font-family: var(--display); font-weight: 400; font-size: 21px; }
.mapinfo span { font-size: 13px; color: #6b5226; }
.note { font-size: 12px; color: #6b5226; line-height: 1.5; text-align: center; }
.big { font-size: 17px; padding: 14px; width: 100%; }
.region .art { transition: filter .8s, opacity .8s; }
.region.locked .art { filter: grayscale(1); opacity: .42; }
.region .fog, .region .lock { transition: opacity .7s; opacity: 0; }
.region.locked .fog, .region.locked .lock { opacity: 1; }
.region .done-badge { opacity: 0; transition: opacity .4s; }
.region.done .done-badge { opacity: 1; }
.region .halo { fill: rgba(255,210,31,0); transform-box: fill-box; transform-origin: center; }
.region.current .halo { fill: rgba(255,210,31,.3); animation: halo 1.6s ease-in-out infinite; }
.mroad { fill: none; stroke: #9b7840; stroke-width: 3; stroke-dasharray: 1 8; stroke-linecap: round; }
.mroad.walked { stroke: #b0571a; stroke-width: 3.6; }
.logwin h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; }
.logwin .reg { font-size: 12px; font-weight: 800; color: #8a6a30; margin-top: 2px; }
.logq { display: grid; grid-template-columns: 20px 1fr; gap: 0 6px; background: rgba(255,250,240,.75); border-radius: 10px; padding: 6px 9px; font-size: 13px; }
.logq i { font-style: normal; font-weight: 800; color: #2f6e16; }
.logq.now i { color: #b0571a; }
.logq.lock { opacity: .55; }
.logq span { grid-column: 2; font-size: 12px; color: #6b5226; }

/* 타이틀 카드 — 지역 이름이 화면을 가로지른다 */
.titlecard { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; pointer-events: none; }
.titlecard .band { width: 100%; padding: 16px 0 14px; background: linear-gradient(90deg, rgba(8,12,30,0), rgba(8,12,30,.82) 18%, rgba(8,12,30,.82) 82%, rgba(8,12,30,0)); border-top: 1.5px solid rgba(255,214,60,.7); border-bottom: 1.5px solid rgba(255,214,60,.7); text-align: center; color: #fff; overflow: hidden; animation: band 2s ease-in-out forwards; }
.titlecard .band > div { animation: sweep 2s cubic-bezier(.2,.8,.2,1) forwards; }
.titlecard b { display: block; font-family: var(--display); font-weight: 400; font-size: 36px; color: var(--gold); -webkit-text-stroke: 1px var(--gold-ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--gold-ink); }
.titlecard small { font-size: 14px; font-weight: 700; letter-spacing: .1em; }

/* 퀘스트 완료 배너 */
.qdone { position: absolute; z-index: 32; left: 12px; right: 12px; top: 22%; display: grid; justify-items: center; gap: 10px; pointer-events: none; }
.qdone .ribbon { font-family: var(--display); font-size: 32px; color: var(--gold); -webkit-text-stroke: 1.5px var(--gold-ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--gold-ink), 0 0 20px rgba(255,214,60,.6); background: linear-gradient(90deg, rgba(20,24,60,0), rgba(20,24,60,.85) 15%, rgba(20,24,60,.85) 85%, rgba(20,24,60,0)); padding: 6px 40px; animation: ribbon .45s cubic-bezier(.2,.9,.3,1.3); white-space: nowrap; }
.qdone .ribbon small { display: block; font-family: var(--body); font-size: 13px; color: #fff; -webkit-text-stroke: 0; text-shadow: none; text-align: center; }
.qdone .lootcard { display: grid; grid-template-columns: 52px 1fr; gap: 2px 10px; align-items: center; width: 100%; max-width: 330px; box-sizing: border-box; background: linear-gradient(180deg, var(--parch), var(--parch-2)); border: 2px solid var(--parch-line); border-radius: 14px; padding: 10px 12px; color: var(--parch-ink); box-shadow: 0 12px 30px rgba(0,0,0,.35); animation: pop .35s .15s both; }
.qdone .lootcard i { grid-row: span 3; font-style: normal; font-size: 30px; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(180deg, #fffaf0, #ecd08a); border: 2px solid #c9a86a; }
.qdone .lootcard strong { font-size: 15px; }
.qdone .lootcard span { font-size: 13px; line-height: 1.45; word-break: keep-all; }
.qdone .lootcard em { font-style: normal; font-weight: 800; font-size: 12.5px; color: var(--gold-ink); }
.qdone.out { animation: fadeout .3s forwards; }

/* 레벨업·지구 장면 */
.float { position: fixed; z-index: 61; pointer-events: none; font-weight: 800; font-size: 16px; color: var(--primary); background: #fff; padding: 3px 9px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.18); white-space: nowrap; transform: translate(-50%, -50%); animation: rise 1.1s ease-out forwards; }
.float.gold { color: var(--gold-ink); background: #fff4c2; }
.float.miss { color: var(--sub); }
.lvup { position: absolute; left: 50%; top: 34%; z-index: 33; transform: translate(-50%, -50%); font-family: var(--display); font-size: 38px; color: var(--gold); -webkit-text-stroke: 1.5px var(--gold-ink); paint-order: stroke fill; background: radial-gradient(circle, rgba(20,24,60,.85), rgba(20,24,60,.6)); padding: 12px 26px; border-radius: 20px; box-shadow: 0 0 0 2px rgba(255,210,31,.6), 0 10px 30px rgba(0,0,0,.4); text-shadow: 0 3px 0 var(--gold-ink); pointer-events: none; white-space: nowrap; animation: lvup 1.5s ease-out forwards; text-align: center; line-height: 1.1; }
.lvup small { display: block; font-family: var(--body); font-weight: 700; font-size: 15px; margin-top: 4px; color: #fff; -webkit-text-stroke: 0; text-shadow: none; }
.loopdone { position: absolute; inset: 0; z-index: 45; display: grid; place-items: center; background: rgba(5,10,30,.85); animation: fadein .3s; }
.loopdone > div { display: grid; justify-items: center; gap: 10px; color: #fff; text-align: center; padding-inline: 20px; }
.loopdone canvas { width: 230px; height: 230px; }
.loopdone b { font-family: var(--display); font-size: 32px; font-weight: 400; color: var(--gold); -webkit-text-stroke: 1px var(--gold-ink); paint-order: stroke fill; }
.loopdone span { font-size: 14px; opacity: .92; line-height: 1.6; word-break: keep-all; }
.loopdone .agent { width: 110px; height: 110px; }

/* 결과 화면 — 게임 결과처럼 */
.result-screen { position: absolute; inset: 0; z-index: 50; overflow-y: auto; background: radial-gradient(circle at 50% 0%, #2a3f86, #0b1022 70%); color: #fff; padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 24px; box-sizing: border-box; display: grid; gap: 14px; align-content: start; animation: fadein .4s; }
.result-screen h2 { margin: 6px 0 0; font-family: var(--display); font-weight: 400; font-size: 19px; color: var(--gold); }
.res-top { display: grid; justify-items: center; gap: 2px; text-align: center; }
.res-top small { font-size: 12px; font-weight: 800; letter-spacing: .3em; color: #ffe9a8; }
.emblem { position: relative; width: 120px; height: 132px; display: grid; place-items: center; }
.emblem svg { position: absolute; inset: 0; }
.emblem b { position: relative; font-family: var(--display); font-weight: 400; font-size: 70px; line-height: 1; color: var(--gold); -webkit-text-stroke: 2px var(--gold-ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--gold-ink); margin-top: -6px; animation: lootpop .6s cubic-bezier(.2,.9,.3,1.4); }
.res-top .rlabel { font-size: 13px; color: #cfd8ff; }
.tiles4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tiles4 div { display: grid; justify-items: center; gap: 2px; padding: 8px 2px; background: rgba(255,255,255,.07); border: 1px solid var(--hud-line); border-radius: 12px; }
.tiles4 b { font-family: var(--num); font-size: 15px; color: #fff2a8; }
.tiles4 span { font-size: 11px; color: #cfd8ff; }
.hero { display: grid; grid-template-columns: 1fr 1fr; align-items: center; justify-items: center; border-radius: 16px; background: radial-gradient(circle at 30% 40%, #1d3f8f, #0a1430); border: 1px solid var(--hud-line); padding: 6px; }
.hero canvas { width: 120px; height: 120px; }
.hero .agent { width: 96px; height: 96px; }
.qlist { display: grid; gap: 5px; }
.qlist .reg { font-size: 12px; font-weight: 800; color: #ffe9a8; margin-top: 4px; }
.q1 { display: grid; grid-template-columns: 18px 1fr; gap: 0 6px; background: rgba(255,255,255,.06); border-radius: 10px; padding: 6px 9px; font-size: 13px; }
.q1 i { font-style: normal; color: #9ff07a; font-weight: 800; }
.q1 span { grid-column: 2; font-size: 12px; color: #cfd8ff; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.items div { display: grid; justify-items: center; gap: 2px; text-align: center; font-size: 11.5px; font-weight: 700; background: rgba(255,250,240,.92); color: var(--parch-ink); border: 1px solid var(--parch-line); border-radius: 10px; padding: 6px 4px; word-break: keep-all; }
.items i { font-style: normal; font-size: 22px; }
.learned { display: grid; gap: 6px; font-size: 13px; }
.learned div { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 7px 10px; background: rgba(255,255,255,.06); border-radius: 10px; }
.learned q { quotes: "“" "”"; font-weight: 700; }
.learned span { color: #cfd8ff; text-align: right; }
.result-screen .note { color: #cfd8ff; }

@keyframes fadein { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes unroll { from { transform: scaleY(.6) translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lootpop { 0% { transform: scale(.2) rotate(-20deg); } 70% { transform: scale(1.15) rotate(4deg); } 100% { transform: none; } }
@keyframes ribbon { from { transform: scaleX(.2); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes dot { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(26,113,255,.45); } 50% { box-shadow: 0 0 0 6px rgba(26,113,255,0); } }
@keyframes pulsegold { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }
@keyframes mbob { 0%, 100% { transform: translate(-50%, 0) scale(1); } 50% { transform: translate(-50%, -6px) scale(1.08); } }
@keyframes nextbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
@keyframes halo { 0%, 100% { transform: translateX(-50%) scale(.9); opacity: .9; } 50% { transform: translateX(-50%) scale(1.1); opacity: .5; } }
.mini .dot.cur, .region.current .halo { animation-name: halo2; }
@keyframes halo2 { 0%, 100% { transform: scale(.9); opacity: .9; } 50% { transform: scale(1.1); opacity: .6; } }
@keyframes objflash { 0% { background: rgba(255,210,31,0); } 30% { background: rgba(255,210,31,.45); } 100% { background: rgba(255,210,31,0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .22; } 50% { transform: scaleX(.85); opacity: .14; } }
@keyframes hop { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(-14px) scale(1.12, .92); } 55% { transform: translateY(0) scale(.94, 1.06); } 100% { transform: none; } }
@keyframes legA { from { transform: rotate(-24deg); } to { transform: rotate(24deg); } }
@keyframes legB { from { transform: rotate(24deg); } to { transform: rotate(-24deg); } }
@keyframes walkbob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -3px; } }
@keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(40px); } }
@keyframes beam { 0%, 100% { opacity: .25; } 50% { opacity: .6; } }
@keyframes wave { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
@keyframes pillar { 0% { transform: translateX(-50%) scaleY(0); opacity: 0; } 25% { transform: translateX(-50%) scaleY(1); opacity: 1; } 70% { opacity: .9; } 100% { transform: translateX(-50%) scaleY(1) scaleX(1.4); opacity: 0; } }
@keyframes band { 0% { opacity: 0; transform: scaleY(.2); } 12% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }
@keyframes sweep { 0% { transform: translateX(60%); opacity: 0; } 20% { transform: translateX(0); opacity: 1; } 80% { transform: translateX(-4%); opacity: 1; } 100% { transform: translateX(-60%); opacity: 0; } }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
@keyframes lvup { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 35% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%); } }
@keyframes slide { from { left: 6px; } to { left: calc(100% - 58px); } }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
@keyframes step { 50% { transform: scaleX(-1) translateY(-4px); } }
@keyframes wiggle { 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }

/* 비서(행성) SVG */
.agent .bob { animation: bob 3s ease-in-out infinite; }
.agent .shadow { animation: shadow 3s ease-in-out infinite; transform-origin: 60px 112px; }
.agent .part { opacity: 0; transition: opacity .5s; }
.agent .eyes-open { opacity: 0; }

.agent:not([data-lv="0"]) .eyes-sleep, .agent:not([data-lv="0"]) .zz { opacity: 0; }
.agent:not([data-lv="0"]) .eyes-open { opacity: 1; }

.agent .zz { animation: float 2s ease-in-out infinite; }

      item: ['🪶', '말투의 깃털', '"말투 바꿔 줘" 한마디면 언제든 바뀌어요. 사실은 그대로예요.'], teach: '말투를 고르면 같은 사실을 내 말투로 들려줘요', thanks: '이제 같이 다녀요!', run: qWake }),
    Q({ r: 0, giver: 'chief', time: '07:30', skyAfter: 'noon', title: '말로 부르는 루틴', lines: ['어서 오게! 이 마을 사람들은 메뉴를 찾지 않는다네. 통신기에 "오늘 루틴"이라고 말해 보게.'], obj: [['"오늘 루틴" 말하기'], ['스트레칭에 ✓ 하기']], xp: 120,
      item: ['🔔', '부름의 종', '메뉴를 찾지 말고 말로 부르세요. 버튼 한 번이면 기록돼요.'], teach: '메뉴 없이 말로 부르고, 카드 버튼으로 기록해요', thanks: '옳지, 그거라네!', run: qRoutine }),
    Q({ r: 0, giver: 'chief', time: '12:30', skyAfter: 'evening', title: '찰칵, 점심 한 장', lines: ['점심때로군! 사진 한 장만 보내면 비서가 기록해 준다네.'], obj: [['사진 한 장으로 점심 기록하기']], xp: 120,
      item: ['🔍', '찰칵 렌즈', '사진 한 장이면 식사가 기록돼요. 저장 전엔 고칠 수 있어요.'], teach: '사진 한 장으로 식사를 기록해요', thanks: '맛있어 보이는구먼!', run: qMeal }),
    Q({ r: 0, giver: 'chief', time: '18:30', skyAfter: 'night', title: '먼저 오는 알림', lines: ['해 질 녘엔 비서가 먼저 말을 걸지. 알림이 오면 바로 잡게!'], obj: [['알림 눌러 열기'], ['산책 시작하거나 미루기']], xp: 120,
      item: ['🧭', '알림 나침반', '비서가 먼저 알려 주면 버튼 한 번으로 바로 해요.'], teach: '비서가 먼저 거는 알림에 버튼 하나로 답해요', thanks: '날렵하구먼!', run: qNudge }),
    Q({ r: 0, giver: 'chief', time: '22:00', title: '힌트 없는 밤', lines: ['마을의 마지막 시험일세. 이번엔 힌트가 없어. 방금 잰 혈압을 혼자 기록해 보게.'], obj: [['혈압 118/76 혼자 기록하기']], xp: 200,
      item: ['💍', '루프의 반지', '기록 → 분석 → 루틴 → 실천. 오늘 하루 루프가 한 바퀴 돌았어요.'], teach: '하고 싶은 걸 말하면 확인 카드가 오고, 누를 때만 저장돼요', thanks: '훌륭하네, 여행자!', run: qBp }),
    Q({ r: 1, giver: 'doctor', time: '10:00', title: '도착한 결과 읽기', lines: ['검진 결과가 나왔어요. 먼저 비서와 쉽게 읽어 보세요. 판정은 진료 때 제가 할게요.'], obj: [['비서에게 결과 뜻 묻기']], xp: 120,
      item: ['📜', '검진 해석의 두루마리', '병원 값과 참고범위를 쉽게 풀어 읽어요. 판정은 의료진이 해요.'], teach: '"이게 무슨 뜻이야?"라고 물으면 쉽게 풀어 줘요, 판정은 의료진', thanks: '잘 읽으셨어요.', run: qLab }),
    Q({ r: 1, giver: 'doctor', time: '10:20', title: '진료실로 가는 질문', lines: ['진료 시간은 짧아요. 물어볼 것 두 개만 챙겨 오세요.'], obj: [['물어볼 질문 고르기', 2], ['외래 예약하기']], xp: 150,
      item: ['📓', '외래 질문 수첩', '물어볼 것을 적어 두면 진료 전날 다시 보여 줘요.'], teach: '물어볼 질문을 챙기고 외래 예약까지 이어요', thanks: '목요일에 봬요!', run: qVisit }),
    Q({ r: 2, giver: 'agent', time: '08:00', skyAfter: 'evening', title: '세 번의 약 시간', lines: ['집에 잘 돌아왔어요. (무릎 수술 뒤 · 가상 예시) 약 먹을 시간은 제가 알려 드릴게요.'], obj: [['나타나는 약 눌러 체크하기', 3]], xp: 120,
      item: ['⏳', '약 시간 모래시계', '약 먹을 시간이 되면 비서가 먼저 알려 줘요.'], teach: '약 먹을 시간 알림에 눌러서 복용을 체크해요', thanks: '잘 챙기셨어요!', run: qPills }),
    Q({ r: 2, giver: 'agent', time: '21:00', title: '오늘의 통증 점수', lines: ['하루 한 번, 오늘 통증이 몇 점인지 알려 주세요.'], obj: [['통증 점수 체크인하기']], xp: 120,
      item: ['📈', '체크인 일지', '매일 체크인이 쌓이면 진료 때 의료진과 같이 봐요. 심하면 병원에 바로 연락해요.'], teach: '통증을 점수로 체크인하고, 심하면 병원 연락처를 받아요', thanks: '오늘도 기록 완료!', run: qPain }),
    Q({ r: 3, giver: 'keeper', time: '16:00', title: '지난 항로 비교', lines: ['여섯 달이 지났군요. 이 항구에선 지난 길을 돌아볼 수 있지요. 통신기에 비교해 달라고 해 보세요.'], obj: [['"지난번이랑 비교해 줘" 말하기']], xp: 120,
      item: ['⚖️', '비교의 저울', '지난 결과와 이번을 나란히 보여 줘요. 해석은 의료진과 함께해요.'], teach: '"지난번이랑 비교해 줘"로 변화를 한눈에 봐요', thanks: '먼 길 오셨군요.', run: qCompare }),
    Q({ r: 3, giver: 'keeper', time: '16:10', title: '등대의 불빛', lines: ['등대 불빛처럼 소식을 가족에게 보낼 수 있어요. 보낼지는 당신이 정해요.'], obj: [['공유할지 정하기']], xp: 150,
      item: ['🏮', '돌봄의 등불', '가족과 나눌지, 나만 볼지 언제나 내가 정해요.'], teach: '결과를 가족에게 공유할지 내가 정해요', thanks: '좋은 항해였어요!', run: qShare }),
  ];
  QUESTS.forEach((q, i) => (q.no = i + 1));
  const completed = [];
  const RING_SCENE = [
    ['루프 완성!', '기록 → 분석 → 루틴 → 실천<br>하루의 마을에서 내 건강 루프가 한 바퀴 돌았어요.', { closeLoop: true, rings: 1 }],
    ['성채를 지났어요', '검진 결과 → 이해 → 진료 연결<br>지구에 두 번째 고리가 감겼어요.', { rings: 2 }],
    ['골짜기를 건넜어요', '퇴원 → 복약 → 체크인<br>세 번째 고리가 감겼어요.', { rings: 3 }],
    ['여정 완주!', '하루의 루프에서 검진, 진료, 회복, 돌봄까지<br>지구에 고리 네 개가 이어지고, 비서가 다 자랐어요.', { rings: 4, withAgent: true }],
  ];

  async function finish() {
    const ms = performance.now() - startedAt; clearInterval(timerId); $('#timer').textContent = mmss(ms);
    const timeBonus = Math.max(0, Math.round((240 - ms / 1000) * 3)); xp += timeBonus; setXp();
    const score = (xp - timeBonus) / maxXp * 0.8 + Math.min(1, Math.max(0, (300 - ms / 1000) / 150)) * 0.2;
    const rank = score >= 0.85 ? 'S' : score >= 0.7 ? 'A' : score >= 0.55 ? 'B' : 'C';
    let best = null;
    try { best = Number(localStorage.getItem('v5quest.bestxp')) || null; if (!best || xp > best) localStorage.setItem('v5quest.bestxp', String(xp)); } catch (e) {}
    const isBest = !best || xp > best;
    sfx.fanfare(); confetti(innerWidth / 2, innerHeight * .25, 140);
    const o = el('div', 'result-screen', `
      <div class="res-top"><small>QUEST CLEAR</small>
        <div class="emblem"><svg viewBox="0 0 120 132" aria-hidden="true"><path d="M60 4 L112 22 V64 Q112 104 60 128 Q8 104 8 64 V22Z" fill="#1a2552" stroke="#ffd21f" stroke-width="4"/><path d="M60 14 L102 29 V64 Q102 97 60 117 Q18 97 18 64 V29Z" fill="none" stroke="rgba(255,214,60,.4)" stroke-width="2"/></svg><b>${rank}</b></div>
        <div class="rlabel">여정 완주 · ${isBest ? '내 최고 기록!' : '내 최고 ⭐ ' + best.toLocaleString()}</div></div>
      <div class="tiles4"><div><b>${xp.toLocaleString()}</b><span>⭐ 총 XP</span></div><div><b>${mmss(ms)}</b><span>⏱ 시간</span></div><div><b>${perfect}</b><span>⚡ 번개</span></div><div><b>Lv.${lv}</b><span>비서 레벨</span></div></div>
      <div class="hero"><canvas id="endGlobe" aria-hidden="true"></canvas><div id="endAgent"></div></div>
      <h2>완료한 퀘스트 ${completed.length}/${QUESTS.length}</h2>
      <div class="qlist">${REGIONS.map((g, ri) => `<div class="reg">${g.name} · ${g.when}</div>` + completed.filter((q) => q.r === ri).map((q) => `<div class="q1"><i>✓</i><b>${q.title}</b><span>${q.teach}</span></div>`).join('')).join('')}</div>
      <h2>획득한 아이템</h2>
      <div class="items">${completed.map((q) => `<div><i>${q.item[0]}</i>${q.item[1]}</div>`).join('')}</div>
      <h2>오늘 배운 말</h2>
      <div class="learned">
        <div><q>오늘 루틴</q><span>말하면 카드가 와요</span></div>
        <div><q>혈압 기록해 줘</q><span>확인하고 눌러야 저장</span></div>
        <div><q>이게 무슨 뜻이야?</q><span>쉽게, 판정은 의료진이</span></div>
        <div><q>지난번이랑 비교해 줘</q><span>변화를 한눈에</span></div>
        <div><q>말투 바꿔 줘</q><span>사실은 그대로</span></div>
      </div>
      <div class="note">시간 보너스 +${timeBonus} 포함. 게임 속 데이터와 병원·연락처는 모두 가상의 예시예요. 아이템은 앱 사용법을 기억하기 위한 상징이에요.</div>
      <button class="btn gold big" type="button" id="again">${rank === 'S' ? '한 번 더' : 'S랭크 다시 도전'}</button>`);
    o.setAttribute('role', 'dialog'); o.setAttribute('aria-label', '여정 결과');
    app.appendChild(o);
    const eg = $('#endGlobe'); eg.dataset.lit = 6; eg.dataset.closed = '1'; eg.dataset.rings = 4; globes.add(eg);
    $('#endAgent').appendChild(mkAgent());
    $('#again').onclick = () => { o.remove(); reset(); begin(false); };
  }
  function reset() {
    chat.innerHTML = ''; chipsEl.innerHTML = ''; hintEl.textContent = ''; onText = null; curQ = null; giverResolve = null;
    xp = 0; maxXp = 0; perfect = 0; lv = 0; questsDone = 0; regionNo = 0; setXp(); setLvAll(); drawXpBar();
    $('#lvnum').textContent = 'Lv.0'; $('#lvname').textContent = LV[0];
    bag.length = 0; completed.length = 0; renderBag();
    compFree = false; globe.closed = false; tn = 'warm';
    app.classList.remove('phone-on'); renderTracker('none');
    buildScene(0); setSky('dawn'); fitStage(); drawMini();
  }
  async function begin(intro) {
    for (let ri = 0; ri < REGIONS.length; ri++) {
      await worldMap(ri, intro && ri === 0);
      if (ri === 0) { startedAt = performance.now(); clearInterval(timerId); timerId = setInterval(() => ($('#timer').textContent = mmss(performance.now() - startedAt)), 250); }
      await enterRegion(ri);
      const qs = QUESTS.filter((q) => q.r === ri);
      for (let k = 0; k < qs.length; k++) await runQuest(qs[k], k === 0 || qs[k].giver !== qs[k - 1].giver);
      await hold(300);
      await bigGlobe(...RING_SCENE[ri]);
    }
    await finish();
  }

  // 시험용 훅 — 자동 진행 스크립트가 상태를 읽는다
  window.__quest = { get q() { return curQ && curQ.no; }, get done() { return questsDone; }, get lv() { return lv; }, get xp() { return xp; } };

  renderBag(); renderTracker('none'); drawXpBar();
  buildScene(0); setSky('dawn'); fitStage(); drawMini();
  requestAnimationFrame(globeLoop);
  begin(true);
})();
</script>
</body>
</html>
