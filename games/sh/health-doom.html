<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOOM · AI 건강비서 에디션</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
:root{
  --p-bg:#ffffff; --p-fg:#171719; --p-sub:#70737c; --p-primary:#1a71ff; --p-divider:#eaebec;
  --p-elevated:#edf2f5; --p-surface:#f4f4f5; --p-user:#eaf2fe; --p-warn-bg:#ffeacc; --p-warn:#804a00;
  --p-grad:radial-gradient(191% 1069% at 11.72% -137.5%,#3385ff,#a333d6),#1a71ff;
  --d-red:#e01b10; --pix:"Galmuri11","Galmuri9",ui-monospace,Menlo,monospace;
}
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{ background:#1b0d0b radial-gradient(120% 80% at 50% 0%,#5a1a10,#1b0d0b 70%); color:var(--p-fg); font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; -webkit-font-smoothing:antialiased; word-break:keep-all; }
button,input{ font:inherit; color:inherit; }
button{ background:none; border:0; padding:0; cursor:pointer; }
[hidden]{ display:none!important; }

.stage{ display:flex; justify-content:center; align-items:center; height:100dvh; padding:24px; }
.phone{ position:relative; width:460px; height:min(900px,calc(100dvh - 48px)); display:flex; flex-direction:column; border-radius:40px; overflow:hidden; background:var(--p-bg); border:8px solid #22202B; box-shadow:0 0 0 2px #6b1d12,0 30px 90px rgba(255,60,20,.35); }
.ph-head{ flex:none; height:56px; display:flex; align-items:center; gap:10px; padding:0 10px 0 14px; border-bottom:1px solid var(--p-divider); }
.lg{ flex:none; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--p-grad); }
.lg svg{ width:58%; height:58%; }
.ph-head b{ display:block; font-size:14px; font-weight:700; }
.ph-head small{ display:block; font-size:11px; color:var(--p-sub); }
.hbtn{ margin-left:auto; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-size:16px; }
.hbtn:hover{ background:var(--p-elevated); }
.thread{ flex:1; overflow:auto; padding:16px 16px 8px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth; }
.who{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; }
.who .lg{ width:26px; height:26px; }
.u{ align-self:flex-end; max-width:80%; padding:10px 14px; border-radius:18px 18px 4px 18px; background:var(--p-user); font-size:15px; }
.sum{ font-size:15.5px; line-height:1.55; }
.sum b{ font-weight:800; }
.reason{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:10px 12px; border-radius:14px; background:#f7f9fa; font-size:12.5px; color:var(--p-sub); }
.badge{ padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:700; background:var(--p-warn-bg); color:var(--p-warn); }
.badge.data{ background:#eaf2fe; color:#002966; }
.safety{ padding:12px 14px; border-radius:14px; background:var(--p-warn-bg); color:var(--p-warn); font-size:14px; line-height:1.5; }
.safety b{ display:block; margin-bottom:2px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ min-height:40px; padding:0 14px; border-radius:20px; background:var(--p-elevated); font-size:14px; font-weight:500; }
.think{ display:flex; gap:8px; align-items:center; font-size:13px; color:var(--p-sub); }
.think i{ width:6px; height:6px; border-radius:50%; background:var(--p-primary); animation:blink 1s infinite; }
.think i:nth-child(2){ animation-delay:.15s; } .think i:nth-child(3){ animation-delay:.3s; }
@keyframes blink{ 50%{ opacity:.2; } }
.composer{ flex:none; padding:8px 12px 10px; border-top:1px solid var(--p-divider); }
.inbox{ display:flex; align-items:center; gap:6px; padding:6px 6px 6px 12px; border-radius:24px; background:var(--p-surface); }
.inbox input{ flex:1; min-width:0; border:0; background:none; font-size:15px; outline:none; }
.ib{ width:28px; height:28px; opacity:.55; }
.send{ width:36px; height:36px; border-radius:50%; background:var(--p-grad); color:#fff; font-size:18px; font-weight:800; }
.disc{ margin:6px 0 0; text-align:center; font-size:11px; color:var(--p-sub); }

/* ---------- 둠 카드 ---------- */
.b-doom{ flex:none; border-radius:16px; overflow:hidden; background:#000; box-shadow:0 0 0 1px #3a120c,0 8px 30px rgba(120,20,0,.35); user-select:none; -webkit-user-select:none; animation:cardin .5s cubic-bezier(.2,1,.3,1); }
@keyframes cardin{ from{ opacity:0; transform:translateY(12px) scale(.98); } }
.dhead{ display:flex; justify-content:space-between; gap:8px; padding:6px 10px; background:#0e0f11; color:#8d93a0; font:700 11px var(--pix); }
.dhead i{ display:inline-block; width:7px; height:7px; margin-right:6px; border-radius:50%; background:#5aff7a; box-shadow:0 0 6px #5aff7a; animation:blink 1.2s infinite; }
.dv{ position:relative; aspect-ratio:16/10; background:#000; touch-action:none; }
.dv canvas{ display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; }
.dmsg{ position:absolute; left:8px; top:6px; max-width:56%; font:13px/1.35 var(--pix); color:#ff4a3a; text-shadow:1px 1px 0 #000,0 0 6px rgba(0,0,0,.8); pointer-events:none; }
.dmsg p{ margin:0 0 2px; animation:msgin .25s ease-out,msgout .5s ease-in 4s forwards; }
@keyframes msgin{ from{ opacity:0; transform:translateX(-8px); } }
@keyframes msgout{ to{ opacity:0; } }
.dmsg small{ display:block; color:#ffe39a; font-size:11.5px; }
.clippy{ position:absolute; right:6px; top:6px; display:flex; align-items:flex-start; gap:4px; max-width:46%; pointer-events:none; animation:slidein .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes slidein{ from{ transform:translateX(60px); opacity:0; } }
.clippy .cb{ position:relative; padding:7px 10px; border:2px solid #3A3420; border-radius:12px; background:#FFFBE3; color:#1E1B2E; font-size:12.5px; font-weight:700; line-height:1.4; box-shadow:0 4px 12px rgba(0,0,0,.4); }
.clippy .cb::after{ content:""; position:absolute; right:-9px; top:12px; border:6px solid transparent; border-left:8px solid #3A3420; }
.clippy svg{ flex:none; width:44px; height:46px; filter:drop-shadow(0 3px 6px rgba(0,0,0,.45)); animation:bob 1.6s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(-4px); } }
.ov{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; gap:6px; overflow:auto; padding:12px; text-align:center; color:#fff; background:rgba(0,0,0,.72); }
.over>:first-child{ margin-top:auto; } .over>:last-child{ margin-bottom:auto; }
.title{ justify-content:center; background:radial-gradient(90% 70% at 50% 35%,#3a0c07,#050101 75%); }
.title>*:not(#fire){ position:relative; z-index:1; }
#fire{ position:absolute; left:0; right:0; bottom:0; width:100%; height:48%; image-rendering:pixelated; pointer-events:none; opacity:.9; -webkit-mask-image:linear-gradient(transparent,#000 45%); mask-image:linear-gradient(transparent,#000 45%); }
.logo{ font:900 clamp(48px,15vw,96px)/.9 Impact,"Arial Black",sans-serif; letter-spacing:.03em; color:transparent; background:linear-gradient(#fff6c8,#ffd23a 22%,#ff7a1a 46%,#c0140a 70%,#3a0402); -webkit-background-clip:text; background-clip:text; -webkit-text-stroke:1.5px #1a0100; transform:perspective(300px) rotateX(18deg); filter:drop-shadow(0 4px 0 #1a0100) drop-shadow(0 0 18px rgba(255,80,20,.55)); animation:breathe 3s ease-in-out infinite; }
@keyframes breathe{ 50%{ filter:drop-shadow(0 4px 0 #1a0100) drop-shadow(0 0 28px rgba(255,110,30,.8)); } }
.sub{ padding:3px 12px; border:1px solid rgba(158,203,255,.35); border-radius:999px; background:rgba(10,24,50,.55); font:700 13px var(--pix); color:#bfe0ff; letter-spacing:.06em; }
.tag{ padding:2px 10px; border-radius:999px; background:rgba(0,0,0,.6); font:12px var(--pix); color:#ffb0a0; }
.meme{ padding:2px 10px; border-radius:999px; background:rgba(0,0,0,.6); font:11px ui-monospace,Menlo,monospace; color:#ff9a80; letter-spacing:.04em; }
.tag b{ color:var(--d-red); }
.go{ margin-top:6px; padding:9px 20px; border:1px solid #ff6a4a; border-radius:8px; background:linear-gradient(#a3160b,#5a0904); color:#fff; font:700 14px var(--pix); letter-spacing:.06em; box-shadow:0 0 16px rgba(255,60,20,.45),inset 0 1px 0 rgba(255,255,255,.25); transition:transform .1s,box-shadow .2s; }
.go:hover,.go:focus-visible{ outline:none; transform:translateY(-1px); box-shadow:0 0 26px rgba(255,80,30,.7),inset 0 1px 0 rgba(255,255,255,.3); }
.skill{ display:flex; flex-direction:column; gap:2px; padding:10px 14px 10px 10px; border:1px solid rgba(255,90,60,.35); border-radius:10px; background:rgba(12,2,1,.72); box-shadow:0 10px 30px rgba(0,0,0,.5); }
.skill p{ margin:0 0 4px; font:700 13px var(--pix); color:#ff4a3a; }
.skill button{ position:relative; padding:3px 6px 3px 26px; font:13px var(--pix); color:#e8d0c8; text-align:left; }
.skill button:hover,.skill button:focus-visible{ color:#fff; outline:none; background:linear-gradient(90deg,rgba(255,60,30,.25),transparent); border-radius:4px; }
.skill button:hover::before,.skill button:focus-visible::before{ content:"💊"; position:absolute; left:2px; animation:pill .5s ease-in-out infinite alternate; }
@keyframes pill{ to{ transform:translateX(3px) rotate(-12deg); } }
.over{ background:radial-gradient(120% 90% at 50% 20%,rgba(40,8,4,.93),rgba(5,1,1,.96)); }
.over h2{ margin:0; font:900 28px Impact,"Arial Black",sans-serif; color:#ff3b2f; letter-spacing:.06em; text-shadow:0 0 18px rgba(255,60,40,.6),2px 2px 0 #000; }
.over .row{ display:flex; justify-content:space-between; gap:24px; width:min(270px,90%); padding:3px 2px; border-bottom:1px dashed rgba(255,110,80,.25); font:13px var(--pix); color:#ff8a70; }
.over .row b{ color:#fff; font-variant-numeric:tabular-nums; }
.over ul{ display:flex; flex-direction:column; gap:3px; margin:6px 0 0; padding:0; list-style:none; text-align:left; font-size:12px; line-height:1.45; color:#e9f3ff; }
.over li{ padding:4px 8px 4px 22px; border-radius:6px; background:rgba(90,255,122,.08); position:relative; }
.over li::before{ content:"✓"; position:absolute; left:7px; color:#5aff7a; font-weight:900; }
.over li.no{ color:#777; background:rgba(255,255,255,.04); text-decoration:line-through; } .over li.no::before{ content:"·"; color:#777; }
.dead{ background:radial-gradient(circle at 50% 45%,rgba(150,0,0,.45),rgba(30,0,0,.94)); }
.dead h2{ animation:shake .5s; } @keyframes shake{ 20%,60%{ transform:translateX(-4px); } 40%,80%{ transform:translateX(4px); } }
.touch{ position:absolute; inset:0; pointer-events:none; }
.stick{ position:absolute; left:10px; bottom:10px; width:96px; height:96px; border-radius:50%; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.25); pointer-events:auto; }
.stick i{ position:absolute; left:33px; top:33px; width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.45); }
.tbtns{ position:absolute; right:8px; bottom:8px; display:grid; grid-template-columns:repeat(2,58px); gap:6px; pointer-events:auto; }
.tbtns button{ height:40px; border-radius:10px; background:rgba(0,0,0,.45); border:2px solid rgba(255,90,60,.7); color:#ffd8c8; font:700 12px var(--pix); }
.tbtns button[data-t="fire"]{ grid-row:span 2; height:86px; background:rgba(160,20,0,.55); }
.dhud{ display:grid; grid-template-columns:1fr 1fr 1.3fr 56px 1fr .8fr; align-items:stretch; gap:4px; padding:5px; background:linear-gradient(#2a2c31,#16171a); border-top:1px solid #45484f; box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
.hc{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 0 3px; border-radius:8px; background:linear-gradient(#1c1d21,#101113); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 2px 6px rgba(0,0,0,.6); }
.hc b{ font:900 21px/1 Impact,"Arial Black",sans-serif; color:#ff3b2f; text-shadow:0 0 8px rgba(255,59,47,.55),1px 1px 0 #000; font-variant-numeric:tabular-nums; letter-spacing:.02em; transition:color .3s; }
.hc b.ok{ color:#5aff7a; text-shadow:0 0 8px rgba(90,255,122,.45),1px 1px 0 #000; } .hc b.mid{ color:#ffd23a; text-shadow:0 0 8px rgba(255,210,58,.45),1px 1px 0 #000; }
.hc small{ margin-top:3px; font:700 9.5px var(--pix); color:#8d93a0; letter-spacing:.06em; }
.arms{ flex-direction:row; flex-wrap:wrap; justify-content:center; gap:0 5px; }
.arms span{ padding:0 3px; border-radius:3px; font:900 14px Impact,sans-serif; color:#454952; }
.arms span.on{ color:#ffd23a; text-shadow:0 0 6px rgba(255,210,58,.55); } .arms span.cur{ color:#1a1206; background:#ffd23a; text-shadow:none; }
.arms small{ width:100%; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#face{ width:56px; height:56px; align-self:center; justify-self:center; border-radius:10px; background:radial-gradient(circle at 50% 38%,#33403a,#121513); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
.keys{ flex-direction:row; flex-wrap:wrap; gap:4px; }
.keys i{ width:10px; height:15px; border-radius:2px; background:#26282d; box-shadow:inset 0 0 0 1px rgba(255,255,255,.07); }
.keys i.r{ background:#e01b10; box-shadow:0 0 8px #e01b10; } .keys i.u{ background:#2b6bff; box-shadow:0 0 8px #2b6bff; }
.keys small{ width:100%; text-align:center; }
.dbar{ display:flex; align-items:center; gap:8px; padding:6px 8px; background:#0e0f11; color:#7d828c; font-size:11px; }
.dbar span{ flex:1; }
.dbar button{ flex:none; padding:5px 10px; border:1px solid #3a3d44; border-radius:6px; background:#22242a; color:#eee; font-size:12px; font-weight:700; }
.b-doom.big{ position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; justify-content:center; align-items:center; border-radius:0; }
.b-doom.big .dv{ width:min(100vw,calc((100dvh - 130px)*1.6)); }
.b-doom.big .dhud,.b-doom.big .dbar,.b-doom.big .dhead{ width:min(100vw,calc((100dvh - 130px)*1.6)); }
.b-doom.big .dmsg{ font-size:17px; }
.b-doom.big .clippy .cb{ font-size:15px; }
@media (max-width:520px){ .stage{ padding:0; } .phone{ width:100%; height:100dvh; border:0; border-radius:0; } .dbar span{ display:none; } .arms{ gap:0 1px; } .arms span{ padding:0 2px; font-size:13px; } }
@media (prefers-reduced-motion:reduce){ .clippy,.clippy svg,.think i,.logo,.dmsg p,.dead h2{ animation:none; } }
</style>
</head>
<body>
<div class="stage"><div class="phone">
  <header class="ph-head">
    <div class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg></div>
    <div><b>AI 건강비서</b><small>건강 코치 · 온라인</small></div>
    <button class="hbtn" id="mute" aria-label="소리 끄기">🔊</button>
  </header>
  <main class="thread" id="thread"></main>
  <form class="composer" id="form">
    <div class="inbox">
      <button type="button" class="ib" aria-label="카메라">📷</button>
      <button type="button" class="ib" aria-label="음성">🎤</button>
      <input id="input" placeholder="메시지를 입력하세요" autocomplete="off">
      <button class="send" id="send" aria-label="보내기">↑</button>
    </div>
    <p class="disc">건강비서의 답변은 참고용이며 의료진의 진단을 대신하지 않아요. (둠도 마찬가지예요)</p>
  </form>
</div></div>

<div class="b-doom" id="doom" hidden>
  <div class="dhead"><span><i></i>DOOM.WAD · 실행 중</span><span>E1M1 건강검진센터</span></div>
  <div class="dv" id="view">
    <canvas id="cv" width="320" height="200"></canvas>
    <div class="dmsg" id="dmsg"></div>
    <div class="clippy" id="clippy" hidden><div class="cb" id="cbText"></div><svg viewBox="0 0 64 68" aria-hidden="true"><path d="M24.5 33h15v34h-5v-6h-5v6h-5z" fill="#8fdcb3" stroke="#183a2a" stroke-width="1.4" stroke-linejoin="round"/><g fill="#183a2a"><circle cx="17" cy="25" r="11.4"/><circle cx="47" cy="25" r="11.4"/><circle cx="32" cy="22" r="14.4"/><circle cx="23" cy="15" r="9.4"/><circle cx="41" cy="15" r="9.4"/><circle cx="32" cy="29" r="11.4"/><circle cx="29" cy="8" r="7.9"/><circle cx="36" cy="8" r="7.4"/></g><g fill="#13a05f"><circle cx="17" cy="25" r="10"/><circle cx="47" cy="25" r="10"/><circle cx="32" cy="22" r="13"/><circle cx="23" cy="15" r="8"/><circle cx="41" cy="15" r="8"/><circle cx="32" cy="29" r="10"/><circle cx="29" cy="8" r="6.5"/><circle cx="36" cy="8" r="6"/></g><path d="M22.5 11.5q9 4.5 18.5-.5" stroke="#183a2a" stroke-width="4.6" fill="none" stroke-linecap="round"/><path d="M22.5 11.5q9 4.5 18.5-.5" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round"/><g fill="#d9f7e7" stroke="#1b1b1b" stroke-width="1.2"><circle cx="28.6" cy="42" r="3.4"/><circle cx="35.4" cy="42" r="3.4"/></g><circle cx="28.6" cy="42.4" r="1.15" fill="#1b1b1b"/><circle cx="35.4" cy="42.4" r="1.15" fill="#1b1b1b"/><path d="M30 47.8q2 2.6 4 0" stroke="#1b1b1b" stroke-width="1.2" fill="none" stroke-linecap="round"/><path d="M39.5 45l6-7" stroke="#183a2a" stroke-width="4" stroke-linecap="round"/><path d="M39.5 45l6-7" stroke="#8fdcb3" stroke-width="2.2" stroke-linecap="round"/><circle cx="46" cy="37.5" r="2.1" fill="#fff" stroke="#183a2a" stroke-width="1.1"/></svg></div>
    <div class="ov title" id="title">
      <canvas id="fire" width="120" height="60"></canvas>
      <div class="logo">DOOM</div>
      <div class="sub">AI 건강비서 에디션</div>
      <div class="tag">오늘 루틴 3개 중 <b>666</b>개가 남았어요</div>
      <div class="meme">Can it run DOOM? — 네, 돌아가요.</div>
      <button class="go" id="go">▶ 실행하기</button>
      <div class="skill" id="skill" hidden>
        <p>난이도를 고르세요</p>
        <button data-s="0">아직 검진받기엔 젊어요</button>
        <button data-s="1">짜게만 먹지 마세요</button>
        <button data-s="2">혈압 좀 올려 봐</button>
        <button data-s="3">공복혈당 폭주</button>
        <button data-s="4">血压偏高，建议复查</button>
      </div>
    </div>
    <div class="ov over" id="over" hidden></div>
    <div class="touch" id="touch" hidden>
      <div class="stick" id="stick"><i></i></div>
      <div class="tbtns"><button data-t="fire">발사</button><button data-t="use">[하기]</button><button data-t="wep">무기</button></div>
    </div>
  </div>
  <div class="dhud">
    <div class="hc"><b id="hAmmo">50</b><small>탄약</small></div>
    <div class="hc"><b id="hHp">100%</b><small>체력</small></div>
    <div class="hc arms" id="hArms"><span data-w="1">2</span><span data-w="2">3</span><span data-w="3">4</span><span data-w="4">5</span><small id="hWep">검진결과 권총</small></div>
    <canvas id="face" width="64" height="64"></canvas>
    <div class="hc"><b id="hArmor">0%</b><small>아머</small></div>
    <div class="hc keys"><i id="kR"></i><i id="kU"></i><small>키카드</small></div>
  </div>
  <div class="dbar"><span>WASD 이동 · 마우스/←→ 회전 · 클릭/Ctrl 발사 · E/Space [하기] · 1-5 무기 · Tab 기능 지도</span><button id="big">⛶ 크게</button></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- 소리 (전부 합성) ---------- */
let AC=null, master=null, muted=false, noiseBuf=null;
function audio(){
  if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.45; master.connect(AC.destination); }
  if(AC.state==='suspended') AC.resume();
}
function tone(f,d,type='square',v=.2,slide=0,at=0){
  if(!AC||muted) return;
  const t=AC.currentTime+Math.max(0,at), o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02);
}
function noise(d,v=.3,freq=1200,at=0){
  if(!AC||muted) return;
  if(!noiseBuf){ noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const ch=noiseBuf.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1; }
  const t=AC.currentTime+Math.max(0,at), s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=noiseBuf; f.type='lowpass'; f.frequency.value=freq; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+d+.02);
}

// 원곡 대신 직접 만든 E 단조 리프
const RIFF=[40,40,43,40,40,45,40,46,40,40,43,40,47,45,43,42];
let musicOn=false, musicT=0, musicStep=0;
function music(){
  if(!AC||muted||!musicOn) return;
  musicT=Math.max(musicT,AC.currentTime);
  while(musicT<AC.currentTime+.25){
    const at=musicT-AC.currentTime, n=RIFF[musicStep%16];
    tone(440*Math.pow(2,(n-69)/12),.15,'sawtooth',.06,0,at); tone(220*Math.pow(2,(n-69)/12),.15,'square',.025,0,at);
    if(musicStep%4===0) tone(110,.14,'sine',.22,40,at);
    if(musicStep%8===4) noise(.12,.13,1800,at);
    if(musicStep%2) noise(.03,.035,8000,at);
    musicT+=60/170/2; musicStep++;
  }
}

function grain(g,base,amt,n=500){
  g.fillStyle=base; g.fillRect(0,0,TS,TS);
  for(let i=0;i<n;i++){ g.fillStyle=Math.random()<.5?`rgba(255,255,255,${amt*Math.random()})`:`rgba(0,0,0,${amt*Math.random()})`; g.fillRect(Math.random()*TS|0,Math.random()*TS|0,2,1); }
}
function txt(g,s,x,y,size,color,stroke){
  g.font=`800 ${size}px "Pretendard Variable",Pretendard,sans-serif`; g.textAlign='center'; g.textBaseline='middle';
  if(stroke){ g.lineWidth=3; g.strokeStyle=stroke; g.strokeText(s,x,y); }
  g.fillStyle=color; g.fillText(s,x,y);
}

/* ---------- 플레이어 ---------- */
const hasAmmo=i=>!WEP[i].ammo||P.ammo[WEP[i].ammo]>=(WEP[i].use||1);

function update(dt){

  const fwd=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-touchMove.y;

function use(){

function hitscan(off,range,dmg){

function bfgBlast(x,y,direct){

/* ---------- 악마들 ---------- */
const BOSS_LINES=['고혈압인가요?!','혈압약 바꿔도 돼?!','이 수치 무슨 병이야?!','당뇨 확정이죠?!','약 끊어도 되죠?!'];
const bossLine=()=>BOSS_LINES[Math.random()*BOSS_LINES.length|0];
function los(ax,ay,bx,by){ const n=Math.ceil(Math.hypot(bx-ax,by-ay)/.1); for(let i=1;i<n;i++){ const t=i/n; if(solid(ax+(bx-ax)*t,ay+(by-ay)*t)) return false; } return true; }
function alertNear(r){ for(const e of ents) if(e.mon&&e.alive&&e.st==='idle'&&Math.hypot(e.x-P.x,e.y-P.y)<r&&(los(e.x,e.y,P.x,P.y)||Math.random()<.5)) wake(e); }
function wake(e){
  e.st='chase'; e.see=true;
  if(e.k==='boss'){ SFX.roar(); say('진단해줘 데몬: 「고혈압인가요?!」'); clippy('저 악마는 진단을 원해요. 저는 진단·처방을 하지 않아요… BFG(의료진 연결)로 안내하세요!','boss'); }
  else if(Math.random()<.5) say(`${e.mon.name}: 「${e.mon.line}」`);
}
function tryMove(e,vx,vy){
  const nx=e.x+vx, ny=e.y+vy, r=.3;
  if(solid(nx+Math.sign(vx)*r,ny)||solid(nx,ny+Math.sign(vy)*r)||Math.hypot(nx-P.x,ny-P.y)<.6) return false;
  e.x=nx; e.y=ny; return true;
}
function ai(e,dt){
  if(e.referT>0){ e.referT-=dt; if(e.referT<=0) e.alive=false; return; }
  e.atkT-=dt; e.painT-=dt; e.moving=false; if(e.painT>0) return;
  const m=e.mon, dx=P.x-e.x, dy=P.y-e.y, dist=Math.hypot(dx,dy);
  e.t-=dt;
  if(e.st==='idle'){ if(e.t<=0){ e.t=.3; if(dist<14&&los(e.x,e.y,P.x,P.y)) wake(e); } return; }
  if(P.hp<=0) return;
  if(e.t<=0){ e.t=.25; e.see=los(e.x,e.y,P.x,P.y); }
  e.cool-=dt;
  if(e.see&&e.cool<=0&&dist<16){ attack(e,dist); e.cool=m.cool*rnd(.8,1.3)/Math.sqrt(SKILL[skill]); return; }
  if(dist>(e.k==='boss'?3:1)){ const sp=m.speed*dt, vx=dx/dist*sp, vy=dy/dist*sp; e.moving=tryMove(e,vx,vy)||tryMove(e,vx,0)||tryMove(e,0,vy); }
}
function attack(e,dist){
  const m=e.mon, run=runId; e.atkT=.35;
  if(!m.proj){ SFX.pistol(); if(Math.random()<clamp(1.1-dist/12,.25,.9)) damage(rnd(...m.dmg),e); return; }
  if(e.k==='imp'&&dist<1.3){ SFX.punch(); damage(rnd(...m.dmg),e); return; }
  SFX.fire();
  for(let i=0;i<(e.k==='boss'?3:1);i++) setTimeout(()=>{
    if(run!==runId||!e.alive||e.referT>0||state!=='play') return;
    const a=Math.atan2(P.y-e.y,P.x-e.x)+rnd(-.05,.05);
    shots.push({k:m.proj,x:e.x+Math.cos(a)*.5,y:e.y+Math.sin(a)*.5,dx:Math.cos(a),dy:Math.sin(a),own:'e',dmg:rnd(...m.dmg)});
    if(e.k==='boss'&&i===0&&Math.random()<.5) say(`진단해줘 데몬: 「${bossLine()}」`);
  },i*260);
}
function hurtMon(e,dmg,bfg){
  if(e.k==='boss'&&!bfg){
    dmg=0;
    if(levelT-(e.saidT||0)>2.5){ e.saidT=levelT; say(`진단해줘 데몬: 「${bossLine()}」`,'일반 무기로는 진단 질문에 답할 수 없어요 — BFG(의료진 연결)를 쓰세요'); clippy('저는 진단·처방을 하지 않아요. 저 악마에겐 BFG(의료진 연결)!','bossweap'); }
  }
  e.hp-=dmg; if(e.st==='idle') wake(e);
  if(e.hp<=0){ kill(e); return; }
  if(dmg>0&&Math.random()<e.mon.pain){ e.painT=.25; SFX.pain(); }
}
function kill(e){
  stats.kills++;
  if(e.k==='boss'){ e.referT=2.5; SFX.siren(); say('진단해줘 데몬을 의료진께 안내했어요 🚑','건강비서는 진단·처방 대신 의료진 상담을 안내해요'); learn('bfg'); return; }
  e.alive=false; e.corpse=true; e.dieT=.35; SFX.die();
  if(e.k==='zombie') ents.push({k:'clip',item:true,x:e.x+.15,y:e.y+.15,alive:true,drop:true});
  if(!lessons.has('why')){ learn('why'); say('처치 근거: 데이터 근거 1개 · 규칙 추론 0개','"왜?"라고 물으면 근거 흐름을 보여 줘요'); }
}
function damage(n,src){

  if(src){ P.hitA=Math.atan2(src.y-P.y,src.x-P.x); P.hitT=1; }
  n*=SKILL[skill];
  if(P.armor>0){ const a=Math.min(P.armor,n/3); P.armor-=a; n-=a; }
  P.hp-=n; P.hurt=Math.min(1,P.hurt+.5); SFX.hurt();
  if(P.hp>0&&P.hp<30) clippy('체력이 낮아요. 21시 약과 검진표를 챙기세요. 저는 진단은 못 해요.','low');
  if(P.hp<=0){ P.hp=0; die(); }
  hud();
}
function gain(i,ammo,n){ const first=!P.has[i]; P.has[i]=true; P.ammo[ammo]+=n; if(first) P.w=i; }
function take(e){
  let msg, sub;
  switch(e.k){
    case 'stim': if(P.hp>=100) return; P.hp=Math.min(100,P.hp+10); msg='21시 약을 챙겼다 (+10)'; sub=LESSON.stim[2]; learn('stim'); break;
    case 'medi': if(P.hp>=100) return; P.hp=Math.min(100,P.hp+25); msg='검진표를 획득했다 (+25)'; sub=LESSON.medi[2]; learn('medi'); break;
    case 'armor': P.armor=Math.max(P.armor,100); msg='메모리 카드 아머를 입었다!'; sub=LESSON.armor[2]; learn('armor'); break;
    case 'clip': P.ammo.bull+=10; P.ammo.shell+=4; msg='검진 결과지 묶음을 주웠다'; break;
    case 'cells': P.ammo.cell+=80; msg='BFG 셀을 주웠다'; break;
    case 'shotgun': gain(2,'shell',20); msg='「오늘 루틴」 샷건을 획득했다!'; sub=LESSON.shotgun[2]; learn('shotgun'); break;
    case 'chaingun': gain(3,'bull',40); msg='「혈압 기록」 체인건을 획득했다!'; sub=LESSON.chaingun[2]; learn('chaingun'); break;
    case 'bfg': gain(4,'cell',80); msg='BFG 9000 — Big Friendly Guide를 획득했다!'; sub='진단 요구엔 의료진 연결로 답해요'; clippy('BFG는 「의료진 연결」이에요. 진단을 원하는 악마에게 쏘세요!','bfg'); break;
    case 'key_r': P.kr=true; msg='「약 복용」 키카드를 얻었다'; sub='빨간 문을 열 수 있어요'; break;
    case 'key_u': P.ku=true; msg='「스트레칭」 키카드를 얻었다'; sub='파란 문을 열 수 있어요'; break;
  }
  e.alive=false; if(!e.drop) stats.items++;
  if(['shotgun','chaingun','bfg'].includes(e.k)){ SFX.weapon(); P.grin=1.2; } else SFX.item();
  P.flash=1; P.flashC='rgba(255,210,58,A)'; say(msg,sub); hud();
}

/* ---------- 흐름 ---------- */
const doomEl=$('#doom'), thread=$('#thread'), overEl=$('#over');
const LOGO=document.querySelector('.ph-head .lg').outerHTML;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function el(cls,html){ const d=document.createElement('div'); d.className=cls; d.innerHTML=html; return d; }
function add(node){ thread.append(node); if(state!=='play') thread.scrollTop=thread.scrollHeight; return node; }
const who=()=>add(el('who',LOGO+'건강비서'));
async function think(t){ const d=add(el('think','<i></i><i></i><i></i>'+t)); await sleep(1100); d.remove(); }
function chips(list){
  const c=el('chips','');
  for(const [label,fn] of list){ const b=document.createElement('button'); b.className='chip'; b.textContent=label; b.onclick=fn; c.append(b); }
  add(c);
}
function user(t){ const d=el('u',''); d.textContent=t; add(d); }
async function intro(){
  const h=new Date().getHours();
  who(); add(el('sum',`${h<11?'좋은 아침이에요':h<17?'좋은 오후예요':'좋은 저녁이에요'}. 최근 기록을 바탕으로 정리했어요.<br><b>오늘 루틴 3개 중 2개가 남았어요.</b>`));
  await sleep(600);
  for(const ch of '이거 둠 돌아가?'){ input.value+=ch; await sleep(75); }
  await sleep(300); input.value=''; user('이거 둠 돌아가?');
  await think('둠 실행 가능 여부를 확인하고 있어요');
  who(); add(el('sum','<b>네, 돌아가요.</b> 둠은 모든 기기에서 돌아가니까요.'));
  add(el('reason','<span class="badge">규칙 추론</span>「Can it run DOOM?」 규칙 <span class="badge data">데이터 근거 0개</span>'));
  doomEl.hidden=false; add(doomEl);
  chips([['무엇을 할 수 있어?',()=>ask('무엇을 할 수 있어?')],['체력 회복 방법',()=>ask('체력 회복 방법')],['고혈압인가요?',()=>ask('고혈압인가요?')]]);
}
async function ask(t){
  user(t); await think('답변을 준비하고 있어요'); who();
  if(/고혈압|당뇨|병|진단|처방|약.*(바꿔|끊|늘|줄)/.test(t)) add(el('safety','<b>안내</b>건강비서는 진단·처방을 하지 않아요. 정확한 판단은 의료진과 상담해 주세요. (둠 안에서는 BFG로 안내해요)'));
  else if(/뭘|무엇|도움|기능/.test(t)) add(el('sum','둠 안에서 할 수 있는 것: <b>2</b> 검진결과 권총 · <b>3</b> 오늘 루틴 샷건 · <b>4</b> 혈압 기록 체인건 · <b>5</b> BFG(의료진 연결). <b>Tab</b>을 누르면 기능 지도가 나와요.'));
  else if(/체력|회복|약/.test(t)) add(el('sum','<b>21시 약</b>은 +10, <b>검진표</b>는 +25 회복돼요. 체력이 100%면 줍지 않아요.'));
  else if(/iddqd|idkfa/i.test(t)) add(el('sum','치트키는 채팅이 아니라 게임 화면에서 입력해 주세요. IDDQD를 써도 진단은 안 해 드려요.'));
  else if(/둠|doom|e1m2/i.test(t)) add(el('sum','E1M2는 준비 중이에요. 대신 E1M1은 이미 돌아가고 있어요 ↑'));
  else add(el('sum','지금은 둠 모드예요. 악마를 먼저 처치하고 다시 물어봐 주세요.'));
}
$('#form').onsubmit=e=>{ e.preventDefault(); const t=input.value.trim(); if(!t) return; input.value=''; ask(t); };
function lock(){ if(matchMedia('(pointer:coarse)').matches) return; try{ view.requestPointerLock()?.catch?.(()=>{}); }catch{} }
$('#go').onclick=()=>{ audio(); $('#go').hidden=true; $('#skill').hidden=false; $('#skill button').focus(); state='title'; };
document.querySelectorAll('#skill button').forEach(b=>b.onclick=()=>{ skill=+b.dataset.s; start(); });
function start(){
  audio(); runId++; reset(); exitOn=false; clipSaid.clear(); dmsg.textContent=''; clipEl.hidden=true;
  $('#title').hidden=true; overEl.hidden=true; state='play'; musicOn=true;
  $('#touch').hidden=!matchMedia('(pointer:coarse)').matches;
  hud(); say('E1M1: 건강검진센터',skill===4?'血压偏高，建议复查':'악마를 무찌르고 출구의 [기록하기]를 누르세요');
  const run=runId; setTimeout(()=>{ if(run===runId) clippy('둠을 하시는 것 같네요! 도와드릴까요? 막히면 Tab = 「무엇을 할 수 있어?」','hello'); },1200);
  lock();
}
function die(){
  state='dead'; musicOn=false; SFX.die(); document.exitPointerLock?.(); dmsg.textContent=''; clipEl.hidden=true;
  overEl.className='ov over dead'; overEl.hidden=false;
  overEl.innerHTML='<h2>사망했어요</h2><p class="tag">오늘 루틴 3개 중 3개가 남았어요.<br>다시 시작해볼까요?</p><button class="go" id="again">다시 시작</button>';
  $('#again').onclick=start;
}
async function finish(){
  if(state!=='play') return;
  state='inter'; musicOn=false; document.exitPointerLock?.(); dmsg.textContent=''; clipEl.hidden=true;
  const run=runId, k=Math.round(stats.kills/stats.totalK*100), it=Math.round(stats.items/stats.totalI*100);
  overEl.className='ov over'; overEl.hidden=false;
  overEl.innerHTML=`<h2>E1M1 완료</h2><div class="tag">건강검진센터</div>
    <div class="row">처치 <b id="iK">0%</b></div><div class="row">아이템 <b id="iI">0%</b></div>
    <div class="row">비밀 <b>0% (저장은 내가 정해요)</b></div><div class="row">시간 <b>${fmt(levelT)}</b></div><div class="row">파 <b>5:00 (회장님 기준)</b></div>
    <ul>${Object.values(LESSON).map(([i,n,d],j)=>`<li class="${lessons.has(Object.keys(LESSON)[j])?'':'no'}">${i} ${n} — ${d}</li>`).join('')}</ul>
    <button class="go" id="again">한 판 더</button>`;
  $('#again').onclick=()=>{ overEl.hidden=true; $('#title').hidden=false; $('#go').hidden=true; $('#skill').hidden=false; state='title'; };
  for(let i=0;i<=20;i++){ if(run!==runId) return; $('#iK').textContent=Math.round(k*i/20)+'%'; $('#iI').textContent=Math.round(it*i/20)+'%'; tone(300+i*20,.03,'square',.06); await sleep(45); }
  who(); add(el('sum',`루틴을 기록했어요. 잘하셨어요! 🎉<br>오늘 악마 ${stats.totalK}마리 중 <b>${stats.totalK-stats.kills}마리</b>가 남았어요.`));
  chips([['E1M2 해 줘',()=>ask('E1M2 해 줘')],['고혈압인가요?',()=>ask('고혈압인가요?')]]);
}
function toggleMap(){ mapOn=!mapOn; if(mapOn){ learn('fist'); clippy('기능 지도예요. 건강비서에선 "뭘 할 수 있어?"라고 물으면 나와요.','map'); } }
function toggleBig(){ const on=doomEl.classList.toggle('big'); $('#big').textContent=on?'✕ 작게':'⛶ 크게'; }
$('#big').onclick=()=>{ audio(); toggleBig(); };
addEventListener('keydown',e=>{ if(e.key==='Escape'&&doomEl.classList.contains('big')&&document.pointerLockElement!==view) toggleBig(); });
view.addEventListener('wheel',e=>{ if(state==='play'){ e.preventDefault(); pick(nextWep()); } },{passive:false});
$('#mute').onclick=()=>{ muted=!muted; $('#mute').textContent=muted?'🔇':'🔊'; };

// 시작 화면 뒤에서 타오르는 고전 둠 불꽃
const FW=120, FH=60, fireCtx=$('#fire').getContext('2d'), fireImg=fireCtx.createImageData(FW,FH), fire32=new Uint32Array(fireImg.data.buffer), heat=new Uint8Array(FW*FH);
const FIRE_PAL='070707 1f0707 2f0f07 470f07 571707 671f07 771f07 8f2707 9f2f07 af3f07 bf4707 c74707 df4f07 df5707 df5707 d75f07 d75f07 d7670f cf6f0f cf770f cf7f0f cf8717 c78717 c78f17 c7971f bf9f1f bf9f1f bfa727 bfa727 bfaf2f b7af2f b7b72f b7b737 cfcf6f dfdf9f efefc7 ffffff'
  .split(' ').map((h,i)=>{ const n=parseInt(h,16); return ((i?Math.min(255,i*14):0)<<24|((n&255)<<16)|(n&0xff00)|(n>>16))>>>0; });
heat.fill(36,(FH-1)*FW);
let fireTick=0;
function fireStep(){
  if(++fireTick%2) return;
  for(let x=0;x<FW;x++) for(let y=1;y<FH;y++){ const i=y*FW+x, p=heat[i]; if(!p){ heat[i-FW]=0; continue; } const r=Math.random()*3|0; heat[Math.max(0,i-r+1-FW)]=p-(r&1); }
  for(let i=0;i<heat.length;i++) fire32[i]=FIRE_PAL[heat[i]];
  fireCtx.putImageData(fireImg,0,0);
}
let last=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  music();
  if(!$('#title').hidden) fireStep();
  if(!P) return;
  if(state==='play') update(dt);
  if(state!=='title'){ render(now); drawFace(now); }
}
Promise.race([document.fonts.ready,sleep(1500)]).then(()=>{ makeTextures(); makeSprites(); makeWeapons(); makeVignette(); requestAnimationFrame(loop); intro(); });
</script>
