<!doctype html>
<!-- 첫 사용 안내 튜토리얼 시안(U1, 2026-10-19) · 계획 docs/intents/261019-tutorial-treasure/plan.md · 가상 데이터 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="손가락 안내로 AI 건강비서에게 질문하고, 게이지 3칸을 채워 보물상자를 열고, 동·은·금·다이아 포인트로 상점까지 가 보는 첫 사용 안내 튜토리얼 시안(가상 데이터).">
<title>건강비서 튜토리얼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 실제 v5 대화 화면 모양 위에 얇은 게임 HUD(게이지·포인트·상점). 안내는 "구멍 뚫린 막"(clip-path)이라
   보물상자 창·상점 창 안의 버튼도 같은 방식으로 가리킨다. 색 토큰은 건강비서-퀘스트.html 과 같다. */
:root {
  --primary: #1a71ff;      /* v5 blue.50 */
  --primary-soft: #eaf2fe; /* v5 blue.95 */
  --ink: #171719;          /* v5 text.default */
  --sub: #70737c;          /* v5 text.sub */
  --line: #dbdcdf;         /* v5 border.base */
  --panel: #ffffff;
  --surface: #f4f5f7;
  --good: #00b200;         /* v5 green.50 */
  --warn: #ff6a00;
  --bronze: #b87333;
  --silver: #aab3bf;
  --gold: #ffc21f;
  --diamond: #5fd8ff;
  --dim: rgba(9, 13, 30, .66);
  --body: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--body); color: var(--ink); background: #0b1022; background-image: radial-gradient(circle at 50% 25%, #1d2a55, #0b1022 70%); display: grid; place-items: center; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
#app { position: relative; width: 100%; max-width: 430px; height: 100vh; height: 100dvh; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 520px) and (min-height: 700px) { #app { height: min(860px, 94vh); border-radius: 28px; box-shadow: 0 30px 80px rgba(0,0,0,.45); } }

/* 머리줄 + HUD */
.bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px 6px; flex: none; }
.logo { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #9fd0ff, #1a71ff 55%, #5b2bd6); flex: none; }
.bar strong { font-size: 16px; }
.pill-note { font-size: 11px; font-weight: 700; color: var(--sub); background: var(--surface); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
#mute { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; }
.hud { display: flex; align-items: center; gap: 8px; padding: 4px 12px 10px; border-bottom: 1px solid var(--line); flex: none; }
#gauge { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--surface); }
#gauge .lbl { font-size: 12px; font-weight: 700; color: var(--sub); }
#gauge .seg { width: 26px; height: 10px; border-radius: 5px; background: #e1e3e8; overflow: hidden; position: relative; }
#gauge .seg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #66a3ff, var(--primary)); transform: scaleX(0); transform-origin: left; transition: transform .45s cubic-bezier(.2,.9,.3,1.2); }
#gauge .seg.on::after { transform: scaleX(1); }
#gauge.full { background: #fff4cc; animation: glow 1s ease-in-out infinite alternate; }
#gauge.full .seg::after { background: linear-gradient(90deg, #ffd34d, #ff9f1a); }
#points { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: var(--surface); font-weight: 900; font-size: 14px; font-variant-numeric: tabular-nums; }
#points .coin { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c2, #ffc21f 55%, #c98a00); box-shadow: inset 0 0 0 1.5px rgba(120,80,0,.35); }
#points.bump { animation: bump .5s; }
#shopBtn { margin-left: auto; display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px; background: var(--primary); color: #fff; font-weight: 700; font-size: 14px; }
#shopBtn .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff4d6d; display: none; }
#shopBtn.new .dot { display: block; }

/* 대화 */
.chat { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.55; animation: pop .25s ease-out; word-break: keep-all; overflow-wrap: anywhere; }
.msg.bot { background: var(--surface); border-top-left-radius: 4px; align-self: flex-start; }
.msg.me { background: var(--primary); color: #fff; border-top-right-radius: 4px; align-self: flex-end; }
.msg small { display: block; margin-top: 4px; font-size: 11px; color: var(--sub); }
.typing { align-self: flex-start; background: var(--surface); border-radius: 16px; padding: 12px 14px; display: flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--sub); animation: dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.sys { align-self: center; font-size: 12px; color: var(--sub); background: var(--surface); padding: 4px 10px; border-radius: 999px; text-align: center; }
.hint { font-size: 12px; color: var(--primary); font-weight: 700; padding: 0 12px 6px; flex: none; }
.hint:empty { padding: 0; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 12px 8px; flex: none; }
.chip { padding: 8px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--primary); color: var(--primary); font-size: 14px; font-weight: 500; }
.chip:disabled { opacity: .45; cursor: default; }
.composer { display: flex; gap: 8px; padding: 8px 10px 6px; border-top: 1px solid var(--line); flex: none; background: var(--panel); }
#input { flex: 1; min-width: 0; font: inherit; font-size: 15px; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; color: var(--ink); background: var(--panel); }
#send { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 18px; flex: none; }
#send:disabled { opacity: .45; }
.foot { font-size: 11px; color: var(--sub); text-align: center; padding: 0 12px 10px; flex: none; }

/* 루틴 카드 */
.card { align-self: stretch; border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 8px; background: var(--panel); animation: pop .25s ease-out; }
.card h4 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
.card h4 small { font-size: 12px; font-weight: 700; color: var(--primary); background: var(--primary-soft); padding: 2px 8px; border-radius: 999px; }
.card .rnote { font-size: 12px; color: var(--sub); }
.rrow { display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 36px; }
.rrow .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; color: #fff; flex: none; }
.rrow .name { flex: 1; }
.rrow .btn { min-height: 32px; padding: 0 12px; font-size: 13px; border-radius: 999px; }
.rrow.done .check { background: var(--good); border-color: var(--good); }
.rrow.done .name { color: var(--sub); text-decoration: line-through; }

/* 겹쳐 뜨는 창 */
.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(9, 13, 30, .55); animation: fade .2s ease-out; }
.modal[hidden] { display: none; }
.sheet { width: min(400px, calc(100vw - 28px)); background: var(--panel); border-radius: 22px; padding: 20px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.35); animation: rise .28s cubic-bezier(.2,.9,.3,1.1); text-align: center; }
.sheet h3 { margin: 0 0 6px; font-size: 19px; }
.sheet p { margin: 0; color: var(--sub); font-size: 14px; line-height: 1.5; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 700; font-size: 15px; }
.btn.ghost { background: var(--surface); color: var(--ink); }
.btn:disabled { background: #c9ccd3; color: #fff; cursor: default; }
.link { color: var(--primary); font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }

/* 보물상자 */
#chestModal .sheet { background: radial-gradient(circle at 50% 35%, #fff9e0, #ffffff 65%); }
#chest { display: block; width: 180px; height: 160px; margin: 6px auto 4px; }
#chest.shake { animation: shake 1.2s ease-in-out infinite; }
#chest .lid { transform-origin: 30px 72px; transition: transform .5s cubic-bezier(.3,1.6,.5,1); }
#chest.open .lid { transform: rotate(-28deg) translate(-6px, -10px); }
#chest .rays { opacity: 0; transition: opacity .4s; }
#chest.open .rays { opacity: 1; }
.odds { margin: 10px auto 0; border-collapse: collapse; font-size: 13px; }
.odds td, .odds th { padding: 4px 10px; border-bottom: 1px solid var(--line); }
.odds th { color: var(--sub); font-weight: 500; }

/* 룰렛 */
.reel { position: relative; height: 112px; margin: 14px -6px 6px; overflow: hidden; border-radius: 16px; background: #10162e; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); }
.reel::before, .reel::after { content: ""; position: absolute; top: 0; bottom: 0; width: 60px; z-index: 2; pointer-events: none; }
.reel::before { left: 0; background: linear-gradient(90deg, #10162e, transparent); }
.reel::after { right: 0; background: linear-gradient(-90deg, #10162e, transparent); }
.reel .mark { position: absolute; left: 50%; top: 4px; bottom: 4px; width: 92px; margin-left: -46px; border: 3px solid #fff; border-radius: 14px; z-index: 3; box-shadow: 0 0 18px rgba(255,255,255,.55); pointer-events: none; }
.strip { position: absolute; top: 10px; left: 0; display: flex; gap: 8px; will-change: transform; }
.tile { width: 84px; height: 92px; border-radius: 12px; display: grid; place-items: center; align-content: center; gap: 4px; color: #fff; font-weight: 900; font-size: 14px; background: #1c2547; flex: none; }
.gem { width: 44px; height: 44px; border-radius: 50%; }
.gem.bronze { background: radial-gradient(circle at 35% 30%, #ffd9b0, var(--bronze) 60%, #6e3f12); }
.gem.silver { background: radial-gradient(circle at 35% 30%, #ffffff, var(--silver) 60%, #6c7480); }
.gem.gold { background: radial-gradient(circle at 35% 30%, #fff6c2, var(--gold) 58%, #b67a00); }
.gem.diamond { border-radius: 6px; width: 38px; height: 38px; transform: rotate(45deg); background: linear-gradient(135deg, #e9fbff, var(--diamond) 55%, #1f8fd1); }
.result { margin-top: 8px; }
.result .gain { font-size: 18px; font-weight: 900; color: var(--primary); }
.tally { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 6px; }
.tally span { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 700; animation: pop .25s ease-out; }
.tally span i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.tally span.wait { color: var(--sub); background: transparent; border: 1px dashed var(--line); }
#chest.bonus { animation: shake 1.2s ease-in-out infinite, rainbow 1.6s linear infinite; }
#chestModal .sheet.bonus { background: radial-gradient(circle at 50% 35%, #ffe9fb, #eaf6ff 45%, #ffffff 75%); }
.bonus-badge { display: inline-block; margin-bottom: 6px; padding: 4px 12px; border-radius: 999px; background: linear-gradient(90deg, #ff5fd2, #ffb84d, #5fd8ff); color: #fff; font-weight: 900; font-size: 13px; animation: bump .6s; }
.bonus-badge[hidden] { display: none; }

/* 상점 */
#shopModal { align-items: end; }
#shopModal .sheet { width: min(430px, 100vw); border-radius: 22px 22px 0 0; text-align: left; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow-y: auto; animation: up .3s cubic-bezier(.2,.9,.3,1); }
.shop-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.shop-head h3 { margin: 0; }
.shop-head .pts { margin-left: 8px; font-weight: 900; font-variant-numeric: tabular-nums; }
.shop-head .x { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); font-size: 18px; }
.bag { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 8px 10px; border-radius: 12px; background: var(--surface); font-size: 13px; color: var(--sub); margin-bottom: 12px; flex-wrap: wrap; }
.bag svg { width: 28px; height: 28px; }
.items { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.item { border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.item svg { width: 64px; height: 64px; }
.item b { font-size: 15px; }
.item .price { font-size: 14px; font-weight: 900; color: var(--warn); }
.item .need { font-size: 11px; color: var(--sub); min-height: 15px; }
.item .btn { width: 100%; min-height: 38px; font-size: 14px; }
.notice { font-size: 11px; color: var(--sub); margin-top: 12px; text-align: center; }

/* 안내(코치마크) — 막은 clip-path 로 대상 자리를 뚫어 그 자리 누르기만 통과시킨다 */
#coach { position: fixed; inset: 0; z-index: 90; pointer-events: none; }
#coach[hidden] { display: none; }
#coach .veil { position: absolute; inset: 0; background: var(--dim); pointer-events: auto; transition: clip-path .25s; }
#coach .ring { position: absolute; border-radius: 16px; box-shadow: 0 0 0 3px #fff, 0 0 0 8px rgba(26,113,255,.55), 0 0 26px 10px rgba(255,255,255,.35); transition: all .25s; animation: ping 1.4s ease-out infinite; }
#coach .tip { position: absolute; max-width: min(300px, calc(100vw - 32px)); background: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); pointer-events: auto; font-size: 15px; font-weight: 700; line-height: 1.45; }
#coach .tip small { display: block; font-weight: 400; color: var(--sub); font-size: 12px; margin-top: 2px; }
#coach .tip .row { display: flex; gap: 8px; margin-top: 8px; }
#coach .tip .row:empty { display: none; }
#coach .tip.nudge { animation: nope .4s; }
#coach .hand { position: absolute; font-size: 34px; animation: tapme 1s ease-in-out infinite; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
#skip { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 95; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--ink); font-size: 13px; font-weight: 700; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
#skip[hidden] { display: none; }

.float { position: fixed; z-index: 99; font-weight: 900; font-size: 18px; color: var(--primary); pointer-events: none; animation: floatUp 1.1s ease-out forwards; text-shadow: 0 2px 0 #fff; }
.float.gold { color: #d48a00; }
#toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 98; transform: translate(-50%, -140%); background: #171719; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; transition: transform .3s; white-space: nowrap; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; }
#toast.show { transform: translate(-50%, 0); }
#fx { position: fixed; inset: 0; z-index: 97; pointer-events: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@keyframes rainbow { from { filter: drop-shadow(0 0 10px #ff5fd2); } 33% { filter: drop-shadow(0 0 12px #ffb84d); } 66% { filter: drop-shadow(0 0 12px #5fd8ff); } to { filter: drop-shadow(0 0 10px #ff5fd2); } }
@keyframes pop { from { transform: translateY(6px); opacity: 0; } }
@keyframes dot { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(20px) scale(.96); opacity: 0; } }
@keyframes up { from { transform: translateY(100%); } }
@keyframes glow { from { box-shadow: 0 0 0 0 rgba(255,194,31,.0); } to { box-shadow: 0 0 0 4px rgba(255,194,31,.45); } }
@keyframes bump { 30% { transform: scale(1.18); } }
@keyframes shake { 0%, 60%, 100% { transform: rotate(0); } 65% { transform: rotate(-6deg); } 72% { transform: rotate(6deg); } 79% { transform: rotate(-4deg); } 86% { transform: rotate(3deg); } }
@keyframes ping { 0% { box-shadow: 0 0 0 3px #fff, 0 0 0 6px rgba(26,113,255,.6), 0 0 26px 10px rgba(255,255,255,.35); } 100% { box-shadow: 0 0 0 3px #fff, 0 0 0 16px rgba(26,113,255,0), 0 0 26px 10px rgba(255,255,255,.35); } }
@keyframes tapme { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes nope { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
@keyframes floatUp { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -46px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="logo" aria-hidden="true"></div><strong>AI 건강비서</strong><span class="pill-note">튜토리얼 시안 · 가상 예시</span>
    <button id="mute" type="button" aria-label="소리 끄기">🔊</button>
  </div>
  <div class="hud">
    <div id="gauge" role="meter" aria-label="질문 게이지" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0">
      <span class="lbl">질문</span><span class="seg"></span><span class="seg"></span><span class="seg"></span>
    </div>
    <div id="points" aria-live="polite"><span class="coin" aria-hidden="true"></span><span id="pointsNum">0</span>P</div>
    <button id="shopBtn" type="button" aria-label="상점 열기">🛍️ 상점<span class="dot" aria-hidden="true"></span></button>
  </div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="hint" id="hint" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="composer" id="composer" autocomplete="off">
    <input id="input" placeholder="비서에게 물어보세요" aria-label="메시지" maxlength="120">
    <button id="send" type="submit" aria-label="보내기">↑</button>
  </form>
  <div class="foot">시안이에요 — 실제 상담·기록이 아니고, 포인트·구매도 저장되지 않아요.</div>
</div>

<div class="modal" id="chestModal" hidden role="dialog" aria-modal="true" aria-labelledby="chestTitle">
  <div class="sheet">
    <span class="bonus-badge" id="bonusBadge" hidden></span>
    <h3 id="chestTitle">보물상자가 나타났어요!</h3>
    <p id="chestSub">질문 3번을 채웠어요. 상자를 눌러 열어 보세요.</p>
    <button id="chestBtn" type="button" aria-label="보물상자 열기">
      <svg id="chest" viewBox="0 0 180 160" aria-hidden="true">
        <g class="rays" stroke="#ffd34d" stroke-width="6" stroke-linecap="round" opacity=".9">
          <path d="M90 50 V14"/><path d="M60 58 L42 30"/><path d="M120 58 L138 30"/><path d="M40 76 L14 66"/><path d="M140 76 L166 66"/>
        </g>
        <ellipse cx="90" cy="146" rx="62" ry="8" fill="rgba(0,0,0,.12)"/>
        <rect x="30" y="72" width="120" height="70" rx="8" fill="#a5612b" stroke="#5b3110" stroke-width="3"/>
        <rect x="30" y="72" width="120" height="16" fill="#8a4d1f"/>
        <rect x="80" y="72" width="20" height="70" fill="#ffc21f" stroke="#a87300" stroke-width="2"/>
        <rect x="30" y="118" width="120" height="8" fill="#ffc21f" stroke="#a87300" stroke-width="2"/>
        <rect x="82" y="92" width="16" height="18" rx="3" fill="#fff1b8" stroke="#a87300" stroke-width="2"/>
        <g class="lid">
          <path d="M30 72 V58 Q30 30 90 30 Q150 30 150 58 V72 Z" fill="#b8702f" stroke="#5b3110" stroke-width="3"/>
          <path d="M80 31 H100 V72 H80 Z" fill="#ffc21f" stroke="#a87300" stroke-width="2"/>
          <path d="M44 50 Q90 40 136 50" stroke="#d48b45" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </button>
    <div id="reelWrap" hidden>
      <div class="reel" aria-hidden="true"><div class="strip" id="strip"></div><div class="mark"></div></div>
    </div>

<div class="modal" id="shopModal" hidden role="dialog" aria-modal="true" aria-labelledby="shopTitle">
  <div class="sheet">
    <div class="shop-head">
      <h3 id="shopTitle">🛍️ 상점</h3><span class="pts" id="shopPts"></span>

<div class="modal" id="doneModal" hidden role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <div class="sheet">
    <div style="font-size:52px" aria-hidden="true">🎉</div>
    <h3 id="doneTitle">튜토리얼 완료!</h3>
    <p>질문하기 → 보물상자 → 상점 → 루틴 상자 → 보너스 룰렛까지 다 해 봤어요.<br>질문 3번마다 상자, 루틴 하나마다 상자(하루 5번)가 나와요. 가끔은 룰렛을 2~3번 돌려요!</p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
      <button class="btn ghost" id="restart" type="button">처음부터 다시</button>
      <button class="btn" id="doneOk" type="button">계속 둘러보기</button>
    </div>
  </div>

<div id="coach" hidden>
  <div class="veil" id="veil"></div>
  <div class="ring" id="ring"></div>
  <div class="hand" id="hand" aria-hidden="true">👆</div>
  <div class="tip" id="tip" role="status"><span id="tipText"></span><small id="tipSub"></small><div class="row" id="tipRow"></div></div>
</div>
<button id="skip" type="button" hidden>튜토리얼 건너뛰기</button>
<div id="toast" role="status"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? Math.min(ms, 150) : ms));
  /** 읽을 시간 — 움직임이 아니라서 움직임 줄이기에서도 줄이지 않는다 */
  const hold = (ms) => new Promise((r) => setTimeout(r, ms));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const chat = $('#chat'), chipsEl = $('#chips'), input = $('#input'), send = $('#send'), hintEl = $('#hint');

  // ── 규칙 값 (questions.md 제안값, 2026-10-19) ──────────────────────
  const GAUGE_MAX = 3;
  const TIERS = {
    bronze:  { name: '동',     points: 10,  color: '#b87333' },
    silver:  { name: '은',     points: 50,  color: '#8d97a5' },
    gold:    { name: '금',     points: 150, color: '#d49a00' },
    diamond: { name: '다이아', points: 500, color: '#1fa6e0' },
  };
  const ODDS = { bronze: 60, silver: 25, gold: 12, diamond: 3 };
  /** 첫 상자는 은 이상 — 첫 포인트로 핫팩(50P)을 바로 살 수 있게(Q4) */
  const FIRST_ODDS = { bronze: 0, silver: 70, gold: 25, diamond: 5 };
  /** 상자 하나에 룰렛을 몇 번 돌리나 — 낮은 확률로 2~3번(보너스 상자, Q11). 튜토리얼 두 번째 상자는 2번 확정(Q12) */
  const SPIN_ODDS = { 1: 87, 2: 10, 3: 3 };
  /** 루틴은 하나 할 때마다 상자를 바로 준다 — 질문 게이지와 따로, 하루 5번까지(Q13). 상한이 보이게 루틴은 6개 */
  const ROUTINE_DAILY_MAX = 5;
  const ROUTINES = ['아침 스트레칭 5분', '물 한 잔 마시기', '점심 먹고 10분 걷기', '계단 3층 오르기', '저녁 산책 20분', '자기 전 혈압 재기'];
  const ITEMS = [
    { id: 'hotpack', name: '핫팩', price: 50 },
    { id: 'socks', name: '수면 양말', price: 80 },
    { id: 'tumbler', name: '보온 텀블러', price: 150 },
    { id: 'band', name: '스트레칭 밴드', price: 200 },
  ];

  // ── 상태 — 저장하지 않는다(새로고침 = 처음부터). 소리 켬·끔만 기억 ──
  const S = { gauge: 0, points: 0, bag: [], chests: 0, busy: false, tutorial: true, step: 0, shopIntro: false, act2: false, act2Stage: null,
    routineDay: new Date().toDateString(), routineDone: new Set(), routineRewards: 0, lastRoutineCard: null };
  /** 튜토리얼에서 핫팩을 살 때까지 기다리는 자리 — 그동안 상점을 닫지 못한다 */
  let afterBuy = null;

  // ── 소리(건강비서-퀘스트.html 과 같은 방식) ─────────────────────────
  let ac = null, muted = false;
  try { muted = localStorage.getItem('pulseTutorial.muted') === '1'; } catch (e) {}
  const muteBtn = $('#mute');
  const drawMute = () => { muteBtn.textContent = muted ? '🔇' : '🔊'; muteBtn.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기'); };
  drawMute();
  muteBtn.onclick = () => { muted = !muted; drawMute(); try { localStorage.setItem('pulseTutorial.muted', muted ? '1' : '0'); } catch (e) {} };
  addEventListener('pointerdown', () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (ac.state === 'suspended') ac.resume(); }, { capture: true });
  function tone(freq, dur = .12, type = 'sine', vol = .08, delay = 0) {
    if (muted || !ac) return;
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
  }
  const sfx = {
    tap: () => tone(660, .07, 'triangle', .06),
    bot: () => tone(520, .05, 'sine', .03),
    fill: (n) => { tone(660 + n * 120, .1, 'triangle', .07); tone(880 + n * 120, .14, 'triangle', .06, .08); },
    chest: () => [392, 523, 659, 784].forEach((f, i) => tone(f, .16, 'triangle', .08, i * .08)),
    tick: () => tone(1200, .025, 'square', .02),
    win: () => [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .2, 'triangle', .09, i * .09)),
    coin: () => { tone(988, .08, 'square', .05); tone(1318, .16, 'square', .05, .07); },
    buy: () => [784, 988, 1175].forEach((f, i) => tone(f, .14, 'sine', .08, i * .07)),
    nope: () => tone(220, .14, 'sawtooth', .04),
  };

  // ── 꽃가루 ─────────────────────────────────────────────────────
  const fx = $('#fx'), cx = fx.getContext('2d'); let bits = [], fxOn = false;
  const fit = () => { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); };
  fit(); addEventListener('resize', fit);
  function confetti(x, y, n = 60, colors) {
    if (reduce) return;
    const C = colors || ['#1a71ff', '#66a3ff', '#ffd34d', '#ff8fb1', '#7de549', '#c972f2'];
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 6; bits.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, r: Math.random() * 6.28, s: 4 + Math.random() * 5, c: C[i % C.length], life: 70 + Math.random() * 30 }); }
    if (!fxOn) { fxOn = true; requestAnimationFrame(loop); }
  }
  function loop() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    bits = bits.filter((b) => b.life-- > 0);
    bits.forEach((b) => { b.vy += .25; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += .2; cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx.restore(); });
    if (bits.length) requestAnimationFrame(loop); else { fxOn = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  const centerOf = (node) => { const r = node.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  function floatAt(node, text, gold) { const [x, y] = centerOf(node); const f = el('div', 'float' + (gold ? ' gold' : ''), text); f.style.left = x + 'px'; f.style.top = (y - 10) + 'px'; document.body.appendChild(f); setTimeout(() => f.remove(), 1200); }
  /** 받침 있으면 '이', 없으면 '가' */
  const josa = (w) => { const c = w.charCodeAt(w.length - 1) - 0xac00; return c >= 0 && c <= 11171 && c % 28 ? '이' : '가'; };
  let toastTimer = 0;
  function toast(text) { const t = $('#toast'); t.textContent = text; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400); }

  // ── 대화 ───────────────────────────────────────────────────────
  const add = (node) => { chat.appendChild(node); chat.scrollTop = chat.scrollHeight; return node; };
  async function typing(ms) { const t = add(el('div', 'typing', '<i></i><i></i><i></i>')); await wait(ms); t.remove(); }
  async function say(html, ms = 550) { await typing(ms); add(el('div', 'msg bot', html)); sfx.bot(); }
  const me = (text) => { const m = el('div', 'msg me'); m.textContent = text; add(m); };
  const sys = (text) => add(el('div', 'sys', text));

  const STARTERS = [
    { label: '오늘 컨디션 어때?', key: 'condition' },
    { label: '잠을 잘 자려면?', key: 'sleep' },
    { label: '오늘 얼마나 걸었어?', key: 'walk' },
    { label: '오늘 루틴', key: 'routine' },
  ];
  /** 정해진 가상 답 — 진단·처방 없이, 가상 기록임을 밝힌다(Q8) */
  const ANSWERS = {
    condition: '어젯밤 6시간 40분 주무셨고, 아침 심박은 평소와 비슷해요. 오늘은 무리하지 말고 물을 자주 드세요.<small>가상 기록이에요</small>',
    sleep: '잠들기 1시간 전에는 화면 밝기를 줄이고, 매일 비슷한 시간에 눕는 게 도움이 돼요. 오늘 밤 알림을 맞춰 드릴까요?<small>가상 예시예요</small>',
    walk: '오늘 4,120걸음 걸으셨어요. 목표 6,000걸음까지 1,880걸음 남았어요 — 저녁 산책 15분이면 충분해요.<small>가상 기록이에요</small>',
    water: '오늘 물은 3잔 기록됐어요. 식사 사이사이 한 잔씩 더 드시면 좋아요.<small>가상 기록이에요</small>',
    bp: '지난주 혈압 기록은 아침 평균 124/80이에요. 재는 시간을 일정하게 하면 비교하기 쉬워요.<small>가상 기록이에요</small>',
    meal: '오늘 점심은 비빔밥으로 기록돼 있어요. 저녁엔 채소를 한 접시 곁들여 보세요.<small>가상 기록이에요</small>',
    stress: '바쁜 하루였나 봐요. 1분만 천천히 숨을 들이쉬고 내쉬어 볼까요? 4초 들이쉬고, 6초 내쉬어요.<small>가상 예시예요</small>',
    weight: '최근 2주 체중은 큰 변화 없이 유지되고 있어요.<small>가상 기록이에요</small>',
    routine: `오늘 루틴 ${ROUTINES.length}개예요. 하나 할 때마다 [했어요]를 눌러 주세요 — 보물상자를 바로 드려요!<small>가상 루틴이에요</small>`,
    routineLater: '루틴은 조금 뒤에 알려 드릴게요 🙂 지금은 다른 걸 물어보세요.',
    fallback: '시안이라 정해진 답만 할 수 있어요 🙂 아래 추천 질문이나 수면·걷기·물·혈압·식사에 대해 물어보세요.',
  };
  const KEYWORDS = [
    [/루틴|할\s*일/, 'routine'], [/잠|수면|자(고|는|야)|불면/, 'sleep'], [/걷|걸음|산책|운동/, 'walk'], [/물|수분/, 'water'], [/혈압/, 'bp'],
    [/식사|밥|먹|음식|점심|저녁|아침/, 'meal'], [/스트레스|피곤|힘들/, 'stress'], [/체중|몸무게|살/, 'weight'], [/컨디션|상태|기분/, 'condition'],
  ];
  /** 위기 말 — 시안은 판정하지 않지만 그대로 넘기지 않고 도움받을 곳만 알린다. 게이지도 채우지 않는다 */
  const CRISIS = /죽고\s*싶|자살|자해|극단적/;

  /** 튜토리얼 1막에는 루틴 칩을 숨긴다 — 루틴 상자가 첫 상자·상점 안내와 엉키지 않게 */
  const routineOpen = () => !(S.tutorial && !S.act2);
  function setChips(list = STARTERS) {
    chipsEl.innerHTML = '';
    list.filter((c) => c.key !== 'routine' || routineOpen()).forEach((s) => { const c = el('button', 'chip', s.label); c.type = 'button'; c.dataset.key = s.key; c.onclick = () => ask(s.label, s.key); chipsEl.appendChild(c); });
  }
  function setBusy(b) { S.busy = b; send.disabled = b; chipsEl.querySelectorAll('.chip').forEach((c) => (c.disabled = b)); drawRoutines(); }

  async function ask(text, key) {
    if (S.busy) return;
    text = text.trim();
    if (!text) return;
    sfx.tap();
    endCoach();
    setBusy(true);
    me(text);
    hintEl.textContent = '';
    if (CRISIS.test(text)) {
      await say('지금 많이 힘드신가 봐요. 이 화면은 시안이라 상담을 할 수 없어요. 혼자 견디지 말고 <b>자살예방상담전화 109</b>(24시간)나, 위급하면 <b>119</b>에 바로 연락해 주세요.');
      setBusy(false);
      return;
    }
    const k = key || (KEYWORDS.find(([re]) => re.test(text)) || [])[1] || 'fallback';
    if (k === 'routine' && routineOpen()) { await say(ANSWERS.routine); S.lastRoutineCard = routineCard(); }
    else await say(ANSWERS[k === 'routine' ? 'routineLater' : k]);
    S.lastAskKey = k;
    setBusy(false);
    await fillGauge();
  }
  $('#composer').addEventListener('submit', (e) => { e.preventDefault(); const v = input.value; if (!v.trim() || S.busy) return; input.value = ''; ask(v); });

  // ── 오늘 루틴 — 하나 할 때마다 보물상자(하루 5번까지) ───────────────
  const dayKey = () => new Date().toDateString();
  /** 날짜가 바뀌면 루틴 완료·보상 횟수를 새로 센다(저장하지 않으므로 새로고침해도 새로 센다) */
  function routineDayCheck() { if (S.routineDay !== dayKey()) { S.routineDay = dayKey(); S.routineDone = new Set(); S.routineRewards = 0; } }
  function routineCard() {
    routineDayCheck();
    const c = el('div', 'card routine');
    c.innerHTML = '<h4>오늘 루틴 <small class="rcount"></small></h4>' +
      ROUTINES.map((name, i) => `<div class="rrow" data-i="${i}"><span class="check" aria-hidden="true"></span><span class="name">${name}</span><button type="button" class="btn" aria-label="${name} 했어요">했어요</button></div>`).join('') +
      `<span class="rnote">루틴 하나를 할 때마다 보물상자를 바로 받아요 — 하루 ${ROUTINE_DAILY_MAX}번까지</span>`;
    c.querySelectorAll('.rrow').forEach((row) => { row.querySelector('.btn').onclick = () => doRoutine(Number(row.dataset.i)); });
    add(c); drawRoutines();
    return c;
  }
  function drawRoutines() {
    document.querySelectorAll('.card.routine').forEach((c) => {
      c.querySelector('.rcount').textContent = `상자 ${S.routineRewards}/${ROUTINE_DAILY_MAX}`;
      c.querySelectorAll('.rrow').forEach((row) => {
        const done = S.routineDone.has(Number(row.dataset.i)), b = row.querySelector('.btn');
        row.classList.toggle('done', done); row.querySelector('.check').textContent = done ? '✓' : '';
        b.disabled = done || S.busy; b.textContent = done ? '완료' : '했어요';
      });
    });
  }
  async function doRoutine(i) {
    routineDayCheck();
    if (S.busy || S.routineDone.has(i)) return;
    endCoach(); sfx.tap();
    S.routineDone.add(i);
    const rewarded = S.routineRewards < ROUTINE_DAILY_MAX;
    if (rewarded) S.routineRewards += 1;
    me(`${ROUTINES[i]} 했어요`);
    setBusy(true);
    if (!rewarded) {
      await say(`잘하셨어요! 기록했어요. 오늘 루틴 상자는 ${ROUTINE_DAILY_MAX}번을 다 받아서 이번엔 상자가 없어요 — 내일 또 받아요 🙂`, 400);
      toast(`오늘 루틴 상자는 다 받았어요 (하루 ${ROUTINE_DAILY_MAX}번)`);
      setBusy(false);
      return;
    }
    await say(`잘하셨어요! 루틴 보상으로 보물상자를 바로 드려요 🎁<small>오늘 루틴 상자 ${S.routineRewards}/${ROUTINE_DAILY_MAX}</small>`, 400);
    setBusy(false);
    await showChest('routine');
  }

  // ── 게이지·포인트 ───────────────────────────────────────────────
  const gaugeEl = $('#gauge');
  function drawGauge() {
    gaugeEl.querySelectorAll('.seg').forEach((s, i) => s.classList.toggle('on', i < S.gauge));
    gaugeEl.classList.toggle('full', S.gauge >= GAUGE_MAX);
    gaugeEl.setAttribute('aria-valuenow', String(S.gauge));
    gaugeEl.setAttribute('aria-valuetext', `질문 게이지 ${S.gauge}/${GAUGE_MAX}`);
  }
  function drawPoints() { $('#pointsNum').textContent = S.points.toLocaleString('ko-KR'); $('#shopPts').textContent = `보유 ${S.points.toLocaleString('ko-KR')}P`; }

  async function fillGauge() {
    S.gauge = Math.min(GAUGE_MAX, S.gauge + 1);
    drawGauge(); sfx.fill(S.gauge); floatAt(gaugeEl, `게이지 ${S.gauge}/${GAUGE_MAX}`);
    await hold(500);
    if (S.gauge >= GAUGE_MAX) { await showChest('gauge'); return; }
    if (S.tutorial) nextStep();
  }

  // ── 튜토리얼 단계 ───────────────────────────────────────────────
  // 0 → ① 추천 칩 누르기  1 → ② 직접 써서 보내기  2 → ③ 자유 질문  → 상자 → 상점 안내 → 핫팩 사기 → 끝
  async function nextStep() {
    if (S.act2) {
      if (S.act2Stage === 'routine') {
        const b = S.lastAskKey === 'routine' && S.lastRoutineCard && S.lastRoutineCard.querySelector('.rrow:not(.done) .btn');
        if (b) {
          S.act2Stage = 'routineDo';
          b.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
          await hold(300);
          coach({ target: b, text: '루틴을 하나 해 볼까요? [했어요]를 눌러 보세요', sub: '루틴은 하나 할 때마다 상자를 바로 줘요', pad: 4 });
        } else coachRoutineChip();
        return;
      }
      if (S.act2Stage === 'gauge') hintEl.textContent = `👇 ${GAUGE_MAX - S.gauge}번 더 물어보면 보너스 상자가 나와요`;
      return;
    }
    S.step += 1;
    if (S.step === 1) {
      await say('잘했어요! 게이지가 1칸 찼어요. 이번엔 <b>직접</b> 물어볼까요?', 400);
      coach({ target: $('#composer'), text: '여기에 직접 써서 보내 보세요', sub: '예: "물은 하루에 얼마나 마셔요?"', pad: 4,

      input.focus({ preventScroll: true });
    } else if (S.step === 2) {
      endCoach();
      await say('좋아요, 2칸! 마지막 한 번은 <b>자유롭게</b> 물어보세요. 칩을 눌러도 돼요.', 400);
      hintEl.textContent = '👇 한 번만 더 물어보면 게이지가 다 차요';

  }

  // ── 안내(코치마크) ──────────────────────────────────────────────
  const coachEl = $('#coach'), veil = $('#veil'), ring = $('#ring'), hand = $('#hand'), tip = $('#tip');
  let coachTarget = null, coachPad = 6, coachRaf = 0;
  function coach({ target, text, sub = '', pad = 6, actions = [] }) {
    if (!S.tutorial || !target) return; // 건너뛴 뒤 늦게 뜨는 안내는 띄우지 않는다
    coachTarget = target; coachPad = pad;
    $('#tipText').textContent = text; $('#tipSub').textContent = sub;
    const row = $('#tipRow'); row.innerHTML = '';
    actions.forEach(([label, fn]) => { const b = el('button', 'btn ghost', label); b.type = 'button'; b.style.minHeight = '36px'; b.style.fontSize = '13px'; b.onclick = fn; row.appendChild(b); });
    coachEl.hidden = false; $('#skip').hidden = false;
    cancelAnimationFrame(coachRaf);
    const track = () => { place(); coachRaf = requestAnimationFrame(track); };
    track();
  }
  function endCoach() { coachTarget = null; coachEl.hidden = true; cancelAnimationFrame(coachRaf); }
  function place() {
    if (!coachTarget) return;
    const r = coachTarget.getBoundingClientRect(), p = coachPad;
    const x1 = Math.max(0, r.left - p), y1 = Math.max(0, r.top - p), x2 = Math.min(innerWidth, r.right + p), y2 = Math.min(innerHeight, r.bottom + p);
    // 바깥을 돌고 안쪽을 반대로 돌면 안쪽이 뚫린다 — 뚫린 자리의 누르기만 아래 진짜 버튼에 닿는다
    veil.style.clipPath = `polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0, ${x1}px ${y1}px, ${x1}px ${y2}px, ${x2}px ${y2}px, ${x2}px ${y1}px, ${x1}px ${y1}px)`;
    Object.assign(ring.style, { left: x1 + 'px', top: y1 + 'px', width: (x2 - x1) + 'px', height: (y2 - y1) + 'px' });
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    const below = innerHeight - y2 > th + 70; // 아래에 자리가 있으면 아래(창 제목을 가리지 않게), 없으면 위
    const tx = Math.min(Math.max(12, (x1 + x2) / 2 - tw / 2), innerWidth - tw - 12);
    const ty = below ? y2 + 48 : y1 - th - 48;
    tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
    hand.textContent = below ? '👆' : '👇';
    hand.style.left = ((x1 + x2) / 2 - 17) + 'px';
    hand.style.top = (below ? y2 + 2 : y1 - 44) + 'px';
  }
  veil.addEventListener('click', () => { sfx.nope(); tip.classList.remove('nudge'); void tip.offsetWidth; tip.classList.add('nudge'); });
  $('#skip').onclick = () => {
    S.tutorial = false; S.shopIntro = true; S.act2 = false; S.act2Stage = null; afterBuy = null; setChips(); endCoach(); $('#skip').hidden = true; hintEl.textContent = '';
    sys('튜토리얼을 건너뛰었어요 — 질문 3번마다 보물상자가 나와요');
  };

  // ── 보물상자·룰렛 ───────────────────────────────────────────────
  // 상자를 열면 룰렛 횟수(1~3)를 먼저 정하고, 회차마다 결과를 쌓았다가 마지막에 합계를 한 번에 받는다
  const chestModal = $('#chestModal'), chestBtn = $('#chestBtn'), chestSvg = $('#chest'), sheet = chestModal.querySelector('.sheet');
  function pick(odds) {
    let n = Math.random() * 100;
    for (const [k, w] of Object.entries(odds)) { if ((n -= w) < 0) return k; }
    return Object.keys(odds)[0];
  }
  /** 튜토리얼 첫 상자는 1번(흐름을 단순하게), 두 번째 상자는 2번 확정(보너스 체험), 나머지는 확률 */
  const spinsFor = (source) => (S.tutorial ? (S.act2 && source === 'gauge' ? 2 : 1) : Number(pick(SPIN_ODDS)));
  function drawOdds() {
    const first = S.chests === 0;
    const o = first ? FIRST_ODDS : ODDS;
    const note = (t) => `<tr><td colspan="3" style="color:var(--sub);border:0">${t}</td></tr>`;
    $('#odds').innerHTML = '<tr><th>등급</th><th>확률</th><th>포인트</th></tr>' +
      Object.entries(TIERS).map(([k, t]) => `<tr><td>${t.name}</td><td>${o[k]}%</td><td>${t.points}P</td></tr>`).join('') +
      (first ? note('첫 상자의 첫 룰렛은 은 이상이 나와요') : '') +
      '<tr><th>룰렛 횟수</th><th>확률</th><th></th></tr>' +
      Object.entries(SPIN_ODDS).map(([n, w]) => `<tr><td>${n}번${n > 1 ? ' (보너스)' : ''}</td><td>${w}%</td><td></td></tr>`).join('') +
      (S.tutorial && S.act2 ? note('튜토리얼 보너스 상자(질문 게이지)는 2번 확정이에요') : '') +
      note(`루틴 상자: 루틴 하나에 1개, 하루 ${ROUTINE_DAILY_MAX}번까지 (오늘 ${S.routineRewards}번 받음)`);
  }
  $('#oddsBtn').onclick = () => { const t = $('#odds'), open = t.hidden; drawOdds(); t.hidden = !open; $('#oddsBtn').setAttribute('aria-expanded', String(open)); place(); };

  /** source: 'gauge'(질문 3번) | 'routine'(루틴 했어요) — 루틴 상자는 게이지를 비우지 않는다 */
  function showChest(source = 'gauge') {
    return new Promise((resolve) => {
      endCoach(); hintEl.textContent = '';
      chestSvg.classList.remove('open', 'bonus'); chestSvg.classList.add('shake'); sheet.classList.remove('bonus');
      chestBtn.hidden = false; chestBtn.disabled = false; $('#reelWrap').hidden = true; $('#result').hidden = true; $('#odds').hidden = true; $('#bonusBadge').hidden = true;
      const second = S.tutorial && S.act2 && source === 'gauge', routine = source === 'routine';
      $('#chestTitle').textContent = routine ? '루틴 보상 상자!' : second ? '두 번째 질문 상자예요!' : '보물상자가 나타났어요!';
      $('#chestSub').textContent = routine ? '루틴을 해냈어요. 상자를 눌러 열어 보세요.' : '질문 3번을 채웠어요. 상자를 눌러 열어 보세요.';
      chestModal.hidden = false; sfx.chest();
      chestBtn.focus({ preventScroll: true });
      if (S.tutorial) setTimeout(() => coach(second
        ? { target: chestBtn, text: '질문 상자를 열어 보세요', sub: '튜토리얼 선물 — 이번엔 룰렛을 2번 돌려요', pad: 2 }
        : routine ? { target: chestBtn, text: '루틴 상자를 열어 보세요', sub: '루틴 상자는 질문 게이지와 따로 받아요', pad: 2 }
        : { target: chestBtn, text: '상자를 눌러서 열어 보세요', sub: '동·은·금·다이아 중 하나가 나와요', pad: 2 }), 350);
      chestBtn.onclick = async () => {
        chestBtn.onclick = null; chestBtn.disabled = true; endCoach();
        sfx.tap(); chestSvg.classList.remove('shake'); chestSvg.classList.add('open');
        const firstChest = S.chests === 0, spins = spinsFor(source);
        S.chests += 1;
        if (source === 'gauge') { S.gauge = 0; drawGauge(); }
        await wait(500);
        if (spins > 1) await bonusIntro(spins);
        const results = [];
        for (let i = 0; i < spins; i++) {
          const tier = pick(firstChest && i === 0 ? FIRST_ODDS : ODDS);
          results.push(tier);
          await spin(tier, i, spins);
          drawTally(results, spins);
          if (i < spins - 1) await stepResult(tier, i, spins);
        }
        await claim(results, spins, source);
        resolve();
      };
    });
  }

  /** 보너스 상자 — 몇 번 돌리는지 먼저 크게 알린다 */
  async function bonusIntro(spins) {
    sheet.classList.add('bonus'); chestSvg.classList.add('bonus');
    const badge = $('#bonusBadge'); badge.textContent = `🎰 보너스 상자 · 룰렛 ${spins}번`; badge.hidden = false;
    $('#chestTitle').textContent = `보너스! 룰렛을 ${spins}번 돌려요`;
    $('#chestSub').textContent = spins === 3 ? '정말 드문 3번 상자예요!' : '가끔 나오는 보너스 상자예요!';
    sfx.win();
    const [x, y] = centerOf(chestSvg); confetti(x, y, 80, ['#ff5fd2', '#ffb84d', '#5fd8ff', '#ffffff']);
    await hold(1300);
  }

  const GEM = (k) => `<span class="gem ${k}"></span>`;
  async function spin(tier, i, n) {
    $('#chestTitle').textContent = n > 1 ? `룰렛 ${i + 1}/${n}` : '두근두근…';
    $('#chestSub').textContent = '무엇이 나올까요?';
    chestBtn.hidden = true; $('#result').hidden = true;
    const strip = $('#strip');
    // 지나가는 칸은 동이 가장 많고 다이아는 드물게 — 같은 등급이 붙어 나오지 않는 고정 무늬
    const PATTERN = ['bronze', 'silver', 'bronze', 'gold', 'bronze', 'silver', 'diamond', 'silver', 'bronze', 'gold'];
    const N = 34, stop = N - 4, off = Math.floor(Math.random() * PATTERN.length);
    const seq = Array.from({ length: N }, (_, k) => (k === stop ? tier : PATTERN[(k + off) % PATTERN.length]));
    if (seq[stop - 1] === tier) seq[stop - 1] = tier === 'bronze' ? 'silver' : 'bronze';
    if (seq[stop + 1] === tier) seq[stop + 1] = tier === 'bronze' ? 'gold' : 'bronze';
    strip.innerHTML = seq.map((k) => `<div class="tile">${GEM(k)}<span>${TIERS[k].name}</span></div>`).join('');
    strip.style.transition = 'none'; strip.style.transform = 'translateX(0)';
    $('#reelWrap').hidden = false;
    const reelW = strip.parentElement.clientWidth, tileW = 84 + 8;
    const end = -(stop * tileW + 42 - reelW / 2) + (Math.random() * 30 - 15);
    void strip.offsetWidth;
    if (reduce) { strip.style.transform = `translateX(${end}px)`; }
    else {
      strip.style.transition = 'transform 2.6s cubic-bezier(.12,.8,.18,1)';
      strip.style.transform = `translateX(${end}px)`;
      // 칸을 지날 때마다 딸깍 — 실제 위치를 읽어 감속과 맞춘다
      let last = 0, alive = true;
      const tickLoop = () => {
        if (!alive) return;
        const m = new DOMMatrixReadOnly(getComputedStyle(strip).transform);
        const idx = Math.floor(-m.m41 / tileW);
        if (idx !== last) { last = idx; sfx.tick(); }
        requestAnimationFrame(tickLoop);
      };
      requestAnimationFrame(tickLoop);
      await new Promise((r) => strip.addEventListener('transitionend', r, { once: true }));
      alive = false;
    }
    const t = TIERS[tier];
    $('#chestTitle').textContent = n > 1 ? `${i + 1}번째: ${t.name} 등급!` : `${t.name} 등급!`;
    $('#chestSub').textContent = tier === 'diamond' ? '대박! 가장 귀한 다이아예요 💎' : tier === 'gold' ? '반짝반짝, 금이에요!' : '축하해요!';

  }

  /** 회차 결과 줄 — 보너스 상자에서만 보인다. 아직 안 돌린 회차는 점선 칸 */

      return r ? `<span><i style="background:${TIERS[r].color}"></i>${TIERS[r].name} +${TIERS[r].points}P</span>` : `<span class="wait">${k + 1}번째</span>`;

      if (S.tutorial) setTimeout(() => coach({ target: ok, text: n > 1 ? `${n}번 결과를 한꺼번에 받아요` : '포인트를 받아요', pad: 4 }), 400);

  // ── 상점 ───────────────────────────────────────────────────────
  const ICON = {
    hotpack: `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 14 q4-6 0-10 M32 14 q4-6 0-10 M44 14 q4-6 0-10" stroke="#ff7a1a" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="12" y="18" width="40" height="40" rx="9" fill="#ff8a3d" stroke="#c44d00" stroke-width="2.5"/><rect x="18" y="26" width="28" height="18" rx="4" fill="#fff3e6"/><text x="32" y="39.5" font-size="11" font-weight="900" text-anchor="middle" fill="#c44d00" font-family="sans-serif">HOT</text><path d="M12 50 H52" stroke="#c44d00" stroke-width="2" stroke-dasharray="3 3"/></svg>`,

  const shopModal = $('#shopModal'), itemsEl = $('#items');
  function drawShop() {
    drawPoints();
    const bag = $('#bag');

    ITEMS.forEach((it) => {

      const card = el('div', 'item', `${ICON[it.id]}<b>${it.name}</b><span class="price">${it.price}P</span><span class="need">${short > 0 ? `${short}P 더 모으면 살 수 있어요` : ''}</span>`);

  }
  function openShop() {

  }
  function closeShop() { shopModal.hidden = true; endCoach(); $('#shopBtn').focus({ preventScroll: true }); }
  $('#shopBtn').onclick = () => { if (S.tutorial && S.step < 2 && !S.shopIntro) { toast('먼저 비서에게 질문해 보세요'); return; } openShop(); };
  $('#shopClose').onclick = () => { if (afterBuy) return sfx.nope(); closeShop(); };

  function buy(it, btn) {

    drawShop();

  }

  async function shopIntro() {
    await say('첫 포인트를 받았어요! 🎉 포인트로는 <b>상점</b>에서 물건을 살 수 있어요.', 300);
    const btn = $('#shopBtn'); btn.classList.add('new');
    coach({ target: btn, text: '상점을 열어 보세요', sub: '포인트로 살 수 있는 물건이 있어요', pad: 4 });
    await new Promise((r) => btn.addEventListener('click', r, { once: true }));
    await hold(350);
    if (!S.tutorial) return;
    const hot = itemsEl.querySelector('[data-id="hotpack"]');
    coach({ target: hot, text: '핫팩을 사 보세요', sub: `핫팩은 ${ITEMS[0].price}P예요`, pad: 4 });
    if (!S.tutorial) return;
    await new Promise((r) => { afterBuy = r; });
    if (!S.tutorial) return;
    coach({ target: $('#bag'), text: '산 물건은 가방에 쌓여요', sub: '', pad: 4, actions: [['알겠어요', () => { endCoach(); startAct2(); }]] });
  }
  /** 튜토리얼 2막 — 오늘 루틴 부르기 → [했어요] → 루틴 상자 → 남은 질문으로 보너스 상자(룰렛 2번 확정) */
  async function startAct2() {
    closeShop();
    if (!S.tutorial) return;
    S.act2 = true; S.act2Stage = 'routine';
    setChips();
    await say('잘했어요! 이번엔 <b>오늘 루틴</b>을 알려 드릴게요 📋', 300);
    await say('"오늘 루틴"이라고 부르면 할 일 카드가 와요. 루틴은 <b>하나 할 때마다 보물상자를 바로</b> 드려요(하루 5번까지).', 600);
    coachRoutineChip();
  }
  function coachRoutineChip() {
    const chip = chipsEl.querySelector('[data-key="routine"]');
    coach({ target: chip, text: '"오늘 루틴"을 불러 보세요', sub: '입력창에 직접 "오늘 루틴"이라고 써도 돼요', pad: 4, actions: [['직접 쓸게요', () => { endCoach(); input.focus(); }]] });
  }
  /** 루틴 상자를 받은 뒤 — 질문 게이지 상자로 넘어간다 */
  async function routineTaught() {
    S.act2Stage = 'gauge';
    await say('루틴 상자는 질문 게이지와 <b>따로</b>예요. 루틴 하나에 상자 하나, 하루 5번까지 받아요.', 300);
    await say(`질문 게이지 상자는 <b>가끔 룰렛을 2~3번</b> 돌리는 보너스 상자로 나와요. 질문 ${GAUGE_MAX - S.gauge}번을 더 채워서 열어 볼까요?`, 600);
    hintEl.textContent = `👇 ${GAUGE_MAX - S.gauge}번 더 물어보면 보너스 상자가 나와요`;
    setChips();
  }
  function finish() {
    closeShop();
    $('#doneModal').hidden = false; sfx.win();
    confetti(innerWidth / 2, innerHeight / 3, 90);
    $('#doneOk').focus({ preventScroll: true });
  }
  $('#doneOk').onclick = async () => { $('#doneModal').hidden = true; setChips(); await say('언제든 물어보세요. 질문 3번마다 보물상자가 또 나와요 🎁', 300); input.focus({ preventScroll: true }); };
  $('#restart').onclick = () => location.reload();

  // ── 시작 ───────────────────────────────────────────────────────
  drawGauge(); drawPoints();
  (async () => {
    setBusy(true);
    await say('안녕하세요! 저는 <b>AI 건강비서</b>예요 👋', 500);
    await say('질문할 때마다 위의 <b>게이지</b>가 한 칸씩 차요. 3칸을 다 채우면 선물이 있어요 🎁', 700);
    setChips(); setBusy(false);
    await hold(300);
    if (S.tutorial) coach({ target: chipsEl.querySelector('.chip'), text: '이걸 눌러 보세요', sub: '추천 질문을 누르면 바로 물어볼 수 있어요', pad: 4 });
  })();
})();
</script>
</body>
</html>
