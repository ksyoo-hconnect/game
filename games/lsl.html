<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>건강의 꽃을 피워라! – Invites Loop 온보딩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --stars:linear-gradient(transparent,transparent);
  --bg:#EEF1FB; --sky:#DCE3F8; --surface:#FFFFFF; --surface-2:#E6EBFA; --line:#CBD3EE;
  --ink:#13204A; --ink-soft:#56618A;
  --mint:#0E9E7C; --mint-a:rgba(14,158,124,.35); --on-mint:#FFFFFF;
  --lilac:#6E56DC; --on-lilac:#FFFFFF;
  --seed:#C27A31; --seed-a:rgba(194,122,49,.14); --seed-ink:#8A4F14;
  --coral:#C9503D;
  --leaf:#2F9B56; --pot:#9A6643; --pot-rim:#B47B54; --soil:#5A3D2A;
  --display:"Gowun Dodum","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stars:radial-gradient(1.3px 1.3px at 12% 18%, rgba(255,255,255,.75), transparent 60%),radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.6), transparent 60%),radial-gradient(1.5px 1.5px at 64% 34%, rgba(196,181,253,.7), transparent 60%),radial-gradient(1px 1px at 30% 62%, rgba(255,255,255,.5), transparent 60%),radial-gradient(1.3px 1.3px at 90% 70%, rgba(110,231,197,.6), transparent 60%),radial-gradient(1px 1px at 46% 90%, rgba(255,255,255,.45), transparent 60%),radial-gradient(1.2px 1.2px at 6% 80%, rgba(246,194,125,.55), transparent 60%);
    --bg:#0F1B3D; --sky:#1F3270; --surface:#172650; --surface-2:#203268; --line:#2E4180;
    --ink:#EEF2FF; --ink-soft:#A9B4D9;
    --mint:#6EE7C5; --mint-a:rgba(110,231,197,.4); --on-mint:#0F1B3D;
    --lilac:#C4B5FD; --on-lilac:#1A1446;
    --seed:#E9A15B; --seed-a:rgba(233,161,91,.16); --seed-ink:#F5C48F;
    --coral:#FF9B8A;
    --leaf:#55C77C; --pot:#7A4E33; --pot-rim:#946042; --soil:#3B281C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --stars:radial-gradient(1.3px 1.3px at 12% 18%, rgba(255,255,255,.75), transparent 60%),radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.6), transparent 60%),radial-gradient(1.5px 1.5px at 64% 34%, rgba(196,181,253,.7), transparent 60%),radial-gradient(1px 1px at 30% 62%, rgba(255,255,255,.5), transparent 60%),radial-gradient(1.3px 1.3px at 90% 70%, rgba(110,231,197,.6), transparent 60%),radial-gradient(1px 1px at 46% 90%, rgba(255,255,255,.45), transparent 60%),radial-gradient(1.2px 1.2px at 6% 80%, rgba(246,194,125,.55), transparent 60%);
  --bg:#0F1B3D; --sky:#1F3270; --surface:#172650; --surface-2:#203268; --line:#2E4180;
  --ink:#EEF2FF; --ink-soft:#A9B4D9;
  --mint:#6EE7C5; --mint-a:rgba(110,231,197,.4); --on-mint:#0F1B3D;
  --lilac:#C4B5FD; --on-lilac:#1A1446;
  --seed:#E9A15B; --seed-a:rgba(233,161,91,.16); --seed-ink:#F5C48F;
  --coral:#FF9B8A;
  --leaf:#55C77C; --pot:#7A4E33; --pot-rim:#946042; --soil:#3B281C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background:var(--stars), radial-gradient(900px 520px at 50% -12%, var(--sky) 0%, transparent 70%), var(--bg);background-color:var(--bg);
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{max-width:440px;margin:0 auto;min-height:100%;padding:14px 18px 28px;display:flex;flex-direction:column;overflow-x:clip}

/* Hub */
.topline{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",var(--body);font-weight:700;font-size:16px;letter-spacing:0}
.brand svg{color:var(--mint)}
.count{font-size:13px;color:var(--ink-soft);padding:5px 11px;border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;gap:8px;background:var(--surface)}
.segs{display:inline-flex;gap:3px}
.segs i{width:13px;height:5px;border-radius:3px;background:var(--line);transition:background .6s}
.segs i.on{background:linear-gradient(90deg,var(--mint),var(--lilac))}
.title{font-family:var(--display);font-weight:400;font-size:31px;line-height:1.2;margin:20px 0 6px}
.lede{color:var(--ink-soft);margin:0;font-size:15px}
.ring-wrap{position:relative;width:min(100%,330px);aspect-ratio:1;margin:18px auto 34px}
.ring-wrap svg.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1}
.comet circle{filter:drop-shadow(0 0 5px #6EE7C5)}
.base{fill:none;stroke:var(--line);stroke-width:5}
.arc{fill:none;stroke:url(#gArc);stroke-width:6;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.1s cubic-bezier(.6,0,.3,1)}
.arc.lit{stroke-dashoffset:0}
.instant .arc{transition:none}
.orbit{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-dasharray:7 93;opacity:0;filter:drop-shadow(0 0 6px var(--mint))}
.orbit.on{opacity:1;animation:orbit 1.5s linear 2 forwards}
@keyframes orbit{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
.node{position:absolute;z-index:3;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink-soft);display:grid;place-items:center;font:600 16px var(--body);cursor:pointer;padding:0;transition:background .4s,border-color .4s,color .4s}
.node .cap{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:500;color:var(--ink-soft)}
.node.active{border-color:var(--mint);color:var(--mint);background:var(--surface-2);animation:pulse 2.2s infinite}
.node.done{background:var(--mint);border-color:var(--mint);color:var(--on-mint);box-shadow:0 0 20px -2px var(--mint-a)}
.node.active::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px dashed var(--mint);opacity:.75;animation:spin 9s linear infinite;pointer-events:none}
.node.locked{cursor:not-allowed}
.node.locked .lk{display:grid;place-items:center;gap:0;line-height:1;font-size:11px}
.node .ni{display:grid;place-items:center;line-height:0}
.node.locked .ni svg:first-child{opacity:.45}
.nb{position:absolute;top:-3px;right:-3px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--bg);line-height:0}
.nb.ok{background:var(--surface);color:var(--mint)}
.nb.lockb{background:var(--surface-2);color:var(--ink-soft)}
.inode{color:var(--mint)}
.inode svg{width:22px;height:22px}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--mint-a)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.center{position:absolute;inset:23%;z-index:2;border:0;background:none;padding:0;border-radius:50%;cursor:pointer;display:block;-webkit-tap-highlight-color:transparent}
span.center{cursor:default}
.center svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 var(--glow,0px) var(--mint-a));transition:filter 1s}
.center::after{content:"";position:absolute;inset:-25%;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,.95), rgba(110,231,197,.45) 32%, transparent 66%);opacity:0;pointer-events:none}
.center.flash::after{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0;transform:scale(.3)}18%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
.center.tap svg{animation:tap .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes tap{40%{transform:scale(1.1)}}
.fx{position:absolute;left:-10%;top:-10%;width:120%;height:120%;pointer-events:none;z-index:0}
.fx.fill{left:0;top:0;width:100%;height:100%}
.rays{position:absolute;inset:6%;border-radius:50%;z-index:0;pointer-events:none;opacity:var(--rays,0);transition:opacity 1.2s;background:repeating-conic-gradient(from 0deg, transparent 0deg 7deg, rgba(110,231,197,.22) 9deg 11deg, transparent 13deg 22.5deg);-webkit-mask-image:radial-gradient(circle, #000 12%, transparent 66%);mask-image:radial-gradient(circle, #000 12%, transparent 66%);animation:spin 46s linear infinite}
.rays.b{animation-direction:reverse;animation-duration:70s;background:repeating-conic-gradient(from 11deg, transparent 0deg 15deg, rgba(196,181,253,.2) 17deg 19deg, transparent 21deg 30deg)}
.aura{position:absolute;inset:18%;border-radius:50%;z-index:0;pointer-events:none;opacity:var(--aura,0);transition:opacity 1.2s;background:radial-gradient(circle, rgba(110,231,197,.42), rgba(168,139,245,.22) 45%, transparent 70%);animation:aura 7s ease-in-out infinite}
@keyframes aura{0%,100%{transform:scale(.92);filter:hue-rotate(0deg)}50%{transform:scale(1.08);filter:hue-rotate(50deg)}}
.halo circle{fill:none;stroke-width:1.4;opacity:0;animation:halo 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.halo circle:nth-child(2){animation-delay:1.2s}.halo circle:nth-child(3){animation-delay:2.4s}
@keyframes halo{0%{transform:scale(.55);opacity:.75}100%{transform:scale(2.1);opacity:0}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.center.arrive svg{animation:arrive .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes arrive{from{transform:translateY(-26px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.tw{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glint{opacity:0;animation:glint 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 3px #6EE7C5)}
@keyframes glint{0%,100%{opacity:0;transform:scale(0) rotate(0deg)}9%{opacity:1;transform:scale(1) rotate(35deg)}20%{opacity:0;transform:scale(.15) rotate(80deg)}}
.tw:nth-of-type(2n){animation-delay:.6s}
@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
.spin{animation:spin 9s linear infinite;transform-origin:100px 100px}
@keyframes spin{to{transform:rotate(360deg)}}
.breathe{animation:breathe 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{50%{opacity:.6;transform:scale(.94)}}

.next-card{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,var(--mint),var(--lilac) 60%,var(--seed)) border-box;border:1.5px solid transparent;border-radius:22px;padding:18px 18px 16px;box-shadow:0 18px 40px -24px var(--mint-a)}
.next-card .eyebrow{margin:0;font-size:13px;color:var(--mint);font-weight:600}
.next-card h2{font-family:var(--display);font-weight:400;font-size:23px;margin:2px 0 4px;line-height:1.3}
.next-card p.d{margin:0 0 14px;color:var(--ink-soft);font-size:15px}
.btn{font:600 16px var(--body);border-radius:14px;padding:13px 18px;border:0;cursor:pointer;min-height:50px;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.primary{background:linear-gradient(135deg,var(--mint),color-mix(in srgb,var(--mint) 60%,var(--lilac)));color:var(--on-mint);box-shadow:0 8px 20px -10px var(--mint-a)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.link{background:none;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;min-height:44px}
.block{width:100%;display:block}
.row{display:flex;gap:8px}
.row .btn{flex:1}
details.tools{margin-top:22px;color:var(--ink-soft);font-size:14px}
details.tools summary{cursor:pointer;padding:6px 0}
details.tools .row{margin-top:8px;flex-wrap:wrap}
details.tools .btn{font-size:14px;min-height:42px;padding:8px 10px;flex:1 1 40%}

/* Stage shell */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0;margin:-14px 0 4px;background:var(--bg)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.bar-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.bar-title small{color:var(--mint);font-weight:600;font-size:12px}
.bar-title strong{font-family:var(--display);font-weight:400;font-size:19px}
.demo-tag{font-size:11px;color:var(--ink-soft);border:1px dashed var(--line);border-radius:6px;padding:2px 6px;flex:none}
.stage{flex:1;display:flex;flex-direction:column}
.hint{color:var(--ink-soft);font-size:14px;margin:4px 0 12px}

/* Stage 1 chat */
.chat{display:flex;flex-direction:column;gap:12px;padding:6px 0 14px;flex:1}
.ai-row{display:flex;gap:8px;align-items:flex-start;max-width:92%}
.av{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--mint);margin-top:2px;font-size:11px;font-weight:700}
.msg{padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.55;animation:in .3s ease}
.msg.ai{background:var(--surface);border:1px solid var(--line);border-top-left-radius:6px}
.msg.me{background:var(--lilac);color:var(--on-lilac);align-self:flex-end;border-top-right-radius:6px;max-width:80%}
.msg.sys{align-self:center;font-size:13px;color:var(--ink-soft);background:none;padding:2px}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.quote{margin:8px 0 2px;padding:9px 12px;border-left:3px solid var(--seed);background:var(--seed-a);border-radius:4px 10px 10px 4px;font-family:var(--display);font-size:16px}
.clue{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--seed-a);color:var(--seed-ink)}
.bars{display:flex;align-items:flex-end;gap:3px;height:62px;margin-top:10px}
.bars span{flex:1;height:calc(var(--h) * 100%);background:var(--ink-soft);opacity:.35;border-radius:3px 3px 0 0}
.bars span.low{background:var(--seed);opacity:1}
.bars-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:4px}
.clues ul{margin:6px 0 0;padding-left:18px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.25;transform:translateY(-3px)}}
.dock{position:sticky;bottom:0;padding:14px 0 6px;background:linear-gradient(to bottom, transparent, var(--bg) 22%)}
.dock-label{font-size:13px;color:var(--ink-soft);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--mint);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:999px;font:500 15px var(--body);cursor:pointer;min-height:44px;text-align:left}
.chip:disabled{opacity:.4;border-color:var(--line);cursor:not-allowed}
.chips.answers{flex-direction:column}
.chips.answers .chip{border-radius:14px;width:100%;border-color:var(--line)}
.chip.wrong{border-color:var(--coral);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,12,30,.55);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.sheet{width:100%;max-width:440px;max-height:92%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .3s}
.scrim.open .sheet{transform:none}
.sheet h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.3;margin:4px 0 8px}
.sheet p{margin:0 0 14px;color:var(--ink-soft)}
.sheet .art{width:150px;height:150px;margin:0 auto 6px;display:block}
.sheet .center-t{text-align:center}
.mini-chat{display:flex;flex-direction:column;gap:8px;margin:0 0 10px;min-height:0}
.composer{display:flex;gap:8px;align-items:center;margin:8px 0 16px;padding:6px 6px 6px 14px;border:1.5px solid var(--mint);border-radius:999px;background:var(--bg)}
.composer input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:400 16px var(--body);padding:8px 0}
.composer input:focus{outline:none}
.composer:focus-within{box-shadow:0 0 0 3px var(--mint-a)}
.composer .icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2)}
.composer .icon-btn.send{background:var(--mint);color:var(--on-mint)}
.composer.morph{animation:morph .6s ease}
@keyframes morph{from{transform:scaleX(.6);opacity:0}}

/* Stage 2 map */
.map{position:relative;aspect-ratio:1/1.02;border-radius:24px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.map svg.roads{position:absolute;inset:0;width:100%;height:100%}
.road{fill:none;stroke:var(--surface-2);stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.road-dash{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 6}
.place{position:absolute;transform:translate(-50%,-50%);border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;min-width:64px}
.place .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:var(--bg);border:1.5px solid var(--line);transition:border-color .2s}
.place:hover .ic{border-color:var(--mint)}
.place .nm{font-size:13px;font-weight:600}
.place.home{cursor:default}
.place.home .ic{border-style:dashed}
.place:disabled{cursor:default}
.parcel{position:absolute;width:52px;height:52px;transform:translate(-50%,-50%);transition:left .9s cubic-bezier(.5,0,.3,1),top .9s cubic-bezier(.5,0,.3,1);pointer-events:none;z-index:2}
.parcel svg{width:100%;height:100%;overflow:visible}
.parcel .lid{transition:transform .5s;transform-origin:8px 18px}
.parcel.open .lid{transform:rotate(-70deg)}
.parcel .pseed{transition:transform .6s .2s;transform:translateY(8px)}
.parcel.open .pseed{transform:translateY(-14px)}
.bubble{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:14px;padding:8px 14px;border-radius:12px;white-space:nowrap;animation:in .25s;z-index:3}
.summary{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;animation:unfold .6s ease}
@keyframes unfold{from{opacity:0;transform:translateY(16px) scaleY(.9)}}
.summary header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface-2);font-size:13px;color:var(--ink-soft)}
.summary header strong{color:var(--ink);font-size:15px}
.summary dl{margin:0;padding:6px 16px 4px}
.summary dl div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.summary dl div:last-child{border:0}
.summary dt{color:var(--ink-soft)}
.summary dd{margin:0}
.summary .foot{padding:10px 16px 14px;font-size:12px;color:var(--ink-soft)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;vertical-align:1px;margin-left:4px}
.tag.ai{background:rgba(196,181,253,.25);color:var(--lilac)}
.tag.md{background:var(--mint-a);color:var(--ink)}

/* Stage 3 video */
.video{position:relative;aspect-ratio:4/5;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.scene{position:absolute;inset:0;padding:18px;opacity:0;transition:opacity .6s;display:flex;flex-direction:column;gap:10px}
.scene.on{opacity:1}
.scr-head{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);padding-bottom:8px;border-bottom:1px solid var(--line)}
.pcard{background:var(--bg);border-radius:16px;padding:14px;border:1px solid var(--line)}
.pcard h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:20px}
.line{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:7px 0;border-top:1px dashed var(--line)}
.scene.on .rise{animation:in .5s both}
.scene.on .rise:nth-child(2){animation-delay:.5s}.scene.on .rise:nth-child(3){animation-delay:1s}.scene.on .rise:nth-child(4){animation-delay:1.5s}
.chk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.scene.on .chk{animation:fillchk .3s both}
.scene.on li:nth-child(1) .chk{animation-delay:1.4s}.scene.on li:nth-child(2) .chk{animation-delay:2.1s}.scene.on li:nth-child(3) .chk{animation-delay:2.8s}
@keyframes fillchk{to{background:var(--mint);border-color:var(--mint);color:var(--on-mint)}}
.scene ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.scene li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.scene li span.t{flex:1}
.stamp{align-self:flex-end;border:2px solid var(--mint);color:var(--mint);font-weight:600;padding:4px 12px;border-radius:8px;transform:rotate(-6deg);opacity:0}
.scene.on .stamp{animation:stamp .4s 2.6s both}
@keyframes stamp{from{opacity:0;transform:rotate(-6deg) scale(1.6)}to{opacity:1;transform:rotate(-6deg) scale(1)}}
.journey{flex:1;position:relative}
.journey svg{width:100%;height:100%}
.travel{transform:translateX(0)}
.scene.on .travel{animation:travel 3.4s .3s ease-in-out both}
@keyframes travel{to{transform:translateX(196px)}}
.caption{min-height:52px;margin:12px 2px 6px;font-size:15px}
.vctrl{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--mint)}
.guide{margin-top:14px;padding:16px;border-left:3px solid var(--mint);background:var(--surface);border-radius:6px 16px 16px 6px;animation:in .4s}
.guide strong{display:block;font-family:var(--display);font-weight:400;font-size:19px;margin-bottom:4px}
.guide p{margin:0;color:var(--ink-soft);font-size:15px}

/* Stage 4 garden */
.garden{position:relative;height:300px;border-radius:24px;background:var(--surface);border:1px solid var(--line);overflow:hidden;touch-action:none}
.garden svg.plant{position:absolute;left:50%;bottom:0;width:260px;height:260px;transform:translateX(-50%);overflow:visible}
.garden svg.plant .grow{animation:grow .8s cubic-bezier(.3,1.3,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes grow{from{transform:scale(.3);opacity:0}}
.floatseed{position:absolute;left:50%;top:22px;width:72px;height:72px;margin-left:-36px;z-index:2;pointer-events:none;animation:bob 2.4s ease-in-out infinite}
.floatseed svg{width:100%;height:100%;overflow:visible}
.floatseed.drop{animation:seeddrop .75s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes bob{50%{translate:0 -6px}}
@keyframes seeddrop{0%{transform:translateY(-8px) scale(1.05)}100%{transform:translateY(150px) scale(.45);opacity:.2}}
.can{position:absolute;left:calc(50% + 14px);top:46px;width:120px;height:90px;z-index:3;pointer-events:none;transform-origin:20% 60%;transform:translate(54px,152px) scale(.72)}
.can-ic{display:block;width:36px;height:27px}
.can-ic svg{width:100%;height:100%;display:block}
.can svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.can.on{animation:can 3.2s ease-in-out forwards}
@keyframes can{0%{transform:translate(54px,152px) scale(.72) rotate(0)}18%{transform:translate(0,0) scale(1) rotate(0)}28%,76%{transform:translate(0,0) scale(1) rotate(-32deg)}100%{transform:translate(54px,152px) scale(.72) rotate(0)}}
.stream{position:absolute;left:calc(50% + 9px);top:86px;width:5px;height:132px;margin-left:-2px;border-radius:3px;z-index:3;pointer-events:none;background:repeating-linear-gradient(to bottom, rgba(124,200,255,.95) 0 9px, rgba(190,230,255,.45) 9px 14px);background-size:100% 14px;transform-origin:top;transform:scaleY(0);opacity:0;transition:transform .35s ease-in, opacity .3s;animation:pour .35s linear infinite;box-shadow:0 0 8px rgba(124,200,255,.7)}
.stream.on{transform:scaleY(1);opacity:1}
@keyframes pour{to{background-position:0 14px}}
.splash{position:absolute;left:calc(50% + 9px);top:218px;width:20px;height:6px;margin:-3px 0 0 -10px;border:2px solid rgba(124,200,255,.9);border-radius:50%;z-index:3;pointer-events:none;animation:splash .8s ease-out forwards}
@keyframes splash{from{transform:scale(.3);opacity:1}to{transform:scale(3.2);opacity:0}}
.wbadge{position:absolute;left:12px;top:12px;z-index:4;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(124,200,255,.18);color:var(--ink);border:1px solid rgba(124,200,255,.55);opacity:0;transform:translateY(-6px);transition:opacity .3s, transform .3s}
.wbadge.on{opacity:1;transform:none}
.garden .soil{transition:fill 1s}
.garden.wet .soil{fill:#24160D}
.drop{position:absolute;width:6px;height:9px;margin-left:-3px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#7CC8FF;box-shadow:0 0 6px rgba(124,200,255,.8);z-index:3;pointer-events:none;opacity:0;animation:fall .6s ease-in forwards}
@keyframes fall{0%{opacity:0;transform:translateY(0)}12%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(128px)}}
.garden.bloomflash::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.92), rgba(110,231,197,.4) 30%, transparent 66%);animation:flash 1.3s ease-out forwards;pointer-events:none;z-index:4}
@keyframes fade{50%{opacity:.35}}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.item{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 13px var(--body);min-height:96px;text-align:center;line-height:1.3}
.item .em{font-size:26px;line-height:1}
.item small{font-weight:400;color:var(--ink-soft);font-size:11px}
.item.ready{border-color:var(--mint);animation:pulse 2.2s infinite}
.item.used{background:var(--surface-2);border-color:var(--surface-2)}
.item:disabled{cursor:not-allowed}
.item:disabled:not(.used){opacity:.45}
.note{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;min-height:48px;animation:in .3s}
.note b{color:var(--mint)}

/* Ending */
.ending{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding-top:10px}
.ending .ring-wrap{margin:6px auto 22px}
.ring-logo{position:absolute;left:50%;top:79%;transform:translateX(-50%);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",var(--body);font-weight:700;font-size:15px;letter-spacing:0;white-space:nowrap;opacity:0;transition:opacity .8s;z-index:3}
.ring-logo svg{color:var(--mint)}
.ring-logo.on{opacity:1}
.end-copy{opacity:0;transform:translateY(10px);transition:opacity .8s,transform .8s}
.end-copy.on{opacity:1;transform:none}
.end-copy .em{font-size:34px}
.end-copy h2{font-family:var(--display);font-weight:400;font-size:30px;margin:4px 0 2px}
.end-copy p{color:var(--ink-soft);margin:0 auto 6px;max-width:30ch}
.end-copy .btn.primary{margin-top:16px}

/* Intro */
.intro{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);background:var(--stars), radial-gradient(700px 520px at 50% 38%, var(--sky), transparent 70%), var(--bg);background-color:var(--bg);transition:opacity .6s, transform .6s}
.intro.out{opacity:0;transform:scale(1.06);pointer-events:none}
.stagewrap{position:relative;width:min(76vw,290px);aspect-ratio:1}
.iring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1}
.iarc{fill:none;stroke:url(#gArc);stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;filter:drop-shadow(0 0 6px #6EE7C5)}
.intro.play .iarc{animation:draw 1.3s cubic-bezier(.6,0,.3,1) 1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.inode{position:absolute;z-index:3;transform:translate(-50%,-50%) scale(0);width:46px;height:46px;border-radius:50%;background:var(--surface);border:2px solid var(--mint);display:grid;place-items:center;font:700 13px var(--body);color:var(--ink);box-shadow:0 0 16px -2px var(--mint-a)}
.intro.play .inode{animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}
.icenter{position:absolute;inset:22%;z-index:2}
.icenter svg{width:100%;height:100%;overflow:visible}
.icenter g{transform-box:fill-box;transform-origin:center}
.ispark{opacity:0}
.intro.play .ispark{animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:scale(0);opacity:0}30%{transform:scale(1.5);opacity:1}100%{transform:scale(.2);opacity:0}}
.iseed,.ibloom{opacity:0}
.intro.play .iseed{animation:seedin .6s cubic-bezier(.3,1.6,.5,1) .4s both, seedout .35s ease-in 2.45s forwards}
@keyframes seedin{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes seedout{to{transform:scale(1.3);opacity:0}}
.intro.play .ibloom{animation:bloomin .9s cubic-bezier(.3,1.4,.5,1) 2.5s both}
@keyframes bloomin{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.iflash{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,.95), rgba(110,231,197,.45) 32%, transparent 66%);opacity:0;pointer-events:none}
.intro.play .iflash{animation:flash 1.1s ease-out 2.45s both}
.intro.still .iarc{stroke-dashoffset:0}
.intro.still .inode{transform:translate(-50%,-50%) scale(1)}
.intro.still .ibloom,.intro.still .ititle{opacity:1}
.intro.still .iseed,.intro.still .ispark{opacity:0}
.ititle{text-align:center;margin-top:26px;opacity:0}
.intro.play .ititle{animation:rise .7s ease-out 2.9s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ilogo{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",var(--body);font-weight:700;font-size:15px;color:var(--ink-soft);letter-spacing:0}
.ititle h1{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.2;margin:6px 0 4px}
.ititle p{margin:0;color:var(--ink-soft);font-size:15px}
.iskip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:4;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font:500 14px var(--body);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;transition:.3s;z-index:60;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
/* ===== Cute colorful theme ===== */
:root{
  --bg:#FBF7FF; --sky:#EADFFF; --surface:#FFFFFF; --surface-2:#F3EEFF; --line:#E4DAF7;
  --ink:#2B2350; --ink-soft:#6F6894;
  --mint:#16A97A; --mint-a:rgba(22,169,122,.35); --on-mint:#FFFFFF;
  --lilac:#8460F0; --on-lilac:#FFFFFF;
  --c0:#F2694F; --c1:#2E93E6; --c2:#8460F0; --c3:#1FA866;
  --blobs:radial-gradient(520px 360px at -10% 0%, #FFE1D8 0, transparent 62%),radial-gradient(520px 380px at 110% 8%, #DCEBFF 0, transparent 62%),radial-gradient(640px 460px at 50% 105%, #DDF8E8 0, transparent 62%),radial-gradient(480px 340px at 100% 70%, #FFE3F3 0, transparent 60%);
  --display:"Jua","Gowun Dodum","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --shadow:0 12px 28px -16px rgba(132,96,240,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1745; --sky:#3A2E86; --surface:#2A2360; --surface-2:#352C74; --line:#4A3F92;
    --ink:#F7F4FF; --ink-soft:#C3BBEA;
    --mint:#5BE6B5; --mint-a:rgba(91,230,181,.4); --on-mint:#1C1745;
    --lilac:#C6B4FF; --on-lilac:#1C1745;
    --c0:#FF8F78; --c1:#5DB8F5; --c2:#A98BFF; --c3:#3FCF85;
    --blobs:radial-gradient(520px 360px at -10% 0%, rgba(255,140,120,.22) 0, transparent 62%),radial-gradient(520px 380px at 110% 8%, rgba(108,198,255,.22) 0, transparent 62%),radial-gradient(640px 460px at 50% 105%, rgba(95,226,158,.18) 0, transparent 62%),radial-gradient(480px 340px at 100% 70%, rgba(255,140,200,.16) 0, transparent 60%);
    --shadow:0 14px 30px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1C1745; --sky:#3A2E86; --surface:#2A2360; --surface-2:#352C74; --line:#4A3F92;
  --ink:#F7F4FF; --ink-soft:#C3BBEA;
  --mint:#5BE6B5; --mint-a:rgba(91,230,181,.4); --on-mint:#1C1745;
  --lilac:#C6B4FF; --on-lilac:#1C1745;
  --c0:#FF8F78; --c1:#5DB8F5; --c2:#A98BFF; --c3:#3FCF85;
  --blobs:radial-gradient(520px 360px at -10% 0%, rgba(255,140,120,.22) 0, transparent 62%),radial-gradient(520px 380px at 110% 8%, rgba(108,198,255,.22) 0, transparent 62%),radial-gradient(640px 460px at 50% 105%, rgba(95,226,158,.18) 0, transparent 62%),radial-gradient(480px 340px at 100% 70%, rgba(255,140,200,.16) 0, transparent 60%);
  --shadow:0 14px 30px -16px rgba(0,0,0,.6);
}
body{background:var(--stars), var(--blobs), var(--bg);background-color:var(--bg);background-attachment:fixed}
.title{font-size:34px;margin-top:18px}
.count{border:0;background:var(--surface);box-shadow:var(--shadow);font-family:var(--display);font-size:14px}
.segs i{width:14px;height:7px}
.segs i:nth-child(1).on{background:var(--c0)}.segs i:nth-child(2).on{background:var(--c1)}.segs i:nth-child(3).on{background:var(--c2)}.segs i:nth-child(4).on{background:var(--c3)}
.base{stroke:var(--line);stroke-width:6;stroke-dasharray:.1 14;stroke-linecap:round}
.arc{stroke-width:9}
#arc0{stroke:url(#gA0)}#arc1{stroke:url(#gA1)}#arc2{stroke:url(#gA2)}#arc3{stroke:url(#gA3)}
.node{width:64px;height:64px;border:3px solid color-mix(in srgb,var(--nc) 40%,transparent);background:color-mix(in srgb,var(--nc) 14%,var(--surface));color:var(--nc);box-shadow:var(--shadow)}
.node .cap{font-family:var(--display);font-weight:400;font-size:14px;color:var(--nc);top:calc(100% + 6px)}
.node.active{background:var(--surface);border-color:var(--nc);color:var(--nc);animation:pulseC 2.2s infinite}
@keyframes pulseC{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--nc) 45%,transparent)}70%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}
.node.active::before{border-color:var(--nc)}
.node.done{background:var(--nc);border-color:var(--surface);color:#fff;box-shadow:0 8px 18px -6px color-mix(in srgb,var(--nc) 75%,transparent)}
.nb{border-color:var(--surface)}
.nb.ok{background:#fff;color:var(--nc)}
.node.locked .ni svg:first-child{opacity:.55}
.deco i{position:absolute;z-index:1;font-style:normal;font-size:24px;line-height:1;animation:bobble 4s ease-in-out infinite;pointer-events:none}
.deco i:nth-child(1){top:1%;left:1%}
.deco i:nth-child(2){top:3%;right:2%;animation-delay:1s}
.deco i:nth-child(3){bottom:7%;left:3%;animation-delay:2s}
.deco i:nth-child(4){bottom:5%;right:4%;animation-delay:1.5s}
@keyframes bobble{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-8px) rotate(8deg)}}
.next-card{background:color-mix(in srgb,var(--nc,var(--mint)) 10%,var(--surface));border:2px solid color-mix(in srgb,var(--nc,var(--mint)) 35%,transparent);border-radius:28px;box-shadow:var(--shadow)}
.next-card .eyebrow{color:var(--nc,var(--mint));font-family:var(--display);font-weight:400;font-size:15px}
.next-card h2{font-size:26px}
.btn{font-family:var(--display);font-weight:400;font-size:19px;border-radius:999px;min-height:54px;transition:transform .12s, box-shadow .12s}
.primary{--bc:var(--nc,var(--mint));background:var(--bc);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.15);box-shadow:0 5px 0 color-mix(in srgb,var(--bc) 62%,#000)}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--bc) 62%,#000)}
.ghost{border-width:2px;background:var(--surface)}
.link{font-size:16px}
.bar-title small{align-self:flex-start;background:color-mix(in srgb,var(--nc) 16%,var(--surface));color:var(--nc);padding:2px 10px;border-radius:999px;font-family:var(--display);font-weight:400;font-size:13px}
.bar-title strong{font-size:22px}
.icon-btn{border-radius:16px;border-width:2px}
.demo-tag{border-radius:999px}
.msg{border-radius:20px}
.msg.ai{border:2px solid color-mix(in srgb,var(--nc,var(--mint)) 28%,transparent)}
.msg.me{background:var(--nc,var(--lilac));color:#fff}
.av{background:var(--nc,var(--mint));color:#fff;font-family:var(--display);font-weight:400;font-size:12px}
.chip{border:2px solid color-mix(in srgb,var(--nc,var(--mint)) 55%,transparent);background:color-mix(in srgb,var(--nc,var(--mint)) 8%,var(--surface));font-family:var(--display);font-weight:400;font-size:16px}
.chips.answers .chip{border-color:color-mix(in srgb,var(--nc,var(--mint)) 35%,transparent)}
.clue{background:color-mix(in srgb,var(--c0) 16%,var(--surface));color:var(--ink);font-family:var(--display);font-weight:400}
.bars span.low{background:var(--c0)}
.quote{border-left-color:var(--c0)}
.map{border-radius:28px;border:2px solid var(--line);background:linear-gradient(160deg, color-mix(in srgb,var(--c3) 12%,var(--surface)), color-mix(in srgb,var(--c1) 12%,var(--surface)))}
.road{stroke:var(--surface)}
.place .ic{border-radius:20px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow)}
.place .nm{font-family:var(--display);font-weight:400;font-size:15px}
.summary,.video,.note,.pcard{border-radius:24px}
.summary{border:2px solid color-mix(in srgb,var(--nc,var(--mint)) 30%,transparent)}
.prog{height:8px}
.prog i{background:linear-gradient(90deg,var(--c0),var(--c1),var(--c2),var(--c3))}
.guide{border-left-color:var(--nc,var(--mint));border-radius:8px 20px 20px 8px}
.guide strong{font-size:20px}
.garden{border-radius:28px;border:2px solid var(--line);background:linear-gradient(to bottom, color-mix(in srgb,var(--c1) 16%,var(--surface)) 0%, var(--surface) 78%)}
.garden::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-6px;height:44px;background:color-mix(in srgb,var(--c3) 32%,var(--surface));border-radius:50% 50% 0 0;z-index:0}
.item{border-radius:22px;font-family:var(--display);font-weight:400;font-size:16px;background:color-mix(in srgb,var(--ic) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--ic) 40%,transparent)}
.item:nth-child(1){--ic:#F29A4A}.item:nth-child(2){--ic:#3FA9F5}.item:nth-child(3){--ic:#F06BAE}
.item small{font-family:var(--body);font-size:11px}
.item.ready{border-color:var(--ic);animation:pulseI 2.2s infinite}
@keyframes pulseI{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ic) 45%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.item.used{background:color-mix(in srgb,var(--ic) 26%,var(--surface));border-color:transparent}
.note{border:2px solid color-mix(in srgb,var(--nc,var(--mint)) 28%,transparent)}
.note b{color:var(--nc,var(--mint))}
.sheet{border-radius:32px 32px 0 0}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 14px}
.sheet h2{font-size:27px}
.toast{border-radius:999px;font-family:var(--display);font-weight:400;font-size:15px}
.intro{background:var(--stars), var(--blobs), radial-gradient(700px 520px at 50% 38%, var(--sky), transparent 70%), var(--bg)}
.intro .inode{background:var(--nc);color:#fff;border:3px solid var(--surface);width:50px;height:50px}
.ititle h1{font-size:36px}
.iskip{font-family:var(--display);font-size:15px;border-width:2px}
.end-copy h2{font-size:34px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .primary, :root:not([data-theme="light"]) .msg.me{color:#1C1745;text-shadow:none}
}

/* ---------- particle fx ---------- */
function createFX(host, opts={}){
  const cv = document.createElement('canvas');
  cv.className = 'fx' + (opts.fill ? ' fill' : '');
  cv.setAttribute('aria-hidden','true');
  host.prepend(cv);
  const ctx = cv.getContext('2d');
  const root = document.documentElement;
  const dark = root.dataset.theme === 'dark' || (root.dataset.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  const COLS = dark ? ['110,231,197','196,181,253','255,156,134','108,198,255','255,143,200','255,214,102','255,255,255'] : ['242,105,79','46,147,230','226,90,160','240,170,30','31,168,102','132,96,240'];
  const oy = opts.oy == null ? .5 : opts.oy;
  let W=0, H=0, level=0, acc=0, raf=0, alive=true;
  const P = [];
  function size(){ const r = cv.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio || 1); W = r.width; H = r.height; cv.width = Math.max(1, W*dpr); cv.height = Math.max(1, H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); }
  size();
  const ro = 'ResizeObserver' in window ? new ResizeObserver(size) : null; if (ro) ro.observe(cv);
  const R = Math.random;
  function add(burst){
    const cx = W/2, cy = H*oy, c = COLS[(R()*COLS.length)|0];
    if (burst){ const an = R()*Math.PI*2, sp = 1.2 + R()*4; P.push({x:cx, y:cy, vx:Math.cos(an)*sp, vy:Math.sin(an)*sp, life:0, max:45+R()*45, r:1.2+R()*2.6, c, b:1, t:R()*6}); }
    else { const an = R()*Math.PI*2, rad = Math.min(W,H)*(.06+R()*.16); P.push({x:cx+Math.cos(an)*rad, y:cy+Math.sin(an)*rad*.7+H*.04, vx:(R()-.5)*.35, vy:-(.2+R()*.55)*(1+level*.15), life:0, max:90+R()*110, r:(.7+R()*1.6)*(1+level*.18), c, b:0, t:R()*6}); }
  }
  function frame(){
    if (!alive) return;
    raf = requestAnimationFrame(frame);
    ctx.clearRect(0,0,W,H);
    acc += [0.12,0.35,0.6,0.95,1.6][level];
    while (acc >= 1){ add(false); acc--; }
    ctx.globalCompositeOperation = dark ? 'lighter' : 'source-over';
    for (let i=P.length-1; i>=0; i--){
      const p = P[i]; p.life++;
      if (p.b){ p.vx *= .955; p.vy = p.vy*.955 + .02; } else { p.vx += Math.sin((p.life + p.t*30)/18)*.012; }
      p.x += p.vx; p.y += p.vy;
      const k = p.life/p.max;
      if (k >= 1){ P.splice(i,1); continue; }
      const al = Math.sin(Math.PI*k) * (.55 + .45*Math.sin(p.life*.25 + p.t));
      ctx.fillStyle = `rgba(${p.c},${(al*.16).toFixed(3)})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*3.2,0,6.283); ctx.fill();
      ctx.fillStyle = `rgba(${p.c},${al.toFixed(3)})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    }
  }
  if (!REDUCE) raf = requestAnimationFrame(frame);
  return {
    setLevel(l){ level = Math.max(0, Math.min(4, l)); },
    burst(n){ if (REDUCE) return; for (let i=0; i<(n||50); i++) add(true); },
    destroy(){ alive = false; cancelAnimationFrame(raf); if (ro) ro.disconnect(); }
  };
}

    </div>
    <div id="after"></div>`);
  const parcel = $('#parcel'), map = $('#map');
  const places = [...map.querySelectorAll('.place:not(.home)')];
  let busy = false, delivered = false, drag = null;
  const goHome = ()=>{ parcel.style.left = P.home.x+'%'; parcel.style.top = (P.home.y-15)+'%'; };
  const showBubble = t => { map.querySelector('.bubble')?.remove(); map.insertAdjacentHTML('beforeend', `<div class="bubble" role="status">${t}</div>`); };
  function hit(x, y){
    return places.find(b=>{ const r = b.getBoundingClientRect(), pad = 16; return x > r.left-pad && x < r.right+pad && y > r.top-pad && y < r.bottom+pad; });
  }
  function move(e){
    const mr = drag.mr;
    const x = Math.min(Math.max(e.clientX - mr.left, 0), mr.width), y = Math.min(Math.max(e.clientY - mr.top, 0), mr.height);
    parcel.style.left = (x/mr.width*100)+'%'; parcel.style.top = (y/mr.height*100)+'%';
    const h = hit(e.clientX, e.clientY);
    places.forEach(b=>b.classList.toggle('hover', b === h));
  }
  parcel.addEventListener('pointerdown', e=>{
    if (busy || delivered) return;

  });

  // 마우스·터치로 장소를 누르면 끌어오라고 안내하고, 키보드(Enter/Space)로 누르면 바로 보낸다.

        <header><strong>진료 준비 요약</strong><span>의료진 화면</span></header>
        <dl>
          <div><dt>환자</dt><dd>영희 씨 (가상 인물)</dd></div>
          <div><dt>주요 고민</dt><dd>계단을 내려갈 때 무릎 불편감 <span class="tag ai">대화 기록</span></dd></div>

          <div><dt>진료 때 확인</dt><dd>불편감이 시작된 시점, 일상 활동에 주는 영향</dd></div>
        </dl>
        <p class="foot">AI가 일상 기록을 정리한 내용이에요. 진료 판단은 의료진이 해요.</p>
      </section>
      <button class="btn primary block" id="nx" type="button" style="margin-top:14px">다음</button>`;
    $('#after').scrollIntoView({behavior:'smooth',block:'start'});
    $('#nx').onclick = ()=>{
      const s = openSheet(`<h2>일상에서 나눈 이야기가 진료로 이어져요!</h2>
        <p>Invites Loop는 일상에서 공유한 건강정보와 고민을 진료 준비에 활용할 수 있도록 정리해요. 의료진은 관련 정보를 확인하고 진료에 참고할 수 있어요.</p>
        <button class="btn primary block" id="done" type="button">Stage 2 완료하기</button>`);
      s.querySelector('#done').onclick = ()=>completeStage(1);

  const SCENE = 4500, TOTAL = SCENE*4;

  let elapsed = 0, t0 = null, playing = true, cur = -1, raf, finished = false;
  function setScene(i){ if (i===cur) return; cur=i; scenes.forEach((s,k)=>s.classList.toggle('on',k===i)); cap.textContent = CAPS[i]; }

const SUN = `<svg viewBox="0 0 100 100" aria-hidden="true"><g class="sunrays">${Array.from({length:12},(_,i)=>`<rect x="46.5" y="1" width="7" height="17" rx="3.5" fill="#FFC93C" transform="rotate(${i*30} 50 50)"/>`).join('')}</g><circle cx="50" cy="50" r="29" fill="url(#gSun)"/><circle cx="41" cy="47" r="3.2" fill="#7A4300"/><circle cx="59" cy="47" r="3.2" fill="#7A4300"/><path d="M42 57 q8 7 16 0" stroke="#7A4300" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="34" cy="56" r="4.5" fill="#FF8FA3" opacity=".6"/><circle cx="66" cy="56" r="4.5" fill="#FF8FA3" opacity=".6"/></svg>`;
function stage4(){
  shell(3, `<p class="hint" id="hint">영희 씨가 퇴원 후 일상으로 돌아왔어요. 화면 속 꽃씨를 눌러 화분에 심어 보세요.</p>
    <div class="garden" id="garden">
      <div id="plantBox">${plantSVG(0)}</div>
      <span class="beam" aria-hidden="true"></span>
      <button class="floatseed target hint-below" id="seed" type="button" data-hint="톡! 눌러서 심기" aria-label="꽃씨를 눌러 화분에 심기"><svg viewBox="0 0 72 72">${seedG(36,36,1.25,true)}</svg></button>
      <button class="can" id="can" type="button" data-hint="눌러서 물 주기" aria-label="물뿌리개를 눌러 물 주기" disabled>${CAN}</button>
      <button class="sun hint-below" id="sun" type="button" data-hint="눌러서 햇빛 비추기" aria-label="햇님을 눌러 햇빛 비추기" disabled>${SUN}</button>
      <span class="stream" id="stream" aria-hidden="true"></span>
      <span class="wbadge" id="wbadge" aria-hidden="true">💧 물을 주고 있어요</span>
    </div>
    <div class="missions" aria-label="미션 진행 상황">
      <div class="mission now"><span class="em" aria-hidden="true">🌰</span>씨앗 심기<small>관리계획 담기</small></div>
      <div class="mission"><span class="em can-ic" aria-hidden="true">${CAN}</span>물주기<small>매일 실천기록</small></div>
      <div class="mission"><span class="em" aria-hidden="true">☀️</span>꽃 피우기<small>경과 공유</small></div>
    </div>
    <div id="noteBox"></div>`);
  const garden = $('#garden'), plantBox = $('#plantBox');
  const seedB = $('#seed'), canB = $('#can'), sunB = $('#sun'), missions = app.querySelectorAll('.mission');
  const gfx = createFX(garden, {fill:true, oy:.42});
  cleanup = ()=>gfx.destroy();
  let step = 0, busy = false;

  function setPlant(l){ plantBox.innerHTML = plantSVG(l); gfx.setLevel(Math.min(4,l)); if (l >= 1) gfx.burst(l >= 4 ? 140 : 30); }
  function setMission(i){ missions.forEach((m,k)=>{ m.classList.toggle('done', k < i); m.classList.toggle('now', k === i); }); }
  function arm(el){ el.disabled = false; el.classList.add('target'); }
  function disarm(el){ el.classList.remove('target'); el.disabled = true; }

  const NOTES = [
    '<b>씨앗을 심었어요</b><br>의료진이 확정한 관리계획(무릎 부담을 줄이는 운동 하루 10분, 걸음 수 천천히 늘리기, 2주 뒤 경과 확인)을 꽃씨에 담아 심었어요.',
    '<b>물을 줬어요</b><br>매일의 실천기록이 물이 돼요. 오늘은 무릎 운동 10분, 걸음 수 3,400보를 기록했어요.',
    '<b>햇빛을 받아 꽃이 활짝 피었어요</b><br>2주 동안의 실천기록을 의료진과 공유했어요. 꾸준한 관리가 꽃을 피웠어요.'
  ];
  const GROW = [
    '씨앗을 심자 새싹이 돋았어요. 이제 물뿌리개를 눌러 물을 줘 볼까요?',
    '물을 주니 꽃봉오리가 맺혔어요. 하늘에 뜬 햇님을 눌러 햇빛을 비춰 주세요!',
    '햇빛을 받아 꽃이 활짝 피었어요!'
  ];
  async function after(i){
    $('#noteBox').innerHTML = `<div class="note" role="status">${NOTES[i]}</div>`;
    $('#hint').textContent = GROW[i];
    step = i + 1; setMission(step); busy = false;
    if (i === 0) arm(canB);
    if (i === 1){ sunB.classList.add('show'); await wait(800); arm(sunB); }
    if (i === 2){
      await wait(1600);
      const s = openSheet(`<h2>건강관리는 진료가 끝나도 계속 이어져요!</h2>
        <p>Invites Loop는 의료진이 확정한 관리계획과 일상에서의 실천기록을 연결해 지속적인 건강관리를 도와줘요.</p>
        <button class="btn primary block" id="done" type="button">Invites Loop 완성하기</button>`);
      s.querySelector('#done').onclick = ()=>completeStage(3);
    }
  }

  seedB.onclick = async ()=>{
    if (step !== 0 || busy) return; busy = true; disarm(seedB);
    seedB.classList.add('drop');
    await wait(760); seedB.remove(); setPlant(1);
    await wait(900); setPlant(2);
    after(0);
  };
  canB.onclick = async ()=>{
    if (step !== 1 || busy) return; busy = true; disarm(canB);
    gfx.setLevel(0);
    const stream = $('#stream'), badge = $('#wbadge');
    badge.classList.add('on');
    canB.classList.remove('on'); void canB.offsetWidth; canB.classList.add('on');
    await wait(900);
    stream.classList.add('on'); garden.classList.add('wet');
    for (let r=0; r<26; r++) setTimeout(()=>{ const d = document.createElement('span'); d.className = 'drop'; d.style.left = `calc(50% + ${4 + Math.random()*12}px)`; d.style.top = '88px'; garden.appendChild(d); setTimeout(()=>d.remove(), 800); }, r*60);
    for (let r=0; r<4; r++) setTimeout(()=>{ const s = document.createElement('span'); s.className = 'splash'; garden.appendChild(s); setTimeout(()=>s.remove(), 900); }, 200 + r*380);
    await wait(700); setPlant(3);
    await wait(900); stream.classList.remove('on');
    await wait(700); badge.classList.remove('on');
    after(1);
  };
  sunB.onclick = async ()=>{
    if (step !== 2 || busy) return; busy = true; disarm(sunB);
    sunB.classList.add('shine'); garden.classList.add('sunlit');
    await wait(1000);
    garden.classList.remove('bloomflash'); void garden.offsetWidth; garden.classList.add('bloomflash');
    setPlant(4); await wait(350); gfx.burst(90);
    after(2);
  };
}

function confetti(){
  if (REDUCE) return;
  const cols = ['var(--c0)','var(--c1)','var(--c2)','var(--c3)','#FFC93C','#FF8FC8'];
  const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden','true');
  for (let i=0; i<46; i++){
    const p = document.createElement('i');
    p.style.left = (Math.random()*100) + '%';
    p.style.background = cols[i % cols.length];
    p.style.animationDelay = (Math.random()*0.8).toFixed(2) + 's';
    p.style.animationDuration = (2.2 + Math.random()*1.4).toFixed(2) + 's';
    p.style.setProperty('--dx', ((Math.random()-.5)*120).toFixed(0) + 'px');
    p.style.setProperty('--rot', ((Math.random()-.5)*1080).toFixed(0) + 'deg');
    if (i % 3 === 0) p.style.borderRadius = '50%';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 4500);
}

  el.innerHTML = `<button class="iskip" type="button">건너뛰기</button>

      <div class="icenter" aria-hidden="true"><span class="iflash"></span><svg viewBox="0 0 200 200">

        <g class="ibloom"><circle cx="100" cy="96" r="96" fill="url(#gGlow)"/>${lotusG(100,128,1.12)}${glints([[84,72,1],[120,60,.85],[100,38,.9]])}</g>
      </svg></div>
      ${STAGES.map((s,i)=>`<span class="inode" aria-hidden="true" style="left:${POS[i][0]}%;top:${POS[i][1]}%;--nc:var(--c${i});animation-delay:${[1.05,1.35,1.65,1.95][i]}s">${STAGE_IC[i]}</span>`).join('')}
    </div>
    <div class="ititle"><div class="ilogo">InvitesLoop</div><h1>건강의 꽃을 피워라!</h1><p>꽃씨 하나로 이어지는 건강 이야기</p></div>`;
  document.body.appendChild(el);
  const fx = createFX(el.querySelector('#iwrap'));
  fx.setLevel(1);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add(REDUCE ? 'still' : 'play')));

/* ---------- BGM (웹 오디오로 직접 연주하는 오르골 루프) ---------- */
const BGM = (()=>{
  const KEYB = 'invites-loop-bgm';
  let pref = 'on';
  try { pref = localStorage.getItem(KEYB) || 'on'; } catch(e) {}
  let ctx = null, master = null, bus = null, lead = null, noise = null, timer = null, playing = false, nextT = 0, step = 0, btn = null;
  const BPM = 112, E8 = 60/BPM/2;
  const MEL = [
    [76,79,84,79,76,79,84,null],
    [74,79,83,79,74,79,83,null],
    [72,76,81,76,72,76,81,79],
    [71,76,79,76,71,76,79,null],
    [69,72,77,81,79,77,76,77],
    [76,null,79,null,84,null,88,null],
    [77,81,84,81,86,84,81,77],
    [79,null,74,null,79,83,86,null]
  ];
  const BASS = [48,43,45,40,41,48,41,43];
  const PAD = [[60,64,67],[59,62,67],[57,60,64],[59,64,67],[57,60,65],[60,64,67],[57,60,65],[59,62,67]];
  const hz = m => 440*Math.pow(2,(m-69)/12);
  function init(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
    master.connect(lp); lp.connect(ctx.destination);
    bus = ctx.createGain(); bus.connect(master);
    lead = ctx.createGain(); lead.connect(bus);
    const dl = ctx.createDelay(); dl.delayTime.value = E8*3;
    const fb = ctx.createGain(); fb.gain.value = .28;
    const wet = ctx.createGain(); wet.gain.value = .35;
    lead.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(bus);
    const len = Math.floor(ctx.sampleRate*.2);
    noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noise.getChannelData(0); for (let i=0; i<len; i++) d[i] = Math.random()*2-1;
  }
  function env(g, t, peak, a, dec){ g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t+a); g.gain.exponentialRampToValueAtTime(0.0001, t+a+dec); }
  function bell(t, m){
    const g = ctx.createGain(); env(g, t, .16, .004, .55); g.connect(lead);
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = hz(m); o.connect(g);
    const g2 = ctx.createGain(); g2.gain.value = .3; g2.connect(g);
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = hz(m)*2; o2.connect(g2);
    o.start(t); o2.start(t); o.stop(t+.65); o2.stop(t+.65);
  }
  function bass(t, m){
    const g = ctx.createGain(); env(g, t, .22, .01, .4); g.connect(bus);
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = hz(m); o.connect(g);
    o.start(t); o.stop(t+.5);
  }
  function pad(t, ch){
    const len = E8*8;
    ch.forEach(m=>{
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.035, t+.25);
      g.gain.setValueAtTime(.035, t+len-.3); g.gain.linearRampToValueAtTime(0.0001, t+len);
      g.connect(bus);
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = hz(m); o.connect(g);
      o.start(t); o.stop(t+len+.05);
    });
  }
  function shaker(t, v){
    const s = ctx.createBufferSource(); s.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = ctx.createGain(); env(g, t, v, .002, .05);
    s.connect(f); f.connect(g); g.connect(bus);
    s.start(t); s.stop(t+.08);
  }
  function sched(){
    while (nextT < ctx.currentTime + .15){
      const bar = Math.floor(step/8) % 8, i = step % 8;
      const m = MEL[bar][i];
      if (m) bell(nextT, m);
      if (i === 0 || i === 4) bass(nextT, BASS[bar] + (i === 4 ? 12 : 0));
      if (i === 0) pad(nextT, PAD[bar]);
      shaker(nextT, i % 2 ? .035 : .015);
      nextT += E8; step++;
    }
  }
  function ui(){
    if (!btn) return;
    btn.classList.toggle('off', !playing);
    btn.setAttribute('aria-pressed', String(playing));
    btn.setAttribute('aria-label', playing ? '배경음악 끄기' : '배경음악 켜기');
  }
  function start(){
    if (playing) return;
    try { if (!ctx) init(); } catch(e) { return; }
    // 모바일(특히 iOS)에서 오디오를 깨우기 위해 아주 짧은 무음을 먼저 재생한다.
    try { const sb = ctx.createBufferSource(); sb.buffer = ctx.createBuffer(1, 1, 22050); sb.connect(ctx.destination); sb.start(0); } catch(e) {}
    ctx.resume();
    setTimeout(()=>{ if (playing && ctx.state !== 'running') toast('소리가 안 나오면 🎵 버튼을 한 번 더 눌러 주세요'); }, 600);
    playing = true; nextT = ctx.currentTime + .08; step = 0;
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(.55, t+1.5);
    clearInterval(timer); timer = setInterval(sched, 25); sched();
    ui();
  }
  function stop(){
    if (!playing) return;
    playing = false;
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t+.5);
    setTimeout(()=>{ if (!playing){ clearInterval(timer); ctx.suspend(); } }, 600);
    ui();
  }
  function setPref(v){ pref = v; try { localStorage.setItem(KEYB, v); } catch(e) {} }
  function mount(){
    btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'bgm-btn off';
    btn.innerHTML = '<span aria-hidden="true">🎵</span>';
    document.body.appendChild(btn); ui();
    btn.addEventListener('click', ()=>{ if (playing && ctx && ctx.state !== 'running'){ ctx.resume(); return; } if (playing){ stop(); setPref('off'); toast('배경음악을 껐어요'); } else { setPref('on'); start(); } });
    // 브라우저는 사용자가 화면을 한 번 누른 뒤에만 소리를 낼 수 있어서, 첫 터치 때 시작한다.
    const EVTS = ['pointerup','touchend','click','keydown'];
    const first = e=>{
      if (e.target && e.target.closest && e.target.closest('.bgm-btn')) return;
      EVTS.forEach(ev=>document.removeEventListener(ev, first, true));
      if (pref === 'on' && !playing) start();
    };
    EVTS.forEach(ev=>document.addEventListener(ev, first, true));
    // 재생 중인데 브라우저가 오디오를 멈춰 두었으면, 다음 터치 때 다시 깨운다.
    ['pointerup','touchend','click'].forEach(ev=>document.addEventListener(ev, ()=>{ if (playing && ctx && ctx.state !== 'running' && !document.hidden) ctx.resume(); }, true));
    document.addEventListener('visibilitychange', ()=>{ if (!ctx) return; if (document.hidden) ctx.suspend(); else if (playing) ctx.resume(); });
  }
  return { mount };
})();

BGM.mount();
showHub();
playIntro();
})();
</script>
