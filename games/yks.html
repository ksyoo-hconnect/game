let state=null,ticker=null;

function home(){clearInterval(ticker);state=null;$('#app').innerHTML=`<section class="hero"><div><span class="stamp"><i class="dot"></i> 작은 선택으로 배우는 연결된 돌봄</span><h1>내 이야기는,<br><span>다음 돌봄으로 이어진다.</span></h1><p class="intro">검사부터 진료, 퇴원, 다시 일상까지.<br>지민 님의 여정을 함께하며 Invites Loop를 직접 경험해 보세요.</p></div><div class="loop-art" aria-label="W, M1, M2, M3를 지나 W로 이어지는 돌봄 여정"><div class="mini-person"><div class="avatar" aria-hidden="true">지</div><div><strong>지민 님의 한 바퀴</strong><small>“아이와 아침 산책을 하고 싶어요.”</small></div></div><span class="genome">◈ IRS+ / MY GENOMIC CONTEXT</span><div class="mini-route">${stages.map(s=>`<div class="route-stop">${s}</div>`).join('')}</div><p class="art-caption">유전적 맥락 + 내 목표 + 의료진 판단<br>따로 있던 정보가, 하나의 여정으로.</p></div></section><div class="section-title"><h2>어떤 방식으로 배워 볼까요?</h2><p>각 약 2~5분 · 순서 상관없이<br>설치 없이 이 파일에서 바로</p></div><div class="welcome-note"><div><b>처음이라면 ③ 직접 이어 보는 나의 루프</b><span>실제처럼 조작하며 가치와 사용법을 함께 배워요.</span></div><button class="secondary" data-action="timer-toggle" aria-pressed="${timed}">${timed?'◷ 5분 타이머 켜짐':'∞ 시간 제한 없이'}</button></div><section class="games" aria-label="게임 선택">${Object.entries(modes).map(([key,m],i)=>`<article class="game-card"><span class="number">0${i+1}</span><h3>${m.name}</h3><p>${m.goal}</p><div class="tags"><span class="tag">${m.type}</span><span class="tag">${m.time}</span><span class="tag">${i===0?'맥락 카드':i===1?'상황 × 기능':'5단계 실습'}</span></div><button class="primary ${i===2?'light':''}" data-action="start" data-mode="${key}"><span>${i===2?'추천 체험 시작':'게임 시작'}</span><span aria-hidden="true">↗</span></button></article>`).join('')}</section><p class="notice">가상의 환자와 기록을 사용하는 학습용 데모입니다. IRS+의 유전적 위험은 확정 진단이 아닙니다. 실제 진료·검사·치료를 제공하지 않으며, 외부 전송과 실제 의료진 승인은 이루어지지 않습니다. 게임 결과만 이 기기에 저장되며, 아래에서 지울 수 있습니다.</p><details class="data-info"><summary>이 기기의 체험 기록 · 데이터 안내</summary><p>모든 인물과 결과는 가상입니다. 개인 건강정보를 입력하지 마세요. 외부 파일·폰트·서버 연결 없이 작동하며, 게임 종류·소요 시간·완료 수만 이 브라우저에 최대 20개 보관합니다.</p><p>최근 완료: ${saved.length?saved.slice(-3).map(r=>esc(modes[r.mode].name)+' '+r.correct+'/'+r.total).join(' · '):'아직 없어요'}</p><button class="secondary" data-action="clear-results">체험 기록 지우기</button></details><footer>INVITES LOOP · OFFLINE LEARNING PROTOTYPE · INVITES LOOP</footer>`;}
function start(mode){if(!modes[mode])return;clearInterval(ticker);state={mode,start:Date.now(),deadline:Date.now()+300000,step:0,selected:[],review:false,feedback:null,matched:[],activeMatch:null,errors:0,correct:0,events:[],ended:false,local:{},completedStages:[]};render();ticker=setInterval(tick,250);tick();focusHeading();}
function remaining(){return Math.max(0,Math.ceil((state.deadline-Date.now())/1000));}
function tick(){if(!state||state.ended)return;const n=remaining();if(timed&&!n){finish(true);return;}const clock=$('#clock');if(clock){clock.innerHTML=timed?`<strong>${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}</strong><small>남은 체험 시간</small>`:'<strong>∞</strong><small>내 속도로 체험 중</small>';clock.classList.toggle('urgent',timed&&n<=30);}if(timed&&n<=30&&!state.warned){state.warned=true;announce('30초 남았어요. 완료한 내용은 학습 지도에 남습니다.');}}
function guard(){if(!state||state.ended)return false;if(timed&&Date.now()>=state.deadline){finish(true);return false;}return true;}
function stage(){return state.mode==='memory'?memoryRounds[state.step].stage:state.mode==='journey'?state.step:state.activeMatch?matches.find(m=>m.id===state.activeMatch).stage:-1;}
function route(active){return `<nav class="journey" aria-label="돌봄 여정">${stages.map((s,i)=>{const done=state.mode==='tools'?state.matched.some(id=>matches.find(m=>m.id===id).stage===i):state.completedStages.includes(i);return `<div class="step ${i===active?'active':done?'done':''}" ${i===active?'aria-current="step"':''}><strong>${done?'✓':s}</strong>${stageNames[i]}</div>`}).join('')}</nav>`;}
function sidebar(){const total=state.mode==='memory'?3:5,done=state.mode==='tools'?state.matched.length:state.step+(state.review?1:0);return `<aside class="sidebar"><section class="side-card"><div class="patient"><div class="avatar" aria-hidden="true">지</div><div><strong>김지민 · 가상 인물</strong><small>야간 근무 · 아이와 산책이 목표</small></div></div><div class="identity"><span class="genome">◈ IRS+</span><b>대사 관련 유전적 위험 우선순위</b><small>검사 기반 참고 정보 · 확정 진단 아님<br>${state.mode==='journey'&&state.step>0?'M1 의사 확인·수정 기록 보존':'의료진 확인·수정과 출처 보존'}</small></div></section><section class="side-card"><h3>${state.mode==='tools'?'연결한 도구':'완료한 미션'}</h3><div class="metric">${done}<small> / ${total}</small></div><div class="progress-bar"><i style="width:${done/total*100}%"></i></div><p>잘못 골라도 괜찮아요.<br>피드백을 보고 다시 시도할 수 있어요.</p></section><section class="side-card"><h3>함께 이어지는 기록</h3>${state.events.length?`<div class="timeline">${state.events.map(e=>`<div class="timeline-row">${e.title}<small>${e.text}</small></div>`).join('')}</div>`:'<p>선택을 완료하면 이곳에<br>다음 단계로 이어진 기록이 쌓입니다.</p>'}</section></aside>`;}
function feedbackHTML(){if(!state.feedback)return '';return `<div class="feedback ${state.feedback.bad?'bad':''}" role="status"><strong>${state.feedback.title}</strong>${state.feedback.text}</div>`;}
function render(){if(!state||state.ended)return;const m=modes[state.mode];$('#app').innerHTML=`<div class="play-header"><div class="play-heading"><button class="text-button" data-action="exit">← 게임 선택</button><p class="overline">${m.eyebrow}</p><h1>${m.name}</h1></div><div class="header-tools"><button class="text-button" data-action="help">도움말</button><div class="clock" id="clock" aria-label="체험 시간"></div></div></div><div class="layout"><section class="board">${route(Math.min(stage(),4))}${state.mode==='memory'?memoryView():state.mode==='tools'?toolsView():journeyView()}</section>${sidebar()}</div><p class="notice">가상 사례 · 실제 데이터 전송 없음 · ${timed?'5분이 지나면 완료한 내용만 학습 지도로 정리합니다. 다른 창을 보는 시간도 포함돼요.':'시간 제한 없이 내 속도로 체험하세요.'}</p>`;tick();}
function memoryView(){const r=memoryRounds[state.step];return `<div class="stage-label">MISSION ${state.step+1} / 3 · ${stages[r.stage]}</div><h2>${r.title}</h2><p class="description">${r.lead}</p><div class="bubble">${r.speech}</div>${!state.review?`<div class="cards">${r.facts.map(f=>`<button class="fact ${state.selected.includes(f[0])?'selected':''}" data-action="fact" data-id="${f[0]}" aria-pressed="${state.selected.includes(f[0])}"><span class="check" aria-hidden="true">${state.selected.includes(f[0])?'✓':''}</span><span><strong>${f[1]}</strong><small>${f[2]}</small></span></button>`).join('')}</div>${feedbackHTML()}<div class="action-row"><small><span class="count-pill">${state.selected.length} / ${r.need}</span> 핵심 카드 선택<br>${state.step===0?'선택한 요약만 공유하는 데 동의해요.':'출처와 최신 판단을 함께 이어가요.'}</small><button class="primary" data-action="pack" ${state.selected.length!==r.need?'disabled':''}>${state.step===0?'동의하고 이어가기':'맥락 이어가기'} →</button></div>`:`${feedbackHTML()}<div class="compare"><div><h3>맥락이 끊긴 대화</h3><p>${r.blank}</p></div><div class="connected"><h3>맥락이 이어진 대화</h3><p>${r.linked}</p></div></div><div class="action-row"><small>정보를 많이 모으는 것보다<br>맞는 맥락을 이어가는 것이 중요해요.</small><button class="primary" data-action="next">${state.step===2?'학습 지도 보기':'다음 미션'} →</button></div>`}`;}
function chooseFact(id){const r=memoryRounds[state.step];if(state.review||!r.facts.some(f=>f[0]===id))return;const i=state.selected.indexOf(id);if(i>=0)state.selected.splice(i,1);else if(state.selected.length<r.need)state.selected.push(id);else {announce(`${r.need}개까지 선택할 수 있어요. 먼저 선택한 카드를 해제해 주세요.`);return;}state.feedback=null;render();const el=$(`[data-action="fact"][data-id="${id}"]`);if(el)el.focus({preventScroll:true});}
function pack(){const r=memoryRounds[state.step];if(state.review||state.selected.length!==r.need)return;const wrong=state.selected.filter(x=>!r.correct.includes(x));if(wrong.length){state.errors++;state.feedback={bad:true,title:'이어가기 전에 한 번 더!',text:'확정되지 않은 진단, 출처 삭제, 승인 없는 변경은 이어갈 맥락이 아닙니다. 카드의 작은 설명을 보고 다시 골라 주세요.'};}else{state.correct++;state.review=true;state.completedStages.push(r.stage);state.feedback={title:'맥락을 안전하게 연결했어요',text:r.feedback};state.events.push({title:['동의한 진료 전 요약','의료진 확인·수정 기록','퇴원 교육 → 추적 → 일상'][state.step],text:['목표 · 걱정 · IRS+ · 최근 기록','진단 출처 · 수정 이력 · 개인 목표','생활 맞춤 교육 · 추적 · 승인 계획'][state.step]});}render();}
function toolsView(){const order=[3,0,4,1,2];return `<div class="stage-label">TOOL MATCH · ${state.matched.length} / 5 연결</div><h2>지금, 어떤 기능이 필요할까요?</h2><p class="description">왼쪽의 <b>환자 상황</b>을 하나 선택한 뒤, 오른쪽의 <b>알맞은 기능</b>을 눌러 연결하세요. 다섯 쌍을 모두 이어 봐요.</p><div class="connection-board"><div class="connection-column"><h3>① 상황 선택</h3>${matches.map((m,i)=>`<button class="match-item ${state.activeMatch===m.id?'selected':''} ${state.matched.includes(m.id)?'matched':''}" data-action="situation" data-id="${m.id}" aria-pressed="${state.activeMatch===m.id}" ${state.matched.includes(m.id)?'disabled':''}><small>${stages[m.stage]} · ${stageNames[m.stage]}</small>${m.situation}</button>`).join('')}</div><div class="connection-column"><h3>② 기능 연결</h3>${order.map(i=>{const m=matches[i];return `<button class="match-item ${state.matched.includes(m.id)?'matched':''}" data-action="tool" data-id="${m.id}" ${state.matched.includes(m.id)?'disabled':''}><small>INVITES LOOP</small><b>${m.tool}</b></button>`;}).join('')}</div></div>${feedbackHTML()}<p class="hint">${state.activeMatch?'선택한 상황에 맞는 기능을 오른쪽에서 눌러 주세요.':'상황을 먼저 고르면 연결을 시작할 수 있어요.'}</p>${state.matched.length===5?'<div class="action-row"><span>다섯 상황을 모두 연결했어요.</span><button class="primary" data-action="finish">학습 지도 보기 →</button></div>':''}`;}
function matchTool(id){if(state.matched.includes(id))return;if(!state.activeMatch){state.feedback={bad:true,title:'상황부터 선택해 주세요',text:'왼쪽의 환자 상황을 누른 다음 필요한 기능을 연결하세요.'};render();return;}const expected=matches.find(m=>m.id===state.activeMatch);if(id===state.activeMatch){state.matched.push(id);state.correct++;state.completedStages.push(expected.stage);state.feedback={title:'딱 맞는 기능을 연결했어요',text:expected.detail};state.events.push({title:`${stages[expected.stage]} · ${expected.tool}`,text:expected.detail});state.activeMatch=null;}else{state.errors++;state.feedback={bad:true,title:'이 상황에서는 다른 기능이 필요해요',text:`힌트: ${expected.detail}`};}render();}

function panelStatus(text,kind=''){return '<span class="state-badge '+kind+'">'+text+'</span>'}
function taskButton(text,act,disabled=false){return '<button class="primary" data-action="'+act+'" '+(disabled?'disabled':'')+'>'+text+'</button>'}
function goNext(){return '<div class="action-row"><small>완료한 맥락이 오른쪽 기록에 이어졌어요.</small>'+taskButton(state.step===4?'내 학습 지도 보기 →':'다음 단계 →','next')+'</div>'}
function completeTask(title,text){if(state.review)return;state.review=true;state.correct++;state.completedStages.push(state.step);state.events.push({title,text});state.feedback={title:'다음 돌봄으로 이어졌어요',text};}
function journeyView(){const l=state.local;let content='';
if(state.step===0){content='<div class="stage-label">CHAPTER 1 / 5 · W → M1</div><h2>저장한 메모를, 동의한 요약으로</h2><div class="bubble">“아이와 아침 산책을 하고 싶어요. 야간 근무가 많고, IRS+ 위험 결과가 무슨 뜻인지 궁금해요.”</div><p class="description">진료 준비에서 질문을 고르고 저장한 다음, 공유 범위를 확인해 전달해 보세요.</p><div class="practice-app"><div class="app-label">진료 준비 <span>가상 앱</span></div><div class="practice-body"><h3>내 진료 전 요약</h3><p class="compact">목표: 아이와 산책 · 생활 맥락: 야간 근무<br>검사: IRS+ 대사 관련 위험 · 확정 진단 아님</p><label class="check-row"><input type="checkbox" data-field="question" '+(l.question?'checked':'')+' '+(l.saved?'disabled':'')+'>“이 위험 결과를 어떻게 이해하면 되나요?” 질문 추가</label>'+(l.saved?panelStatus('① 개인 초안 저장됨','blue'):taskButton('① 준비 내용 저장','save-summary',!l.question));if(l.saved)content+='<div class="share-box"><b>이번에 전달할 내용</b><p>위 목표·근무 맥락·IRS+ 요약과 고른 질문만 전달합니다. 개인 대화 원문은 포함하지 않습니다.</p><label class="check-row"><input type="checkbox" data-field="consent" '+(l.consent?'checked':'')+' '+(state.review?'disabled':'')+'>선택한 요약의 공유에 동의해요</label>'+(state.review?panelStatus('② 전달 완료 · 의료진 열람 전','green'):taskButton('② 선택한 요약 전달하기','send-summary',!l.consent))+'</div>';content+='</div></div>';}
if(state.step===1){content='<div class="stage-label">CHAPTER 2 / 5 · M1 외래</div><h2>검사 출처와 의료진 판단을 함께</h2><p class="description">앞서 동의한 요약이 진료 검토 목록에 도착했습니다. 가상 진료에서 의사가 확인한 내용과 원래 검사 출처를 비교하세요.</p><div class="compare"><div><h3>검사 기반 참고 정보</h3><p>IRS+ · 대사 관련 위험 우선순위<br>확정 진단이 아닌 검사 해석</p></div><div class="connected"><h3>의료진 확인 · 가상 진료일 D0</h3><p>진료·검사를 종합해 제2형 당뇨병 확인<br>현재 상태에 맞게 관리 우선순위 수정</p></div></div><div class="task-box"><h3>어떤 기록을 다음 단계로 이어갈까요?</h3>'+decisionButtons([['최신 진단과 계획만 남긴다','중복을 줄이기 위해 이전 검사 출처는 제외'],['검사 출처·확인된 진단·수정 이력을 함께 남긴다','의료진과 진료일을 표시하고 개인 목표도 유지'],['검사 위험과 진단을 하나의 상태로 합친다','두 정보의 차이를 없애 간단하게 표시']],state.review)+'</div>';}
if(state.step===2){content='<div class="stage-label">CHAPTER 3 / 5 · M2 퇴원 준비</div><h2>읽었다는 표시보다, 내 말 한 문장</h2><p class="description">시간이 흘러 별도의 입원 치료를 마치고 퇴원을 준비하는 가상 장면입니다. 앞선 진료 때문에 입원한 것으로 가정하지 않습니다.</p><div class="practice-app"><div class="app-label">퇴원 교육 <span>생활에 맞춘 설명</span></div><div class="practice-body"><div class="format-tabs" role="group" aria-label="설명 방식">'+['짧은 문장','순서대로'].map((t,i)=>'<button class="secondary" aria-pressed="'+((l.format||0)===i)+'" data-action="format" data-id="'+i+'">'+t+'</button>').join('')+'</div><p class="education">'+(l.format?'① 승인된 계획을 확인해요.<br>② 활동 기록을 남겨요.<br>③ 근무 일정 때문에 어렵다면 조정을 요청해요.<br>④ 승인과 적용일을 확인한 뒤 바꿔요.':'승인된 계획에 따라 실천하고 활동을 기록해요. 야간 근무 때문에 어렵다면 사정을 알려 조정을 요청하세요. 변경은 승인과 적용일을 확인한 뒤 반영해요.')+'</p></div></div><h3 class="task-title">퇴원 후 할 일을 내 말로 설명한다면?</h3>'+decisionButtons([['안내문을 저장해 두고, 실천이 어려워지면 일단 기다릴게요.','자료 보관에 집중'],['새 계획이 승인됐다는 알림이 오면 바로 적용할게요.','적용 날짜는 따로 확인하지 않음'],['기록을 남기고, 어려우면 요청한 뒤 승인과 적용일을 확인할게요.','내 상황과 다음 행동을 함께 설명']],state.review);}
if(state.step===3){content='<div class="stage-label">CHAPTER 4 / 5 · M3 퇴원 후</div><h2>요청은 승인과 다르고, 승인은 적용과 달라요</h2><div class="bubble">“근무 일정이 바뀌었어요. 기존 계획의 실천 시간을 아침에서 오후로 옮기고 싶어요.”</div><div class="trend" aria-label="가상 활동 기록 월 22분, 화 18분, 수 11분, 목 8분"><div style="height:80px">22분<span>월</span></div><div style="height:66px">18분<span>화</span></div><div style="height:44px">11분<span>수</span></div><div style="height:35px">8분<span>목</span></div></div><div class="practice-app"><div class="app-label">계획 조정 요청 <span>오늘 D0</span></div><div class="practice-body"><p class="compact"><b>현재 승인 계획 v1</b> · 아침 실천<br><b>변경 희망</b> · 오후 실천 · 근무 시간 변화<br>같은 목표를 이어가기 위한 가상 일정 변경입니다.</p>';if(!l.requested)content+=taskButton('기록·근무 변화와 함께 조정 요청','request-plan');else if(!l.approved)content+=panelStatus('요청 접수 · 승인 대기','amber')+'<p class="compact">현재는 기존 계획 v1이 유효해요. 실제 전송 없이 가상 검토를 진행합니다.</p>'+taskButton('가상 의료진 검토 결과 확인','approve-plan');else content+=panelStatus('계획 v2 승인 · 내일 D1부터','green')+'<div class="effective"><b>오늘 D0: 기존 계획 v1 · 아침</b><span>내일 D1: 변경 계획 v2 · 오후</span></div><h3>승인 알림을 받은 오늘은?</h3>'+decisionButtons([['오후 계획 v2로 바로 바꾼다','승인 알림을 현재 적용으로 이해'],['오늘은 v1, 내일부터 v2를 적용한다','승인과 적용 시점을 각각 확인'],['기존 계획을 지우고 내일까지 기록을 멈춘다','변경 전 이력을 남기지 않음']],state.review);content+='</div></div>';}
if(state.step===4){content='<div class="stage-label">CHAPTER 5 / 5 · 다시 W</div><h2>다음 날, 내 이야기를 이어서</h2><p class="description">시연상 다음 날 D1입니다. 첫 장면의 목표·진료 질문과 의료진 판단이 오늘의 계획으로 돌아왔어요.</p><div class="goal-card"><small>내가 지키고 싶은 일</small><strong>아이와 아침 산책할 체력을 되찾고 싶어요.</strong></div><div class="effective"><b>오늘 D1 유효: 승인 계획 v2 · 오후 실천</b><span>의료진 확인 기록 + 야간 근무 맥락 + 변경 승인 이력</span></div><div class="practice-app"><div class="app-label">활동 기록 <span>관찰과 수행은 별도</span></div><div class="practice-body"><p>가상 활동계에 <b>12분</b>이 표시됐어요. 오늘 관찰 기록에 남겨 보세요.</p><form id="activity-form"><label class="record-label" for="activity">활동 시간 (분)</label><div class="record-row"><input id="activity" type="number" inputmode="numeric" min="0" max="1440" placeholder="12" value="'+esc(l.minutes??'')+'" '+(l.recorded?'disabled':'')+'><button type="submit" class="primary" '+(l.recorded?'disabled':'')+'>기록 저장</button></div></form>'+(l.recorded?panelStatus('관찰 기록: 12분 · 오늘 D1','blue')+'<label class="check-row"><input type="checkbox" data-field="today" '+(l.today?'checked':'')+' '+(state.review?'disabled':'')+'>오늘 유효한 v2 계획을 확인했어요</label>'+(!state.review?taskButton('내 이야기 한 바퀴 완성','finish-loop',!l.today):''):'')+'<p class="compact">관찰을 기록한 것만으로 계획 전체를 수행했다고 처리하지 않아요.</p></div></div>';}
return content+feedbackHTML()+(state.review?goNext():'');}
function decisionButtons(items,disabled){return '<div class="choice-list">'+items.map((c,i)=>'<button class="choice '+(state.selected[0]===i?'selected':'')+'" data-action="decision" data-id="'+i+'" '+(disabled?'disabled':'')+'><span class="key">'+String.fromCharCode(65+i)+'</span><span><b>'+c[0]+'</b><small>'+c[1]+'</small></span></button>').join('')+'</div>';}
function decide(i){if(state.review)return;const correct={1:1,2:2,3:1};if(!(state.step in correct)||!Number.isInteger(i)||i<0||i>2||state.step===3&&!state.local.approved)return;state.selected=[i];if(i===correct[state.step]){const records={1:['의료진 확인·수정','M1: 검사 출처 + 가상 진단·진료일 + 수정 이력 보존'],2:['내 말로 확인한 퇴원 교육','M2: 생활 맞춤 교육 · 기록 → 요청 → 승인·적용일 확인'],3:['변경 요청 → 검토 → 승인','M3: v2 승인 · 오늘은 v1, 내일부터 v2']};completeTask(...records[state.step]);}else{state.errors++;state.feedback={bad:true,title:'이 차이를 한 번 더 살펴봐요',text:state.step===1?'검사와 진료 판단은 출처와 역할이 다릅니다. 최신 판단을 반영하면서 원래 출처와 수정 이력을 함께 남겨야 해요.':state.step===2?'자료를 받는 것과 이해하는 것은 달라요. 어려움을 알리고, 요청·승인·적용일을 구분해 설명해 보세요.':'계획 v2의 적용일은 내일 D1입니다. 오늘은 아직 v1이 유효하며 변경 전 기록도 보존해요.'};}render();focusTask();}
function focusTask(){const el=$('.feedback')||$('#app h2');if(el){el.setAttribute('tabindex','-1');el.focus({preventScroll:true});}}
function practiceAction(a){if(state.mode!=='journey'||state.review)return;const l=state.local;if(a==='save-summary'&&state.step===0&&l.question){l.saved=true;state.feedback={title:'개인 초안에 저장했어요',text:'저장만으로는 전달되지 않습니다. 아래에서 공유 범위를 보고 동의해 주세요.'};}
else if(a==='send-summary'&&state.step===0&&l.saved&&l.consent)completeTask('동의한 요약 전달','W → M1: 산책 목표 · 야간 근무 · IRS+ · 질문. 전달 완료와 의료진 열람은 별도.');
else if(a==='request-plan'&&state.step===3){l.requested=true;state.feedback={title:'변경 요청을 접수했어요',text:'아직 승인되지 않았어요. 현재 유효한 계획 v1은 유지됩니다.'};}
else if(a==='approve-plan'&&state.step===3&&l.requested){l.approved=true;state.feedback=null;}
else if(a==='finish-loop'&&state.step===4&&l.recorded&&l.today)completeTask('오늘의 계획 + 새 관찰','다시 W · D1: v2 적용 확인 · 활동 12분 기록 · 산책 목표 유지');
else return;render();focusTask();}
function recordActivity(){if(!guard()||state.mode!=='journey'||state.step!==4||state.review)return;const l=state.local;l.minutes=$('#activity').value;if(l.minutes.trim()!==''&&Number(l.minutes)===12){l.recorded=true;state.feedback={title:'오늘의 관찰을 기록했어요',text:'활동 12분을 남겼습니다. 오늘 유효한 계획도 확인하고 마무리해 보세요.'};}else{state.feedback={bad:true,title:'가상 활동계 값을 확인해 주세요',text:'이 미션에서는 화면에 제시된 12분을 입력하세요. 실제 건강정보는 입력하지 않습니다.'};}render();focusTask();}
function showExit(){const d=$('#exit-dialog');if(d.open)return;d.showModal();$('#stay').focus();}
function help(){const h=state.mode==='memory'?'개인 목표·검사 출처·의료진 판단을 구분해 핵심 카드를 고르세요. 선택한 카드를 다시 누르면 해제할 수 있어요.':state.mode==='tools'?'상황을 먼저 고른 뒤 맞는 기능을 선택하세요. 순서는 자유이며 위쪽 여정 표시는 실제 연결한 단계에 맞춰 바뀝니다.':['질문을 추가해 저장 → 공유 동의 → 요약 전달 순서로 진행해요.','최신 판단과 원래 검사 출처를 함께 남기는 선택을 찾아보세요.','내 생활에서 할 행동을 본인 말로 설명하는 문장을 찾아보세요.','요청 → 검토 → 승인 → 적용 시점을 차례로 확인해요.','가상 활동계의 12분을 기록한 뒤 오늘 유효한 계획을 확인하세요.'][state.step];state.feedback={title:'이 장면의 도움말',text:h};render();focusTask();}

function next(){if(!state.review)return;const total=state.mode==='memory'?3:5;if(state.step===total-1){finish(false);return;}state.step++;state.review=false;state.selected=[];state.feedback=null;state.local={};render();focusHeading();window.scrollTo({top:0,behavior:'instant'});}
function finish(timeout){if(!state||state.ended)return;state.ended=true;clearInterval(ticker);if($('#exit-dialog').open)$('#exit-dialog').close();const seconds=Math.max(0,Math.floor((Date.now()-state.start)/1000)),total=state.mode==='memory'?3:5;saved.push({mode:state.mode,seconds,correct:state.correct,total});saved=saved.slice(-20);try{localStorage.setItem('invites-loop-unified-v1',JSON.stringify(saved))}catch{}const hints={memory:'핵심은 대화 횟수가 아니라 이어진 맥락입니다. 내 목표와 걱정이 진료 판단, 퇴원 교육, 승인된 계획에 연결되면 매번 같은 이야기를 반복할 필요가 줄어듭니다.',tools:'진료 전에는 요약, 진료실에서는 확인·수정, 퇴원 시에는 개인화 교육, 이후에는 추적·조정 요청, 일상에서는 누적 맥락을 사용합니다.',journey:'환자의 동의로 시작하고, 의료진의 확인과 승인으로 이어지며, 개인의 목표로 돌아옵니다. W는 출처 있는 진료 기록을 전달하고, 승인된 계획 안에서 일상을 지원합니다.'};$('#app').innerHTML=`<section class="result-hero"><div class="result-icon" aria-hidden="true">${timeout?'◷':'↻'}</div><p class="overline">${modes[state.mode].name} · LEARNING MAP</p><h1>${timeout?'5분, 여기서 한 번 정리해요.':'내 이야기가 한 바퀴 이어졌어요.'}</h1><p>${timeout?'시간이 되어 게임을 마쳤어요. 완료한 내용과 아직 남은 여정을 아래 지도에서 확인하세요.':'작은 선택이 모여, 한 사람의 이야기가 다음 돌봄의 출발점이 됩니다.'}</p><div class="result-stats"><div><strong>${state.correct} / ${total}</strong><small>완료한 연결</small></div><div><strong>${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}</strong><small>함께한 시간</small></div><div><strong>${state.errors}</strong><small>다시 생각한 선택</small></div></div></section><section class="board"><div class="section-title"><h2>내가 배운 Invites Loop</h2><span class="tag">W → M1 → M2 → M3 → W</span></div><div class="learning-map">${stages.map((s,i)=>`<article class="learning-stop ${state.completedStages.includes(i)?'is-complete':''}"><span class="map-status">${state.completedStages.includes(i)?'✓ 직접 체험':'○ 여정 안내'}</span><em>0${i+1} · ${stageNames[i]}</em><b>${s}</b><p>${mapText[i]}</p></article>`).join('')}</div><div class="result-detail"><div><h3>${modes[state.mode].type} · 가져갈 한 가지</h3><p>${hints[state.mode]}</p><p><b>IRS+ 위험 ≠ 확정 진단.</b> 원래 검사 출처와 의료진 확인·수정 이력은 함께 남습니다.</p></div><div><h3>이번에 직접 이어 본 기록</h3>${state.events.length?`<ul class="list-clean">${state.events.map(e=>`<li>${e.title}<span>${e.text}</span></li>`).join('')}</ul>`:'<p>아직 완료된 선택이 없어요. 학습 지도를 읽고 다시 도전해 보세요.</p>'}${state.correct<total?`<p>아직 ${total-state.correct}개 연결이 남았어요. 위 지도는 완료 여부와 관계없이 전체 여정을 보여줍니다.</p>`:''}</div></div><div class="action-row result-actions"><button class="secondary" data-action="print">결과 인쇄·PDF 저장</button><button class="secondary" data-action="replay">한 번 더 해 보기</button><button class="primary" data-action="home">다른 게임 선택 →</button></div></section><p class="notice">이 게임의 환자·검사·진단·승인 기록은 모두 가상입니다. 표시된 진료·교육·계획은 체험용 예시입니다. 입력과 게임 상태는 외부로 전송되지 않습니다.</p>`;announce(timeout?'5분이 지나 학습 지도로 이동했습니다.':'게임을 마쳤습니다. 학습 지도를 확인하세요.');focusHeading();window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='timer-toggle'){timed=!timed;home();return;}if(a==='clear-results'){saved=[];try{localStorage.removeItem('invites-loop-unified-v1')}catch{}home();announce('이 기기의 체험 기록을 지웠어요.');return;}if(a==='print'){window.print();return;}if(a==='stay'){$('#exit-dialog').close();return;}if(a==='leave'){$('#exit-dialog').close();home();focusHeading();return;}if(a==='start'){start(b.dataset.mode);return;}if(a==='home'){home();focusHeading();return;}if(a==='replay'){start(state.mode);return;}if(a==='exit'){if(guard())showExit();return;}if(!guard())return;if(a==='help'){help();return;}if(a==='format'&&state.mode==='journey'&&state.step===2){state.local.format=Number(b.dataset.id);render();return;}if(['save-summary','send-summary','request-plan','approve-plan','finish-loop'].includes(a)){practiceAction(a);return;}if(a==='fact')chooseFact(b.dataset.id);if(a==='pack'){pack();focusTask();}if(a==='next')next();if(a==='situation'){state.activeMatch=b.dataset.id;state.feedback=null;render();const el=$(`[data-action="situation"][data-id="${b.dataset.id}"]`);if(el)el.focus({preventScroll:true});}if(a==='tool'){matchTool(b.dataset.id);focusTask();}if(a==='decision')decide(Number(b.dataset.id));if(a==='finish')finish(false);});
document.addEventListener('change',e=>{if(!guard()||state.mode!=='journey'||state.review)return;const f=e.target.dataset.field;if(!['question','consent','today'].includes(f))return;state.local[f]=e.target.checked;render();const el=document.querySelector('[data-field="'+f+'"]');if(el)el.focus({preventScroll:true});});
document.addEventListener('submit',e=>{if(e.target.id==='activity-form'){e.preventDefault();recordActivity();}});
document.addEventListener('input',e=>{if(state&&!state.ended&&e.target.id==='activity')state.local.minutes=e.target.value;});
document.addEventListener('visibilitychange',tick);window.addEventListener('pageshow',tick);window.addEventListener('focus',tick);home();
</script>
</body>
</html>
