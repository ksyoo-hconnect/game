<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9edf3">
<title>LOOP 플레이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  --page:#e9edf3; --pink:#ffecdc;
  --f:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --fd:"Jua",var(--f); --fp:"Silkscreen","Courier New",monospace;
  --dot:#1a1a1a; --red:#e5322d; --gold:#f2b632;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--page);font:14px/1.6 var(--f);color:#202124;display:flex;justify-content:center;align-items:center;gap:44px;min-height:100vh;min-height:100dvh;padding:20px;-webkit-user-select:none;user-select:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid #a8c7fa;outline-offset:2px}
[hidden]{display:none!important}
img{-webkit-user-drag:none}

/* ===== 시연 패널 (데스크톱) ===== */
.panel{width:300px;display:flex;flex-direction:column;gap:14px}
.panel .eye{font:700 11px/1 var(--f);letter-spacing:.16em;color:#7a8595}
.panel h1{font:400 34px/1.15 var(--fd);margin:0}
.panel h1 small{display:block;font:600 13px/1.5 var(--f);color:#677183;margin-top:6px}
.panel p{margin:0;color:#5f6b7b;font-size:13px}
.mode{display:flex;flex-direction:column;gap:3px;text-align:left;background:#fff;border:1px solid #dfe5ee;border-left:5px solid var(--c);border-radius:16px;padding:12px 14px;transition:transform .15s}
.mode:hover{transform:translateX(3px)}
.mode b{font:400 19px/1.2 var(--fd)}
.mode span{font-size:12px;color:#5f6b7b;line-height:1.5}
.mode i{font-style:normal;font-size:11px;color:var(--c);font-weight:700}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prow button{font-size:12px;background:#fff;border:1px solid #dfe5ee;border-radius:10px;padding:5px 10px}
.pts{font:400 13px var(--fp);background:var(--gold);border:2px solid var(--dot);border-radius:99px;padding:1px 10px}

/* ===== 폰과 앱 화면 (인바이츠루프 V5 기본 화면) ===== */
.phone{width:392px;height:min(846px,calc(100dvh - 40px));padding:10px;background:#1c1f24;border-radius:48px;box-shadow:0 30px 70px rgba(30,40,60,.28),inset 0 0 0 2px #3a3f47;flex:none;position:relative}
.screen{
  --bg:#fff; --ink:#202124; --muted:#7a8595; --line:#eef0f4; --soft:#f0f3f8; --chipbd:#dce5f3; --chipink:#476690; --accent:#4285f4; --card:#fff; --userb:#edf2fa;
  position:relative;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;transition:background .35s,color .35s}
.screen[data-theme=dark]{--bg:#131417;--ink:#e8eaed;--muted:#9aa0a6;--line:#25282e;--soft:#1f2226;--chipbd:#353a43;--chipink:#a8c7fa;--accent:#8ab4f8;--card:#1b1d21;--userb:#2a3140}
.screen[data-theme=warm]{--bg:#fff9f1;--ink:#3b2f26;--muted:#8d7b6c;--line:#f1e5d6;--soft:#f6ecdf;--chipbd:#ead9c4;--chipink:#8a5a33;--accent:#d9824b;--card:#fffdf9;--userb:#f6e6d2}
.sb{height:34px;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0;font-size:13px;font-weight:650;flex:none}
.sb i{font-style:normal;letter-spacing:2px;font-size:11px}
.apphead{height:54px;display:flex;align-items:center;padding:0 10px;gap:4px;border-bottom:1px solid var(--line);flex:none}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.icon:active{background:var(--soft)}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{flex:1;font-size:16.5px;font-weight:650;letter-spacing:-.5px;padding-left:2px}
.brand b{background:linear-gradient(130deg,#4285f4,#9672de,#d18fc5);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:4px}
.chat{flex:1;overflow-y:auto;padding:22px 18px 14px;scroll-behavior:smooth;transition:padding .3s}
.date{text-align:center;color:var(--muted);font-size:11px;margin-bottom:18px}
.welcome{font-size:23px;line-height:1.45;margin:0 0 18px;font-weight:600;letter-spacing:-.8px}
.welcome span{background:linear-gradient(90deg,#3679d9,#9672c4);-webkit-background-clip:text;background-clip:text;color:transparent}
.screen[data-theme=warm] .welcome span{background:linear-gradient(90deg,#d9824b,#c0587a);-webkit-background-clip:text;background-clip:text}
.user{background:var(--userb);border-radius:20px 20px 5px 20px;padding:10px 15px;margin:16px 0 18px auto;font-size:13.5px;width:fit-content;max-width:82%;animation:appear .25s}
.ai{margin-bottom:16px;animation:appear .25s}
.ai .mark{background:linear-gradient(130deg,#4285f4,#9672de);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:19px;line-height:1;margin-bottom:6px}
.ai p{font-size:14px;line-height:1.75;margin:0 0 10px;letter-spacing:-.2px}
.loading{background:linear-gradient(90deg,#8192ac 20%,#c4dafc 45%,#4285f4 50%,#8192ac 75%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.3s linear infinite;font-size:13px}
@keyframes shine{to{background-position:-250% 0}}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
.card{border:1px solid var(--line);border-radius:18px;padding:14px 15px;margin:10px 0;background:var(--card)}
.ch{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.ch .sub{font-size:10.5px;color:var(--muted)}
.num{font-size:30px;font-weight:600;letter-spacing:-1px;margin-top:8px}
.num small{font-size:13px;color:var(--muted);font-weight:400}
.sub2{font-size:11.5px;color:var(--muted)}
.spark{width:100%;height:70px;display:block;margin-top:6px}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.bigs{font-size:16px;font-weight:600;line-height:1.6;margin:8px 0 0!important}
.fn{font-size:10.5px;color:var(--muted);margin-top:8px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.chip{border:1px solid var(--chipbd);color:var(--chipink);border-radius:18px;padding:7px 12px;font-size:12.5px;background:var(--card);text-align:left}
.chip:active{background:var(--soft)}
.hcard{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:13px 15px;margin:10px 0;animation:appear .3s}
.hcard b{font-size:14.5px}
.hcard small{font-size:12px;color:var(--muted)}
.hcard.wk{background:linear-gradient(120deg,#fff3d6,#ffe4ec);border-color:#f3d7a4;color:#3b2f26}
.hcard.wk small{color:#8a6d4b}
.hcard.tip{flex-direction:row;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:10px 14px}
.hcard.start{background:linear-gradient(120deg,#e3ecff,#efe6ff);color:#24324d;border-color:#d3defa}
.hcard.start small{color:#5a6a8a}
.rt{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.rt li{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.rt li:first-child{border-top:0}
.mem{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:center}
.mem img{width:78px;height:auto}
.mem .tagm{display:inline-block;font-size:12px;background:var(--soft);border-radius:8px;padding:2px 8px;margin:4px 0}
.btnrow{display:flex;gap:7px;margin-top:8px}
.bt{flex:1;border-radius:14px;padding:9px;font-weight:650;font-size:13px;background:var(--soft)}
.bt.pri{background:var(--accent);color:#fff}
.sos{border:2px solid #e5322d;background:#fff5f4;color:#3a1515}
.sos .ch b{color:#c62828}
.call{width:100%;margin-top:10px;background:#e5322d;color:#fff;border-radius:14px;padding:11px;font-weight:700;font-size:14px}
.composer{padding:6px 12px 14px;flex:none;position:relative;background:var(--bg)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:4px 2px 9px;max-height:42vh;overflow-y:auto;animation:appear .2s}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{white-space:normal;flex:0 1 auto;line-height:1.35}
.inputbox{background:var(--soft);border-radius:26px;display:flex;align-items:center;gap:2px;padding:5px 5px 5px 6px}
.inputbox input{flex:1;min-width:0;border:0;outline:0;background:none;padding:9px 4px;font-size:13.5px;-webkit-user-select:text;user-select:text}
.inputbox input::placeholder{color:var(--muted)}
.ci{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ci svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.send{background:#d3e3fd;color:#264e8b}
.screen[data-theme=dark] .send{background:#2b3a55;color:#a8c7fa}
.disc{font-size:9.5px;color:var(--muted);text-align:center;margin-top:6px}

/* 더보기 메뉴 · 서랍 */
.more{position:absolute;right:10px;top:84px;z-index:46;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(20,30,50,.18);min-width:214px;padding:6px;animation:appear .18s}
.more button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:13.5px}
.more button:active{background:var(--soft)}
.more hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.more .new{margin-left:auto;font-size:10px;font-weight:700;color:#fff;background:#e5322d;border-radius:6px;padding:0 5px}
.scrim{position:absolute;inset:0;z-index:44;background:rgba(10,15,25,.32);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:absolute;left:0;top:0;bottom:0;width:80%;z-index:45;background:var(--soft);padding:48px 16px 20px;overflow-y:auto;animation:slidein .22s ease-out;box-shadow:12px 0 40px rgba(20,30,50,.18)}
@keyframes slidein{from{transform:translateX(-100%)}}
.drawer h3{font-size:17px;margin:0 0 14px}
.drawer h4{font-size:11px;color:var(--muted);margin:18px 6px 4px;font-weight:600}
.drawer button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 8px;border-radius:12px;font-size:13.5px}
.drawer button:active{background:var(--line)}
.drawer button:disabled{opacity:.45;cursor:default}
.drawer small{font-size:10.5px;color:var(--muted);margin-left:auto}
.drawer .ptsrow{margin-top:16px;padding:12px;border-radius:14px;background:var(--card);display:flex;justify-content:space-between;font-size:13px}

/* 공통 레이어 · 시트 · 토스트 */
.layer{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:fade .3s;overflow:hidden}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -12px 40px rgba(20,30,50,.18);padding:16px 18px 22px;animation:sheetup .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes sheetup{from{transform:translateY(100%)}}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:18px;letter-spacing:-.5px}
.sheet .sub2{margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--chipbd);border-radius:14px;padding:12px 14px;text-align:left;font-size:14.5px;font-weight:600;background:var(--card);display:flex;justify-content:space-between;align-items:center}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.opt small{font-weight:400;color:var(--muted);font-size:11.5px}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:18px;border-radius:4px}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:95;background:#202124;color:#fff;border-radius:14px;padding:9px 15px;font-size:13px;white-space:nowrap;animation:appear .25s;pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.plus{position:absolute;right:22px;top:96px;z-index:96;font:700 18px var(--fp);color:#e0a000;text-shadow:1px 1px 0 #fff,2px 2px 0 var(--dot);animation:plusup 1.1s forwards;pointer-events:none}
@keyframes plusup{to{transform:translateY(-34px);opacity:0}}
.hint{outline:3px solid #ffb300!important;outline-offset:3px;animation:hintp 1s infinite;position:relative;z-index:6}
@keyframes hintp{50%{outline-color:transparent;box-shadow:0 0 0 8px #ffb30033}}
.go{width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:13px;font-size:15.5px;font-weight:700;animation:appear .3s}
.go.dark{background:#202124}
.go.gold{background:var(--gold);color:var(--dot);border:2px solid var(--dot);box-shadow:3px 3px 0 var(--dot)}
.go:active{transform:translateY(2px)}
.x{position:absolute;right:14px;top:44px;z-index:5;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:18px}
.ptpill{font:400 12px var(--fp);background:var(--gold);color:var(--dot);border:2px solid var(--dot);border-radius:99px;padding:1px 9px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}

/* ===== 온보딩 · 도입 (박정언 그림) ===== */
.intro .iscene{position:relative;flex:1;background:#2a2320 center/cover no-repeat}
.intro .iscene::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
.ihero{position:absolute;left:50%;bottom:31%;height:40%;transform:translateX(-58%);z-index:2;transition:opacity .15s;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.ibub{position:absolute;left:52%;bottom:72%;z-index:3;background:#fff;border-radius:16px;padding:7px 13px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:appear .3s}
.ibub::after{content:"";position:absolute;left:18px;top:100%;border:7px solid transparent;border-top-color:#fff}
.noti{position:absolute;left:12px;right:12px;top:86px;z-index:4;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-radius:20px;padding:11px 14px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:notidown .45s cubic-bezier(.2,.9,.3,1.2);color:#202124}
@keyframes notidown{from{transform:translateY(-140%)}}
.noti .ap{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4285f4,#9672de);color:#fff;display:grid;place-items:center;font-size:17px}
.noti b{font-size:13px;display:block}
.noti span{font-size:12px;color:#5f6368}
.noti small{font-size:11px;color:#80868b;align-self:start}
.ifoot{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 18px 26px;display:flex;flex-direction:column;gap:10px;color:#fff}
.ifoot .cap{font:400 22px/1.35 var(--fd);text-shadow:0 2px 8px rgba(0,0,0,.4)}
.skip{position:absolute;right:16px;top:46px;z-index:5;color:#fff;font-size:12px;background:rgba(0,0,0,.35);border-radius:99px;padding:4px 11px}

/* ===== 온보딩 · 동의 (정다운) ===== */
.consent{background:linear-gradient(#0f1830,#23305a 60%,#3a3f6a);color:#eef2ff;overflow-y:auto}
.consent .ct{padding:52px 22px 0;display:flex;flex-direction:column;gap:6px}
.consent .ct small{font:400 11px var(--fp);letter-spacing:.14em;color:#a9b6ff}
.consent h2{margin:0;font:400 26px/1.3 var(--fd)}
.consent p{margin:0;font-size:13.5px;color:#cfd6f5}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 14%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 82% 9%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 66% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 92% 36%,#fff 50%,transparent 51%);pointer-events:none}
.moon{position:absolute;right:28px;top:120px;width:38px;height:38px;border-radius:50%;box-shadow:-9px 4px 0 0 #ffe9a8}
.house{position:relative;margin:18px auto 0;width:236px;flex:none}
.roof{height:54px;background:#1b2240;clip-path:polygon(50% 0,100% 100%,0 100%);margin:0 -14px}
.facade{background:#2a335c;border:3px solid #141a33;border-top:0;padding:18px 18px 0;display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.win{display:flex;flex-direction:column;align-items:center;gap:5px;color:#cfd6f5}
.win .pane{width:100%;aspect-ratio:1.3;border:4px solid #141a33;border-radius:6px;background:#11172e;display:grid;place-items:center;font-size:30px;position:relative;transition:background .4s,box-shadow .4s;filter:grayscale(1) brightness(.6)}
.win .pane::before,.win .pane::after{content:"";position:absolute;background:#141a33}
.win .pane::before{left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%)}
.win .pane::after{top:50%;left:0;right:0;height:4px;transform:translateY(-50%)}
.win.on .pane{background:radial-gradient(#fff6c7,#ffd76a);box-shadow:0 0 30px 6px #ffd76a88;filter:none}
.win b{font-size:13px}
.win small{font-size:10.5px;color:#9fa9d6;margin-top:-4px}
.door{height:40px;width:44px;margin:10px auto 0;background:#141a33;border-radius:22px 22px 0 0;grid-column:1/-1}
.loopsay{margin:14px 22px 0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 13px;font-size:13px;min-height:44px;display:flex;gap:8px;align-items:flex-start}
.loopsay b{color:#ffd76a;flex:none}
.cfoot{margin-top:auto;position:sticky;bottom:0;background:linear-gradient(transparent,#3a3f6a 30%);padding:18px 22px 22px;display:flex;flex-direction:column;gap:8px}
.cfoot .later{color:#a9b6ff;font-size:13px;padding:6px}
.cfoot .note{font-size:11px;color:#9fa9d6;text-align:center}

/* ===== 온보딩 · 비서 방탈출 × 법정 (육소연 · 민채현) ===== */
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.ctitle{overflow-y:auto;background:#3a2316 repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 46px);color:#fff7e6;align-items:center;text-align:center;padding:48px 22px 24px;gap:12px}
.ctitle small{font:400 12px var(--fp);letter-spacing:.2em;color:#ffcf7a}
.ctitle h2{margin:0;font:400 44px/1.05 var(--fd);color:#fff;-webkit-text-stroke:2px var(--dot);text-shadow:4px 4px 0 var(--dot)}
.ctitle h2 em{font-style:normal;display:block;font-size:22px;color:#ffcf7a;-webkit-text-stroke:0;text-shadow:2px 2px 0 var(--dot);margin-top:8px}
.bench{position:relative;width:200px;height:160px;margin:6px auto 0}
.bench canvas{width:128px;height:128px;margin:0 auto;animation:bobp 1.2s steps(2) infinite}
@keyframes bobp{50%{transform:translateY(-3px)}}
.bench::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38px;background:#7a4a2a;border:3px solid var(--dot);border-radius:6px 6px 0 0}
.dotbox{background:#fff;color:var(--dot);border:3px solid var(--dot);box-shadow:4px 4px 0 var(--dot);border-radius:4px;padding:10px 12px;text-align:left;font-weight:700;font-size:14px;line-height:1.55;position:relative}
.dotbox .nm{position:absolute;left:10px;top:-13px;background:var(--dot);color:#fff;font:400 11px var(--fp);padding:2px 8px}
.rules{list-style:none;margin:0;padding:0;font-size:12.5px;text-align:left;display:flex;flex-direction:column;gap:5px;color:#ffe9c7}
.rules li::before{content:"▶ ";font-size:9px;color:#ffcf7a}
.court{position:absolute;left:0;right:0;top:88px;z-index:30;display:flex;flex-direction:column;gap:6px;padding:6px 8px 9px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 8px 14px rgba(0,0,0,.06)}
.court > *{pointer-events:auto}
.locks{display:flex;align-items:center;gap:4px;background:var(--dot);color:#fff;border-radius:4px;padding:4px 8px;font:400 11px var(--fp)}

.locks .tm{margin-left:auto}
.claim{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.claim canvas{width:52px;height:52px;background:#ffe9c7;border:3px solid var(--dot)}

.goal{font-size:12px;font-weight:700;color:var(--dot);background:#ffcf7a;border:3px solid var(--dot);border-radius:4px;padding:5px 10px;box-shadow:3px 3px 0 var(--dot)}
.goal .h{display:block;font-weight:600;color:#7a3d00}
.screen.courting .chat{padding-top:226px}
.screen.setup .chat{padding-bottom:300px}
.screen.setup .composer{visibility:hidden}
.sbtns{display:flex;gap:8px;margin-top:10px}
.sbtns .bt{flex:none;width:96px;border-radius:16px}
.sbtns .go{flex:1}
.opts.row3{grid-template-columns:repeat(3,1fr)}
.opts.row3 .opt{justify-content:center;padding:12px 6px;font-size:14px}
.ai.flash{animation:appear .25s,flashbg 1.4s}
@keyframes flashbg{0%,40%{background:#ffe9a8;border-radius:14px;box-shadow:0 0 0 8px #ffe9a8}}
.go:disabled{opacity:.4}
.cut{position:absolute;inset:0;z-index:80;display:grid;place-items:center;background:repeating-conic-gradient(from 0deg at 50% 50%,#fff 0 5deg,#ffd2cf 5deg 10deg);animation:fade .1s}
.cut .obj{font:400 62px/1 var(--fd);color:var(--red);-webkit-text-stroke:3px var(--dot);text-shadow:6px 6px 0 var(--dot);transform:rotate(-9deg);animation:objin .35s cubic-bezier(.3,1.7,.6,1)}
@keyframes objin{from{transform:rotate(-9deg) scale(2.6);opacity:0}}
.cut .who{position:absolute;bottom:18%;font:400 13px var(--fp);background:var(--dot);color:#fff;padding:3px 10px}
.modal{position:absolute;inset:0;z-index:70;background:rgba(10,12,20,.55);display:grid;place-items:center;padding:20px;animation:fade .2s}
.evi{width:100%;background:#fff;color:var(--dot);border:3px solid var(--dot);box-shadow:5px 5px 0 var(--dot);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:appear .3s}
.evi .tag{align-self:flex-start;font:400 11px var(--fp);background:var(--red);color:#fff;padding:2px 8px}
.evi h3{margin:0;font:400 22px/1.3 var(--fd)}
.evi .who2{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;font-weight:700;font-size:13.5px}
.evi .who2 canvas{width:44px;height:44px;background:#ffe9c7;border:3px solid var(--dot)}
.evi .key{font:400 14px var(--fp);text-align:center;background:#fff6d6;border:2px dashed #e0a000;border-radius:6px;padding:6px}
.evi .from{font-size:11px;color:#777}
.evi .go{background:var(--dot)}
.evi.xr{max-height:100%;overflow-y:auto;gap:9px}
.lbl2{font:700 11.5px var(--f);color:#7a3d00}
.stm{display:block;width:100%;text-align:left;border:3px solid var(--dot);border-radius:4px;padding:8px 10px;font-weight:700;font-size:13px;background:#fff;color:var(--dot);margin-bottom:6px;line-height:1.45}
.stm[aria-pressed=true]{background:#ffcf7a}
.ev{display:flex;flex-direction:column;text-align:left;width:100%;border:2px dashed #999;border-radius:6px;padding:7px 10px;margin-bottom:6px;background:#fffbea;color:var(--dot);gap:1px}
.ev b{font-size:13px}
.ev small{font-size:11.5px;color:#555;line-height:1.4}
.ev[aria-pressed=true]{border:3px solid var(--red);background:#ffe9e7}
.evi .go:disabled{opacity:.35}
.verdict{background:#3a2316 repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 46px);color:#fff7e6;padding:46px 20px 20px;gap:12px;overflow-y:auto}
.verdict h2{margin:0;text-align:center;font:400 34px var(--fd);color:#fff;-webkit-text-stroke:2px var(--dot);text-shadow:3px 3px 0 var(--dot)}
.stamp{align-self:center;margin:4px 0 6px;border:4px solid var(--red);color:var(--red);background:#fff7e6;font:400 22px var(--fd);padding:4px 16px;border-radius:10px;transform:rotate(-8deg);animation:objin .4s cubic-bezier(.3,1.7,.6,1)}
.rulelist{list-style:none;margin:0;padding:12px;background:#fff7e6;color:var(--dot);border:3px solid var(--dot);border-radius:6px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.rulelist li{display:flex;gap:8px}
.rulelist li::before{content:"🔓"}
.aim{position:relative;height:90px;margin:4px 0}
.verdict>*{flex:none}
.rwbox{background:#fff7e6;color:var(--dot);border:3px solid var(--dot);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700}
.rwbox b{font:400 16px var(--fd)}
.rwbox span{display:flex;justify-content:space-between}
.rwbox i{font-style:normal;color:#14b46a}
.vh{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#2a335c;border:3px solid var(--dot);border-radius:6px;padding:8px}
.vw{display:flex;flex-direction:column;align-items:center;gap:2px;color:#cfd6f5;font-size:10px;font-weight:700;text-align:center}
.vw span{width:100%;aspect-ratio:1;display:grid;place-items:center;font-size:20px;background:#11172e;border:3px solid #141a33;border-radius:4px;filter:grayscale(1) brightness(.55)}
.vw.on span{background:radial-gradient(#fff6c7,#ffd76a);filter:none;box-shadow:0 0 14px #ffd76a}
.wpick{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;background:#11172e;color:#eef2ff;border-radius:6px;padding:10px}
.wpick .wpane{width:54px;height:54px;display:grid;place-items:center;font-size:26px;background:radial-gradient(#fff6c7,#ffd76a);border:3px solid var(--dot);border-radius:4px}
.wpick b{font-size:14px;display:block}
.wpick small{font-size:12px;color:#cfd6f5;line-height:1.45}
.aim span{position:absolute;top:0;font:400 72px/1 var(--fd);color:#fff;-webkit-text-stroke:3px var(--dot);text-shadow:5px 5px 0 var(--dot);transition:left .9s cubic-bezier(.6,0,.3,1),color .6s}
.aim .i{color:#ffcf7a}
.iam{text-align:center;font:400 19px var(--fd);color:#ffcf7a;min-height:28px}
.ctime{text-align:center;font:400 12px var(--fp);color:#ffe9c7}

.hhead{padding:44px 16px 10px;display:flex;flex-direction:column;gap:8px;flex:none}

.hob .lb{position:absolute;top:100%;margin-top:4px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.78);border-radius:6px;padding:1px 7px;white-space:nowrap;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.3)}

.hbody{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:10px}
.hprog{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.hcardx{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:8px;animation:appear .25s}

.hcardx .top span{font-size:28px}

.hcardx .top small{display:block;font-size:11.5px;color:var(--muted)}
.where{font-size:12px;background:var(--soft);border-radius:10px;padding:7px 10px}
.where b{color:var(--accent)}
.lbl{font-size:11.5px;color:var(--muted);font-weight:600}
.mini{border-radius:14px;background:var(--soft);padding:10px;display:flex;flex-direction:column;gap:8px}
.mini .u{align-self:flex-end;background:var(--userb);border-radius:14px 14px 4px 14px;padding:6px 11px;font-size:12.5px}
.mini .a{font-size:12.5px;line-height:1.6}
.mini .a::before{content:"✦ ";color:#7d6ee0}
.sit{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.sit span{font-weight:700;margin-right:2px}
.sit button{border:1px solid var(--chipbd);border-radius:99px;padding:5px 10px;font-size:12px;background:var(--card);color:var(--chipink)}
.sit button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hgrid button{border:1px solid var(--line);border-radius:12px;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;background:var(--card)}

.hgrid button.seen{border-color:#2e9a6e}

/* ===== 주간 정리 · 리워드 (박정언 · 조민지) ===== */
.week{background:#f3f6fd;color:#172640}
.screen[data-theme=dark] .week{background:#151a26;color:#e6ebf7}
.whead{padding:44px 16px 8px;display:flex;align-items:center;gap:8px;flex:none}

.mc .ba::before{content:"∞";font:400 26px var(--fd)}

.mc .fa small{font-size:9.5px;color:#5d6b85}

.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}

.tl .miss{font-size:10px;color:#d26a4a;font-weight:700;margin-left:4px}
.track{position:relative;height:250px;border-radius:22px;overflow:hidden;background:#d9c center/auto 100% repeat-x;flex:none}

.loopbar{position:relative;height:30px;margin:0 6px}

.loopbar .fl{position:absolute;left:0;top:13px;height:4px;border-radius:4px;background:#4466e8}
.loopbar .st{position:absolute;top:4px;transform:translateX(-50%);font:400 10px var(--fp);background:#fff;border:2px solid #c9d3ee;border-radius:6px;padding:1px 5px;color:#5d6b85}
.loopbar .st.on{background:#4466e8;border-color:#4466e8;color:#fff}
.loopbar{margin:0 14px 14px}
.loopbar .st i{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font:600 9.5px var(--f);font-style:normal;color:#5d6b85;white-space:nowrap}
.goalf{position:absolute;right:5%;bottom:10%;font-size:34px;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.goalf small{font:700 10px var(--f);color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:0 6px}
.track .runner{transition:left .08s linear}
.track .runner.rest{filter:grayscale(.6) drop-shadow(0 6px 6px rgba(0,0,0,.25));transform:translateY(4px)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

.zst{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:9px;color:#172640;animation:appear .3s;box-shadow:0 6px 20px rgba(40,60,140,.12)}

.zh small{font-size:10px;color:#5d6b85;text-align:right}

.zok{position:absolute;right:8px;top:6px;border:3px solid #e5322d;color:#e5322d;font:400 14px var(--fd);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;transform:rotate(-14deg);animation:objin .35s cubic-bezier(.3,1.7,.6,1);background:#fff}
.zbeds{position:absolute;left:6px;right:6px;bottom:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.zbed{background:#fff;border:2px solid #3b2a2a;border-bottom-width:4px;border-radius:8px;padding:3px;font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;color:#172640}
.zbed b{font:400 12px var(--fp);color:#fff;border-radius:4px;padding:0 5px}
.zp1{background:#e5322d}.zp2{background:#e8902e}.zp3{background:#6aa0d8}
.zbed.done{background:#e5f6ee;opacity:.6}
.zbed.no{animation:shake .35s}
.zscr{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.zs{border:2px solid #3b2a2a;border-radius:12px;padding:7px;display:flex;flex-direction:column;gap:4px;font-size:11.5px;line-height:1.45}
.zs small{font:400 9px var(--fp);color:#fff;align-self:flex-start;border-radius:4px;padding:0 5px}
.zs.p{background:#fff8f2}.zs.p small{background:#c2754d}
.zs.d{background:#f3f7fd;font-family:var(--fp)}.zs.d small{background:#3d78dc}
.zs svg{width:100%;height:30px}
.zcap{font-size:12px;color:#5d6b85}
.tapbtn{width:100%;padding:18px;border-radius:20px;background:#4466e8;color:#fff;font:400 24px var(--fd);box-shadow:0 6px 0 #2c46b8}
.tapbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #2c46b8}
.room{position:relative;width:100%;aspect-ratio:640/853;max-height:340px;border-radius:22px;overflow:hidden;background:#2a2320 center 70%/cover no-repeat;flex:none}
.room .it{position:absolute;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));animation:pop .45s cubic-bezier(.3,1.8,.6,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(0)}}
.room .heart{position:absolute;left:88%;top:70%;font-size:18px;animation:heart 1.4s infinite}
@keyframes heart{50%{transform:translateY(-8px)}}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.shop button{background:#fff;border:2px solid #d3dcf0;border-radius:14px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;color:#172640}
.shop button span{font-size:24px}
.shop button em{font-style:normal;font:400 10px var(--fp);color:#b07a00}
.shop button.own{border-color:#2e9a6e;background:#effaf4}
.shop button.own em{color:#2e9a6e}
.shop button:disabled{opacity:.4}
.gbopts{display:flex;flex-direction:column;gap:7px}
.gbopts button{text-align:left;background:#fff;border:2px solid #d3dcf0;border-radius:14px;padding:10px 12px;font-weight:600;color:#172640}
.gbopts button[aria-pressed=true]{border-color:#4466e8;background:#eef2ff}
.spiral{width:100%;height:230px;background:radial-gradient(circle at 50% 50%,#fff,#e8eefc);border-radius:22px;flex:none}
.spiral path{fill:none;stroke:#4466e8;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;animation:draw 1.6s ease-out}
@keyframes draw{from{stroke-dashoffset:1}}
.spiral text{font:400 11px var(--fp);fill:#172640}
.gblist{background:#fff;border:2px dashed #c9d3ee;border-radius:14px;padding:10px 12px;font-size:13px;color:#172640}
.gblist small{display:block;font:400 10px var(--fp);color:#5d6b85;margin-bottom:2px}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(900px) rotate(540deg)}}

/* 첫 실행 화면 (모바일) */
.hcard.ptsc{background:linear-gradient(120deg,#e6f7ee,#eef8ff);border-color:#bfe6cf;color:#163a28}
.hcard.ptsc small{color:#4f7a62}
.pt{background:#fff;color:#111}
.pthead{display:flex;align-items:center;gap:14px;padding:44px 18px 10px;flex:none;font-size:20px}
.pthead b{flex:1;font-size:19px;letter-spacing:-.6px}
.pthead .close{width:32px;height:32px;border-radius:50%;background:#f2f2f2;font-size:15px}
.ptbody{flex:1;overflow-y:auto;padding:6px 18px 18px;display:flex;flex-direction:column;gap:14px}
.ptbody h2{margin:6px 0 4px;font-size:25px;font-weight:500;line-height:1.38;letter-spacing:-.8px}
.ptcard{background:#f5f5f5;border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ptcard div{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.ptcard b{font-size:16px}
.ptcard strong{font-size:20px;color:#14b46a;border-bottom:3px solid #14b46a;line-height:1.2}
.ptbtns{display:grid;grid-template-columns:1fr 1fr;border:1px solid #ddd;border-radius:4px}
.ptbtns button{padding:11px;font-size:14px}
.ptbtns button+button{border-left:1px solid #ddd}
.ptmis{background:#f3f3f3;margin:0 -18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ptmis small{font-size:13px;font-weight:700}
.ptmis h3{margin:-6px 0 4px;font-size:20px;font-weight:500}
.mi{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;position:relative;border-radius:14px;padding:4px}
.mi.game{background:#fff;padding:8px;box-shadow:0 0 0 2px #14b46a}
.mic{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px}
.mi.game .mic{background:#e6f7ee}
.mtx small{display:block;font-size:12.5px;font-weight:400;color:#555}
.mtx b{font-size:16px}
.mtag{background:#222;color:#fff;font-size:11px;border-radius:4px;padding:3px 7px;white-space:nowrap}
.mtag em{font-style:normal;color:#3ee08f}
.mtag.ok{background:#14b46a}
.mi i{position:absolute;left:8px;top:-7px;font:400 9px var(--fp);font-style:normal;background:#14b46a;color:#fff;border-radius:4px;padding:0 5px}
.pthist h3{margin:0 0 6px;font-size:16px}
.pthist div{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #eee}
.pthist b{color:#14b46a}
.pthist p{margin:0;font-size:12.5px;color:#888}
.ptnote{margin:0;font-size:11px;color:#999}
.pttab{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-top:1px solid #eee;padding:6px 6px 14px;text-align:center;font-size:18px;background:#fff}
.pttab small{display:block;font-size:10.5px;color:#333}
.pttab .on small{font-weight:700}
.pttab .plus{width:48px;height:48px;margin:-18px auto 0;border-radius:50%;background:#5b5bd6;color:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 6px 14px rgba(91,91,214,.4)}
.launch{background:linear-gradient(160deg,#eef3ff,#f6efff);color:#202124;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px}
.launch .lg{font-size:54px;background:linear-gradient(130deg,#4285f4,#9672de,#d18fc5);-webkit-background-clip:text;background-clip:text;color:transparent}
.launch h2{margin:0;font-size:24px;letter-spacing:-.6px}
.launch p{margin:0;color:#5f6b7b;font-size:13.5px}
.launch .go{max-width:280px}
.launch .alt{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.launch .alt button{font-size:12px;color:#476690;border:1px solid #d5def0;border-radius:99px;padding:5px 11px;background:#fff}

@media (max-width:760px){
  body{padding:0;display:block}
  .panel{display:none}
  .phone{width:100%;height:100vh;height:100dvh;padding:0;border-radius:0;background:none;box-shadow:none}
  .screen{border-radius:0}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- 흐름 취소 · 타이머 관리 ---------- */
let RUN=0, FLOW=''; const TM=new Set();
const later=(fn,ms)=>{ const id=setTimeout(()=>{TM.delete(id);fn()},ms); TM.add(id); return id };
const every=(fn,ms)=>{ const id=setInterval(fn,ms); TM.add(id); return id };
function wait(ms){ const r=RUN; return new Promise((res,rej)=>later(()=>r===RUN?res():rej('cancel'),ms)) }
function guard(r){ if(r!==RUN) throw 'cancel' }
const BUS=[];
function emit(e){ BUS.slice().forEach(f=>f(e)) }
function onBus(f){ BUS.push(f); return ()=>{ const i=BUS.indexOf(f); if(i>=0) BUS.splice(i,1) } }
function until(pred){ const r=RUN; return new Promise((res,rej)=>{ const off=onBus(e=>{ if(r!==RUN){off();rej('cancel');return} if(pred(e)){off();res(e)} }) }) }
function clickOnce(el){ const r=RUN; return new Promise((res,rej)=>{ el.addEventListener('click',()=>r===RUN?res():rej('cancel'),{once:true}) }) }

/* ---------- 소리 (WebAudio · 민채현 법정 칩튠) ---------- */
const AU={ctx:null,timer:null,step:0,next:0,track:null};
function ac(){ if(!AU.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AU.ctx=new C() } if(AU.ctx.state==='suspended') AU.ctx.resume(); return AU.ctx }
function tone(type,f,t,dur,vol){ const c=AU.ctx,o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.02) }
function noise(t,dur,vol){ const c=AU.ctx,b=c.createBuffer(1,Math.ceil(c.sampleRate*dur),c.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const s=c.createBufferSource(),g=c.createGain(); s.buffer=b; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(g).connect(c.destination); s.start(t) }
const hz=m=>440*2**((m-69)/12);
const TRACKS={
  court:{bpm:132,mel:[69,0,72,76,74,72,71,72,69,0,64,0,69,71,72,0,74,0,77,76,74,72,71,74,76,0,0,68,71,0,76,0],bas:[45,45,40,45,45,45,40,40,50,50,45,50,52,52,56,52]},
  press:{bpm:150,mel:[76,76,0,76,74,76,77,0,76,76,0,76,74,72,71,0,72,72,0,72,71,72,74,0,76,0,74,0,72,0,71,68],bas:[45,57,45,57,45,57,45,57,41,53,41,53,40,52,44,56]},
  calm:{bpm:100,soft:1,mel:[72,0,76,0,79,0,76,0,74,0,77,0,81,0,77,0,72,0,76,0,79,0,84,0,79,0,76,0,74,0,0,0],bas:[48,48,55,55,50,50,57,57,48,48,55,55,43,43,50,50]}
};
function music(name){
  musicStop(); AU.track=name;
  if(!S.sound||!name||!ac()) return;
  AU.next=AU.ctx.currentTime+.05; AU.step=0;
  AU.timer=setInterval(()=>{ const c=AU.ctx,T=TRACKS[AU.track]; if(!T) return; const e=60/T.bpm/2;
    while(AU.next<c.currentTime+.2){ const i=AU.step%32,m=T.mel[i];
      if(m) tone(T.soft?'triangle':'square',hz(m),AU.next,e*.9,T.soft?.028:.03);
      if(i%2===0) tone('triangle',hz(T.bas[i/2]),AU.next,e*1.8,T.soft?.05:.08);
      if(!T.soft&&i%2===1) noise(AU.next,.04,.018);
      AU.next+=e; AU.step++ } },50);
}
function musicStop(){ clearInterval(AU.timer); AU.timer=null }
function sfx(k){
  if(!S.sound||!ac()) return; const t=AU.ctx.currentTime;
  const seq={tap:[['square',660,0,.035,.025]],ok:[['triangle',660,0,.09,.07],['triangle',990,.09,.16,.07]],
    coin:[['square',988,0,.07,.045],['square',1319,.07,.18,.045]],
    bang:[['sawtooth',65,0,.35,.13],['square',523,.12,.08,.06],['square',659,.2,.08,.06],['square',784,.28,.08,.06],['square',1047,.36,.3,.06]],
    wrong:[['square',196,0,.12,.06],['square',147,.12,.25,.06]],key:[['triangle',1047,0,.08,.06],['triangle',1568,.08,.22,.06]],
    flip:[['triangle',520,0,.05,.04]],ding:[['sine',1318,0,.5,.08],['sine',1760,.12,.6,.06]],
    win:[['square',523,0,.12,.05],['square',659,.12,.12,.05],['square',784,.24,.12,.05],['square',1047,.36,.45,.05]],
    step:[['triangle',300+Math.random()*60,0,.03,.03]]}[k];
  if(k==='bang') noise(t,.3,.14);
  if(seq) seq.forEach(([w,f,d,du,v])=>tone(w,f,t+d,du,v));
}

const LM={smug:[[4,9,"e"],[5,9,"e"],[10,9,"e"],[11,9,"e"],[8,10,"e"],[9,10,"e"]],sweat:[[5,8,"e"],[5,9,"e"],[10,8,"e"],[10,9,"e"],[7,10,"e"],[8,10,"e"],[14,5,"s"],[14,6,"s"],[1,8,"s"]],broken:[[4,8,"e"],[6,8,"e"],[5,9,"e"],[4,10,"e"],[6,10,"e"],[9,8,"e"],[11,8,"e"],[10,9,"e"],[9,10,"e"],[11,10,"e"],[7,11,"e"],[8,11,"e"],[14,5,"s"],[14,6,"s"],[1,7,"s"],[1,8,"s"]],happy:[[5,8,"e"],[4,9,"e"],[6,9,"e"],[10,8,"e"],[9,9,"e"],[11,9,"e"],[7,10,"e"],[8,10,"e"]],idle:[[5,8,"e"],[5,9,"e"],[10,8,"e"],[10,9,"e"],[7,10,"e"],[8,10,"e"]]};
const LP={'#':'#1a1a1a',e:'#1a1a1a',o:'#1a1a1a',h:'#785434',l:'#aa7c52',a:'#ffecdc',p:'#ffa0a0',t:'#1a71ff',s:'#78aaff'};
function liam(mood='idle'){
  const g=LB.map(r=>r.split('')); if(mood!=='broken'){ g[10][4]='p'; g[10][11]='p' }
  for(const [x,y,c] of LM[mood]) g[y][x]=c;
  const cv=document.createElement('canvas'); cv.width=cv.height=16; cv.className='px'; const x=cv.getContext('2d');
  g.forEach((r,y)=>r.forEach((c,i)=>{ if(LP[c]){ x.fillStyle=LP[c]; x.fillRect(i,y,1,1) } })); return cv;
}

function intent(t){
  if(/가슴|숨이|119|응급/.test(t)) return 'sos';
  if(/무릎|시큰|밤에 자주 깼/.test(t)) return 'knee';
  if(/혈압/.test(t)&&/기록하/.test(t)) return 'bpform';
  if(/혈압/.test(t)) return 'bp';
  if(/루틴/.test(t)) return 'routine';
  if(/검진|검사/.test(t)) return 'checkup';
  if(/걸었|걸음/.test(t)) return 'walk';
  if(/수면|잠/.test(t)) return 'sleep';
  if(/말투|글씨/.test(t)) return 'tone';
  if(/진료/.test(t)&&/(일정|준비)/.test(t)) return 'visit';
  if(/보여줄|공유/.test(t)) return 'share';
  if(/사용법|도움말/.test(t)) return 'help';
  if(/정리|주간|포인트/.test(t)) return 'weekly';
  return 'other';
}

screen.addEventListener('click',e=>{
  const b=e.target.closest('[data-say],[data-act],[data-go],[data-menu]'); if(!b||!screen.contains(b)) return;
  if(b.closest('.layer')&&!b.closest('.layer').classList.contains('passthru')) { if(!b.dataset.say&&!b.dataset.menu) return }

async function startOnboarding(only){
  closeAll(); const r=RUN; ac(); FLOW='onboard';
  try{
    if(!only){ await obIntro(r) }
    if(!only||only==='setup'){ renderHome(); await obSetup(r) }
    if(only==='consent'){ await obConsent(r) }
    if(!only){ await obCourt(r) }
    if(only){ renderHome(); toast(only==='setup'?'나만의 공간이 바뀌었어요':'연결 설정을 저장했어요') }
  }catch(e){ if(e!=='cancel') console.error(e) }
  if(r===RUN){ FLOW=''; renderHome() }
}

      `<div class="sbtns">${i?'<button class="bt" id="sprev">← 이전</button>':''}<button class="go" id="snext" ${st.o&&log[st.k]===undefined?'disabled':''}>${i<SETUP.length-1?'다음 →':'나만의 공간 완성!'}</button></div>`;

          if(prog>=target) return res(); requestAnimationFrame(tick) };
        requestAnimationFrame(tick) });
      tap.hidden=true; rn.src=A.run0; good++; earn(5,x.d+'요일 실천'); $('#dy'+i,wb).className='ok'; $('#rc',wb).textContent=`실천 ${Math.min(good,GOAL)}/${GOAL}일`;
      await wait(350);
    } else if(x.good){ good++; earn(5,x.d+'요일 실천'); $('#dy'+i,wb).className='ok'; await wait(1300) }
    else { sfx('tap'); $('#dy'+i,wb).className='no'; rn.classList.add('rest'); await wait(1900); rn.classList.remove('rest') }
  }
  $$('.days span',wb).forEach(s=>s.classList.remove('now'));
  const reach=good>=GOAL; S.laps+=1; save();
  if(reach){ sfx('win'); confetti(); earn(30,'목표 도착') } else { sfx('wrong') }
  const tip=!S.perms.wear?'다음 주엔 걸음·수면 창문을 열어 볼까요? 걸은 날도 기록돼요.':'비 오는 날엔 실내에서 10분만 움직여도 실천이에요.';
  dc.innerHTML=reach?`<div class="dres ok"><img src="${A.hero_point}" alt=""><div><b>목표 도착! 🎉</b><small>이번 주 실천 ${good}일. 쉬어 간 날도 이야기로 남았어요.</small></div></div>`
    :`<div class="dres no"><img src="${A.hero_think}" alt=""><div><b>아쉬워요… 목표까지 ${GOAL-good}일</b><small>${tip}</small></div></div>`;
  tap.outerHTML=`<button class="go" id="rnext" style="background:#4466e8">한 주 동안 모은 포인트로 내 방 꾸미기 →</button>`;
  $$('[data-pts]',screen).forEach(e=>e.textContent=S.points+' P');
  await clickOnce($('#rnext',wb)); guard(r); sfx('ok');
}
async function wkRoom(r,wb,only){
  const draw=()=>{
    wb.innerHTML=`<div class="wq">한 주 동안 모은 걸로 내 방 꾸미기</div><div class="room" id="room" style="background-image:url(${A.bg_room})">${S.room.map(id=>{ const it=SHOP.find(s=>s.id===id); return it?`<span class="it" style="left:${it.x}%;top:${it.y}%;font-size:${it.s}px">${it.e}</span>`:'' }).join('')}${S.room.includes('treat')?'<span class="heart">💛</span>':''}</div>
      <div class="hprog" style="color:inherit"><span>이번 주 모은 <b>${S.weekPts||0}P</b>만큼 소품이 열려요</span><b data-pts>${S.points} P</b></div><div class="sub2" style="margin:-6px 0 0;color:inherit;opacity:.7">꾸며도 내 포인트는 줄지 않아요 · 혜택에서 스토어·e쿠폰으로 써요</div>
      <div class="shop">${SHOP.map(s=>{ const own=S.room.includes(s.id), lockd=(s.lap&&!S.laps)||(s.gift&&!S.gotGift); return `<button data-b="${s.id}" class="${own?'own':''}" ${lockd?'disabled':''}><span>${s.e}</span>${s.n}<em>${own?'놓음 ✓':lockd?(s.gift?'도움말 퇴원 후':'한 바퀴 후'):(S.weekPts||0)>=s.p?'놓기':s.p+'P부터'}</em></button>` }).join('')}</div>
      <button class="go" id="roomNext" style="background:#4466e8">${only?'다 꾸몄어요':'방명록 남기기 →'}</button>`;
    $$('[data-b]',wb).forEach(b=>b.onclick=()=>{ const s=SHOP.find(x=>x.id===b.dataset.b);
      if(S.room.includes(s.id)){ toast('이미 놓았어요'); return }
      if((S.weekPts||0)<s.p){ sfx('wrong'); toast(`이번 주 ${s.p-(S.weekPts||0)}P 더 모으면 열려요`); return }
      S.room.push(s.id); save(); sfx('coin'); toast(`${s.n}을(를) 놓았어요`); draw() });
    $('#roomNext',wb).onclick=()=>{ sfx('ok'); nxt() };
  };
  let nxt; const p=new Promise(res=>nxt=res); draw(); await p; guard(r);
  if(only){ closeAll(); renderHome(); return }
  const li=GBLINES[Math.min(S.week,GBLINES.length)-1];
  const opts=[li,'이번 주는 내 페이스로 잘 지냈다.','쉬어 가도 이야기는 이어진다.'];
  wb.innerHTML=`<div class="wq">방명록 한 줄</div><p class="sub2" style="margin:0;color:inherit;opacity:.75">이번 주를 한 줄로 남겨요. 바퀴가 쌓일수록 문장도 달라져요.</p><div class="gbopts">${opts.map((o,i)=>`<button data-g="${i}" aria-pressed="false">${o}</button>`).join('')}</div><button class="go" id="gok" style="background:#4466e8" disabled>이 문장으로 남기기</button>`;
  let pickd=null; $$('[data-g]',wb).forEach(b=>b.onclick=()=>{ sfx('tap'); pickd=opts[+b.dataset.g]; $$('[data-g]',wb).forEach(x=>x.setAttribute('aria-pressed',String(x===b))); $('#gok',wb).disabled=false });
  await clickOnce($('#gok',wb)); guard(r); S.gb.push({w:S.week,t:pickd||li}); save(); sfx('ok');
}
function spiralSvg(n){
  const pts=[], cx=150, cy=128, turns=1+n*.9, end=Math.PI*2*turns;
  for(let a=0;a<=end;a+=.08){ const rr=12+a*(86/end); pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)*.62-a*1.4]) }
  const at=f=>pts[Math.floor(f*(pts.length-1))];
  const labs=['W','M1','M2','M3'].map((l,i)=>{ const p=at([.62,.74,.86,.98][i]); return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="#d9824b"/><text x="${(p[0]+6).toFixed(1)}" y="${(p[1]-6).toFixed(1)}">${l}</text>` }).join('');
  return `<svg class="spiral" viewBox="0 0 300 230" role="img" aria-label="${n}바퀴 나선"><path pathLength="1" d="M${pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')}"/>${labs}</svg>`;
}
async function wkEnd(r,wb){
  sfx('win');
  wb.innerHTML=`<div class="wq">${S.week}주차 루프 완성!</div>${spiralSvg(S.laps)}<div class="hprog" style="color:inherit"><span>쌓인 바퀴</span><b>${S.laps}바퀴 · ${S.points} P</b></div>
    <div class="gblist">${S.gb.slice(-3).reverse().map(g=>`<div style="margin-bottom:6px"><small>${g.w}주차 방명록</small>${esc(g.t)}</div>`).join('')}</div>
    <div class="hprog" style="color:inherit"><span>이번 주 받은 포인트</span><b>+${S.weekPts||0}P → 내 포인트 ${S.points}P</b></div><button class="go" id="eok" style="background:#4466e8">다음 주에 또 만나요</button><button class="chip" id="eptp" style="align-self:center">💰 혜택에서 내 포인트 보기</button>`;
  confetti(); $('#eptp',wb).onclick=()=>{ sfx('tap'); S.week+=1; save(); openPoints() };
  await clickOnce($('#eok',wb)); guard(r); S.week+=1; save(); closeAll(); renderHome(); toast('이번 주 기록이 다음 주로 이어져요');
}

/* =========================================================
   혜택 · 내 포인트 (현재 인바이츠루프 포인트 화면 목업) — 게임 보상이 여기로 쌓인다
   ========================================================= */
function openPoints(){
  closeAll(); const r=RUN; ac();
  const done=S.onboarded, hs=S.helpSeen.length;
  const mis=[
    {ic:'🧩',a:'비서 방탈출 완주하고',b:'100P 받기',tag:done?'완료':'1회',go:'onboard',game:1,ok:done},
    {ic:'🪟',a:'연결 창문 하나 열 때마다',b:'20P 받기',tag:`${PERMS.filter(p=>S.rw&&S.rw['win_'+p[0]]).length}/4`,go:'onboard',game:1,ok:PERMS.every(p=>S.rw&&S.rw['win_'+p[0]])},
    {ic:'🏠',a:'나만의 공간 만들고',b:'20P 받기',tag:S.rw&&S.rw.setup?'완료':'1회',go:'onboard',game:1,ok:!!(S.rw&&S.rw.setup)},
    {ic:'❓',a:'도움말 물건 찾을 때마다',b:'5P씩 받기',tag:`${hs}/${OBJ.length}`,go:'help',game:1,ok:hs>=OBJ.length},
    {ic:'🎁',a:'이번 주 정리하고',b:'최대 130P 받기',tag:`${S.week}주차`,go:'weekly',game:1},
    {ic:'✒️',a:'글 작성하고',b:'최대 100P 받기',tag:'오늘 <em>10</em>회 가능'},
    {ic:'👍',a:'게시글 좋아요 10개하고',b:'최대 3P 받기'},
    {ic:'💬',a:'게시글 댓글달고',b:'최대 50P 받기',tag:'오늘 <em>10</em>회 가능'}];
  const L=layer('pt',`<div class="pthead"><b>인바이츠루프</b><span>🤖</span><span>🔔</span><button class="close" aria-label="닫기">✕</button></div>
    <div class="ptbody">
      <h2>${esc(S.name)}님,<br>오늘도 같이 포인트를<br>쌓아볼까요?</h2>
      <div class="ptcard"><div><b>내 포인트</b><strong data-pts>${S.points}P</strong></div><div><span>받을 수 있는 포인트</span><span>5,123P</span></div></div>
      <div class="ptbtns"><button data-mock>🛍 핫팩 스토어</button><button data-mock>🎟 e쿠폰 교환</button></div>
      <div class="ptmis"><small>오늘의 미션</small><h3>띵동! 미션 배달왔어요!</h3>
        ${mis.map(m=>`<button class="mi ${m.game?'game':''}" ${m.go?`data-pgo="${m.go}"`:'data-mock'}><span class="mic">${m.ic}</span><span class="mtx"><small>${m.a}</small><b>${m.b}</b></span>${m.tag?`<span class="mtag ${m.ok?'ok':''}">${m.tag}</span>`:''}${m.game?'<i>GAME</i>':''}</button>`).join('')}
      </div>
      <div class="pthist"><h3>최근 적립</h3>${(S.hist||[]).slice(-6).reverse().map(h=>`<div><span>${esc(h.t)}</span><b>+${h.n}P</b></div>`).join('')||'<p>아직 게임으로 받은 포인트가 없어요.</p>'}</div>
      <p class="ptnote">목업 화면 · 게임에서 받은 포인트가 실제 앱의 ‘내 포인트’로 쌓이는 흐름을 보여 줘요.</p>
    </div>
    <nav class="pttab"><span>⌂<small>홈</small></span><span>🧭<small>발견</small></span><span class="plus">＋</span><span>🗓<small>루틴</small></span><span class="on">🎁<small>혜택</small></span></nav>`);
  $('.close',L).onclick=()=>{ sfx('tap'); closeAll(); renderHome() };
  $$('[data-mock]',L).forEach(b=>b.onclick=()=>{ sfx('tap'); toast('목업 화면이에요') });
  $$('[data-pgo]',L).forEach(b=>b.onclick=()=>{ sfx('ok'); const g=b.dataset.pgo; if(g==='onboard') startOnboarding(); if(g==='help') startHelp(); if(g==='weekly') startWeekly() });
}

/* ---------- 시작 ---------- */
$$('[data-run]').forEach(b=>b.onclick=()=>{ ac(); const m=b.dataset.run; if(m==='onboard') startOnboarding(); if(m==='help') startHelp(); if(m==='weekly') startWeekly() });
$('#pSound').onclick=()=>{ S.sound=!S.sound; save(); $('#pSound').textContent=S.sound?'🔊 소리':'🔈 소리 꺼짐'; if(!S.sound) musicStop() };
$('#pPts').onclick=()=>{ ac(); openPoints() };
$('#pReset').onclick=()=>{ try{ localStorage.removeItem(KEY) }catch(e){} S=Object.assign({},DEF); save(); closeAll(); renderHome(); launch() };
function launch(){
  if(S.onboarded) return;
  const L=layer('launch',`<div class="lg">✦</div><h2>인바이츠루프에 오신 걸 환영해요</h2><p>처음이시네요. 2분이면 함께 시작할 수 있어요.</p><button class="go" id="lgo">시작하기</button><div class="alt"><button data-l="help">❓ 도움말 먼저 보기</button><button data-l="weekly">🎁 주간 정리 미리 보기</button><button data-l="home">앱 둘러보기</button></div>`);
  $('#lgo',L).onclick=()=>{ ac(); startOnboarding() };
  $$('[data-l]',L).forEach(b=>b.onclick=()=>{ ac(); const m=b.dataset.l; L.remove(); if(m==='help') startHelp(); if(m==='weekly') startWeekly() });
}
$('#pSound').textContent=S.sound?'🔊 소리':'🔈 소리 꺼짐';
save(); renderHome();
// 소개 페이지에서 ?mode=onboard|help|weekly|points 로 바로 열기
const QM=new URLSearchParams(location.search).get('mode');
if(QM==='onboard') startOnboarding();
else if(QM){ if(!S.onboarded){ S.onboarded=true; save(); renderHome() } ({help:startHelp,weekly:startWeekly,points:openPoints}[QM]||(()=>{}))() }
else launch();
})();
</script>
