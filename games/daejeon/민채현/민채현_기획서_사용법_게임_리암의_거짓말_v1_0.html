<script id="docs" type="application/json">[{"id": "plan", "title": "기획서", "md": "# 기획서 — 인바이츠루프 사용법을 앱 화면 안의 5분 법정 게임 「리암의 거짓말」로 익히게 한다\n\n> 상태: **v1.3 (2026-10-19, 결과 공유 카드)** · v1.2 레드팀 반영 · v1.1 레드팀 연결 · v1.0 초안\n> 근거: 사용자용 사용법 문서가 없음(2026-10-19 저장소 조사) · [레드팀 분석서](../03-analysis/20261019_분석서_리암의_거짓말_기획서_v1.0_레드팀_리뷰_v1.0.md)\n> 저장소: **invites-loop-web**(`apps/invites-loop`, 구현 전) · 게임 시안 [`02-design/20261019_시안_리암의_거짓말_게임_v2.html`](../02-design/20261019_시안_리암의_거짓말_게임_v2.html)(단일 HTML, 글꼴 내장, 오프라인 실행) · 같은 내용 아티팩트 https://claude.ai/code/artifact/3db73e0e-b357-47b4-9679-e2ebc0dad528\n\n## 변경 이력\n\n| 버전 | 일자 | 내용 |\n|---|---|---|\n| v1.0 | 2026-10-18 | 최초 작성. 따라 하기형·웹 분할형 시안(§1-2의 말문 트기 · 인바이츠루프 퀘스트 · 리암의 거짓말 웹 분할판) 작업 — 모두 버림 |\n| v1.1 | 2026-10-19 | **도트형으로 업데이트**: 앱 화면 안 진행, 도트 리암 C안, 칩튠(프로토타입 v4). 레드팀 결과 연결, §5 ① \"통과\"를 정정 — 실제 터치로는 사건 5 진행 불가 |\n| v1.2 | 2026-10-19 | 레드팀 반영(채현님 결정 2026-10-19): 단서 무료 · 시간 초과 엔딩 삭제(시간은 기록만) · ♥ 3 · 진실 사건 위치 무작위 · 사건 1을 루틴 18일로. 증거 콕 집기, 시간 기반 보조 3단계, 증거 도착 반응, 탭해서 넘기기, 명중 컷인, 결과 등급, 메뉴를 실제 앱 구조로. 대화창·시트 겹침 수정. 도트 에셋 전체 수록(§2-6) |\n| v1.3 | 2026-10-19 | 판결 팝업을 결과 공유 카드로: 버튼 [다시 하기 · 닫기] / [이미지 저장 · 공유하기]. 바깥을 눌러도 닫히지 않고 **닫기로만** 닫힘(채현님 요청). 공유 카드 이미지(720×960 도트) 추가(§2-6). §4-11 결정 |\n\n## 0. 한 줄 결론\n\n사용법을 \"따라 하기\"로 가르치지 않고, **거짓말하는 리암을 앱 속 증거로 잡아내는 게임**으로 만든다. 증거가 숨어 있는 곳이 곧 앱 기능의 위치다. 장소는 막힐 때 보조가 점점 좁혀 알려 주고, **모순을 콕 집는 판단**은 플레이어 몫으로 남긴다. 게임은 별도 페이지가 아니라 **앱 화면 위에 얹힌 도트 대화창**에서 진행한다.\n\n## 1. 지금 (조사 · 시도한 것)\n\n### 1-1. 앱이 사용법을 알려 주는 방식\n\n| 쪽 | 무엇이 있나 | 기능 위치를 가르치나 |\n|---|---|---|\n| WX H5 온보딩 | \"인바이츠루프란 무엇인가요?\" 5단계 루프 슬라이드 → AI 비서·시그니처 라운지·개인화된 루틴 소개 | 아니요. 서비스 소개만 |\n| 웹뷰 앱(`apps/invites-loop`) | 온보딩 없음. 대시보드 문진 카드가 첫 행동을 유도 | 아니요 |\n| 문서 | `loop-meta/ONBOARDING.md`는 개발자용 30분 안내 | 사용자용 아님 |\n\n### 1-2. 버린 시안과 배운 것\n\n| 일자 | 시안 | 내용 | 채현님 반응 | 배운 것 |\n|---|---|---|---|---|\n| 2026-10-18 | 「말문 트기」 | 일반 채팅 UI 미션 9개 | 대상이 \"특정 앱\"이어야 함 | 대상 앱을 먼저 정한다 |\n| 2026-10-18 | 「인바이츠루프 퀘스트」 | 미션 6개 체크리스트 + 버튼에 고리 | \"게임이 아니다, 재미없다, 웃음 요소가 없다\" | 따라 하기는 게임이 아니다. 상대와 판단이 있어야 한다 |\n| 2026-10-18 | 「리암의 거짓말」 웹 분할판 | 왼쪽 법정 패널 + 오른쪽 폰 | \"앱 화면 안에서 이루어져야 한다\", \"도트가 좋다\" | 게임은 앱 위 레이어로만 |\n| 2026-10-19 | 도트 리암 1·2차 | 검은 머리 사람형, 동글 블롭형 | \"못생겼다\", \"더 귀여웠으면\" | 3안(나무늘보·감자·사람) 비교 → **C 사람(갈색 머리)** |\n| 2026-10-19 | 게임 시안 v1(프로토타입 v4, 도트형) | 증거 화면만 띄우면 정답, 단서는 ♥를 잃어야 나옴 | 레드팀: 정답 쾌감 없음, 판단 없음, 사건 5 진행 불가 | §2 전부에 반영 |\n\n## 2. 무엇을 만드나\n\n### 2-1. 규칙\n\n| 항목 | 내용 |\n|---|---|\n| 역할 | 플레이어 = 리암의 AI 코치. 리암 = 루틴을 했다고 우기는 피고 |\n| 한 사건 | 리암이 주장 → 앱을 돌아다니며 증거 화면을 찾음 → **이의 있음!** → 화면 속 모순을 **콕 집기**(빨간 점선 항목 중 하나) |\n| 진실 사건 | 리암이 사실을 말하는 사건이 하나 있다. **증거 화면을 보고** 인정해야 맞다 |\n| 신뢰도 ♥ 3 | **틀린 판단에만** 깎인다: 틀린 항목 콕 집기, 거짓말을 인정, 진실을 콕 집기, 판결 집행에서 리암 유혹에 넘어가기 |\n| 깎이지 않는 것 | 증거 없는 화면에서 이의(리암이 조롱만 하고 보조가 한 단계 오른다), 단서 보기, 증거 안 보고 진실 인정(다시 보고 오라고 함) |\n| 시간 | 리암이 말하는 연출 중엔 멈추고, 플레이어가 찾는 시간만 잰다. **시간 초과 엔딩 없음** — 결과 등급과 기록에만 쓴다 |\n| 끝 | 5사건 해결 → 유죄 확정 / ♥ 0 → 리암 석방 |\n| 등급 | S 명코치(♥3 · 3분 이내) · A 눈치 빠른 코치(♥2 이상) · B 리암 반쯤 믿는 코치(♥1) · C 리암 절친(석방). 최고 기록을 기기에 저장하고 갱신 시 \"신기록!\" |\n| 결과 화면 | \"앱에서 찾는 곳\" **6줄 전부**. 못 푼 위치는 회색 \"놓침\" |\n| 결과 공유 카드 | 버튼 두 줄: **[다시 하기] [닫기]** / **[이미지 저장] [공유하기]**. 카드 바깥을 눌러도 닫히지 않고 **닫기로만** 닫힌다. 닫으면 화면 위에 \"▶ 재판 결과 보기\"가 남아 다시 열 수 있다 |\n| 이미지 저장 | 결과를 720×960 도트 카드 PNG로 그려 내려받기를 시도하고, 같은 이미지를 미리보기로 띄운다(앱 웹뷰처럼 내려받기가 막힌 환경에서 길게 눌러 저장) |\n| 공유하기 | 기기 공유 시트에 카드 이미지 + 문구(\"리암의 거짓말 A등급 「눈치 빠른 코치」 · 2분 14초 — 인바이츠루프에서 리암을 잡아 보세요.\") → 이미지 공유가 안 되면 문구만 → 공유 기능이 없으면 문구 복사 |\n\n### 2-2. 사건\n\n사건 1은 항상 처음, 사건 5는 항상 마지막. 가운데 셋(물·야식·수면)에서 **진실 사건(수면)의 자리는 판마다 무작위**다.\n\n| # | 리암의 주장 | 증거 화면 (배우는 기능) | 콕 집을 곳 | 코치 반박 → 리암 변명 |\n|---|---|---|---|---|\n| 1-1 | 어제 저녁 산책 40분 했어요 | 루틴 탭 → **날짜 18**(2탭) | 저녁 산책 \"기록 없음\" | \"기록 없음인데요?\" → \"기록 안 하는 주의거든요\" → **증언 번복** |\n| 1-2 | 워치엔 만 보 찍혔을 거예요 | 내 정보 → ≡ 메뉴 → **장치 연결** | 걸음 수 312 · 활동 4분 (최대 심박 88은 오답) | \"한 걸음에 8초씩?\" → \"음미하면서 걸었어요\" → \"…소파에서 다리만 흔들었어요\" |\n| 가운데 | 물은 하루 8잔 마셔요 | 내 정보 → ≡ 메뉴 → **Assessments → 라이프스타일 질문지** | 물 \"3잔 이하\" (커피 6잔 이상은 오답) | \"3잔 이하라고 쓰셨네요\" → \"얼음을 안 셌어요\" → \"…얼음은 씹어 먹었어요\" |\n| 가운데 | 야식 끊은 지 한 달 됐어요 | 루틴 탭 → **날짜 17(토)** | 01:52 식사 사진 \"양념반 후라이드반\" | \"토요일 새벽 1시 52분\" → \"아주 이른 아침 식사예요\" → \"…닭도 아침형 인간이었던 거죠\" |\n| 가운데 (진실) | 7시간 한 번도 안 깼어요. 기네스 감이죠 | 대시보드 → **오늘의 질문**(7시간 2분) 또는 장치 연결 수면 | 콕 집지 않고 **인정** | \"믿어 주셔서 감사해요. 이 앱 쓰고 처음이에요\" |\n| 5 | 스쿼트 100개 너무 쉬워요 | 대시보드 → **건강 활동 점수** | 40 · 건강 범위 65 ~ 75 | \"1개 하고 99개는 마음속으로\" → **판결 집행**: 리암이 \"'너무 쉽습니다' 눌러 주세요\" 유혹 → 플레이어가 **쉽게 루틴 변경 → 루틴이 너무 어렵습니다.** → \"5개는 안 될까요?\" |\n\n진실 사건은 일부러 가장 거짓말처럼(능청 표정, 과장된 말) 만들어 찍기가 아니라 확인하게 한다. 마지막 사건부터 배경음악이 \"몰아붙이기\" 곡으로 바뀐다.\n\n### 2-3. 막혔을 때의 보조 — 전부 무료\n\n원칙: 시간으로 나오는 보조에는 벌점이 없다. 보조는 방향 → 경로 → 누를 버튼 순서로 좁힌다.\n\n| 단계 | 트리거 | 무엇이 나오나 (사건 1-2 예) |\n|---|---|---|\n| 0 | 시작 팝업 | \"막히면 **단서**를 눌러요. 단서는 공짜예요.\" |\n| 1 | 찾는 시간 **20초** | 리암이 흘리듯 방향을 말한다: \"워치 기록은 내 정보 깊숙이 있어서 아무도 못 찾아요.\" |\n| 2 | **45초**, 첫 헛짚기, 또는 **단서** 버튼 | 코치 줄(빨간 막대)에 경로: \"내 정보 → 오른쪽 위 ≡ 메뉴 → Settings의 장치 연결\". 단서 버튼 깜빡임 + 알림음 |\n| 3 | **75초** 또는 두 번째 헛짚기 | 지금 화면에서 다음에 누를 버튼에 **▼ 고리**(한 칸씩 따라감). 2depth 화면에서 길이 없으면 뒤로 버튼 |\n| 상시 | 증거 화면 도착 | 리암이 식은땀 표정으로 \"…(리암이 갑자기 말이 없다)\". 3단계 뒤라면 \"리암이 땀을 흘려요. 지금 이의 있음!\" + 이의 버튼에 고리 |\n| 상시 | 증거와 무관한 버튼 | 짧은 농담 토스트(\"AI 보고서는…\"), 메뉴 항목은 \"이번 사건 증거가 없어요\"로 범위를 좁혀 준다 |\n| 상시 | 증거 없는 화면에서 이의 | 도장이 금 가며 떨어지고 리암이 화면별 대사로 조롱(대시보드·루틴·커뮤니티·내 정보·장치 연결·Assessments·질문지 각각 다름, 판 전체에서 순번이 이어짐) |\n\n### 2-4. 연출\n\n| 순간 | 연출 |\n|---|---|\n| 대사 | 30ms/자 타이핑 + 3글자마다 블립(440~520Hz). 다 나오면 ▼ 깜빡임, **탭하면 넘김**(타이핑 중 탭은 전체 표시). 안 누르면 `1500 + 글자수×60ms` 뒤 자동, 펀치라인은 \"…\" 한 박자 뒤 최소 2.5초 |\n| 이의 있음 | 도장. 증거 화면이면 콕 집기로, 아니면 도장이 **금 가며 떨어짐** + 부저 |\n| 명중(정답 콕) | 음악 끊김 → 쿵 + 상승 아르페지오 → 집은 항목 빨간 실선 → 화면 흔들림 → 리암 **멘붕 컷인 \"으악!\"** 1.1초 → 코치 반박 한 줄 → 리암 변명(마지막 줄 멘붕) |\n| 틀린 콕 | \"땡\" 도장(금 가며 떨어짐) + ♥ −1 + 리암의 항목별 대사(\"심박 88이면 살아 있다는 증거죠\") |\n| 인정 | 회색 도장. 진실이면 삼각파 2음 |\n| 판결 집행 | 파란 도장 + 승리음 |\n\n### 2-5. 화면 구성 — 앱 위 레이어\n\n| 레이어 | 위치 | 내용 |\n|---|---|---|\n| 앱 | 그대로 | 대시보드·루틴·커뮤니티·내 정보, 하단 탭, 메뉴 시트(Assessments 항목 → 목록 화면, Reward·S 방 회색, 40px) |\n| 등급 | 등급 도장 136px(−6°) + 등급 이름 36px + 찾은 시간 + 신뢰도 하트 |\n| 리암 | 16×16을 224px로(14배, 보간 없음). 유죄는 broken, 석방은 happy. 옆에 등급별 엔딩 대사 말풍선(4px 테두리 + 8px 그림자) |\n| 바닥 | \"찾은 증거 n / 6\" + 초대 문구. 줄바꿈은 띄어쓰기 단위 |\n| 글꼴 | 갈무리11(게임과 같은 내장 글꼴) |\n\n### 2-7. 소리\n\n| 소리 | 만드는 법 | 언제 |\n|---|---|---|\n| 배경음악 ① 법정 | Web Audio. 사각파 멜로디 + 삼각파 베이스 + 노이즈 하이햇, A단조 4마디, 132 BPM | 사건 1~4 |\n| 배경음악 ② 몰아붙이기 | 같은 편성, 옥타브 베이스, 150 BPM | 사건 5 |\n| 글자 블립 | 사각파 30ms, 440~520Hz 무작위, 3글자마다 | 리암 대사 |\n| 이의 / 명중 / 틀림 / 승리 / 진실 / 단서 / 패배 | 상승 3음 / 노이즈 쿵 + 저음 톱니 + 상승 4음 / 하강 2음 / 상승 4음 / 삼각파 2음 / 삼각파 2음 / 하강 4음 | 판정마다 |\n\n음악은 시작 팝업의 \"칩튠 음악 켜기\"와 대화창 ♪로 켜고 끈다. 선택은 기기에 기억한다. 게임 시안은 기본 켜짐(§4-4).\n\n## 3. 바뀌지 않는 것\n\n- 앱의 실제 기능·데이터는 건드리지 않는다. 게임 속 앱은 **리암의 가짜 데이터**로 채운 같은 화면이고, 게임 중 눌러도 사용자의 실제 기록이 바뀌지 않는다.\n- 앱 화면의 색·글꼴·컴포넌트는 앱 토큰 그대로(`packages/invites-ui`, Pretendard). 도트는 게임 레이어에만.\n- 기존 WX 온보딩 슬라이드는 그대로 둔다(서비스 소개 역할).\n\n## 4. 결정할 것\n\n| # | 질문 | 추천 / 결정 |\n|---|---|---|\n| 1 | 언제 보여 주나 | 추천: 가입 직후 1회 권유(\"5분 게임으로 앱 둘러보기\") + 내 정보 → 메뉴 → 도움말 센터에 상시. 건너뛰기 가능 |\n| 2 | 피고 이름 | 추천: 앱 목업의 가족 멤버 Liam 유지(루틴 탭 멤버 칩과 이어짐). 국내 반응이 낮으면 한국 이름으로 |\n| 3 | 게임 속 앱을 어떻게 만드나 | 추천: 실제 화면 컴포넌트에 **게임용 가짜 데이터만 주입**(모의 프로바이더). 따로 그린 화면은 실제 앱과 어긋난다(분석서 H6) |\n| 4 | 음악 기본값 | 추천: 실제 앱은 **꺼짐**(공공장소). 게임 시안은 시연용으로 켜짐 |\n| 5 | 완료 보상 | 추천: 유죄 확정 시 포인트 지급. 등급별 차등 여부와 금액은 포인트 정책 담당과 정한다 |\n| 6 | 단서 비용 | **결정(채현님 2026-10-19): 무료** |\n| 7 | 타이머 | **결정: 연출 중 정지, 시간 초과 엔딩 없음, 등급·기록에만 반영** |\n| 8 | 신뢰도 | **결정: ♥ 3, 틀린 판단에만 감소** |\n| 9 | 진실 사건 위치 | **결정: 가운데 세 자리 중 무작위** |\n| 10 | 사건 1 | **결정: 루틴 → 18일(2탭)로 시작, 증언 번복으로 장치 연결까지** |\n| 11 | 공유 카드 | **결정(채현님 2026-10-19): 만든다.** 버튼 [다시 하기·닫기] / [이미지 저장·공유하기], 닫기로만 닫힘(§2-1). 실제 앱에선 네이티브 셸의 저장·공유 브리지를 쓸지 설계서에서 정한다 |\n| 12 | WX(중국어) 버전 | 대사가 말장난 위주라 번역보다 현지 대사 새로 쓰기. 이번 범위 밖 |\n\n## 5. 확인 방법\n\n| # | 내용 |\n|---|---|\n| ① | 자동 플레이(2026-10-19, 게임 시안 v2, **좌표 클릭** — 버튼 중앙의 맨 위 요소를 눌러 실제 터치와 같은 조건): 증거 없는 화면 이의(♥ 유지, 보조 2단계) → 사건 1-1·1-2(틀린 콕 1번 ♥ −1) → 물 → 야식 → 진실 인정 → 스쿼트(유혹에 넘어감 ♥ −1 → 다시 골라 집행) → 판결 B, 결과 6줄. **가려진 버튼 0개 — 통과** |\n| ② | 보조 단계: 찾는 시간 75초 → 루틴 탭 버튼에 ▼ 고리 → 루틴 탭으로 가면 날짜 18로 고리 이동 → 18일 도착 시 리암 \"…(말이 없다)\" + 이의 버튼 고리 — **통과** |\n| ②-1 | 결과 공유 카드: 카드 바깥(어두운 영역) 클릭 → 그대로 남음 / 닫기 → 닫히고 \"재판 결과 보기\" 생김 → 누르면 다시 열림 / 이미지 저장 → 720×960 카드 생성 + 미리보기 — **통과**. 공유하기는 기기 공유 시트가 필요해 **실기기 미확인** |\n| ③ | 음악·효과음 실제 청취 — **미확인**(자동 플레이는 소리 끔) |\n| ④ | 사용성 테스트 5명: 찾는 시간, 사건별 헛짚기·단서 사용, 보조 단계별 도달률, 끝난 뒤 위치 퀴즈 6문항 정답률, 웃은 순간 기록 |\n| ⑤ | 실제 앱 대조: 이미 답한 라이프스타일 질문지를 다시 볼 수 있는지, 루틴 탭 날짜 선택이 지난 기록·사진을 보여 주는지(분석서 §7) — **미확인**. 없으면 증거 화면을 바꾼다 |\n\n## 6. 범위 밖\n\n- 루틴 추가(운동 등록), 커뮤니티, AI 비서, 1:1 문의 — 다음 시즌 사건 후보(분석서의 \"증거 인멸 저지\", \"AI 보고서\" 사건 아이디어 포함).\n- 실제 앱 구현(설계서에서 다룬다).\n- WX·미니프로그램 버전.\n"}]</script>

const REF={};const refH=[...out.querySelectorAll('h2')].find(h=>/근거 코드 풀이/.test(h.textContent));
if(refH){let n=refH.nextElementSibling;while(n&&n.tagName!=='H2'){const tb=n.querySelector?.('table');if(tb){tb.querySelectorAll('tbody tr').forEach(tr=>{const c=tr.children;if(c.length>=3)REF[c[0].textContent.trim()]={src:c[1].textContent.trim(),txt:c[2].textContent.trim()}});break}n=n.nextElementSibling}
 refH.id=refH.id||'refs';}
const refKeys=Object.keys(REF).sort((a,b)=>b.length-a.length);
function refLookup(code){if(REF[code])return REF[code];const m=code.match(/^(V-\d+)/);if(m){const k=refKeys.find(k=>{const r=k.match(/^V-(\d+) ~ V-(\d+)$/);return r&&+m[1].slice(2)>=+r[1]&&+m[1].slice(2)<=+r[2]});if(k)return REF[k]}return null}
if(refKeys.length){const re=new RegExp('(D\\d|R-\\d|H-\\d|V-\\d+(?: [①②③])?|레드팀 \\d|규격서 §[\\d-]+|정의서 v[\\d.]+)','g');
 out.querySelectorAll('table.ref td:last-child, .meta dd').forEach(td=>{if(td.closest('h2')||refH&&refH.nextElementSibling&&td.closest('table')===refH.nextElementSibling.querySelector?.('table'))return;
  td.querySelectorAll('a').length; td.childNodes.forEach(nd=>{if(nd.nodeType!==3)return;const frag=document.createDocumentFragment();let last=0,m;re.lastIndex=0;

// 툴팁: 약어 (본문 단락·목록·표 안, 코드 제외)

nodes.forEach(n=>{if(!re.test(n.data)){re.lastIndex=0;return}re.lastIndex=0;const frag=document.createDocumentFragment();let last=0,m;

const topBtn=document.getElementById('top');

const tip=document.getElementById('tip');let tipEl=null;
function showTip(el){tipEl=el;const d=el.dataset;tip.innerHTML=`<span class="k ${d.cls||''}">${d.kind||''}</span><strong class="t">${d.term||''}</strong><span class="d">${d.tip}</span>`;
 tip.classList.add('on');tip.setAttribute('aria-hidden','false');placeTip()}
function placeTip(){if(!tipEl)return;const r=tipEl.getBoundingClientRect();const w=tip.offsetWidth,hh=tip.offsetHeight;let x=r.left+r.width/2-w/2;x=Math.max(12,Math.min(innerWidth-w-12,x));let y=r.top-hh-10;let below=false;if(y<8){y=r.bottom+10;below=true}
 tip.style.left=x+'px';tip.style.top=y+'px';tip.classList.toggle('below',below);tip.style.setProperty('--ax',(r.left+r.width/2-x)+'px')}
function hideTip(){tipEl=null;tip.classList.remove('on');tip.setAttribute('aria-hidden','true')}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el&&el!==tipEl)showTip(el);else if(!el&&tipEl)hideTip()});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el)});
document.addEventListener('focusout',hideTip);
addEventListener('scroll',()=>{if(tipEl)placeTip()},{passive:true});
addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});
// 본문 폭 보통/전체 — 오른쪽 아래 확대/축소 버튼. 기본은 full, 선택은 이 브라우저에만 기억
