:root{
  --ink:#171719; --sub:#70737c; --muted:#989ba2; --line:#dbdcdf;
  --subtle:#f4f4f5; --elev:#edf2f5; --paper:#ffffff; --blue:#1a71ff; --blue-press:#0052cc; --blue-95:#eaf2fe;
  --green:#00a336; --orange:#ff9f1a; --red:#ff341a;
  --chip-green-bg:#ccffdd; --chip-green:#00521b; --chip-red-bg:#ffedeb; --chip-red:#991200; --chip-purple-bg:#f4deff; --chip-purple:#4f0970;
  --dotink:#1a1a1a; --cheek:#ffaaaa;
  --font:"PretendardSub","Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --dot:"GalmuriSub","Galmuri11",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--subtle);color:var(--ink);font:400 13px/1.55 var(--font);letter-spacing:-.01em;word-break:keep-all;display:grid;place-items:center;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
canvas.px{image-rendering:pixelated;display:block}

.phone{width:375px;height:min(780px,calc(100vh - 32px),calc(100dvh - 32px));border-radius:44px;padding:10px;background:var(--ink);box-shadow:0 20px 50px rgb(23 23 25 / .18)}
.screen{position:relative;height:100%;border-radius:35px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
#app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
@media (max-width:500px){
  body{display:block;background:var(--paper)}
  .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
}

/* ---------- 앱 ---------- */
.nav{flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px}
.nav b{font-size:18px;font-weight:800}
.nav.d2{padding:0 8px;justify-content:flex-start;gap:4px}
.nav.d2 b{font-size:16px;font-weight:600}
.ib{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--ink)}
.ib:active{background:var(--subtle)}
#app svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

<script>
// ---------- 리암 도트 (16×16) ----------
const BASE = ["................", "........##......", "....########....", "...#hhhhhhhh#...", "..#hhlhhhhhhh#..", "..#hhhhhhhhhh#..", "..#hhaahaaaah#..", "..#haaaaaaaah#..", "..#aaaaaaaaaa#..", "..#aaaaaaaaaa#..", "..#aaaaaaaaaa#..", "...#aaaaaaaa#...", "....#tttttt#....", "...#atttttta#...", "....########....", ".....oo..oo....."];
const MOODS = {"smug": [[4, 9, "e"], [5, 9, "e"], [10, 9, "e"], [11, 9, "e"], [8, 10, "e"], [9, 10, "e"]], "sweat": [[5, 8, "e"], [5, 9, "e"], [10, 8, "e"], [10, 9, "e"], [7, 10, "e"], [8, 10, "e"], [14, 5, "s"], [14, 6, "s"], [1, 8, "s"]], "broken": [[4, 8, "e"], [6, 8, "e"], [5, 9, "e"], [4, 10, "e"], [6, 10, "e"], [9, 8, "e"], [11, 8, "e"], [10, 9, "e"], [9, 10, "e"], [11, 10, "e"], [7, 11, "e"], [8, 11, "e"], [14, 5, "s"], [14, 6, "s"], [1, 7, "s"], [1, 8, "s"]], "happy": [[5, 8, "e"], [4, 9, "e"], [6, 9, "e"], [10, 8, "e"], [9, 9, "e"], [11, 9, "e"], [7, 10, "e"], [8, 10, "e"]], "sleep": [[4, 9, "e"], [5, 9, "e"], [6, 9, "e"], [9, 9, "e"], [10, 9, "e"], [11, 9, "e"], [7, 10, "e"]], "idle": [[5, 8, "e"], [5, 9, "e"], [10, 8, "e"], [10, 9, "e"], [7, 10, "e"], [8, 10, "e"]]};
const PAL = {'#':'#1a1a1a', e:'#1a1a1a', o:'#1a1a1a', h:'#785434', l:'#aa7c52', a:'#ffecdc', p:'#ffa0a0', t:'#1a71ff', s:'#78aaff'};
function liam(mood){
  const g = BASE.map(r => r.split(''));
  if (mood !== 'broken'){ g[10][4] = 'p'; g[10][11] = 'p' }
  for (const [x, y, c] of MOODS[mood]) g[y][x] = c;
  const cv = document.createElement('canvas'); cv.width = cv.height = 16; cv.className = 'px';
  const ctx = cv.getContext('2d');
  g.forEach((r, y) => r.forEach((c, x) => { if (PAL[c]){ ctx.fillStyle = PAL[c]; ctx.fillRect(x, y, 1, 1) } }));
  return cv;
}

// ---------- 칩튠 ----------
const SND = {on:true, ctx:null, timer:null, step:0, next:0, track:0};
try { SND.on = localStorage.getItem('liam-sound') !== 'off' } catch {}
const hz = m => 440 * 2 ** ((m - 69) / 12);
// 0: 평상시 법정 테마(132 BPM) · 1: 몰아붙이기(150 BPM, 마지막 사건). 8분음표 32칸, 0 = 쉼
const TRACKS = [
  {bpm:132, mel:[69,0,72,76,74,72,71,72, 69,0,64,0,69,71,72,0, 74,0,77,76,74,72,71,74, 76,0,0,68,71,0,76,0], bas:[45,45,40,45, 45,45,40,40, 50,50,45,50, 52,52,56,52]},
  {bpm:150, mel:[76,76,0,76,74,76,77,0, 76,76,0,76,74,72,71,0, 72,72,0,72,71,72,74,0, 76,0,74,0,72,0,71,68], bas:[45,57,45,57, 45,57,45,57, 41,53,41,53, 40,52,44,56]},
];
function ac(){
  if (!SND.ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; SND.ctx = new C() }
  if (SND.ctx.state === 'suspended') SND.ctx.resume();
  return SND.ctx;
}
function tone(type, f, t, dur, vol){
  const c = SND.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(t, dur, vol){
  const c = SND.ctx, b = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(), g = c.createGain(); s.buffer = b;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(g).connect(c.destination); s.start(t);
}
function musicStart(track = SND.track){
  SND.track = track;
  if (!SND.on || SND.timer || !ac()) return;
  SND.next = SND.ctx.currentTime + .05; SND.step = 0;
  SND.timer = setInterval(() => {
    const c = SND.ctx, T = TRACKS[SND.track], e = 60 / T.bpm / 2;
    while (SND.next < c.currentTime + .2){
      const i = SND.step % 32, m = T.mel[i];
      if (m) tone('square', hz(m), SND.next, e * .9, .032);
      if (i % 2 === 0) tone('triangle', hz(T.bas[i / 2]), SND.next, e * 1.8, .09);
      if (i % 2 === 1) noise(SND.next, .04, .022);
      SND.next += e; SND.step++;
    }
  }, 50);
}
function musicStop(){ clearInterval(SND.timer); SND.timer = null }
function sfx(kind){
  if (!SND.on || !ac()) return;
  const t = SND.ctx.currentTime;
  if (kind === 'blip') return tone('square', 440 + Math.random() * 80, t, .03, .018);
  if (kind === 'bang') noise(t, .25, .12);
  const seq = {
    obj:[['square',523,0,.08,.07],['square',392,.08,.08,.07],['square',784,.16,.22,.07]],
    bang:[['sawtooth',65,0,.35,.12],['square',523,.12,.08,.06],['square',659,.2,.08,.06],['square',784,.28,.08,.06],['square',1047,.36,.3,.06]],
    wrong:[['square',196,0,.12,.07],['square',147,.12,.25,.07]],
    win:[['square',523,0,.1,.06],['square',659,.1,.1,.06],['square',784,.2,.1,.06],['square',1047,.3,.3,.06]],
    truth:[['triangle',659,0,.15,.12],['triangle',784,.15,.3,.12]],
    hint:[['triangle',880,0,.08,.08],['triangle',1175,.08,.12,.08]],
    lose:[['square',392,0,.18,.06],['square',330,.18,.18,.06],['square',262,.36,.18,.06],['square',196,.54,.5,.06]],
  }[kind];
  for (const [ty, f, at, d, v] of seq) tone(ty, f, t + at, d, v);
}
function setSound(on){
  SND.on = on; try { localStorage.setItem('liam-sound', on ? 'on' : 'off') } catch {}
  on && G && G.phase !== 'end' && G.phase !== 'intro' ? musicStart() : musicStop();
  drawHead();
}

// ---------- 사건 ----------

    <div class="devrow"><span class="ico">${IC.heart}</span><div><b>애플 헬스</b><span class="ok">연결됨</span></div><button class="lb" data-a="na" data-v="증거를 지우면 안 돼요">장치 연결 해제</button></div></div>
    <div class="sec"><h3>어제 (10월 18일)</h3><div class="stat2"><div data-ev="steps"><span>걸음 수</span><b>312</b></div><div data-ev="active"><span>활동 시간</span><b>4분</b></div><div data-ev="sleep"><span>수면</span><b>7h 02m</b></div><div data-ev="hr"><span>최대 심박</span><b>88</b></div></div></div>
  </div>`;
}
function sheet(){
  if (!S.drawer) return '';
  const enter = S.drawer !== sheet.last ? ' enter' : '';
  let h = '';
  if (S.drawer === 'adjust') h = `<h4>루틴 조정</h4><p class="sub" style="margin:0">현재 루틴이 맞지 않는 이유를 클릭해 주세요.</p>
    ${[['easy','루틴이 너무 쉽습니다.'],['hard','루틴이 너무 어렵습니다.'],['how','어떻게 해야 할지 모르겠어요.']].map(([v, t]) => `<button class="opt" data-a="adj" data-v="${v}">${t}</button>`).join('')}`;

    [['Reward',['Reward','포인트 몰']],['Settings',['루틴 설정','장치 연결','알림 설정','앱 버전','약관 및 정책','앱 평가']],['도움말 센터',['자주 묻는 질문','1:1 문의']]]
    .map(([g, l]) => `<div class="menu-sec"><span>${g}</span>${l.map(x => `<button data-a="mi" data-v="${x}">${x}</button>`).join('')}</div>`).join('');
  return `<div class="dim" data-a="close"></div><div class="sheet${enter}" id="sheet"><span class="grab"></span>${h}</div>`;
}
function tabbar(){
  const t = (id, n, ic) => `<button class="tab ${S.tab === id ? 'on' : ''}" data-a="tab" data-v="${id}">${ic}${n}</button>`;
  return `<nav class="tabbar">${t('dashboard','인바이츠루프',IC.menu)}${t('routine','루틴',IC.cal)}<button class="ai" data-a="na" data-v="AI 비서는 이번 게임에서 쉬어요" aria-label="AI">AI</button>${t('community','커뮤니티',IC.chat)}${t('my','내 정보',IC.user)}</nav>`;
}
function render(){
  const key = (S.screen || S.tab) + S.day;
  const top = render.key === key ? ($('body')?.scrollTop || 0) : 0;
  const sheetTop = $('sheet')?.scrollTop || 0;
  const main = {assess, lifestyle, device}[S.screen] || {dashboard, routine:routineTab, community, my}[S.tab];
  scr.classList.toggle('d2s', !!S.screen);
  scr.classList.toggle('sheet-open', !!S.drawer);
  app.innerHTML = main() + (S.screen ? '' : tabbar()) + sheet() + (S.toast ? `<div class="toast" role="status">${S.toast}</div>` : '');
  $('avatar')?.append(liam('idle'));
  if ($('body')) $('body').scrollTop = top;
  if ($('sheet') && sheet.last === S.drawer) $('sheet').scrollTop = sheetTop;
  render.key = key; sheet.last = S.drawer;
  if (G && G.phase !== 'intro' && G.phase !== 'end'){ arrive(); ring() }
}
function act(a, v){
  switch (a){
    case 'tab': S.tab = v; S.screen = S.drawer = null; break;
    case 'na': toast(v); break;
    case 'day': S.day = +v; break;
    case 'adjust': S.drawer = 'adjust'; break;
    case 'adj':
      if (v === 'hard'){ S.adjusted = true; S.drawer = null; toast('스쿼트 100개 → 10개로 바꿨어요') }
      else if (G.phase === 'exec' && v === 'easy'){ S.drawer = null; render(); return tempted() }
      else toast(v === 'easy' ? '리암 표정을 보세요. 정말 쉬워 보이나요?' : '리암은 방법은 알아요. 안 할 뿐이죠');
      break;
    case 'menu': S.drawer = 'menu'; break;
    case 'close': S.drawer = null; break;
    case 'back': S.screen = S.screen === 'lifestyle' ? 'assess' : null; break;
    case 'mi':
      if (v === '장치 연결'){ S.drawer = null; S.screen = 'device' }
      else if (v === 'Assessments'){ S.drawer = null; S.screen = 'assess' }
      else toast(`"${v}"엔 이번 사건 증거가 없어요`);
      break;
    case 'as': if (v === '라이프스타일 질문지') S.screen = 'lifestyle'; else toast(`"${v}"엔 이번 사건 증거가 없어요`); break;
  }
  render(); if (G?.phase === 'exec') checkExec();
}
app.addEventListener('click', e => {
  if (G?.phase === 'poke'){
    e.preventDefault(); e.stopPropagation();
    const p = e.target.closest('[data-ev]');
    p ? poke(p) : coach('빨간 점선 가운데서 골라요. 아니면 "취소".', true);
    return;
  }
  const b = e.target.closest('[data-a]'); if (b) act(b.dataset.a, b.dataset.v);
}, true);

// ---------- 대사 ----------
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const live = () => G && G.phase !== 'end' && G.phase !== 'intro';
const SAY = {typing:false, skip:null, adv:null};

async function type(text){
  const el = $('say'); if (!el) return;
  const token = type.t = Symbol();
  SAY.typing = true; el.textContent = '';
  let n = 0, done = reduced;
  SAY.skip = () => { done = true };
  for (const ch of text){
    if (type.t !== token) return;
    if (done){ el.textContent = text; break }
    el.textContent += ch; if (ch !== ' ' && n++ % 3 === 0) sfx('blip');
    await wait(30);
  }
  if (type.t === token){ SAY.typing = false; SAY.skip = null }
}
// 대사 한 줄: 다 나오면 ▼ 깜빡이며 탭을 기다린다. 안 누르면 읽을 시간만큼 뒤 자동으로 넘어간다
async function say(text, punch){
  if (!live()) return;
  if (punch){ await type('…'); await wait(600) }
  await type(text);
  const el = $('say'); if (!el || !live()) return;
  el.insertAdjacentHTML('beforeend', '<span class="next">▼</span>');
  const auto = Math.max(punch ? 2500 : 0, 1500 + text.length * 60);
  await new Promise(r => { SAY.adv = r; setTimeout(r, auto) });
  SAY.adv = null;
}
async function lines(arr, m){
  for (let i = 0; i < arr.length; i++){
    if (!live()) return;
    if (m) mood(i === arr.length - 1 && arr.length > 1 ? 'broken' : m);
    await say(arr[i], i === arr.length - 1 && arr.length > 1);
  }
}
dock.addEventListener('click', e => {
  if (!e.target.closest('.stand')) return;
  if (SAY.typing && SAY.skip) SAY.skip(); else if (SAY.adv) SAY.adv();
});

function mood(m){
  const l = $('liamBox'); if (!l) return;
  l.innerHTML = ''; l.append(liam(m));
  if (m === 'sleep') l.insertAdjacentHTML('beforeend', '<span class="zz">z</span>');
  l.className = 'liam ' + (m === 'sweat' || m === 'broken' ? 'shake' : 'bob');
}
function coach(t, hint){ const c = $('coach'); if (!c) return; c.textContent = t || ''; c.classList.toggle('hint', !!hint) }
function stamp(text, cls = ''){
  const s = document.createElement('div'); s.className = 'stamp ' + cls; s.textContent = text; fx.append(s);
  setTimeout(() => s.remove(), cls.includes('fail') ? 1300 : 900);
}
function hit(){ scr.classList.remove('hit'); void scr.offsetWidth; scr.classList.add('hit') }

// ---------- 진행 ----------
const cur = () => CASES[G.queue[G.ci][G.sub]];
const step = () => G.phase === 'exec' ? cur().exec : cur();

function drawHead(){
  const h = $('dhead'); if (!h || !G?.queue) return;
  const t = G.time;
  h.innerHTML = `<span>사건 ${Math.min(G.ci + 1, 5)}/5</span><span class="hearts" title="신뢰도">${'♥'.repeat(G.hearts)}<s>${'♥'.repeat(3 - G.hearts)}</s></span><span>${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}</span>
    <span class="sp"></span><button class="dbtn" id="snd">${SND.on ? '♪ 켜짐' : '♪ 꺼짐'}</button><button class="dbtn" id="fold">${scr.classList.contains('fold') ? '▲ 펴기' : '▼ 접기'}</button>`;
  $('snd').onclick = () => setSound(!SND.on);
  $('fold').onclick = () => { scr.classList.toggle('fold'); drawHead() };
}
function drawDock(){
  dock.hidden = false;
  dock.innerHTML = `<div class="dhead" id="dhead"></div>
    <div class="issue"><b>쟁점</b><span id="issue"></span></div>
    <div class="stand"><div class="liam" id="liamBox"></div><div class="say" id="say"></div></div>
    <div class="coach" id="coach"></div>
    <div class="acts" id="acts"></div>`;
  drawActs(); drawHead();
}
function drawActs(){
  const a = $('acts'); if (!a) return;
  if (G.phase === 'poke'){
    a.innerHTML = '<button class="cancel" id="cancel">취소</button>';
    $('cancel').onclick = () => { scr.classList.remove('poking'); G.phase = 'testify'; drawActs(); coach(''); };
    return;
  }
  const off = !['testify','exec'].includes(G.phase);
  a.innerHTML = `<button class="obj" id="obj" ${off || G.phase === 'exec' ? 'disabled' : ''}>이의 있음!</button><button class="adm" id="adm" ${off || G.phase === 'exec' ? 'disabled' : ''}>인정</button><button class="clue" id="clue" ${off ? 'disabled' : ''}>단서</button>`;
  $('obj').onclick = objection; $('adm').onclick = admit; $('clue').onclick = () => { G.stage = Math.max(G.stage, 2); clueOn(); ring() };
}

// 시간 기반 보조: 20초 방향 · 45초 경로 · 75초 화살표. 벌점 없음
function setStage(n){
  if (n > G.stage){
    G.stage = n;
    if (n === 1) nudge();
    if (n >= 2) clueOn();
  }
  ring();
}
function nudge(){
  const k = step();
  if (G.phase === 'exec'){ const el = $('say'); if (el) el.textContent = k.nudge; return }
  if (G.phase !== 'testify' || G.atEv) return;
  mood('happy');
  say(k.nudge).then(() => { if (G.phase === 'testify' && !G.atEv){ mood(k.mood); const el = $('say'); if (el) el.textContent = k.claim } });
}
function clueOn(){
  coach('단서: ' + step().clue, true); sfx('hint');
  const c = $('clue'); if (c){ c.classList.remove('blink'); void c.offsetWidth; c.classList.add('blink') }
}
function ring(){
  scr.querySelectorAll('.ring').forEach(e => e.classList.remove('ring'));
  if (!G || G.stage < 3 || !['testify','exec'].includes(G.phase)) return;
  const k = step();
  if (G.phase === 'testify' && G.atEv){ $('obj')?.classList.add('ring'); coach('리암이 땀을 흘려요. 지금 이의 있음!', true); return }
  let el = null;
  for (const sel of k.guide){ const e = app.querySelector(sel); if (e) el = e }
  if (!el && S.screen) el = app.querySelector(NAV.back);
  if (el){ el.classList.add('ring'); el.scrollIntoView({block:'nearest'}) }
}
// 증거 화면에 들어오면 리암이 조용해진다
function arrive(){
  if (G.phase !== 'testify') return;
  const at = !!cur().ev(S);
  if (at === G.atEv) return;
  G.atEv = at;
  type.t = null; SAY.typing = false;
  const el = $('say'); if (!el) return;
  if (at){ mood('sweat'); el.textContent = '…(리암이 갑자기 말이 없다)' }
  else { mood(cur().mood); el.textContent = cur().claim }
}

function tick(){
  if (!['testify','poke','exec'].includes(G.phase)) return; // 연출 중엔 시간이 멈춘다
  G.time++; G.idle++;
  if (G.idle === 20) setStage(1);
  if (G.idle === 45) setStage(2);
  if (G.idle === 75) setStage(3);
  drawHead();
}

async function openCase(){
  const k = cur();
  G.phase = 'react'; G.stage = 0; G.idle = 0; G.atEv = null; G.miss = 0;
  if (!k.cont) drawDock();
  if (G.ci === 4) { musicStop(); musicStart(1) }
  $('issue').textContent = k.issue; coach(''); mood(k.mood); drawActs();
  await say(k.claim);
  if (!live()) return;
  G.phase = 'testify'; drawActs(); arrive(); ring();
}

async function objection(){
  if (G.phase !== 'testify') return;
  const k = cur();
  sfx('obj');
  if (!k.ev(S)){
    // 증거 없는 화면: 벌점 없이 조롱 + 보조 한 단계
    G.phase = 'react'; drawActs(); stamp('이의 있음!', 'fail'); await wait(500); sfx('wrong');
    G.miss++;
    const pool = MOCK[S.screen || S.tab] || MOCK.dashboard;
    mood('happy'); await say(pool[G.mockN++ % pool.length]);
    if (!live()) return;
    G.phase = 'testify'; drawActs(); mood(k.mood); G.atEv = null; arrive();
    setStage(Math.min(3, G.miss + 1));
    return;
  }
  stamp('이의 있음!');
  G.phase = 'poke'; drawActs(); scr.classList.add('poking'); scr.classList.remove('fold'); drawHead();
  ring();
  coach('어디가 모순인가요? 빨간 점선을 콕 집어요.', true);
}

async function poke(el){
  const k = cur(), key = el.dataset.ev;
  scr.classList.remove('poking'); G.phase = 'react'; drawActs();
  if (!k.truth && k.hit.includes(key)){
    // 명중: 정적 → 표시 → 컷인 → 코치 반박 → 리암 변명
    musicStop(); sfx('bang'); hit();
    el.classList.add('hitmark');
    const ci = document.createElement('div'); ci.className = 'cutin'; ci.append(liam('broken'));
    ci.insertAdjacentHTML('beforeend', '<b>으악!</b>'); fx.append(ci);
    await wait(1100); ci.remove(); musicStart();
    if (!live()) return;
    G.via[G.queue[G.ci][G.sub]] = true;
    coach('코치: ' + k.rebut); mood('sweat');
    await lines(k.caught, 'sweat');
    if (!live()) return;
    if (k.exec){ return startExec() }
    return next();
  }
  sfx('wrong'); stamp('땡', 'gray fail');
  if (lose()) return;
  mood('happy');
  await say(k.truth ? '7시간 맞잖아요! 진실을 말해도 의심받는 인생…' : (k.wrong?.[key] || '그게 이 사건이랑 무슨 상관이에요?'));
  if (!live()) return;
  G.phase = 'testify'; drawActs(); mood(k.mood); G.atEv = null; arrive();
}

async function admit(){
  if (G.phase !== 'testify') return;
  const k = cur();
  G.phase = 'react'; drawActs();
  if (k.truth && k.ev(S)){
    stamp('인정', 'gray'); sfx('truth'); await wait(600);
    coach('코치: 증거와 말이 같아요. 이번엔 진짜예요.');
    mood('happy'); await lines(k.admitted, 'happy');
    G.via.sleep = true;
    return next();
  }
  if (k.truth){
    mood('happy'); await say('증거도 안 보고 믿으세요? 고마워요 코치님 ♥ …근데 한 번 보고 오세요.');
    setStage(Math.max(G.stage, 2));
  } else {
    stamp('인정', 'gray fail'); await wait(500); sfx('wrong');
    if (lose()) return;
    mood('happy'); await say('역시 코치님은 저를 믿어 주시네요. (방금 야식 주문함)');
    coach('리암 입꼬리가 올라갔어요. 다시 생각해 봐요.', true);
  }
  if (!live()) return;
  G.phase = 'testify'; drawActs(); mood(k.mood); G.atEv = null; arrive();
}

async function startExec(){
  const x = cur().exec;
  G.phase = 'react'; G.stage = 0; G.idle = 0;
  $('issue').textContent = x.issue; coach(''); mood('smug');
  await say(x.tempt);
  if (!live()) return;
  G.phase = 'exec'; drawActs(); checkExec();
}
async function tempted(){
  sfx('wrong'); if (lose()) return;
  G.phase = 'react'; drawActs(); mood('happy');
  await say('와! 200개! …아 근데 오늘은 좀 피곤하네요. 내일부터 할게요.');
  coach('리암 말만 믿으면 루틴이 안 바뀌어요. 다시 골라요.', true);
  if (!live()) return;
  G.phase = 'exec'; drawActs(); setStage(Math.max(G.stage, 2));
}
async function checkExec(){
  const x = cur().exec;
  if (G.phase !== 'exec' || !x.done(S)) return;
  G.phase = 'react'; drawActs(); coach('코치: 판결 집행 완료');
  stamp('판결 집행', 'blue'); sfx('win'); await wait(600);
  mood('sweat'); await lines(x.after, 'sweat');
  next();
}

function lose(){
  G.hearts--; drawHead();
  if (G.hearts <= 0){ end(false); return true }
}
async function next(){
  if (!live()) return;
  await wait(400);
  if (!live()) return;
  if (G.sub < G.queue[G.ci].length - 1) G.sub++;
  else { G.ci++; G.sub = 0; if (G.ci < 5) sfx('win') }
  if (G.ci >= G.queue.length) return end(true);
  openCase();
}

// ---------- 시작 · 끝 ----------
function popup(html){
  fx.querySelector('.pop')?.remove();
  fx.insertAdjacentHTML('beforeend', `<div class="pop"><div class="box">${html}</div></div>`);
  const p = fx.querySelector('.pop');
  p.addEventListener('click', e => e.stopPropagation());
  return p;
}
const GRADES = {
  S:['명코치', '코치님… 혹시 저 미행하세요?'],
  A:['눈치 빠른 코치', '…다음 주부터 진짜 걸을게요. 아마도요.'],
  B:['리암 반쯤 믿는 코치', '코치님 반쯤은 제 편이시죠? 그쵸?'],
  C:['리암 절친', '신뢰도 0! 저 무죄죠? 야식 식겠다.'],
};
function end(win){
  if (!G || G.phase === 'end') return;
  G.phase = 'end'; clearInterval(G.timer); type.t = null; musicStop();
  sfx(win ? 'win' : 'lose');
  dock.hidden = true; scr.classList.remove('fold', 'poking');
  const grade = !win ? 'C' : G.hearts === 3 && G.time <= 180 ? 'S' : G.hearts >= 2 ? 'A' : 'B';
  let best = null, isNew = false;
  try { best = JSON.parse(localStorage.getItem('liam-best') || 'null') } catch {}
  if (win && (!best || 'SABC'.indexOf(grade) < 'SABC'.indexOf(best.g) || (grade === best.g && G.time < best.t))){
    isNew = true; best = {g:grade, t:G.time};
    try { localStorage.setItem('liam-best', JSON.stringify(best)) } catch {}
  }
  G.result = {win, grade, isNew, best, time:G.time, hearts:G.hearts, via:{...G.via}};
  showResult();
}

const mmss = t => `${Math.floor(t / 60)}분 ${t % 60}초`;
// 결과 공유 카드. 바깥을 눌러도 닫히지 않고 "닫기"로만 닫힌다
function showResult(){
  const R = G.result, all = ['walk','steps','water','snack','sleep','squat'];
  fx.querySelector('.reopen')?.remove();
  const p = popup(`<span class="label">판결</span><h2>${R.win ? '유죄 확정' : '리암 석방'}</h2>
    <div class="grade"><span class="g">${R.grade}</span><div><b>${GRADES[R.grade][0]}</b><br><span class="label">${R.win ? `${mmss(R.time)} · 신뢰도 ${'♥'.repeat(R.hearts)}` : '신뢰도를 다 썼어요'}</span>${R.isNew ? '<div class="new">신기록!</div>' : R.best ? `<div class="label">최고 기록 ${R.best.g} · ${mmss(R.best.t)}</div>` : ''}</div></div>
    <div class="hero"><span id="endFace"></span><div class="bubble">${GRADES[R.grade][1]}</div></div>
    <span class="label">앱에서 찾는 곳</span>
    <ul>${all.map(k => `<li class="${R.via[k] ? '' : 'miss'}" style="--c:${CASES[k].c}">${CASES[k].where}${R.via[k] ? '' : ' · 놓침'}</li>`).join('')}</ul>
    <div class="note" id="note" role="status"></div>
    <div class="btns"><button class="go" id="again">${R.win ? '다시 하기' : '재심 청구'}</button><button class="go sub" id="close">닫기</button></div>
    <div class="btns"><button class="go sub" id="save">이미지 저장</button><button class="go sub" id="share">공유하기</button></div>`);
  p.querySelector('#endFace').append(liam(R.win ? 'broken' : 'happy'));
  $('again').onclick = start;
  $('close').onclick = () => {
    p.remove();
    fx.insertAdjacentHTML('beforeend', '<button class="reopen" id="reopen">▶ 재판 결과 보기</button>');
    $('reopen').onclick = showResult;
  };
  $('save').onclick = saveCard;
  $('share').onclick = shareCard;
}
function note(t){ const n = $('note'); if (n) n.textContent = t }

// 결과 카드를 도트 이미지(720×960)로 그린다
async function drawCard(){
  const R = G.result, W = 720, H = 960, ink = '#1a1a1a', red = '#ff341a';
  try { await Promise.all(['400 24px GalmuriSub', '700 24px GalmuriSub'].map(f => document.fonts.load(f))) } catch {}
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'); c.imageSmoothingEnabled = false;
  const F = (px, b) => `${b ? 700 : 400} ${px}px GalmuriSub, Galmuri11, monospace`;
  c.fillStyle = '#f4f4f5'; c.fillRect(0, 0, W, H);
  c.fillStyle = ink; c.fillRect(52, 52, W - 88, H - 88);
  c.fillStyle = '#fff'; c.fillRect(36, 36, W - 88, H - 88);
  c.lineWidth = 6; c.strokeStyle = ink; c.strokeRect(36, 36, W - 88, H - 88);
  c.textBaseline = 'top'; c.fillStyle = '#70737c'; c.font = F(24); c.fillText('인바이츠루프 사용법 게임', 76, 80);
  c.fillStyle = ink; c.font = F(56, 1); c.fillText('리암의 거짓말', 76, 120);
  c.fillStyle = R.win ? red : '#70737c'; c.font = F(40, 1); c.fillText(R.win ? '유죄 확정' : '리암 석방', 76, 200);
  // 등급 도장
  c.save(); c.translate(160, 380); c.rotate(-6 * Math.PI / 180);
  c.fillStyle = ink; c.fillRect(-62, -62, 136, 136); c.fillStyle = red; c.fillRect(-70, -70, 136, 136);
  c.lineWidth = 5; c.strokeRect(-70, -70, 136, 136);
  c.fillStyle = '#fff'; c.font = F(96, 1); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(R.grade, -2, 2);
  c.restore();
  c.textBaseline = 'top'; c.fillStyle = ink; c.font = F(36, 1); c.fillText(GRADES[R.grade][0], 270, 330);
  c.font = F(26); c.fillStyle = '#70737c';
  c.fillText(R.win ? `${mmss(R.time)}` : '신뢰도를 다 썼어요', 270, 382);
  if (R.win){ c.fillStyle = red; c.fillText('♥'.repeat(R.hearts), 270, 420); c.fillStyle = '#d9d9de'; c.fillText('♥'.repeat(3 - R.hearts), 270 + c.measureText('♥'.repeat(R.hearts)).width, 420) }
  // 리암 + 말풍선
  c.drawImage(liam(R.win ? 'broken' : 'happy'), 76, 500, 224, 224);
  const bx = 330, by = 540, bw = 300;
  const lines = wrap(c, GRADES[R.grade][1], bw - 40, F(28));
  const bh = 40 + lines.length * 40;
  c.fillStyle = ink; c.fillRect(bx + 8, by + 8, bw, bh); c.fillStyle = '#fff'; c.fillRect(bx, by, bw, bh);
  c.lineWidth = 4; c.strokeRect(bx, by, bw, bh);
  c.fillStyle = ink; c.font = F(28); lines.forEach((l, i) => c.fillText(l, bx + 20, by + 22 + i * 40));
  // 잡은 증거 수
  const n = Object.keys(R.via).length;
  c.fillStyle = ink; c.font = F(28, 1); c.fillText(`찾은 증거 ${n} / 6`, 76, 780);
  c.fillStyle = '#70737c'; wrap(c, '리암을 잡을 수 있을까요? 인바이츠루프에서 해 보세요.', W - 88 - 80, F(24)).forEach((l, i) => c.fillText(l, 76, 830 + i * 34));
  return cv;
}
function wrap(c, text, max, font){
  c.font = font; const out = []; let line = '';
  // 띄어쓰기 단위로 줄을 바꾼다(keep-all)
  for (const w of text.split(' ')){ const t = line ? line + ' ' + w : w; if (line && c.measureText(t).width > max){ out.push(line); line = w } else line = t }
  if (line) out.push(line); return out;
}
const cardBlob = async () => { const cv = await drawCard(); return new Promise(r => cv.toBlob(r, 'image/png')) };
const shareText = () => { const R = G.result; return `리암의 거짓말 ${R.grade}등급 「${GRADES[R.grade][0]}」${R.win ? ' · ' + mmss(R.time) : ''} — 인바이츠루프에서 리암을 잡아 보세요.` };

// 이미지 저장: 다운로드를 시도하고, 막힌 환경(앱 웹뷰 등)을 위해 길게 눌러 저장할 수 있는 미리보기를 함께 띄운다
async function saveCard(){
  const blob = await cardBlob(); if (!blob){ note('이미지를 만들지 못했어요. 다시 눌러 주세요.'); return }
  const url = URL.createObjectURL(blob);
  try { const a = document.createElement('a'); a.href = url; a.download = `리암의_거짓말_${G.result.grade}.png`; document.body.append(a); a.click(); a.remove() } catch {}
  fx.insertAdjacentHTML('beforeend', `<div class="pop" id="preview"><div class="box"><span class="label">이미지 저장</span>
    <img src="${url}" alt="리암의 거짓말 결과 카드" style="width:100%;border:2px solid var(--dotink)">
    <p class="label">저장이 안 되면 이미지를 길게 눌러(컴퓨터는 오른쪽 클릭) 저장하세요.</p>
    <button class="go sub" id="pclose">닫기</button></div></div>`);
  $('pclose').onclick = () => { $('preview').remove(); URL.revokeObjectURL(url) };
}
// 공유하기: 이미지까지 공유 → 문구만 공유 → 문구 복사 순서로 시도한다
async function shareCard(){
  const text = shareText();
  try {
    const blob = await cardBlob();
    const file = blob && new File([blob], `리암의_거짓말_${G.result.grade}.png`, {type:'image/png'});
    if (file && navigator.canShare?.({files:[file]})){ await navigator.share({files:[file], title:'리암의 거짓말', text}); return }
    if (navigator.share){ await navigator.share({title:'리암의 거짓말', text}); return }
  } catch (e) { if (e?.name === 'AbortError') return }
  try { await navigator.clipboard.writeText(text); note('공유 문구를 복사했어요. 원하는 곳에 붙여 넣으세요.') }
  catch { note('이 화면에선 공유할 수 없어요. "이미지 저장"으로 저장해서 보내 주세요.') }
}

function start(){
  clearInterval(G?.timer); fx.innerHTML = ''; type.t = null;
  S = fresh(); render.key = null;
  G = {queue:ORDER(), ci:0, sub:0, hearts:3, time:0, idle:0, stage:0, via:{}, mockN:0, phase:'react', atEv:null, miss:0};
  render();
  G.timer = setInterval(tick, 1000);
  musicStop(); musicStart(0); openCase();
}
