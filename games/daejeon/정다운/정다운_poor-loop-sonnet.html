<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>신입 수호신 실습</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* 한 개의 폰 폭 기둥(최대 430px). 위: 144×150 도트 월드, 아래: RPG 대화창/행동 카드.
   마지막 막에서만 index.html 토큰의 앱 화면(#app)이 월드를 덮는다. */
:root{
  color-scheme:dark;
  --bg:#0A0816; --panel:#130F27; --panel2:#1B1636; --edge:#F4EBD0; --ink:#F4EBD0; --dim:#9A92B8; --gold:#F2C75C; --rose:#FF7A8A; --teal:#4FE0C8; --ln:#2C2547;
  --a-bg:#F3F9F5; --a-ink:#1E2320; --a-sub:#83908A; --a-hair:#E1ECE5; --a-clay:#B8865C; --a-blue:#5B8FB9; --a-pale:#E3F1E8; --a-loop:#1FB86B;
  --f:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --px:"Press Start 2P",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#05040c;color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
#phone{position:relative;max-width:430px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

/* ---------- 월드 ---------- */
#stage{position:relative;width:min(100%,calc(64dvh * 144 / 176));aspect-ratio:144/176;margin:0 auto;flex:none;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.55}
#stage.shake{animation:shk .08s linear infinite}
@keyframes shk{0%{transform:translate(2px,1px)}25%{transform:translate(-2px,-1px)}50%{transform:translate(1px,-2px)}75%{transform:translate(-1px,2px)}100%{transform:translate(2px,1px)}}
#hud{position:absolute;left:0;right:0;top:0;padding-right:70px!important;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:7px 8px;pointer-events:none;z-index:4}
#hud .day{font:9px/1.3 var(--px);color:var(--ink);text-shadow:0 2px 0 #000;letter-spacing:0}
#hud .day small{display:block;font-size:7px;color:var(--gold);margin-top:3px}
#bars{display:grid;gap:3px;width:42%}
.bar{display:grid;grid-template-columns:30px 1fr 22px;gap:4px;align-items:center;font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 0 #000}
.bar i{display:block;height:6px;background:#000a;border:1px solid #fff6;position:relative;overflow:hidden}
.bar i b{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--c);transition:width .5s steps(8)}
.bar em{font-style:normal;font:7px var(--px);text-align:right}
.bar.b{--c:#FF6B6B}.bar.m{--c:#7FB5FF}.bar.t{--c:#7BE0A0}
#bubbleLayer{position:absolute;inset:0;pointer-events:none;z-index:5}
.bub{position:absolute;max-width:62%;background:#FFFBEF;color:#241c33;font-size:12.5px;line-height:1.45;font-weight:500;padding:6px 9px;box-shadow:0 -2px 0 #FFFBEF,0 2px 0 #FFFBEF,-2px 0 0 #FFFBEF,2px 0 0 #FFFBEF,0 0 0 4px #241c33;transform:translate(-50%,-100%);animation:pop .18s steps(3)}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;width:8px;height:6px;background:#FFFBEF;transform:translateX(-50%);box-shadow:0 2px 0 #241c33,-2px 0 0 #241c33 inset}
.bub.rule{background:#241c33;color:#FFFBEF;box-shadow:0 -2px 0 #241c33,0 2px 0 #241c33,-2px 0 0 #241c33,2px 0 0 #241c33,0 0 0 4px #FFFBEF}
.bub.rule::after{background:#241c33}
.bub .who{display:block;font:7px var(--px);color:#a0457c;margin-bottom:3px}
@keyframes pop{from{transform:translate(-50%,-92%) scale(.9);opacity:0}}
.float{position:absolute;font:9px var(--px);color:#fff;text-shadow:0 2px 0 #000;z-index:6;animation:fl 1.3s steps(12) forwards;pointer-events:none}
@keyframes fl{to{transform:translateY(-34px);opacity:0}}
#banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:7;text-align:center;pointer-events:none;font:14px/1.7 var(--px);color:#fff;text-shadow:0 3px 0 #000,0 0 18px var(--gold);opacity:0;white-space:nowrap}
#banner.on{animation:ban 2.2s steps(1) forwards}
@keyframes ban{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}
#banner small{display:block;font:500 12px/1.6 var(--f);color:var(--gold);margin-top:6px}
.fx{position:absolute;inset:0;pointer-events:none;z-index:8}
#fade{background:#000;opacity:0;transition:opacity .5s}
#flash{background:#fff;opacity:0}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);max-width:92%;text-align:center;font:700 11.5px/1.4 var(--f);color:var(--gold);background:#05040cdd;padding:5px 10px;box-shadow:0 0 0 2px #000;z-index:6;pointer-events:none;animation:blink 1.4s steps(2) infinite;white-space:nowrap}
@keyframes blink{50%{opacity:.2}}
#tutTag{position:absolute;left:0;top:34px;z-index:6;background:var(--gold);color:#20170a;font:7px/1 var(--px);padding:5px 7px 4px;box-shadow:0 2px 0 #000;transform:translateX(-100%);transition:transform .25s steps(5)}
#tutTag.on{transform:none}
#dpad{position:absolute;bottom:44px;display:flex;gap:6px;z-index:6;left:8px}
#dpad.r{left:auto;right:8px}
.pad{width:44px;height:44px;background:#0009;border:2px solid var(--edge);color:var(--edge);font:12px var(--px);display:grid;place-items:center;touch-action:none}
.pad:active{background:var(--gold);color:#000}

/* ---------- 패널(대화·선택) ---------- */
#panel{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(#0F0B21,#0A0816);overflow:auto}
.dlg{position:relative;background:var(--panel);color:var(--ink);padding:16px 16px 14px;min-height:112px;box-shadow:0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 0 0 6px #000;animation:up .2s steps(4);cursor:pointer;margin:6px 3px 4px}
@keyframes up{from{transform:translateY(8px);opacity:.2}}
.dlg .nm{position:absolute;left:12px;top:-13px;background:var(--gold);color:#1d1503;font-weight:900;font-size:12px;padding:3px 9px;box-shadow:0 2px 0 #000}
.dlg .nm.me{background:var(--teal)}.dlg .nm.sys{background:#cfc6ff}.dlg .nm.ghost{background:#e9e3d0}.dlg .nm.poor{background:#ffd0a3}
.dlg .tx{font-size:15px;line-height:1.7;font-weight:400;min-height:5.1em;word-break:keep-all;overflow-wrap:anywhere}
.dlg .tx .c{opacity:0}.dlg .tx .c.on{opacity:1}
.dlg .tx em{font-style:normal;color:var(--gold);font-weight:700}
.dlg .nx{position:absolute;right:12px;bottom:6px;font:9px var(--px);color:var(--gold);animation:blink .8s steps(2) infinite}
.dlg.ghost{background:#0d0a1c;color:#E9E3D0}
.dlg.big .tx{font-size:16.5px}
.dlg.dim .tx{color:var(--dim)}
.choices{display:grid;gap:10px;margin:2px 3px}
.ch{position:relative;text-align:left;background:var(--panel2);padding:12px 14px;min-height:50px;box-shadow:0 -2px 0 0 var(--edge),0 2px 0 0 var(--edge),-2px 0 0 0 var(--edge),2px 0 0 0 var(--edge),0 0 0 4px #000;animation:up .2s steps(4) both}
.ch b{display:block;font-size:14.5px;font-weight:700}
.ch span{display:block;font-size:12px;color:var(--dim);margin-top:2px;line-height:1.45}
.ch:active{background:var(--gold);color:#1d1503}.ch:active span{color:#3a2c0a}
.ch.dis{opacity:.28;pointer-events:none}
.ch.spot{background:#2c2350;animation:spot 1s steps(2) infinite}
@keyframes spot{50%{box-shadow:0 -2px 0 0 var(--gold),0 2px 0 0 var(--gold),-2px 0 0 0 var(--gold),2px 0 0 0 var(--gold),0 0 0 4px #000}}
.hand{position:absolute;right:10px;bottom:-14px;width:34px;height:41px;image-rendering:pixelated;animation:hnd .7s steps(2) infinite;pointer-events:none;z-index:3}
@keyframes hnd{50%{transform:translateY(-8px)}}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 3px}
.card3{position:relative;background:var(--panel2);padding:10px 4px 9px;text-align:center;box-shadow:0 -2px 0 0 var(--edge),0 2px 0 0 var(--edge),-2px 0 0 0 var(--edge),2px 0 0 0 var(--edge),0 0 0 4px #000;animation:up .2s steps(4) both}
.card3 canvas{width:40px;height:40px;image-rendering:pixelated;display:block;margin:0 auto 5px}
.card3 b{display:block;font-size:13px;font-weight:900}
.card3 span{display:block;font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.35;padding:0 3px}
.card3:active,.card3.spot{background:#2c2350}
.card3.spot{animation:spot 1s steps(2) infinite}
.card3.dis{opacity:.22;pointer-events:none}
.card3 .hand{right:50%;margin-right:-17px;bottom:-26px}
.cont{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 3px}
.btnpx{background:var(--gold);color:#1d1503;font:900 15px var(--f);padding:13px 20px;box-shadow:0 -2px 0 0 #fff4,0 4px 0 0 #8a6c1d,0 0 0 4px #000;width:100%;letter-spacing:.02em}
.btnpx:active{transform:translateY(3px);box-shadow:0 1px 0 0 #8a6c1d,0 0 0 4px #000}
.btnpx.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 -2px 0 0 var(--edge),0 2px 0 0 var(--edge),-2px 0 0 0 var(--edge),2px 0 0 0 var(--edge),0 0 0 4px #000}
.note{font-size:12px;color:var(--dim);text-align:center;line-height:1.6;padding:0 6px}
.tut .ch:not(.spot),.tut .card3:not(.spot){opacity:.25;pointer-events:none}

/* ---------- 오버레이 화면(타이틀·게임오버 등) ---------- */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(5,4,12,.0)}
#title{justify-content:flex-end;padding-bottom:max(34px,env(safe-area-inset-bottom));background:linear-gradient(transparent 40%,#05040ccc)}
#title h1{margin:0;font:34px/1.2 var(--px);color:#fff;text-shadow:0 4px 0 #6a3fd1,0 8px 0 #000;letter-spacing:2px}
#title .sub{font-size:14px;color:var(--gold);margin:14px 0 4px;letter-spacing:.2em;font-weight:700}
#title .sub2{font-size:12px;color:var(--dim);margin-bottom:26px}
#title .press{font:10px var(--px);color:#fff;animation:blink 1s steps(2) infinite}
#title .ver{position:absolute;right:12px;bottom:8px;font:7px var(--px);color:#fff5}
#gameover{background:#000;justify-content:center;gap:6px}
#gameover h2{font:26px/1.3 var(--px);color:#ff4d5e;margin:0 0 14px;text-shadow:0 4px 0 #5a0a14}
#gameover .cnt{font:64px var(--px);color:#fff;margin:6px 0 18px;text-shadow:0 5px 0 #6a3fd1}
#gameover p{margin:0 0 4px;color:var(--dim);font-size:13.5px;line-height:1.7}
#gameover .btnpx{width:auto;padding:14px 28px}
#sheet{background:#05040cF2;justify-content:flex-start;overflow:auto;padding-top:34px}
.pcard{width:100%;max-width:340px;background:var(--panel);padding:16px;text-align:left;box-shadow:0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 0 0 6px #000;animation:up .3s steps(4)}
.pcard h3{margin:0 0 4px;font:11px/1.5 var(--px);color:var(--gold)}
.pcard .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--ln);line-height:1.5}
.pcard .row b{color:var(--teal);font-weight:700;white-space:nowrap}
.pcard .big{font:40px var(--px);color:var(--gold);text-align:center;margin:8px 0;text-shadow:0 4px 0 #6a3fd1}
.pcard p{font-size:13.5px;line-height:1.7;margin:10px 0 0;color:#d9d2ee}

/* ---------- 감독 메뉴 ---------- */
#dirBtn{position:absolute;right:6px;top:6px;z-index:30;font:7px var(--px);color:#fff;background:#0008;padding:6px 7px;border:1px solid #fff5}
#dir{position:absolute;inset:0;z-index:40;background:#05040cEE;padding:44px 18px 18px;overflow:auto}
#dir h4{font:9px var(--px);color:var(--gold);margin:0 0 12px}
#dir .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
#dir button{background:var(--panel2);border:2px solid var(--ln);padding:11px 8px;font-size:13px;font-weight:700;text-align:left}
#dir button.on{border-color:var(--gold);color:var(--gold)}
#dir .x{position:absolute;right:14px;top:12px;font:9px var(--px)}

/* ---------- 앱(3막) ---------- */
#app{position:absolute;inset:0;z-index:25;background:var(--a-bg);color:var(--a-ink);display:flex;flex-direction:column;animation:appin .6s steps(6)}
@keyframes appin{from{transform:scale(.9);opacity:0}}
#app header{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;background:var(--a-bg);border-bottom:1px solid var(--a-hair)}
#app header canvas{width:34px;height:34px;image-rendering:pixelated;background:var(--a-pale);border-radius:50%}
#app header b{font-size:16px;font-weight:700;letter-spacing:.06em}
#app header small{display:block;font-size:11px;color:var(--a-sub);margin-top:1px}
#log3{flex:1;min-height:0;overflow:auto;padding:14px 16px 6px;display:flex;flex-direction:column;gap:9px}
.m3{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.6;animation:mi .25s ease-out both;word-break:keep-all;overflow-wrap:anywhere}
@keyframes mi{from{transform:translateY(8px);opacity:0}}
.m3.l{align-self:flex-start;background:#fff;border:1px solid var(--a-hair);border-top-left-radius:4px}
.m3.me{align-self:flex-end;background:var(--a-loop);color:#fff;border-top-right-radius:4px}
.m3.typing{display:flex;gap:4px;padding:13px 14px}
.m3.typing i{width:6px;height:6px;border-radius:50%;background:var(--a-sub);animation:dt 1s infinite}
.m3.typing i:nth-child(2){animation-delay:.15s}.m3.typing i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.m3.sys{align-self:center;background:transparent;color:var(--a-sub);font-size:11.5px;padding:2px}
#bot3{padding:10px 16px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--a-hair);background:var(--a-bg);display:grid;gap:8px}
#bot3 .opt{background:#fff;border:1px solid var(--a-hair);border-radius:14px;padding:13px 14px;text-align:left;font-size:14.5px;line-height:1.45;font-weight:500;animation:mi .25s ease-out both}
#bot3 .opt small{display:block;color:var(--a-sub);font-weight:400;font-size:12px;margin-top:2px}
#bot3 .opt:active{background:var(--a-pale)}
#bot3 .pri{background:var(--a-loop);color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:15px;text-align:center}
#bot3 .pri:disabled{opacity:.4}
#bot3 .sec{color:var(--a-sub);font-size:13px;padding:6px;text-align:center}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;border:1px solid var(--a-hair);background:#fff;border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;color:var(--a-ink);outline:none}
.inrow input:focus{border-color:var(--a-loop)}
.inrow button{background:var(--a-loop);color:#fff;border-radius:14px;padding:0 18px;font-weight:700}
.eyebox{background:#fff;border:1px solid var(--a-hair);border-radius:16px;padding:12px;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
.eyebox canvas{width:76px;height:60px;image-rendering:pixelated;background:#1E2320;border-radius:10px}
.eyebox p{margin:0;font-size:12.5px;line-height:1.55;color:var(--a-sub)}.eyebox p b{color:var(--a-ink)}
.perm{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--a-hair);border-radius:14px;padding:11px 14px;font-size:14px;font-weight:500;text-align:left;width:100%}
.perm small{display:block;color:var(--a-sub);font-weight:400;font-size:11.5px;margin-top:1px}
.sw{flex:none;width:44px;height:26px;border-radius:13px;background:#cdd8d1;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.perm.on .sw{background:var(--a-loop)}.perm.on .sw::after{left:21px}
.plantbox{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--a-hair);border-radius:16px;padding:10px 12px}
.plantbox canvas{width:96px;height:96px;image-rendering:pixelated;background:linear-gradient(#E3F1E8,#F3F9F5);border-radius:12px}
.plantbox p{margin:0;font-size:13px;line-height:1.55;color:var(--a-sub)}.plantbox p b{color:var(--a-ink);display:block;font-size:14.5px;margin-bottom:2px}
#lock{position:absolute;inset:0;z-index:26;background:#0b0b18;color:#fff;display:flex;flex-direction:column;align-items:center;padding:70px 20px 40px;animation:appin .5s steps(5)}
#lock .t{font:300 76px/1 var(--f);letter-spacing:-2px}
#lock .d{font-size:15px;opacity:.8;margin-top:8px}
#lock .n{margin-top:auto;width:100%;background:#ffffff22;backdrop-filter:blur(14px);border-radius:18px;padding:13px 15px;display:flex;gap:12px;align-items:center;text-align:left;animation:nin .5s ease-out}
@keyframes nin{from{transform:translateY(30px);opacity:0}}
#lock .n canvas{width:38px;height:38px;border-radius:10px;background:#E3F1E8;image-rendering:pixelated;flex:none}
#lock .n b{font-size:13px;display:flex;justify-content:space-between}#lock .n b i{font-style:normal;font-weight:400;opacity:.6;font-size:11px}
#lock .n p{margin:2px 0 0;font-size:13.5px;line-height:1.45;opacity:.95}
#lock .home{margin-top:18px;font:8px var(--px);opacity:.55;animation:blink 1.4s steps(2) infinite}

/* 데스크톱: 폰 껍데기 — 화면이 커져도 폰 크기 유지 */
@media (min-width:600px){
  html{--ph:min(844px,calc(100vh - 48px));height:100%;background:#0b0b12!important;display:grid;place-items:center;overflow:hidden}
  body{position:relative!important;width:390px!important;height:var(--ph)!important;min-height:0!important;margin:0!important;overflow:hidden!important;border-radius:44px;transform:translateZ(0);box-shadow:0 0 0 10px #15171f,0 0 0 11px #3b4050,0 30px 80px rgba(0,0,0,.45)}
  #phone{height:100%!important;max-width:none!important}
  #stage{width:min(100%,calc(var(--ph)*.64*144/176))!important}
}
</style>

<div id="phone">
  <div id="stage">
    <canvas id="cv" width="144" height="176"></canvas>
    <div id="hud" hidden>
      <div class="day"><span id="dayT">DAY 01</span><small id="clockT">07:40</small></div>
      <div id="bars">
        <div class="bar b"><span>몸</span><i><b id="bB"></b></i><em id="bBn">70</em></div>
        <div class="bar m"><span>마음</span><i><b id="bM"></b></i><em id="bMn">70</em></div>
        <div class="bar t"><span>신뢰</span><i><b id="bT"></b></i><em id="bTn">60</em></div>
      </div>
    </div>
    <div id="tutTag">TUTORIAL 1/3</div>
    <div id="bubbleLayer"></div>
    <div id="banner"></div>
    <div id="hint" hidden></div>
    <div id="dpad" hidden><button class="pad" id="padL">◀</button><button class="pad" id="padR">▶</button></div>
    <div class="fx" id="fade"></div>
    <div class="fx" id="flash"></div>
  </div>
  <div id="panel"></div>

  <div class="screen" id="title" hidden>
    <h1>LOOP</h1>
    <div class="sub">신입 수호신 실습</div>
    <div class="sub2">POOR → LOOP · 졸업 시험</div>
    <div class="press">TAP TO START</div>

    rec.rej = () => { clearTimeout(to); rej(ABORT); }; pend.add(rec);

}

}

  rec.rej = () => { cancelAnimationFrame(id); rej(ABORT); }; pend.add(rec); id = requestAnimationFrame(step);
});

  const s = $('#sheet'); s.hidden = false; s.style.background = '#05040cF4'; $('#app').hidden = true;
  const perms = H.perms.length, done = APP.done;
  const grade = done ? (perms > 0 ? 'S' : 'A') : (perms > 0 ? 'A' : 'B');
  const gl = { S: '대신 살지 않았고, 허락 안에서 움직였다.', A: '잘 했다. 한 가지만 더 맡기면 S.', B: '아직 눈을 감고 있다. 그래도 시작했다.' }[grade];
  sfx(done ? 'reveal' : 'chime');
  s.innerHTML = `<canvas id="endCv" width="144" height="100" style="width:100%;max-width:340px;image-rendering:pixelated;box-shadow:0 0 0 3px #7a4fd1;margin-bottom:14px"></canvas>
    <div class="pcard"><h3>GRADUATION EXAM · DAY 2</h3>
    <div class="big">${grade}</div><p style="text-align:center;margin:0 0 8px">${gl}</p>
    <div class="row"><span>대신 살아준 횟수</span><b>0회</b></div>
    <div class="row"><span>허락받은 창</span><b>${perms} / 4</b></div>
    <div class="row"><span>닿은 알림</span><b>딱 1번 (${H.when})</b></div>
    <div class="row"><span>첫 약속</span><b>${done ? '해냄' : '내일로'}</b></div>
    <div class="row"><span>1막 기록</span><b>부드럽게 ${H.soft} · 단호하게 ${H.firm} · 지켜봄 ${H.watch}</b></div>
    <p><b style="color:var(--gold)">LOOP의 세 가지 원칙</b><br>① 말하기 전에 묻는다<br>② 허락받은 만큼만 본다<br>③ 신호만 보내고, 사는 건 그가 한다</p>
    <p style="color:var(--dim);font-size:12.5px">히기에이아: "졸업은 말이야, 네가 필요 없어지는 날이야. 일단 오늘은 수고했어, 수호신."</p></div>
    <div style="display:grid;gap:10px;width:100%;max-width:340px;margin-top:16px"><button class="btnpx" id="again">처음부터 다시 ▶</button></div>`;
  const ec = $('#endCv'), eg = ec.getContext('2d'); eg.imageSmoothingEnabled = false; let live = true;
  const lp = now => { if (!live) return; eg.clearRect(0, 0, 144, 100); eg.fillStyle = '#05040c'; eg.fillRect(0, 0, 144, 100); eg.save(); eg.translate(0, -2); drawVisionFuture(eg, (now - T0) / 1000, 1); eg.restore(); requestAnimationFrame(lp); };
  requestAnimationFrame(lp);
  await userWait(d => { $('#again').onclick = () => { sfx('coin'); d(); }; return () => { live = false; }; });
  live = false; s.hidden = true; s.style.background = '';
  play('title');
}

/* =====================================================================
   13. 감독 메뉴 · 부팅
   ===================================================================== */
const SCENES = { title: sceneTitle, prologue: scenePrologue, act1: async () => { await act1(); }, over: async () => { await gameOver(); }, rewind: sceneRewind, temple: sceneTemple, ascend: sceneAscend, app: sceneApp };
const SEQ = ['title', 'prologue', 'act1', 'over', 'rewind', 'temple', 'ascend', 'app'];
async function play(from) {
  abortAll(); const me = RUN;
  if (['rewind', 'temple', 'ascend', 'app', 'over'].includes(from) && !H.days.length) presetState();
  if (from === 'title') resetState();
  try { for (let i = SEQ.indexOf(from); i < SEQ.length; i++) { await SCENES[SEQ[i]](); if (me !== RUN) return; } }
  catch (e) { if (e !== ABORT) console.error('scene error', e && e.stack || e); }
}
const DIR = [['title', '타이틀'], ['prologue', '프롤로그 · 신들의 학교'], ['act1', '1막 · 21일 관찰 실습'], ['over', '게임 오버 · 컨티뉴'], ['rewind', '회귀 · 다이얼'], ['temple', '신전 · 세 손님'], ['ascend', '회빙환 · 소환'], ['app', '3막 · LOOP 앱']];
function openDir() {
  const d = $('#dir'); d.hidden = false;
  d.innerHTML = `<button class="x" id="dx">CLOSE ✕</button><h4>SCENE 점프</h4><div class="g">${DIR.map(([k, n]) => `<button data-k="${k}">${n}</button>`).join('')}</div>
   <h4>OPTIONS</h4><div class="g"><button id="oAuto" class="${AUTO ? 'on' : ''}">AUTO ${AUTO ? 'ON' : 'OFF'}</button><button id="oSnd" class="${SND && !MUTED ? 'on' : ''}">SOUND ${MUTED ? 'OFF' : 'ON'}</button>
   <button data-sp="1" class="${SPEED === 1 ? 'on' : ''}">속도 ×1</button><button data-sp="2" class="${SPEED === 2 ? 'on' : ''}">속도 ×2</button><button data-sp="4" class="${SPEED === 4 ? 'on' : ''}">속도 ×4</button></div>`;
  $('#dx').onclick = () => d.hidden = true;
  d.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { d.hidden = true; audio(); play(b.dataset.k); });
  d.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { SPEED = +b.dataset.sp; openDir(); });
  $('#oAuto').onclick = () => { AUTO = !AUTO; if (AUTO && NEXTFN) NEXTFN(); openDir(); };
  $('#oSnd').onclick = () => { MUTED = !MUTED; if (MUTED) musicGrid(null); openDir(); };
}
$('#dirBtn').onclick = openDir;
const stage = $('#stage');
['down', 'move'].forEach(k => stage.addEventListener('pointer' + k, e => SC.pointer && SC.pointer[k] && SC.pointer[k](e)));
addEventListener('pointerup', e => SC.pointer && SC.pointer.up && SC.pointer.up(e)); addEventListener('pointercancel', e => SC.pointer && SC.pointer.up && SC.pointer.up(e));
requestAnimationFrame(frame);
(function boot() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('speed')) SPEED = +q.get('speed'); if (q.get('auto')) AUTO = true; if (q.get('mute')) MUTED = true;
  const s = q.get('scene') || 'title';
  if (s !== 'title') { presetState(); }
  setTimeout(() => play(s), 50);
})();

</script>
