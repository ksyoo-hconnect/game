<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>하강 — 수호자의 첫 실습</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 한 개의 긴 세로 세계(144px 폭)를 손가락으로 내려간다. 캔버스가 바닥 전체, 대화·버튼은 그 위에 얹는다.
   마지막 막에서만 폰 화면(#app)이 세계를 덮고 index.html 토큰을 쓴다. */
:root{
  color-scheme:dark;
  --ink:#F2EEF8; --dim:#9C95B8; --box:#0D1030; --box2:#181C48; --edge:#E9E3F4; --sig:#FFB347; --sig2:#FF6E7A; --ok:#7EE3A6; --ln:#2A2E62;
  --a-bg:#F3F9F5; --a-ink:#1E2320; --a-sub:#83908A; --a-hair:#E1ECE5; --a-clay:#B8865C; --a-blue:#5B8FB9; --a-pale:#E3F1E8; --a-loop:#1FB86B;
  --f:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --px:"Silkscreen",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#070A18;color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
#phone{position:relative;max-width:430px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#070A18;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#phone::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);opacity:.5;z-index:1}
#phone.shake{animation:shk .07s linear infinite}
@keyframes shk{0%{transform:translate(2px,1px)}33%{transform:translate(-2px,-2px)}66%{transform:translate(1px,2px)}100%{transform:translate(-1px,0)}}
#ui{position:absolute;inset:0;z-index:3;pointer-events:none}
#ui>*{pointer-events:auto}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:8px 72px 8px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font:10px/1.4 var(--px);text-shadow:0 2px 0 #000;pointer-events:none}
#hud .d b{display:block;font-size:13px;color:#fff}
#hud .d small{color:var(--sig);font-size:9px}
#meters{display:grid;gap:4px;min-width:118px}
.mt{display:grid;grid-template-columns:28px 1fr;gap:5px;align-items:center;font-family:var(--f);font-size:10px;font-weight:700;color:#fff}
.mt i{height:7px;background:#0009;border:1px solid #fff8;position:relative;overflow:hidden}
.mt i b{position:absolute;inset:0;right:auto;width:0;background:var(--c);transition:width .4s steps(6)}
.mt.t{--c:#7EE3A6}.mt.a{--c:#FF6E7A}
#hud .mute{font:9px var(--px);color:var(--sig2);margin-top:3px;display:none}
#hud.muted .mute{display:block}

/* 힌트 · 배너 · 플로터 */
#hint{position:absolute;left:50%;bottom:36%;transform:translateX(-50%);font:700 12px/1.4 var(--f);color:#fff;background:#0D1030E6;padding:7px 12px;box-shadow:0 0 0 2px var(--edge),0 0 0 4px #000;white-space:nowrap;animation:bob 1.1s steps(2) infinite;pointer-events:none;text-align:center}
#hint b{display:block;font:11px var(--px);color:var(--sig);letter-spacing:.05em}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;pointer-events:none;opacity:0;font:700 22px/1.3 var(--px);color:#fff;text-shadow:0 3px 0 #000,0 0 22px var(--sig);letter-spacing:.04em}
#banner.on{animation:ban 2.4s steps(1) forwards}
@keyframes ban{0%{opacity:0}6%{opacity:1}84%{opacity:1}100%{opacity:0}}
#banner small{display:block;font:500 13px/1.6 var(--f);color:var(--sig);margin-top:8px;letter-spacing:.1em}
#banner .hj{font:900 30px/1.2 var(--f);letter-spacing:.3em;color:#fff}
.fl{position:absolute;font:11px var(--px);color:#fff;text-shadow:0 2px 0 #000;pointer-events:none;animation:flo 1.2s steps(10) forwards;white-space:nowrap}
@keyframes flo{to{transform:translateY(-30px);opacity:0}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
#fade{background:#000;opacity:0;transition:opacity .5s}
#flash{background:#fff;opacity:0}
#sepia{background:#c9a46a;opacity:0;mix-blend-mode:multiply;transition:opacity .6s}

/* 말풍선(캔버스 좌표에 핀) */
.bub{position:absolute;transform:translate(-50%,-100%);max-width:64%;background:#FFFBEF;color:#1d1830;font-size:12px;line-height:1.45;font-weight:500;padding:5px 8px;box-shadow:0 -2px 0 #FFFBEF,0 2px 0 #FFFBEF,-2px 0 0 #FFFBEF,2px 0 0 #FFFBEF,0 0 0 4px #1d1830;animation:pop .15s steps(3);pointer-events:none;z-index:4}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;width:6px;height:6px;background:#FFFBEF;transform:translateX(-50%)}
.bub.dark{background:#1d1830;color:#FFFBEF;box-shadow:0 -2px 0 #1d1830,0 2px 0 #1d1830,-2px 0 0 #1d1830,2px 0 0 #1d1830,0 0 0 4px #FFFBEF}.bub.dark::after{background:#1d1830}
@keyframes pop{from{transform:translate(-50%,-92%) scale(.85);opacity:0}}

/* 아래 패널: 대화창·선택·미니게임 */
#panel{position:absolute;left:0;right:0;bottom:0;padding:10px 10px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,#070A18 55%)}
.dlg{position:relative;background:var(--box);padding:16px 14px 14px;min-height:104px;box-shadow:0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 0 0 6px #000;animation:up .18s steps(4);cursor:pointer;margin:4px 3px 4px}
@keyframes up{from{transform:translateY(8px);opacity:.3}}
.dlg .nm{position:absolute;left:10px;top:-12px;background:var(--sig);color:#1d1503;font-weight:900;font-size:12px;padding:3px 9px;box-shadow:0 2px 0 #000}
.dlg .nm.sys{background:#cfc6ff}.dlg .nm.gh{background:#e9e3d0}.dlg .nm.poor{background:#ffd0a3}.dlg .nm.loop{background:var(--ok)}
.dlg .tx{font-size:15px;line-height:1.7;min-height:4.5em;word-break:keep-all;overflow-wrap:anywhere}
.dlg .tx .c{opacity:0}.dlg .tx .c.on{opacity:1}
.dlg .nx{position:absolute;right:12px;bottom:5px;font:10px var(--px);color:var(--sig);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.dlg.gh{background:#120d22;color:#E9E3D0}
.dlg.dim .tx{color:var(--dim)}
.choices{display:grid;gap:9px;margin:0 3px}
.ch{position:relative;text-align:left;background:var(--box2);padding:11px 13px;box-shadow:0 -2px 0 0 var(--edge),0 2px 0 0 var(--edge),-2px 0 0 0 var(--edge),2px 0 0 0 var(--edge),0 0 0 4px #000;animation:up .2s steps(4) both}
.ch b{display:block;font-size:14.5px;font-weight:700}.ch span{display:block;font-size:12px;color:var(--dim);margin-top:2px;line-height:1.45}
.ch:active{background:var(--sig);color:#1d1503}.ch:active span{color:#3a2c0a}
.ch.dis{opacity:.3;pointer-events:none}
.cont{display:flex;flex-direction:column;gap:8px;margin:0 3px}
.btnpx{background:var(--sig);color:#1d1503;font:900 15px var(--f);padding:13px 20px;box-shadow:0 -2px 0 0 #fff5,0 4px 0 0 #9a6a1d,0 0 0 4px #000;width:100%}
.btnpx:active{transform:translateY(3px);box-shadow:0 1px 0 0 #9a6a1d,0 0 0 4px #000}
.btnpx.ghost{background:var(--box2);color:var(--ink);box-shadow:0 -2px 0 0 var(--edge),0 2px 0 0 var(--edge),-2px 0 0 0 var(--edge),2px 0 0 0 var(--edge),0 0 0 4px #000}
.note{font-size:12px;color:var(--dim);text-align:center;line-height:1.55}

/* 신호 미니게임 */
#mg{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:0 3px}
#mg .info{background:var(--box);padding:10px 12px;box-shadow:0 -2px 0 0 var(--edge),0 2px 0 0 var(--edge),-2px 0 0 0 var(--edge),2px 0 0 0 var(--edge),0 0 0 4px #000}
#mg .info b{display:block;font-size:13px;font-weight:700}
#mg .info small{display:block;color:var(--dim);font-size:11.5px;line-height:1.45;margin-top:2px}
#ammo{display:flex;gap:5px;margin-top:7px}
#ammo i{width:14px;height:14px;background:var(--sig);box-shadow:0 0 0 2px #000}
#ammo i.used{background:#2a2e62}
#send{width:92px;height:92px;border-radius:50%;background:var(--sig);color:#1d1503;font:900 15px/1.1 var(--f);box-shadow:0 0 0 4px #000,0 0 0 7px var(--sig2),0 6px 0 7px #000;position:relative}
#send small{display:block;font:9px var(--px);margin-top:3px}
#send:active{transform:translateY(4px);box-shadow:0 0 0 4px #000,0 0 0 7px var(--sig2),0 2px 0 7px #000}
#send.lit{background:#fff;box-shadow:0 0 0 4px #000,0 0 0 7px var(--ok),0 6px 0 7px #000,0 0 30px var(--ok)}
#send:disabled{background:#2a2e62;color:var(--dim);box-shadow:0 0 0 4px #000,0 0 0 7px #2a2e62}
#timer{position:absolute;left:-7px;right:-7px;top:-7px;bottom:-7px;border-radius:50%;pointer-events:none}

/* 전체 화면 카드 */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px 20px;overflow:auto}
#title{justify-content:flex-end;padding-bottom:max(30px,env(safe-area-inset-bottom));background:linear-gradient(transparent 45%,#070A18e0 80%)}
#title h1{margin:0;font:700 28px/1.2 var(--px);color:#fff;text-shadow:0 4px 0 #6a3fd1,0 8px 0 #000;letter-spacing:.06em}
#title h1 small{display:block;font:900 15px/1.5 var(--f);color:var(--sig);letter-spacing:.35em;margin-top:8px}
#title .sub2{font-size:12.5px;color:var(--dim);margin:8px 0 20px;line-height:1.6}
#title .press{font:11px var(--px);color:#fff;animation:blink 1s steps(2) infinite}
#title .ver{position:absolute;right:12px;bottom:8px;font:8px var(--px);color:#fff5}
.pcard{width:100%;max-width:340px;background:var(--box);padding:16px;text-align:left;box-shadow:0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge),0 0 0 6px #000;animation:up .3s steps(4)}
.pcard h3{margin:0 0 6px;font:11px/1.5 var(--px);color:var(--sig)}
.pcard .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--ln);line-height:1.5}
.pcard .row b{color:var(--ok);white-space:nowrap;text-align:right}
.pcard .big{font:40px var(--px);color:var(--sig);text-align:center;margin:6px 0;text-shadow:0 4px 0 #6a3fd1}
.pcard p{font-size:13.5px;line-height:1.7;margin:10px 0 0;color:#d9d2ee}
.rule{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--ln)}
.rule i{font:700 12px var(--px);color:var(--sig);background:#000;padding:5px 0;text-align:center;box-shadow:0 0 0 2px var(--sig)}
.rule b{display:block;font-size:14.5px}.rule span{display:block;font-size:12px;color:var(--dim);line-height:1.5;margin-top:2px}
#sheet{background:#070A18F2}

/* 감독 메뉴 */
#dirBtn{position:absolute;right:6px;top:6px;z-index:30;font:8px var(--px);color:#fff;background:#0008;padding:6px 7px;border:1px solid #fff5}
#dir{position:absolute;inset:0;z-index:40;background:#070A18EE;padding:44px 18px 18px;overflow:auto}
#dir h4{font:9px var(--px);color:var(--sig);margin:0 0 12px}
#dir .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
#dir button{background:var(--box2);border:2px solid var(--ln);padding:11px 8px;font-size:13px;font-weight:700;text-align:left}
#dir button.on{border-color:var(--sig);color:var(--sig)}
#dir .x{position:absolute;right:14px;top:12px;font:9px var(--px)}

/* 3막 — 폰 */
#lock{position:absolute;inset:0;z-index:26;background:#0b0b18;color:#fff;display:flex;flex-direction:column;align-items:center;padding:70px 20px 40px;animation:appin .5s steps(5)}
@keyframes appin{from{transform:scale(.9);opacity:0}}
#lock .t{font:300 74px/1 var(--f);letter-spacing:-2px}
#lock .d{font-size:15px;opacity:.8;margin-top:8px}
#lock .n{margin-top:auto;width:100%;background:#ffffff22;backdrop-filter:blur(14px);border-radius:18px;padding:13px 15px;display:flex;gap:12px;align-items:center;text-align:left;animation:nin .5s ease-out;cursor:pointer}
@keyframes nin{from{transform:translateY(30px);opacity:0}}
#lock .n canvas{width:38px;height:38px;border-radius:10px;background:#E3F1E8;image-rendering:pixelated;flex:none}
#lock .n b{font-size:13px;display:flex;justify-content:space-between}#lock .n b i{font-style:normal;font-weight:400;opacity:.6;font-size:11px}
#lock .n p{margin:2px 0 0;font-size:13.5px;line-height:1.45;opacity:.95}
#lock .home{margin-top:18px;font:9px var(--px);opacity:.55;animation:blink 1.4s steps(2) infinite}
#app{position:absolute;inset:0;z-index:25;background:var(--a-bg);color:var(--a-ink);display:flex;flex-direction:column;animation:appin .6s steps(6)}
#app header{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--a-hair)}
#app header canvas{width:34px;height:34px;image-rendering:pixelated;background:var(--a-pale);border-radius:50%}
#app header b{font-size:16px;font-weight:700;letter-spacing:.06em}#app header small{display:block;font-size:11px;color:var(--a-sub);margin-top:1px}
#log3{flex:1;min-height:0;overflow:auto;padding:14px 16px 6px;display:flex;flex-direction:column;gap:9px}
.m3{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.6;animation:mi .25s ease-out both;word-break:keep-all;overflow-wrap:anywhere}
@keyframes mi{from{transform:translateY(8px);opacity:0}}
.m3.l{align-self:flex-start;background:#fff;border:1px solid var(--a-hair);border-top-left-radius:4px}
.m3.me{align-self:flex-end;background:var(--a-loop);color:#fff;border-top-right-radius:4px}
.m3.typing{display:flex;gap:4px;padding:13px 14px}.m3.typing i{width:6px;height:6px;border-radius:50%;background:var(--a-sub);animation:dt 1s infinite}.m3.typing i:nth-child(2){animation-delay:.15s}.m3.typing i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.m3.sys{align-self:center;background:transparent;color:var(--a-sub);font-size:11.5px;padding:2px}
.m3.card{width:100%;max-width:100%;background:#fff;border:1px solid var(--a-hair);align-self:stretch}
#bot3{padding:10px 16px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--a-hair);background:var(--a-bg);display:grid;gap:8px}
#bot3 .opt{background:#fff;border:1px solid var(--a-hair);border-radius:14px;padding:13px 14px;text-align:left;font-size:14.5px;line-height:1.45;font-weight:500;animation:mi .25s ease-out both}
#bot3 .opt small{display:block;color:var(--a-sub);font-weight:400;font-size:12px;margin-top:2px}
#bot3 .opt:active{background:var(--a-pale)}
#bot3 .pri{background:var(--a-loop);color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:15px;text-align:center}
.inrow{display:flex;gap:8px}.inrow input{flex:1;min-width:0;border:1px solid var(--a-hair);background:#fff;border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;color:var(--a-ink);outline:none}.inrow input:focus{border-color:var(--a-loop)}.inrow button{background:var(--a-loop);color:#fff;border-radius:14px;padding:0 18px;font-weight:700}
/* 창문 권한 */
.bld{background:#1E2320;border-radius:16px;padding:14px 14px 10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.bld::before{content:"";position:absolute;left:14px;right:14px;top:6px;height:3px;background:#B8865C}
.win{background:#2b3a44;border:3px solid #0f1518;border-radius:3px;padding:10px 8px;text-align:left;color:#8fa3b0;font-size:13px;font-weight:700;line-height:1.3;min-height:66px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;position:relative;transition:.2s}
.win small{font-weight:400;font-size:10.5px;opacity:.8}
.win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#0f1518;transform:translateX(-50%)}
.win::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:#0f1518}
.win.on{background:#FFE28A;color:#4a3203;box-shadow:0 0 18px #ffd96a99}
.win.on small{opacity:.9}
.bld .door{grid-column:1/-1;text-align:center;color:#83908A;font-size:11px;padding-top:4px}
.plantbox{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--a-hair);border-radius:16px;padding:10px 12px}
.plantbox canvas{width:96px;height:96px;image-rendering:pixelated;background:linear-gradient(#E3F1E8,#F3F9F5);border-radius:12px}
.plantbox p{margin:0;font-size:13px;line-height:1.55;color:var(--a-sub)}.plantbox p b{color:var(--a-ink);display:block;font-size:14.5px;margin-bottom:2px}

/* 데스크톱: 폰 껍데기 — 화면이 커져도 폰 크기 유지 */
@media (min-width:600px){
  html{--ph:min(844px,calc(100vh - 48px));height:100%;background:#0b0b12!important;display:grid;place-items:center;overflow:hidden}
  body{position:relative!important;width:390px!important;height:var(--ph)!important;min-height:0!important;margin:0!important;overflow:hidden!important;border-radius:44px;transform:translateZ(0);box-shadow:0 0 0 10px #15171f,0 0 0 11px #3b4050,0 30px 80px rgba(0,0,0,.45)}
  #phone{height:100%!important;max-width:none!important}
}
</style>

<div id="phone">
  <canvas id="cv" width="144" height="256"></canvas>
  <div id="ui">
    <div id="hud" hidden><div class="d"><b id="dayT">DAY 01</b><small id="subT">07:40</small><div class="mute">NOTIFICATIONS OFF</div></div>
      <div id="meters"><div class="mt t"><span>신뢰</span><i><b id="mT"></b></i></div><div class="mt a"><span>짜증</span><i><b id="mA"></b></i></div></div></div>
    <div id="hint" hidden></div>
    <div id="banner"></div>
    <div id="bubs"></div>
    <div id="panel"></div>
  </div>
  <div class="fx" id="sepia"></div><div class="fx" id="fade"></div><div class="fx" id="flash"></div>
  <div class="screen" id="title" hidden>
    <h1>DESCENT<small>하강 — 수호자의 첫 실습</small></h1>
    <div class="sub2">POOR → LOOP · 화면을 위로 쓸어 올리면 내려갑니다<br>소리 켜기 권장 · 오른쪽 위 SCENE 으로 장면 이동</div>
    <div class="press">TAP TO BEGIN</div>
    <div class="ver">PILOT v0.4 · FABLE</div>
  </div>
  <div class="screen" id="sheet" hidden></div>
  <button id="dirBtn">SCENE</button>
  <div id="dir" hidden></div>
  <div id="lock" hidden></div>
  <div id="app" hidden>
    <header><canvas id="avHead" width="16" height="16"></canvas><div><b>LOOP</b><small>당신의 수호자 · 열어준 창문만 봅니다</small></div></header>
    <div id="log3"></div><div id="bot3"></div>
  </div>
</div>

<script>
let INSTANT = false, SPEED = 1;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const GLYPH = {};
(function () {
  const raw = {

async function lsay(txt, ms) { const ty = document.createElement('div'); ty.className = 'm3 l typing'; ty.innerHTML = '<i></i><i></i><i></i>'; log3().appendChild(ty); log3().scrollTop = 1e6; await wait(ms || Math.min(1400, 350 + txt.length * 20)); ty.remove(); sfx('msg'); return addMsg(txt, 'l'); }
function ask(opts) { return userWait(done => { const b = bot3(); b.innerHTML = ''; opts.forEach((o, i) => { const x = document.createElement('button'); x.className = 'opt'; x.style.animationDelay = i * .05 + 's'; x.innerHTML = o.t + (o.s ? `<small>${o.s}</small>` : ''); x.onclick = () => { sfx('select'); b.innerHTML = ''; addMsg(o.t, 'me'); done(i); }; b.appendChild(x); }); if (AUTO) setTimeout(() => b.querySelector('.opt') && b.querySelector('.opt').click(), 900 / SPEED); return () => { }; }); }
function askText(ph) { return userWait(done => { const b = bot3(); b.innerHTML = `<div class="inrow"><input id="nm3" type="text" maxlength="12" placeholder="${ph}" autocomplete="off"><button id="go3">보내기</button></div>`; const send = () => { const v = $('#nm3').value.trim() || ph; sfx('send'); b.innerHTML = ''; addMsg(v, 'me'); done(v); }; $('#go3').onclick = send; $('#nm3').onkeydown = e => { if (e.key === 'Enter') send(); }; if (AUTO) setTimeout(send, 900 / SPEED); return () => { }; }); }
function paintIcon(c) { const x = c.getContext('2d'); x.clearRect(0, 0, 16, 16); const f = sprite('f' + ST.form, FORMS[ST.form]); x.drawImage(f, Math.round((16 - f.width) / 2), Math.round((16 - f.height) / 2)); }
async function lockScreen(timeStr, dateStr, msg) {

async function sceneApp() {

  else { await lsay('네. 패스도 기록해둘게요. 비난이 아니라 기록이에요. 내일 같은 시간에 또 있을게요.'); await plantGrow(true); }
  await lsay(`저는 대신 살아드리지 않아요. 신호만 보내요. 사는 건 ${ST.name}님 몫이니까요.`); await wait(700);

function askWindows() {
  return userWait(done => {
    const items = [['수면', '몇 시에 잤는지만'], ['식사', '직접 올린 사진만'], ['걸음', '하루 합계만'], ['일정', '빈 시간만']]; const on = [false, false, false, false];
    const b = bot3(); b.innerHTML = `<div class="bld">${items.map((it, i) => `<button class="win" data-i="${i}">${it[0]}<small>${it[1]}</small></button>`).join('')}<div class="door">켜진 창 <b id="wn">0</b> / 4 · 언제든 끌 수 있어요</div></div><button class="pri" id="winGo">이대로 시작</button>`;
    b.querySelectorAll('.win').forEach(w => w.onclick = () => { const i = +w.dataset.i; on[i] = !on[i]; w.classList.toggle('on', on[i]); sfx(on[i] ? 'select' : 'blip'); $('#wn').textContent = on.filter(Boolean).length; });
    $('#winGo').onclick = () => { sfx('confirm'); ST.perms = items.filter((_, i) => on[i]).map(x => x[0]); b.innerHTML = ''; addMsg(ST.perms.length ? '켜둘게요: ' + ST.perms.join(', ') : '전부 꺼둘게요', 'me'); done(); };
    if (AUTO) setTimeout(() => { b.querySelectorAll('.win')[0].click(); b.querySelectorAll('.win')[2].click(); $('#winGo').click(); }, 1200 / SPEED);
    return () => { };
  });
}
async function plantGrow(small) {
  const m = document.createElement('div'); m.className = 'plantbox'; m.innerHTML = `<canvas id="plC" width="24" height="24"></canvas><p><b>${small ? '씨앗을 심었어요' : '첫 새싹'}</b><span>${small ? '아직 땅속이에요. 원래 그런 거예요.' : '물을 준 건 당신이에요.'}</span></p>`;
  log3().appendChild(m); log3().scrollTop = 1e6; const c = $('#plC'), x = c.getContext('2d'); const f = sprite('f' + ST.form, FORMS[ST.form]);
  await tween(small ? 1200 : 3000, fr => { x.clearRect(0, 0, 24, 24); x.fillStyle = '#B8865C'; x.fillRect(8, 18, 8, 5); x.fillStyle = '#7a5538'; x.fillRect(8, 18, 8, 1); if (fr > .25 || small) { x.fillStyle = '#56c27a'; const h = small ? 1 : Math.min(8, Math.floor(fr * 10)); x.fillRect(11, 17 - h, 2, h); if (!small && fr > .55) { x.fillStyle = '#7fd88f'; x.fillRect(8, 11 - Math.floor((fr - .55) * 6), 4, 2); x.fillRect(13, 10 - Math.floor((fr - .55) * 6), 4, 2); } } x.drawImage(f, 1, 1); });
  if (!small) { sfx('sparkle'); sfx('chime'); }
}

    <p><b style="color:var(--sig)">히기에이아</b><br>"첫 21일엔 ${rate}%가 닿았고, 그래도 졌지. 두 번째엔 한 번만 보내고 창은 그가 열었어. 졸업은 말이야, 네가 필요 없어지는 날이야. 오늘은 여기까지. 수고했어, 불씨."</p></div>
    <div style="display:grid;gap:10px;width:100%;max-width:340px;margin-top:16px"><button class="btnpx" id="again">처음부터 다시 ▶</button></div>`;

/* =====================================================================

const SCENES = { title: sceneTitle, sky: sceneSky, floors: sceneFloors, roof: sceneRoof, fall: sceneFall, app: sceneApp };
const SEQ = ['title', 'sky', 'floors', 'roof', 'fall', 'app'];
async function play(from) {
  abortAll(); const me = RUN;
  if (from === 'title' || from === 'sky' || from === 'floors') resetState(); else if (!ST.log.length) presetState();
  if (from === 'roof') { ST.night = false; ST.rain = false; } if (from === 'fall') { ST.night = true; }
  if (from === 'app') { ST.night = true; ST.room = true; jumpCam(camMax()); }
  try { for (let i = SEQ.indexOf(from); i < SEQ.length; i++) { await SCENES[SEQ[i]](); if (me !== RUN) return; } } catch (e) { if (e !== ABORT) console.error('scene error', e && e.stack || e); }
}
const DIR = [['title', '타이틀'], ['sky', '하늘 · 신들의 학교'], ['floors', '1막 · 건물을 내려가며 21일'], ['roof', '회귀 · 옥상의 세 손님'], ['fall', '빙의 · 밤의 하강'], ['app', '환생 · LOOP 앱']];
function openDir() {
  const d = $('#dir'); d.hidden = false;
  d.innerHTML = `<button class="x" id="dx">CLOSE ✕</button><h4>SCENE 점프</h4><div class="g">${DIR.map(([k, n]) => `<button data-k="${k}">${n}</button>`).join('')}</div><h4>OPTIONS</h4><div class="g"><button id="oAuto" class="${AUTO ? 'on' : ''}">AUTO ${AUTO ? 'ON' : 'OFF'}</button><button id="oSnd" class="${!MUTED ? 'on' : ''}">SOUND ${MUTED ? 'OFF' : 'ON'}</button><button data-sp="1" class="${SPEED === 1 ? 'on' : ''}">속도 ×1</button><button data-sp="2" class="${SPEED === 2 ? 'on' : ''}">속도 ×2</button><button data-sp="4" class="${SPEED === 4 ? 'on' : ''}">속도 ×4</button></div>`;
  $('#dx').onclick = () => d.hidden = true; d.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { d.hidden = true; audio(); play(b.dataset.k); });
  d.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { SPEED = +b.dataset.sp; openDir(); }); $('#oAuto').onclick = () => { AUTO = !AUTO; if (AUTO && NEXTFN) NEXTFN(); openDir(); }; $('#oSnd').onclick = () => { MUTED = !MUTED; if (MUTED) musicGrid(null); openDir(); };
}
$('#dirBtn').onclick = openDir;

(function boot() { const q = new URLSearchParams(location.hash.slice(1)); if (q.get('speed')) SPEED = +q.get('speed'); if (q.get('auto')) AUTO = true; if (q.get('mute')) MUTED = true; const s = q.get('scene') || 'title'; setTimeout(() => play(s), 50); })();
