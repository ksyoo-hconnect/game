name: Sync public tournament results
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loop-play-results-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and validate the shared CSV
        run: python3 scripts/sync-results.py
      - name: Commit updated results
        run: |
          if git diff --quiet -- results/results.csv; then
            echo "No new results"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/results.csv
          git commit -m "Update shared tournament results"
          git push origin HEAD:main
